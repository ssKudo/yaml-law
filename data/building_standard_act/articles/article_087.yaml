article_caption: "（用途の変更に対するこの法律の準用）"
description: "建築物の用途を変更して特殊建築物（確認申請が必要なもの）とする場合の手続き（準用）、および類似用途間の変更や既存不適格建築物の用途変更時における現行基準の適用範囲を定めた条文。"
