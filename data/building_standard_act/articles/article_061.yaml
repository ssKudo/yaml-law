article_num: "61"
article_title: "第六十一条"
article_caption: "（防火地域及び準防火地域内の建築物）"
description: "火災の拡大を防ぐため、防火地域および準防火地域内における建築物の耐火性能（耐火建築物等、準耐火建築物等）に関する基本制限、ならびに外壁が隣地境界線に接する際の規定について定めた条文。"
