article_caption: "（特殊建築物等の内装）"
description: "一定規模以上の特殊建築物、3階建て以上の建築物、無窓の居室を持つ建築物、または火を使用する室（キッチン等）における火災時の初期延焼と煙の発生を防ぐための、内装制限（壁・天井の仕上げの難燃化）を定めた条文。"
