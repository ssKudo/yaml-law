article_caption: "（一の敷地内にあるとみなされる建築物に対する高度利用地区等内における制限の特例）"
description: "一団地認定等の特例により一の敷地内にあるとみなされる複数の建築物について、高度利用地区や特定街区等の規定を適用する際には、それら全体を「一の建築物」とみなして適用することを定めた条文。"
