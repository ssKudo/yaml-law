description: "建築基準法上の「道路」の定義として、原則幅員4m（一部地域では6m）以上の公道や開発道路等の基準、および幅員4m未満であっても特定行政庁が指定することで道路とみなす「2項道路（みなし道路）」等の定義を定めた条文。"
