article_caption: "（区域を区分して建築物の容積を適正に配分する地区計画等の区域内における建築物の容積率の特例）"
description: "地区計画の区域を区分して容積率を配分する地区（容積適正配分地区など）において、定められた基準（敷地面積や壁面位置など）に適合する場合に、地区計画の最高限度を基準値とみなして容積率制限を適用する特例を定めた条文。"
