article_title: "第十条"
article_caption: "（著しく保安上危険な建築物等の所有者等に対する勧告及び命令）"
description: "既存不適格等の建築物の劣化が著しく、保安上危険または衛生上きわめて有害であると認める場合において、特定行政庁が所有者等に対して除却や修繕等の措置を勧告・命令できる権限、および命令違反に対する手続きを定めた条文。"
