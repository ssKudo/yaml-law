article_caption: "（建築物の用途を変更して一時的に他の用途の建築物として使用する場合の制限の緩和）"
description: "災害救助用の応急使用建築物、一時的な興行場・イベント・仮設店舗等に用途変更する際において、確認申請等の適用除外や、特定行政庁の許可期間（1〜2年等）、建築審査会の同意要件を定めた条文。"
