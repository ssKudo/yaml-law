article_caption: "（特殊の構造方法又は建築材料）"
description: "建築基準法の第二章（単体規定）に想定されていない最新または特殊な構造方法や建築材料を使用する際、国土交通大臣が同等以上の安全性・効力があると認めた場合に法の適用外とする（大臣認定制度）ことを定めた条文。"
