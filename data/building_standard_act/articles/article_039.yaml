article_caption: "（災害危険区域）"
description: "地方公共団体が条例によって、津波、高潮、出水などによる危険の著しいエリアを「災害危険区域」に指定し、区域内における住宅等の建築禁止や災害防止上の建築制限を定めることができる権限を規定した条文。"
