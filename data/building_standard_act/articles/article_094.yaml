article_caption: "（不服申立て）"
description: "特定行政庁や建築主事、指定確認検査機関等の処分または不作為に不服がある場合、建築審査会に対して行う審査請求の手続き、裁決期限（1ヶ月以内）、および公開口頭審査の実施義務を定めた条文。"
