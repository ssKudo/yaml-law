article_title: "第七十五条の二"
article_caption: "（建築協定の認可等の公告のあつた日以後建築協定に加わる手続等）"
description: "建築協定の認可公告後において、協定の効力が及ばない区域内の土地所有者や隣接地の所有者等が、特定行政庁への書面表示等を通じて自主的に建築協定に加入するための手続きと効力を規定した条文。"
