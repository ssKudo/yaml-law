article_caption: "（私道の変更又は廃止の制限）"
description: "特定行政庁が、私道の変更や廃止によってその私道に接する建築物敷地が接道義務（43条）に抵触することになる場合、その私道の変更・廃止を禁止または制限できる権限を定めた条文。"
