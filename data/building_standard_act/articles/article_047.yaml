article_title: "第四十七条"
article_caption: "（壁面線による建築制限）"
description: "特定行政庁が壁面線を指定した街区において、建築物の外壁や柱、および高さ2メートルを超える門や塀を、壁面線を越えて道路側に建築してはならないとする建築制限とその例外（地盤面下など）を定めた条文。"
