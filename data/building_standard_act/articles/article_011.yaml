article_caption: "（第三章の規定に適合しない建築物に対する措置）"
description: "都市計画制限などに適合しない既存不適格建築物が公益上著しく支障があると認める場合、特定行政庁が議会の同意を得て是正命令（除却、移転等）を出す手続き、および通常生ずべき損害の時価補償について定めた条文。"
