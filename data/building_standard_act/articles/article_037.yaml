article_title: "第三十七条"
article_caption: "（建築材料の品質）"
description: "建築物の基礎や主要構造部などの安全性・耐久性に直結する指定建築材料（コンクリート、木材、鉄鋼等）の品質について、JIS（日本産業規格）やJAS（日本農林規格）への適合、または国土交通大臣の認定を受けた品質であることを義務付けた条文。"
