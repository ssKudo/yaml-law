article_caption: "（用途地域等における建築物の敷地、構造又は建築設備に対する制限）"
description: "用途地域や特別用途地区、特定用途制限地域内において、良好な住環境の保護や土地利用の高度化等の指定目的に沿って、建築物の敷地面積、構造、または建築設備に関する付加的な制限を地方公共団体が条例で指定できることを規定した条文。"
