article_caption: "（敷地等と道路との関係）"
description: "建築物の敷地は、道路に2メートル以上接しなければならないとする「接道義務」の基本原則、および敷地の周囲に広い空地があるなど安全上支障がない場合の許可による例外規定について定めた条文。"
