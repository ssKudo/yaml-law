chapter: "第三章 都市計画区域等における建築物の敷地、構造、建築設備及び用途"
section: "第二節 建築物又はその敷地と道路又は壁面線との関係等"
subsection: null
division: null
article_num: "46"
article_title: "第四十六条"
article_caption: "（壁面線の指定）"
description: "街区内における建築物の位置を整え、良好な道路環境や環境の向上を図るため、特定行政庁が建築審査会の同意を得て道路境界線から後退した位置に「壁面線」を指定する手続きと事前公聴会等について定めた条文。"
