article_caption: "（総合的設計による一団地の住宅施設についての制限の特例）"
description: "都市計画で一団地の住宅施設が定められた低層住宅専用エリア等において、都市計画で独自に定めた容積率や高さ基準等を適用し、通常の集団規定（容積・建蔽・後退・高さ制限）を適用除外する特例を定めた条文。"
