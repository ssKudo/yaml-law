article_caption: "（維持保全）"
description: "建築物の所有者、管理者、占有者が、建築物の敷地、構造、建築設備を常時適法な状態に維持保全する努力義務、および一定の特殊建築物の所有者・管理者に対する維持保全計画・準則の作成義務について定めた条文。"
