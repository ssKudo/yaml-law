article_caption: "（確認審査等に関する指針等）"
description: "建築確認、検査、構造計算適合性判定等の業務が公正かつ確実に行われるよう、国土交通大臣が「確認審査等に関する指針」を定め、公表する義務、および関係者がそれに従う義務を定めた条文。"
