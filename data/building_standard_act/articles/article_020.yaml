article_caption: "（構造耐力）"
description: "建築物の自重、地震力、積雪、風圧等の荷重や外力に対する構造耐力の安全基準を、建物の規模や高さ（60m超、60m以下等）に応じて4つの区分に分類し、適合すべき構造計算の基準等を定めた条文。"
