article_caption: "（その敷地が四メートル未満の道路にのみ接する建築物に対する制限の付加）"
description: "建築物の敷地が、幅員4m未満でセットバックが必要な道路（42条3項指定道路など）にのみ接している場合、地方公共団体が条例によって、敷地、構造、設備、用途に関して追加的な制限を課すことができることを規定した条文。"
