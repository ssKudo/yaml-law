article_caption: "（建築物の敷地が地区計画等の区域の内外にわたる場合の措置）"
description: "地区計画等の条例に基づく容積率や建蔽率の制限を受ける区域の内外に建築物の敷地がわたる場合において、敷地全体における制限値の適用（按分計算等）に関する措置を定めた条文。"
