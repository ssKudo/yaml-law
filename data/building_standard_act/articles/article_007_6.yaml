article_num: "7_6"
article_title: "第七条の六"
article_caption: "（検査済証の交付を受けるまでの建築物の使用制限）"
description: "新築や大規模な増改築工事等において、原則として検査済証の交付を受けるまで建築物の使用を制限すること、および安全上支障がない場合の仮使用認定の手続き（特定行政庁や指定確認検査機関による仮使用認定）について定めた条文。"
