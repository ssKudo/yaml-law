article_title: "第八十七条の二"
article_caption: "（既存の一の建築物について二以上の工事に分けて用途の変更に伴う工事を行う場合の制限の緩和）"
description: "既存不適格建築物の用途変更に伴う改修等を、複数回（2回以上）の工事に分割して行う場合において、特定行政庁が全体計画を審査して認定する全体計画認定制度とその制限緩和について定めた条文。"
