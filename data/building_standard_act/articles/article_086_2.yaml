article_caption: "（公告認定対象区域内における建築物の位置及び構造の認定等）"
description: "一団地認定・許可を受けた公告対象区域内において、他の建築物を新築したり既存建物を増改築等したりする際の位置・構造の認定手続き、および容積率や高さ制限の追加緩和について定めた条文。"
