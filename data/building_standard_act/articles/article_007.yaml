article_caption: "（建築物に関する完了検査）"
description: "建築確認を受けた工事が完了した際、建築主が完了後4日以内に建築主事等へ完了検査の申請をする義務、および検査実施者による完了検査と検査済証の交付手続きを定めた条文。"
