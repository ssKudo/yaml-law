article_caption: "（大規模の建築物の主要構造部等）"
description: "木造などの可燃材料を用いた大規模な建築物（階数が4以上、高さ16m超、または3階建てで高さ13m超の特殊建築物）や延べ面積3000平方メートル超の建築物に対し、火災時の倒壊や延焼を防ぐ主要構造部の耐火・防火性能基準を定めた条文。"
