article_title: "第六十八条の五の五"
article_caption: "（区域の特性に応じた高さ、配列及び形態を備えた建築物の整備を誘導する地区計画等の区域内における制限の特例）"
description: "壁面後退や高さ制限などが細かく定められた地区計画の区域内において、周囲の状況に適合する優良な建築物について、前面道路幅員による容積率制限や高さ制限（道路斜線等）の適用を除外・緩和する特例を定めた条文。"
