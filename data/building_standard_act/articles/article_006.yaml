article_caption: "（建築物の建築等に関する申請及び確認）"
description: "建築物を建築、大規模の修繕・模様替をしようとする場合の着手前の確認申請手続き、建築主事等による確認済証の交付義務、審査期間、および確認済証交付前の工事着手禁止を定めた条文。"
