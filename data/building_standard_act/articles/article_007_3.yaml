article_title: "第七条の三"
article_caption: "（建築物に関する中間検査）"
description: "3階建て以上の共同住宅などの特定工程を含む建築工事において、特定行政庁が指定する工程を終えた段階で中間検査を受ける義務、中間検査合格証の交付、および合格証交付前に対象外の後続工程を施工することの禁止を定めた条文。"
