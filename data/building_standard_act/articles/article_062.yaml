article_num: "62"
article_title: "第六十二条"
article_caption: "（屋根）"
description: "準防火地域内において、木造等の建築物の延焼を防ぐために必要な外壁、軒裏、屋根の防火措置や一定規模以上の建築物に対する耐火性能制限について規定した条文。"
