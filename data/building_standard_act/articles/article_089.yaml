article_caption: "（工事現場における確認の表示等）"
description: "一定規模の建築工事現場において、見やすい場所に建築主、設計者、施工者、現場管理者の氏名・名称や建築確認済証を表示する看板の掲示義務、および設計図書の備付け義務を定めた条文。"
