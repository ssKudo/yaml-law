article_title: "第四十四条"
article_caption: "（道路内の建築制限）"
description: "公共空間および避難路としての機能を守るため、道路内や道路上に建築物や擁壁を設置・築造することを禁止する原則、ならびに地下建築物や公衆便所などの一定の例外許可手続きを定めた条文。"
