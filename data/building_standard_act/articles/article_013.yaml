article_caption: "（身分証明書の携帯）"
description: "建築主事、建築監視員、または委任を受けた職員が、検査や命令などの執行のために立ち入りや質問等を行う際、身分証明書を携帯し関係者に提示する義務、および捜査目的の立ち入り禁止を定めた条文。"
