article_title: "第八十六条の八"
article_caption: "（既存の一の建築物について二以上の工事に分けて増築等を含む工事を行う場合の制限の緩和）"
description: "既存不適格建築物の増改築等の全体計画を作成し特定行政庁から認定を受けることで、工事を複数回（2回以上）に分けて分割施工する場合における既存不適格緩和適用の特例や監督措置を定めた条文。"
