article_caption: "（長屋又は共同住宅の各戸の界壁）"
description: "長屋や共同住宅における隣接する住戸間の遮音性能を確保するため、戸境壁（界壁）の遮音構造基準、および界壁を小屋裏・天井裏まで到達させて防火・遮音を図る義務を定めた条文。"
