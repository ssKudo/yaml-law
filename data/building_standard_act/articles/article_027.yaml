article_title: "第二十七条"
article_caption: "（耐火建築物等としなければならない特殊建築物）"
description: "劇場、病院、共同住宅、店舗などの特殊建築物のうち、階数や床面積が一定基準を超えるものに対し、火災時の避難安全性を確保するための耐火建築物等化（主要構造部の耐火構造化等）および開口部への防火設備設置を義務付けた条文。"
