article_caption: "（被災市街地における建築制限）"
description: "災害が発生した市街地において、都市計画や区画整理のために特定行政庁が区域を指定し、災害発生から最大2ヶ月間の範囲内で建築制限・禁止を行える応急措置を定めた条文。"
