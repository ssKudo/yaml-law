article_title: "第九条の三"
article_caption: "（違反建築物の設計者等に対する措置）"
description: "違反建築物の是正命令等が出された場合、特定行政庁が当該建築物の設計者、工事監理者、施工者、宅地建物取引業者等の情報を監督官庁（国土交通大臣や都道府県知事）に通知し、免許取消や業務停止等の行政処分を求める手続きについて定めた条文。"
