article_title: "第九条"
article_caption: "（違反建築物に対する措置）"
description: "建築基準法令や許可条件に違反している建築物について、特定行政庁が工事の停止や是正措置（除却、移転、改築、使用禁止など）を命じる権限、事前手続き（意見書提出、公開意見聴取）、緊急時の仮命令、行政代執行および公示手続きを定めた条文。"
