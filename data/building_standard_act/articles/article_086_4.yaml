article_caption: "（一の敷地内にあるとみなされる建築物に対する外壁の開口部に対する制限の特例）"
description: "一団地認定等の対象区域において、隣接する他の建物との関係で一定の耐火性能（耐火・準耐火建築物とみなす）を満たす場合に、開口部の防火設備設置などの制限を緩和する特例を定めた条文。"
