article_caption: "（建築基準適合判定資格者検定）"
description: "建築物が建築基準関係規定に適合するかどうかを判定する建築基準適合判定資格者（一級・二級）を検定するための、国土交通大臣による検定の実施、受検資格、および委員について定めた条文。"
