article_caption: "（型式部材等製造者の認証）"
description: "型式適合認定を受けた建築材料や型式部材等を量産する製造者に対して、品質管理体制が適切であることを審査し、国土交通大臣が「認証型式部材等製造者」として認証する制度を定めた条文。"
