article_title: "第九十三条"
article_caption: "（許可又は確認に関する消防長等の同意等）"
description: "特定行政庁や建築主事等が建築の許可や確認を行う際、管轄の消防長または消防署長の「消防同意」を得なければならないとする同意義務、回答期限（3日〜7日）、および保健所長への通知等を定めた条文。"
