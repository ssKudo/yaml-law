article_title: "第三十六条の八"
article_caption: "（市街地開発事業等予定区域の区域内における建築等の許可を要しない通常の管理行為、軽易な行為その他の行為）"
description: "市街地開発事業等の予定区域内において、知事等の許可を受けずに実施できる仮設工作物の建設や、既存敷地内での小規模な附属建築物の建築などの軽易な行為を定めた規定。"
