article_caption: "（適正かつ合理的な土地利用及び環境の保全を図る上で支障がない公益上必要な建築物）"
description: "開発許可が不要となる公益上必要な建築物として、道路・鉄道施設、郵便や電気・通信用施設、図書館、火葬場、一定 of 庁舎などの具体的な範囲を規定した条文。"
