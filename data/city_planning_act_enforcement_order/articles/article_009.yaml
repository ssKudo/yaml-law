article_caption: "（都道府県が定める都市計画）"
description: "都道府県が広域的な見地から決定すべき都市計画として、一定規模以上の風致地区や特別緑地保全地区、および主要道路や都市高速鉄道などの主要都市施設を規定した条文。"
