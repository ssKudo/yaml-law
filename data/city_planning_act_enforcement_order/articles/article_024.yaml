article_caption: "（輸送の便等からみて支障がないと認められなければならない開発行為の規模）"
description: "周辺の輸送道路や交通の便などからみて支障がないことの確認が開発許可の基準となる大規模開発行為の面積基準（40ヘクタール以上）を規定した条文。"
