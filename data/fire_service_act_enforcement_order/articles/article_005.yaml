article_caption: "（対象火気設備等の位置、構造及び管理に関する条例の基準）"
description: "消防法施行令の第五条は「対象火気設備等の位置、構造及び管理に関する条例の基準」を定める。 本文冒頭: 火を使用する設備又はその使用に際し、火災の発生のおそれのある設備であつて総務省令で定めるもの（以下この条及び第五条の四において「対象火気設備等」という。）の位置、構造及び管理に関し火災の予防のために必要な事項に係る法第九条の規定に基づく条例の制定に関する基準（以下この条から第五条の五までにおいて「条例制定基準」という。）は、次のとおりとする。"
