article_caption: "（統括防火管理者を定めなければならない防火対象物）"
description: "消防法施行令の第三条の三は「統括防火管理者を定めなければならない防火対象物」を定める。 本文冒頭: 法第八条の二第一項の政令で定める防火対象物は、次に掲げる防火対象物とする。"
