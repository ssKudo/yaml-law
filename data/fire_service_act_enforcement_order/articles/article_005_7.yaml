description: "消防法施行令の第五条の七は「住宅用防災機器の設置及び維持に関する条例の基準」を定める。 本文冒頭: 住宅用防災機器の設置及び維持に関し住宅における火災の予防のために必要な事項に係る法第九条の二第二項の規定に基づく条例の制定に関する基準は、次のとおりとする。"
