article_title: "第十三条"
article_caption: "（水噴霧消火設備等を設置すべき防火対象物）"
description: "消防法施行令の第十三条は「水噴霧消火設備等を設置すべき防火対象物」を定める。 本文冒頭: 次の表の上欄に掲げる防火対象物又はその部分には、水噴霧消火設備、泡消火設備、不活性ガス消火設備、ハロゲン化物消火設備又は粉末消火設備のうち、それぞれ当該下欄に掲げるもののいずれかを設置するものとする。"
