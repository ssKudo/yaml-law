article_num: "4_2_6"
article_title: "第四条の二の六"
article_caption: "（消防計画における自衛消防組織の業務の定め）"
description: "消防法施行令の第四条の二の六は「消防計画における自衛消防組織の業務の定め」を定める。 本文冒頭: 前条第一項の権原を有する者は、その者が定めた防火管理者に、総務省令で定めるところにより、防火管理に係る消防計画において、自衛消防組織の業務に関する事項を定めさせなければならない。"
