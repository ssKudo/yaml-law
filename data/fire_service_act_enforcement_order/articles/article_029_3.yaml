article_title: "第二十九条の三"
article_caption: "（無線通信補助設備に関する基準）"
description: "消防法施行令の第二十九条の三は「無線通信補助設備に関する基準」を定める。 本文冒頭: 無線通信補助設備は、別表第一（十六の二）項に掲げる防火対象物で、延べ面積が千平方メートル以上のものに設置するものとする。"
