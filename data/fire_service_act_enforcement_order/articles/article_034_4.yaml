description: "消防法施行令の第三十四条の四は「適用が除外されない防火対象物の範囲」を定める。 本文冒頭: 法第十七条の二の五第二項第四号の政令で定める複合用途防火対象物は、別表第一（十六）項イに掲げる防火対象物とする。"
