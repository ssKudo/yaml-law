article_title: "第三条の二"
article_caption: "（防火管理者の責務）"
description: "消防法施行令の第三条の二は「防火管理者の責務」を定める。 本文冒頭: 防火管理者は、総務省令で定めるところにより、当該防火対象物についての防火管理に係る消防計画を作成し、所轄消防長又は消防署長に届け出なければならない。"
