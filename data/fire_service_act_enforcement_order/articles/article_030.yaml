description: "消防法施行令の第三十条は「消防用設備等の規格」を定める。 本文冒頭: 法第十七条第一項の消防用設備等（以下「消防用設備等」という。）又はその部分である法第二十一条の二第一項の検定対象機械器具等若しくは法第二十一条の十六の二の自主表示対象機械器具等（以下この条において「消防用機械器具等」という。）で第三十七条各号又は第四十一条各号に掲げるものに該当するものは、これらの消防用機械器具等について定められた法第二十一条の二第二項又は法…"
