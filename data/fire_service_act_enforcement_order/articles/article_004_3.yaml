article_title: "第四条の三"
article_caption: "（防炎防火対象物の指定等）"
description: "消防法施行令の第四条の三は「防炎防火対象物の指定等」を定める。 本文冒頭: 法第八条の三第一項の政令で定める防火対象物は、別表第一（一）項から（四）項まで、（五）項イ、（六）項、（九）項イ、（十二）項ロ及び（十六の三）項に掲げる防火対象物（次項において「防炎防火対象物」という。）並びに工事中の建築物その他の工作物（総務省令で定めるものを除く。）とする。"
