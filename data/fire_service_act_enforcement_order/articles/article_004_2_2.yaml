article_caption: "（火災の予防上必要な事項等について点検を要する防火対象物）"
description: "消防法施行令の第四条の二の二は「火災の予防上必要な事項等について点検を要する防火対象物」を定める。 本文冒頭: 法第八条の二の二第一項の政令で定める防火対象物は、別表第一（一）項から（四）項まで、（五）項イ、（六）項、（九）項イ、（十六）項イ及び（十六の二）項に掲げる防火対象物であつて、次に掲げるものとする。"
