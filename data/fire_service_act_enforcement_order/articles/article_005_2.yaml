article_caption: "（対象火気器具等の取扱いに関する条例の基準）"
description: "消防法施行令の第五条の二は「対象火気器具等の取扱いに関する条例の基準」を定める。 本文冒頭: 火を使用する器具又はその使用に際し、火災の発生のおそれのある器具であつて総務省令で定めるもの（以下この条及び第五条の四において「対象火気器具等」という。）の取扱いに関し火災の予防のために必要な事項に係る条例制定基準は、次のとおりとする。"
