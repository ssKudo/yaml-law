article_num: "41"
article_title: "第四十一条"
article_caption: "（自主表示対象機械器具等の範囲）"
description: "消防法施行令の第四十一条は「自主表示対象機械器具等の範囲」を定める。 本文冒頭: 法第二十一条の十六の二の政令で定める消防の用に供する機械器具等は、次に掲げるもの（法第十七条第三項の規定による認定を受けた特殊消防用設備等の部分であるもの、輸出されるもの（輸出されるものであることについて、総務省令で定めるところにより、総務大臣の承認を受けたものに限る。）又は船舶安全法若しくは航空法の規定に基づく検査若しくは試験に合格したものを除く。）とする…"
