article_title: "第三十六条"
article_caption: "（消防用設備等又は特殊消防用設備等について点検を要しない防火対象物等）"
description: "消防法施行令の第三十六条は「消防用設備等又は特殊消防用設備等について点検を要しない防火対象物等」を定める。 本文冒頭: 法第十七条の三の三の消防用設備等又は特殊消防用設備等について点検を要しない防火対象物は、別表第一（二十）項に掲げる防火対象物とする。"
