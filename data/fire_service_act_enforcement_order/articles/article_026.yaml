description: "消防法施行令の第二十六条は「誘導灯及び誘導標識に関する基準」を定める。 本文冒頭: 誘導灯及び誘導標識は、次の各号に掲げる区分に従い、当該各号に定める防火対象物又はその部分に設置するものとする。"
