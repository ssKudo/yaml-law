article_title: "第五条の八"
article_caption: "（住宅用防災機器に係る条例の規定の適用除外に関する条例の基準）"
description: "消防法施行令の第五条の八は「住宅用防災機器に係る条例の規定の適用除外に関する条例の基準」を定める。 本文冒頭: 法第九条の二第二項の規定に基づく条例には、住宅用防災機器について、消防長又は消防署長が、住宅の位置、構造又は設備の状況から判断して、住宅における火災の発生又は延焼のおそれが著しく少なく、かつ、住宅における火災による被害を最少限度に止めることができると認めるときにおける当該条例の規定の適用の除外に関する規定を定めるものとする。"
