article_title: "第二十四条"
article_caption: "（非常警報器具又は非常警報設備に関する基準）"
description: "消防法施行令の第二十四条は「非常警報器具又は非常警報設備に関する基準」を定める。 本文冒頭: 非常警報器具は、別表第一（四）項、（六）項ロ、ハ及びニ、（九）項ロ並びに（十二）項に掲げる防火対象物で収容人員が二十人以上五十人未満のもの（次項に掲げるものを除く。）に設置するものとする。"
