article_caption: "（災害対策基本法施行令の準用）"
description: "消防法施行令の第五十条は「災害対策基本法施行令の準用」を定める。 本文冒頭: 災害対策基本法施行令（昭和三十七年政令第二百八十八号）第二十五条から第二十七条までの規定は、法第三条第三項及び第五条の三第四項において準用する災害対策基本法（昭和三十六年法律第二百二十三号）第六十四条第三項の規定に基づく公示及び同条第四項の規定に基づく売却について準用する。"
