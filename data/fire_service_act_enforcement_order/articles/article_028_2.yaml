article_title: "第二十八条の二"
article_caption: "（連結散水設備に関する基準）"
description: "消防法施行令の第二十八条の二は「連結散水設備に関する基準」を定める。 本文冒頭: 連結散水設備は、別表第一（一）項から（十五）項まで、（十六の二）項及び（十七）項に掲げる防火対象物で、地階の床面積の合計（同表（十六の二）項に掲げる防火対象物にあつては、延べ面積）が七百平方メートル以上のものに設置するものとする。"
