article_caption: "（消防長等の同意を要する住宅）"
description: "消防法施行令の第一条は「消防長等の同意を要する住宅」を定める。 本文冒頭: 消防法（以下「法」という。）第七条第一項ただし書の政令で定める住宅は、一戸建ての住宅で住宅の用途以外の用途に供する部分の床面積の合計が延べ面積の二分の一以上であるもの又は五十平方メートルを超えるものとする。"
