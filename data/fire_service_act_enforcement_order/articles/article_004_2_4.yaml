article_caption: "（自衛消防組織の設置を要する防火対象物）"
description: "消防法施行令の第四条の二の四は「自衛消防組織の設置を要する防火対象物」を定める。 本文冒頭: 法第八条の二の五第一項の政令で定める防火対象物は、法第八条第一項の防火対象物のうち、次に掲げるものとする。"
