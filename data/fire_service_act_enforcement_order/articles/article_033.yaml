article_caption: "（総務省令への委任）"
description: "消防法施行令の第三十三条は「総務省令への委任」を定める。 本文冒頭: この節に定めるもののほか、消防用設備等の設置方法の細目及び設置の標示並びに点検の方法その他消防用設備等の設置及び維持に関し必要な事項は、総務省令で定める。"
