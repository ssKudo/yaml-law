description: "消防法施行令の第二十一条の二は「ガス漏れ火災警報設備に関する基準」を定める。 本文冒頭: ガス漏れ火災警報設備は、次に掲げる防火対象物又はその部分（総務省令で定めるものを除く。）に設置するものとする。"
