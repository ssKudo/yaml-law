description: "消防法施行令の第九条の規定。 本文冒頭: 第九条 別表第一（十六）項に掲げる防火対象物の部分で、同表各項（（十六）項から（二十）項までを除く。）の防火対象物の用途のいずれかに該当する用途に供されるものは、この節（第十二条第一項第三号及び第十号から第十二号まで、第二十一条第一項第三号、第七号、第十号及び第十四号、第二十一条の二第一項第五号、第二十二条第一項第六号及び第七号、第二十四条第二項第二号並びに…"
