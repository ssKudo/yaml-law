description: "消防法施行令の第二十九条の四は「必要とされる防火安全性能を有する消防の用に供する設備等に関する基準」を定める。 本文冒頭: 法第十七条第一項の関係者は、この節の第二款から前款までの規定により設置し、及び維持しなければならない同項に規定する消防用設備等（以下この条において「通常用いられる消防用設備等」という。）に代えて、総務省令で定めるところにより消防長又は消防署長が、その防火安全性能（火災の拡大を初期に抑制する性能、火災時に安全に避難することを支援する性能又は消防隊による活動を支…"
