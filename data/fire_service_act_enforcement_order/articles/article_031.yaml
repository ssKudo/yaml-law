description: "消防法施行令の第三十一条は「基準の特例」を定める。 本文冒頭: 別表第一（十二）項イに掲げる防火対象物で、総務省令で定めるものについては、この節の第二款に定める基準に関して、総務省令で特例を定めることができる。"
