article_num: "4_2_7"
article_title: "第四条の二の七"
article_caption: "（自衛消防組織の業務）"
description: "消防法施行令の第四条の二の七は「自衛消防組織の業務」を定める。 本文冒頭: 自衛消防組織は、前条の自衛消防組織の業務に関する事項の定めに従い、火災の初期の段階における消火活動、消防機関への通報、在館者が避難する際の誘導その他の火災の被害の軽減のために必要な業務を行うものとする。"
