description: "消防法施行令の第三十二条の規定。 本文冒頭: 第三十二条 この節の規定は、消防用設備等について、消防長又は消防署長が、防火対象物の位置、構造又は設備の状況から判断して、この節の規定による消防用設備等の基準によらなくとも、火災の発生又は延焼のおそれが著しく少なく、かつ、火災等の災害による被害を最少限度に止めることができると認めるときにおいては、適用しない。"
