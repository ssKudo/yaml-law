article_title: "第四十六条"
article_caption: "（防災管理を要する建築物その他の工作物）"
description: "消防法施行令の第四十六条は「防災管理を要する建築物その他の工作物」を定める。 本文冒頭: 法第三十六条第一項の政令で定める建築物その他の工作物は、第四条の二の四の防火対象物とする。"
