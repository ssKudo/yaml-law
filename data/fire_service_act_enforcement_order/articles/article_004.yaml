article_title: "第四条"
article_caption: "（統括防火管理者の資格）"
description: "消防法施行令の第四条は「統括防火管理者の資格」を定める。 本文冒頭: 法第八条の二第一項の政令で定める資格を有する者は、次の各号に掲げる防火対象物の区分に応じ、当該各号に定める者で、当該防火対象物の全体についての防火管理上必要な業務を適切に遂行するために必要な権限及び知識を有するものとして総務省令で定める要件を満たすものとする。"
