article_title: "第四条の二の三"
article_caption: "（避難上必要な施設等の管理を要する防火対象物）"
description: "消防法施行令の第四条の二の三は「避難上必要な施設等の管理を要する防火対象物」を定める。 本文冒頭: 法第八条の二の四の政令で定める防火対象物は、別表第一に掲げる防火対象物（同表（十八）項から（二十）項までに掲げるものを除く。）とする。"
