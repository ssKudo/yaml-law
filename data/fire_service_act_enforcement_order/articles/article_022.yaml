article_title: "第二十二条"
article_caption: "（漏電火災警報器に関する基準）"
description: "消防法施行令の第二十二条は「漏電火災警報器に関する基準」を定める。 本文冒頭: 漏電火災警報器は、次に掲げる防火対象物で、間柱若しくは下地を準不燃材料（建築基準法施行令第一条第五号に規定する準不燃材料をいう。以下この項において同じ。）以外の材料で造つた鉄網入りの壁、根太若しくは下地を準不燃材料以外の材料で造つた鉄網入りの床又は天井野縁若しくは下地を準不燃材料以外の材料で造つた鉄網入りの天井を有するものに設置するものとする。"
