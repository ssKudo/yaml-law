article_caption: "（免状の交付の申請）"
description: "消防法施行令の第三十六条の三は「免状の交付の申請」を定める。 本文冒頭: 法第十七条の七第一項の消防設備士免状（以下この章において「免状」という。）の交付を受けようとする者は、申請書に総務省令で定める書類を添えて、当該免状に係る消防設備士試験を行つた都道府県知事（法第十七条の十一第三項に規定する指定試験機関が行つた消防設備士試験を受けた者にあつては、当該消防設備士試験の実施に関する事務を当該指定試験機関に行わせることとした都道府県…"
