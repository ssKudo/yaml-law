article_num: "48_3"
article_title: "第四十八条の三"
article_caption: "（統括防災管理者の責務）"
description: "消防法施行令の第四十八条の三は「統括防災管理者の責務」を定める。 本文冒頭: 統括防災管理者は、総務省令で定めるところにより、当該防災管理対象物の全体についての防災管理に係る消防計画を作成し、所轄消防長又は消防署長に届け出なければならない。"
