article_caption: "（住宅用防災機器）"
description: "消防法施行令の第五条の六は「住宅用防災機器」を定める。 本文冒頭: 法第九条の二第一項の住宅用防災機器として政令で定める機械器具又は設備は、次に掲げるもののいずれかであつて、その形状、構造、材質及び性能が総務省令で定める技術上の規格に適合するものとする。"
