article_title: "第四十一条の二"
article_caption: "（登録検定機関の登録の更新の手数料）"
description: "消防法施行令の第四十一条の二は「登録検定機関の登録の更新の手数料」を定める。 本文冒頭: 法第二十一条の四十七第二項の規定により納付すべき手数料の額は、六万四千七百円（情報通信技術を活用した行政の推進等に関する法律（平成十四年法律第百五十一号）第六条第一項の規定により同項に規定する電子情報処理組織を使用して法第二十一条の四十七第一項の登録の更新を申請する場合にあつては、六万四千六百円）とする。"
