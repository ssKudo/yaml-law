article_caption: "（消防用設備等の種類）"
description: "消防法施行令の第七条は「消防用設備等の種類」を定める。 本文冒頭: 法第十七条第一項の政令で定める消防の用に供する設備は、消火設備、警報設備及び避難設備とする。"
