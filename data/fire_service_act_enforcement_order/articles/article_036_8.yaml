article_title: "第三十六条の八"
article_caption: "（指定講習機関による工事整備対象設備等の工事又は整備に関する講習の手数料）"
description: "消防法施行令の第三十六条の八は「指定講習機関による工事整備対象設備等の工事又は整備に関する講習の手数料」を定める。 本文冒頭: 法第十七条の十一第一項の規定により納付すべき手数料の額は、七千円とする。"
