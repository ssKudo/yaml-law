article_title: "第四条の二の八"
article_caption: "（自衛消防組織の要員の基準）"
description: "消防法施行令の第四条の二の八は「自衛消防組織の要員の基準」を定める。 本文冒頭: 自衛消防組織には、統括管理者及び総務省令で定める自衛消防組織の業務ごとに総務省令で定める員数以上の自衛消防要員を置かなければならない。"
