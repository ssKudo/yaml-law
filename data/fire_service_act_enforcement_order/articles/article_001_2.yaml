article_caption: "（防火管理者を定めなければならない防火対象物等）"
description: "消防法施行令の第一条の二は「防火管理者を定めなければならない防火対象物等」を定める。 本文冒頭: 法第八条第一項の政令で定める大規模な小売店舗は、延べ面積が千平方メートル以上の小売店舗で百貨店以外のものとする。"
