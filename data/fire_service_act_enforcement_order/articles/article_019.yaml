description: "消防法施行令の第十九条は「屋外消火栓設備に関する基準」を定める。 本文冒頭: 屋外消火栓設備は、別表第一（一）項から（十五）項まで、（十七）項及び（十八）項に掲げる建築物で、床面積（地階を除く階数が一であるものにあつては一階の床面積を、地階を除く階数が二以上であるものにあつては一階及び二階の部分の床面積の合計をいう。第二十七条において同じ。）が、耐火建築物にあつては九千平方メートル以上、準耐火建築物（建築基準法第二条第九号の三に規定す…"
