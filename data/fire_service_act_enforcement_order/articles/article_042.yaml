article_title: "第四十二条"
article_caption: "（災害による事故等に準ずる事故その他の事由の範囲等）"
description: "消防法施行令の第四十二条は「災害による事故等に準ずる事故その他の事由の範囲等」を定める。 本文冒頭: 法第二条第九項の災害による事故等に準ずる事故その他の事由で政令で定めるものは、屋内において生じた事故又は生命に危険を及ぼし、若しくは著しく悪化するおそれがあると認められる症状を示す疾病とし、同項の政令で定める場合は、当該事故その他の事由による傷病者を医療機関その他の場所に迅速に搬送するための適当な手段がない場合とする。"
