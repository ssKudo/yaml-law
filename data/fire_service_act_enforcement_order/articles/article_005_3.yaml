article_caption: "（その他の火災の予防のために必要な事項に関する条例の基準）"
description: "消防法施行令の第五条の三は「その他の火災の予防のために必要な事項に関する条例の基準」を定める。 本文冒頭: 前二条又はこれらの規定に基づく総務省令に定める条例制定基準に従つて定められるもののほか、法第九条に基づく条例の規定は、火災の予防に貢献する合理的なものであることが明らかなものでなければならないものとする。"
