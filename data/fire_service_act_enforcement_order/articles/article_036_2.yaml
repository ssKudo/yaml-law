article_caption: "（消防設備士でなければ行つてはならない工事又は整備）"
description: "消防法施行令の第三十六条の二は「消防設備士でなければ行つてはならない工事又は整備」を定める。 本文冒頭: 法第十七条の五の政令で定める消防用設備等又は特殊消防用設備等の設置に係る工事は、次に掲げる消防用設備等（第一号から第三号まで及び第八号に掲げる消防用設備等については電源、水源及び配管の部分を除き、第四号から第七号まで及び第九号から第十号までに掲げる消防用設備等については電源の部分を除く。）又は必要とされる防火安全性能を有する消防の用に供する設備等若しくは特殊…"
