article_title: "第四十四条"
article_caption: "（救急隊の編成及び装備の基準）"
description: "消防法施行令の第四十四条は「救急隊の編成及び装備の基準」を定める。 本文冒頭: 救急隊（次条第一項に定めるものを除く。次項において同じ。）は、救急自動車一台及び救急隊員三人以上をもつて、又は航空機一機及び救急隊員二人以上をもつて編成しなければならない。"
