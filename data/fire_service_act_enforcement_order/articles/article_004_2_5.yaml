article_title: "第四条の二の五"
article_caption: "（自衛消防組織を置かなければならない者）"
description: "消防法施行令の第四条の二の五は「自衛消防組織を置かなければならない者」を定める。 本文冒頭: 法第八条の二の五第一項の自衛消防組織（以下「自衛消防組織」という。）は、前条の防火対象物につき、その管理についての権原を有する者（同条第二号に掲げる防火対象物にあつては、自衛消防組織設置防火対象物の用途に供される部分の管理についての権原を有する者に限る。）が置くものとする。"
