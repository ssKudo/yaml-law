article_caption: "（大規模の修繕及び模様替えの範囲）"
description: "消防法施行令の第三十四条の三は「大規模の修繕及び模様替えの範囲」を定める。 本文冒頭: 法第十七条の二の五第二項第二号及び第十七条の三第二項第二号の政令で定める大規模の修繕及び模様替えは、当該防火対象物の主要構造部（建築基準法第二条第五号に規定する主要構造部をいう。）である壁について行う過半の修繕又は模様替えとする。"
