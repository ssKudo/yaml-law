article_caption: "（防災管理を要する災害）"
description: "消防法施行令の第四十五条は「防災管理を要する災害」を定める。 本文冒頭: 法第三十六条第一項の火災以外の災害で政令で定めるもの及び同項において読み替えて準用する法第八条の二の二第一項の火災以外の災害で政令で定めるものは、次に掲げる災害とする。"
