article_caption: "（対象火気設備等に係る条例の規定の適用除外に関する条例の基準）"
description: "消防法施行令の第五条の四は「対象火気設備等に係る条例の規定の適用除外に関する条例の基準」を定める。 本文冒頭: 法第九条の規定に基づく条例には、対象火気設備等又は対象火気器具等について、消防長又は消防署長が、予想しない特殊の設備又は器具を用いることにより第五条若しくは第五条の二又はこれらの規定に基づく総務省令に定める条例制定基準に従つて定められた条例の規定による場合と同等以上の安全性を確保することができると認めるとき、その他当該対象火気設備等の位置、構造及び管理又は当…"
