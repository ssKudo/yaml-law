article_caption: "（同一敷地内における二以上の防火対象物）"
description: "消防法施行令の第二条は「同一敷地内における二以上の防火対象物」を定める。 本文冒頭: 同一敷地内に管理について権原を有する者が同一の者である別表第一に掲げる防火対象物が二以上あるときは、それらの防火対象物は、法第八条第一項の規定の適用については、一の防火対象物とみなす。"
