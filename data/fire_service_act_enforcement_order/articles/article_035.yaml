article_caption: "（消防機関の検査を受けなければならない防火対象物等）"
description: "消防法施行令の第三十五条は「消防機関の検査を受けなければならない防火対象物等」を定める。 本文冒頭: 法第十七条の三の二の政令で定める防火対象物は、次に掲げる防火対象物とする。"
