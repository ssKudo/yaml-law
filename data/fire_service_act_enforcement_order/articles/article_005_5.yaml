article_title: "第五条の五"
article_caption: "（基準の特例に関する条例の基準）"
description: "消防法施行令の第五条の五は「基準の特例に関する条例の基準」を定める。 本文冒頭: 市町村は、法第九条の規定に基づく条例を定める場合において、その地方の気候又は風土の特殊性により、第五条若しくは第五条の二又はこれらの規定に基づく総務省令に定める条例制定基準に従つて定められた条例の規定によつては火災の予防の目的を充分に達し難いと認めるときは、当該条例制定基準に従わないことができる。"
