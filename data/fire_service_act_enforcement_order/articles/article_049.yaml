article_title: "第四十九条"
article_caption: "（火災以外の災害時における自衛消防組織の業務等）"
description: "消防法施行令の第四十九条は「火災以外の災害時における自衛消防組織の業務等」を定める。 本文冒頭: 自衛消防組織に法第三十六条第七項の規定の適用がある場合における第四条の二の六及び第四条の二の七の規定の適用については、第四条の二の六中「防火管理者」とあるのは「防災管理者」と、「において、」とあるのは「において火災に対応するための自衛消防組織の業務に関する事項を、防災管理に係る消防計画において火災以外の災害に対応するための」と、第四条の二の七中「火災の被害」…"
