article_title: "第四十八条の二"
article_caption: "（統括防災管理者の資格）"
description: "消防法施行令の第四十八条の二は「統括防災管理者の資格」を定める。 本文冒頭: 法第三十六条第一項において読み替えて準用する法第八条の二第一項の政令で定める資格を有する者は、第四十七条第一項各号のいずれかに掲げる者で、当該防災管理対象物の全体についての防災管理上必要な業務を適切に遂行するために必要な権限及び知識を有するものとして総務省令で定める要件を満たすものとする。"
