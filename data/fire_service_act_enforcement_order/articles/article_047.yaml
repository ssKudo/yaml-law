article_caption: "（防災管理者の資格）"
description: "消防法施行令の第四十七条は「防災管理者の資格」を定める。 本文冒頭: 法第三十六条第一項において読み替えて準用する法第八条第一項の政令で定める資格を有する者は、次の各号のいずれかに掲げる者で、前条の防火対象物（以下「防災管理対象物」という。）において防災管理上必要な業務を適切に遂行することができる管理的又は監督的な地位にあるもの（総務省令で定める防災管理対象物にあつては、防災管理上必要な業務を適切に遂行するために必要な権限及び…"
