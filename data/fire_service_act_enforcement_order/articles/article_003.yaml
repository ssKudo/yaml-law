article_title: "第三条"
article_caption: "（防火管理者の資格）"
description: "消防法施行令の第三条は「防火管理者の資格」を定める。 本文冒頭: 法第八条第一項の政令で定める資格を有する者は、次の各号に掲げる防火対象物の区分に応じ、当該各号に定める者で、当該防火対象物において防火管理上必要な業務を適切に遂行することができる管理的又は監督的な地位にあるものとする。"
