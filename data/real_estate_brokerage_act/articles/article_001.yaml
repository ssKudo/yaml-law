article_caption: "（目的）"
description: "宅地建物取引業法の第一条は「目的」を定める。 本文冒頭: この法律は、宅地建物取引業を営む者について免許制度を実施し、その事業に対し必要な規制を行うことにより、その業務の適正な運営と宅地及び建物の取引の公正とを確保するとともに、宅地建物取引業の健全な発達を促進し、もつて購入者等の利益の保護と宅地及び建物の流通の円滑化とを図ることを目的とする。"
