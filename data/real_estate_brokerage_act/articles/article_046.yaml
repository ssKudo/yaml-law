description: "宅地建物取引業法の第四十六条は「報酬」を定める。 本文冒頭: 宅地建物取引業者が宅地又は建物の売買、交換又は貸借の代理又は媒介に関して受けることのできる報酬の額は、国土交通大臣の定めるところによる。"
