article_caption: "（指定等）"
description: "宅地建物取引業法の第五十条の二の五は「指定等」を定める。 本文冒頭: 第三十四条の二第五項の規定による指定（以下この節において「指定」という。）は、次に掲げる要件を備える者であつて、次条第一項各号に掲げる業務を適正かつ確実に行うことができると認められるものにつき、国土交通省令で定めるところにより、その者の同意を得て行わなければならない。"
