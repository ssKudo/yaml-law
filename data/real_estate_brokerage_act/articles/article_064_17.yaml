description: "宅地建物取引業法の第六十四条の十七は「一般保証業務」を定める。 本文冒頭: 宅地建物取引業保証協会は、一般保証業務を行なう場合においては、あらかじめ、国土交通省令の定めるところにより、国土交通大臣の承認を受けなければならない。"
