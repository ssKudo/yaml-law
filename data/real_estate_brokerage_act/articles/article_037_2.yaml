article_title: "第三十七条の二"
article_caption: "（事務所等以外の場所においてした買受けの申込みの撤回等）"
description: "宅地建物取引業法の第三十七条の二は「事務所等以外の場所においてした買受けの申込みの撤回等」を定める。 本文冒頭: 宅地建物取引業者が自ら売主となる宅地又は建物の売買契約について、当該宅地建物取引業者の事務所その他国土交通省令・内閣府令で定める場所（以下この条において「事務所等」という。）以外の場所において、当該宅地又は建物の買受けの申込みをした者又は売買契約を締結した買主（事務所等において買受けの申込みをし、事務所等以外の場所において売買契約を締結した買主を除く。）は、…"
