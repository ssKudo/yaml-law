article_title: "第七十八条の四"
article_caption: "（事務の区分）"
description: "宅地建物取引業法の第七十八条の四は「事務の区分」を定める。 本文冒頭: 第八条、第十条及び第十四条の規定により都道府県が処理することとされている事務（国土交通大臣の免許を受けた宅地建物取引業者に係る宅地建物取引業者名簿の備付け、登載、閲覧、訂正及び消除に関するものに限る。）は、地方自治法第二条第九項第一号に規定する第一号法定受託事務とする。"
