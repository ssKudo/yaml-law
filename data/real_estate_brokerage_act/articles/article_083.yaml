description: "宅地建物取引業法の第八十三条の規定。 本文冒頭: 一　第九条、第五十条第二項、第五十三条（第六十三条の三第二項において準用する場合を含む。）、第六十三条第二項（第六十三条の三第二項において準用する場合を含む。）又は第七十七条第三項の規定による届出をせず、又は虚偽の届出をした者 二　第三十七条、第四十六条第四項、第四十八条第一項又は第五十条第一項の規定に違反した者 三　第四十五条又は第七十五条の三の規定に違反…"
