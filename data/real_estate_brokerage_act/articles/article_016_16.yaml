description: "宅地建物取引業法の第十六条の十六は「委任の撤回の通知等」を定める。 本文冒頭: 委任都道府県知事は、指定試験機関に試験事務を行わせないこととするときは、その三月前までに、その旨を指定試験機関に通知しなければならない。"
