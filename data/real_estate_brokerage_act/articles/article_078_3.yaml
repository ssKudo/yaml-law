article_title: "第七十八条の三"
article_caption: "（都道府県知事への免許等に関する情報の提供）"
description: "宅地建物取引業法の第七十八条の三は「都道府県知事への免許等に関する情報の提供」を定める。 本文冒頭: 国土交通大臣は、次の各号に掲げる場合には、当該各号に定める事項及び当該各号に掲げる場合において第四条第一項の免許申請書又は第九条第一項の届出書に添付された特定書類の写しを、遅滞なく、宅地建物取引業者の主たる事務所の所在地を管轄する都道府県知事に提供しなければならない。"
