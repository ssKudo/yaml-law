article_title: "第十六条の十八"
article_caption: "（試験事務の引継ぎ等に関する国土交通省令への委任）"
description: "宅地建物取引業法の第十六条の十八は「試験事務の引継ぎ等に関する国土交通省令への委任」を定める。 本文冒頭: 前条第一項の規定により委任都道府県知事が試験事務を行うこととなつた場合、国土交通大臣が第十六条の十四第一項の規定により試験事務の廃止を許可し、若しくは第十六条の十五第一項若しくは第二項の規定により指定を取り消した場合又は委任都道府県知事が指定試験機関に試験事務を行わせないこととした場合における試験事務の引継ぎその他の必要な事項は、国土交通省令で定める。"
keywords: ["宅地建物取引業法", "試験事務の引継ぎ等に関する国土交通省令への委任"]
