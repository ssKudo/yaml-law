article_caption: "（宅地建物取引業審議会）"
description: "宅地建物取引業法の第七十三条は「宅地建物取引業審議会」を定める。 本文冒頭: 都道府県は、都道府県知事の諮問に応じて宅地建物取引業に関する重要事項を調査審議させるため、地方自治法第百三十八条の四第三項の規定により、宅地建物取引業審議会を置くことができるものとする。"
