article_title: "第三十三条"
article_caption: "（広告の開始時期の制限）"
description: "宅地建物取引業法の第三十三条は「広告の開始時期の制限」を定める。 本文冒頭: 宅地建物取引業者は、宅地の造成又は建物の建築に関する工事の完了前においては、当該工事に関し必要とされる都市計画法第二十九条第一項又は第二項の許可、建築基準法（昭和二十五年法律第二百一号）第六条第一項の確認その他法令に基づく許可等の処分で政令で定めるものがあつた後でなければ、当該工事に係る宅地又は建物の売買その他の業務に関する広告をしてはならない。"
