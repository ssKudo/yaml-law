article_caption: "（改善命令）"
description: "宅地建物取引業法の第六十一条は「改善命令」を定める。 本文冒頭: 国土交通大臣は、指定保証機関が第五十二条第二号から第四号までの規定に該当することとなつた場合において、買主の利益を保護するため必要かつ適当であると認めるときは、その必要の限度において、当該指定保証機関に対し、財産の状況又はその事業の運営を改善するため必要な措置を執るべきことを命ずることができる。"
