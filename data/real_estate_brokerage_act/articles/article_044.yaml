article_title: "第四十四条"
article_caption: "（不当な履行遅延の禁止）"
description: "宅地建物取引業法の第四十四条は「不当な履行遅延の禁止」を定める。 本文冒頭: 宅地建物取引業者は、その業務に関してなすべき宅地若しくは建物の登記若しくは引渡し又は取引に係る対価の支払を不当に遅延する行為をしてはならない。"
