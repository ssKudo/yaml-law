description: "宅地建物取引業法の第六十四条の八は「弁済業務保証金の還付等」を定める。 本文冒頭: 宅地建物取引業保証協会の社員と宅地建物取引業に関し取引をした者（社員とその者が社員となる前に宅地建物取引業に関し取引をした者を含み、宅地建物取引業者に該当する者を除く。）は、その取引により生じた債権に関し、当該社員が社員でないとしたならばその者が供託すべき第二十五条第二項の政令で定める営業保証金の額に相当する額の範囲内（当該社員について、既に次項の規定により…"
