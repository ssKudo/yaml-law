article_caption: "（権限の委任）"
description: "宅地建物取引業法の第七十八条の二は「権限の委任」を定める。 本文冒頭: この法律に規定する国土交通大臣の権限は、国土交通省令で定めるところにより、その一部を地方整備局長又は北海道開発局長に委任することができる。"
