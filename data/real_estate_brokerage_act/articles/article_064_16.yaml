article_caption: "（事業計画書等）"
description: "宅地建物取引業法の第六十四条の十六は「事業計画書等」を定める。 本文冒頭: 宅地建物取引業保証協会は、毎事業年度開始前に（第六十四条の二第一項の規定による指定を受けた日の属する事業年度にあつては、その指定を受けた後すみやかに）、収支の見積りその他国土交通省令で定める事項を記載した事業計画書を作成し、国土交通大臣の承認を受けなければならない。"
