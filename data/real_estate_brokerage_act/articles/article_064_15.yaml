article_title: "第六十四条の十五"
article_caption: "（社員の地位を失つた場合の営業保証金の供託）"
description: "宅地建物取引業法の第六十四条の十五は「社員の地位を失つた場合の営業保証金の供託」を定める。 本文冒頭: 宅地建物取引業者は、第六十四条の八第一項の規定により国土交通大臣の指定する弁済業務開始日以後に宅地建物取引業保証協会の社員の地位を失つたときは、当該地位を失つた日から一週間以内に、第二十五条第一項から第三項までの規定により営業保証金を供託しなければならない。"
