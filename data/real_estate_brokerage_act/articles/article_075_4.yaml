article_title: "第七十五条の四"
article_caption: "（内閣総理大臣への資料提供等）"
description: "宅地建物取引業法の第七十五条の四は「内閣総理大臣への資料提供等」を定める。 本文冒頭: 内閣総理大臣は、国土交通大臣の免許を受けた宅地建物取引業者の第三十五条第一項第十四号イに規定する宅地建物取引業者の相手方等の利益の保護を図るため必要があると認めるときは、国土交通大臣に対し、資料の提供、説明その他必要な協力を求めることができる。"
