article_caption: "（変更の届出）"
description: "宅地建物取引業法の第九条は「変更の届出」を定める。 本文冒頭: 宅地建物取引業者は、第四条第一項第一号から第五号までに掲げる事項について変更があつた場合においては、国土交通省令の定めるところにより、三十日以内に、当該変更に係る事項を記載した届出書をその免許を受けた国土交通大臣又は都道府県知事に提出しなければならない。"
