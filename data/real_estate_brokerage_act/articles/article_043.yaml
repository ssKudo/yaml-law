article_title: "第四十三条"
article_caption: "（所有権留保等の禁止）"
description: "宅地建物取引業法の第四十三条は「所有権留保等の禁止」を定める。 本文冒頭: 宅地建物取引業者は、みずから売主として宅地又は建物の割賦販売を行なつた場合には、当該割賦販売に係る宅地又は建物を買主に引き渡すまで（当該宅地又は建物を引き渡すまでに代金の額の十分の三をこえる額の金銭の支払を受けていない場合にあつては、代金の額の十分の三をこえる額の金銭の支払を受けるまで）に、登記その他引渡し以外の売主の義務を履行しなければならない。"
