description: "宅地建物取引業法の第六十二条は「指定の取消し等」を定める。 本文冒頭: 国土交通大臣は、指定保証機関が次の各号の一に該当する場合又はこの法律の規定に違反した場合においては、当該指定保証機関に対して、必要な指示をすることができる。"
