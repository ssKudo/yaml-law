article_title: "第十四条"
article_caption: "（国土交通省令への委任）"
description: "宅地建物取引業法の第十四条は「国土交通省令への委任」を定める。 本文冒頭: 第三条から第十一条までに規定するもののほか、免許の申請、免許証の交付、書換交付、再交付及び返納並びに宅地建物取引業者名簿の登載、訂正及び消除について必要な事項は、国土交通省令で定める。"
