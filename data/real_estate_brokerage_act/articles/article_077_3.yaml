description: "宅地建物取引業法の第七十七条の三の規定。 本文冒頭: ２特例事業者については、前項に掲げる規定並びに第三十一条の三、第三十五条、第三十五条の二、第三十七条及び第四十八条から第五十条までの規定を除き、国土交通大臣の免許を受けた宅地建物取引業者とみなしてこの法律の規定を適用する。"
