article_title: "第十九条の二"
article_caption: "（登録の移転）"
description: "宅地建物取引業法の第十九条の二は「登録の移転」を定める。 本文冒頭: 第十八条第一項の登録を受けている者は、当該登録をしている都道府県知事の管轄する都道府県以外の都道府県に所在する宅地建物取引業者の事務所の業務に従事し、又は従事しようとするときは、当該事務所の所在地を管轄する都道府県知事に対し、当該登録をしている都道府県知事を経由して、登録の移転の申請をすることができる。"
