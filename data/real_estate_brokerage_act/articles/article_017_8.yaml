article_caption: "（登録事項の変更の届出）"
description: "宅地建物取引業法の第十七条の八は「登録事項の変更の届出」を定める。 本文冒頭: 登録講習機関は、第十七条の五第二項第二号から第四号までに掲げる事項を変更しようとするときは、変更しようとする日の二週間前までに、その旨を国土交通大臣に届け出なければならない。"
