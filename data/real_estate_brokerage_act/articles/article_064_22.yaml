article_title: "第六十四条の二十二"
article_caption: "（指定の取消し等）"
description: "宅地建物取引業法の第六十四条の二十二は「指定の取消し等」を定める。 本文冒頭: 国土交通大臣は、宅地建物取引業保証協会が次の各号の一に該当するときは、当該宅地建物取引業保証協会に対して、第六十四条の二第一項の規定による指定を取り消すことができる。"
