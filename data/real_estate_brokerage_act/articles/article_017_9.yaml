description: "宅地建物取引業法の第十七条の九は「講習業務規程」を定める。 本文冒頭: 登録講習機関は、講習業務に関する規程（以下「講習業務規程」という。）を定め、講習業務の開始前に、国土交通大臣に届け出なければならない。"
