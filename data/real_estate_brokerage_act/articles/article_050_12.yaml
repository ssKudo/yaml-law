article_title: "第五十条の十二"
article_caption: "（報告及び検査）"
description: "宅地建物取引業法の第五十条の十二は「報告及び検査」を定める。 本文冒頭: 国土交通大臣は、第五十条の三第一項に規定する業務の適正な実施を確保するため必要があると認めるときは、指定流通機構に対し、当該業務の状況に関し必要な報告を求め、又はその職員に、指定流通機構の事務所に立ち入り、業務の状況若しくは設備、帳簿、書類その他の物件を検査させることができる。"
