article_title: "第六十三条の三"
article_caption: "（指定等）"
description: "宅地建物取引業法の第六十三条の三は「指定等」を定める。 本文冒頭: 第四十一条の二第一項第一号の指定（以下この節において「指定」という。）は、宅地又は建物の売買（第四十一条第一項に規定する売買を除く。）に関し、宅地建物取引業者に代理して手付金等を受領し、当該宅地建物取引業者が受領した手付金等の額に相当する額の金銭を保管する事業（以下「手付金等保管事業」という。）を営もうとする者の申請により行う。"
