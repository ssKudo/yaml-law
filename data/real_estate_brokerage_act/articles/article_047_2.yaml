description: "宅地建物取引業法の第四十七条の二の規定。 本文冒頭: ２宅地建物取引業者等は、宅地建物取引業に係る契約を締結させ、又は宅地建物取引業に係る契約の申込みの撤回若しくは解除を妨げるため、宅地建物取引業者の相手方等を威迫してはならない。"
