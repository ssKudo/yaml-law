article_caption: "（監督処分の公告等）"
description: "宅地建物取引業法の第七十条は「監督処分の公告等」を定める。 本文冒頭: 国土交通大臣又は都道府県知事は、第六十五条第二項若しくは第四項、第六十六条又は第六十七条の二第一項若しくは第二項の規定による処分をしたときは、国土交通省令の定めるところにより、その旨を公告しなければならない。"
