article_caption: "（適合命令）"
description: "宅地建物取引業法の第十七条の十二は「適合命令」を定める。 本文冒頭: 国土交通大臣は、登録講習機関が第十七条の五第一項の規定に適合しなくなつたと認めるときは、その登録講習機関に対し、同項の規定に適合するため必要な措置をとるべきことを命ずることができる。"
