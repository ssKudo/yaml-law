description: "宅地建物取引業法の第六十四条の二は「指定」を定める。 本文冒頭: 国土交通大臣は、次に掲げる要件を備える者の申請があつた場合において、その者が次条第一項各号に掲げる業務の全部について適正な計画を有し、かつ、確実にその業務を行うことができると認められるときは、この章に定めるところにより同項各号に掲げる業務を行う者として、指定することができる。"
