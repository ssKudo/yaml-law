article_caption: "（試験事務の休廃止）"
description: "宅地建物取引業法の第十六条の十四は「試験事務の休廃止」を定める。 本文冒頭: 指定試験機関は、国土交通大臣の許可を受けなければ、試験事務の全部又は一部を休止し、又は廃止してはならない。"
