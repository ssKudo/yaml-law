description: "宅地建物取引業法の第八十五条の二の規定。 本文冒頭: 第八十五条の二 第十七条の十一第一項の規定に違反して財務諸表等を備えて置かず、財務諸表等に記載すべき事項を記載せず、若しくは虚偽の記載をし、又は正当な理由がないのに同条第二項各号の規定による請求を拒んだ者は、二十万円以下の過料に処する。"
