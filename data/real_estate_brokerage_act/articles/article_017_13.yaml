article_caption: "（改善命令）"
description: "宅地建物取引業法の第十七条の十三は「改善命令」を定める。 本文冒頭: 国土交通大臣は、登録講習機関が第十七条の七の規定に違反していると認めるときは、その登録講習機関に対し、同条の規定による講習業務を行うべきこと又は登録講習の方法その他の業務の方法の改善に関し必要な措置をとるべきことを命ずることができる。"
