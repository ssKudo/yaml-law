article_title: "第五十条の十四"
article_caption: "（指定の取消し等）"
description: "宅地建物取引業法の第五十条の十四は「指定の取消し等」を定める。 本文冒頭: 国土交通大臣は、指定流通機構が次の各号のいずれかに該当するときは、当該指定流通機構に対し、その指定を取り消し、又は期間を定めて登録業務の全部若しくは一部の停止を命ずることができる。"
