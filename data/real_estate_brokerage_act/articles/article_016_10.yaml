article_title: "第十六条の十"
article_caption: "（事業計画等）"
description: "宅地建物取引業法の第十六条の十は「事業計画等」を定める。 本文冒頭: 指定試験機関は、毎事業年度、事業計画及び収支予算を作成し、当該事業年度の開始前に（第十六条の二第一項の規定による指定を受けた日の属する事業年度にあつては、その指定を受けた後遅滞なく）、国土交通大臣の認可を受けなければならない。"
