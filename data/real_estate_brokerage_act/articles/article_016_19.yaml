article_title: "第十六条の十九"
article_caption: "（受験手数料）"
description: "宅地建物取引業法の第十六条の十九は「受験手数料」を定める。 本文冒頭: 都道府県は、地方自治法（昭和二十二年法律第六十七号）第二百二十七条の規定に基づき試験に係る手数料を徴収する場合においては、第十六条の二の規定により指定試験機関が行う試験を受けようとする者に、条例で定めるところにより、当該手数料を当該指定試験機関に納めさせ、その収入とすることができる。"
