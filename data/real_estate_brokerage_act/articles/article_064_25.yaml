article_caption: "（指定の取消し等の場合の弁済業務保証金等の交付）"
description: "宅地建物取引業法の第六十四条の二十五は「指定の取消し等の場合の弁済業務保証金等の交付」を定める。 本文冒頭: 旧協会は、前条第三項から第五項までの規定により取り戻した弁済業務保証金、第六十四条の二第一項の規定による指定を取り消され、又は解散した日（以下この条において「指定取消し等の日」という。）以後において第六十四条の十第二項の規定により納付された還付充当金並びに弁済業務保証金準備金（指定取消し等の日以後において第六十四条の十二第四項の規定により納付された特別弁済業…"
