description: "宅地建物取引業法の第六十四条の二十は「改善命令」を定める。 本文冒頭: 国土交通大臣は、この章の規定を施行するため必要があると認めるときは、その必要の限度において、宅地建物取引業保証協会に対し、財産の状況又はその事業の運営を改善するため必要な措置をとるべきことを命ずることができる。"
