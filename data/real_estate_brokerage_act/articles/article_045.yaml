article_caption: "（秘密を守る義務）"
description: "宅地建物取引業法の第四十五条は「秘密を守る義務」を定める。 本文冒頭: 宅地建物取引業者は、正当な理由がある場合でなければ、その業務上取り扱つたことについて知り得た秘密を他に漏らしてはならない。"
