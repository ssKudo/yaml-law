article_caption: "（監督命令）"
description: "宅地建物取引業法の第五十条の十一は「監督命令」を定める。 本文冒頭: 国土交通大臣は、第五十条の三第一項に規定する業務の適正な実施を確保するため必要があると認めるときは、指定流通機構に対し、当該業務に関し監督上必要な命令をすることができる。"
