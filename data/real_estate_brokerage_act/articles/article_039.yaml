article_caption: "（手付の額の制限等）"
description: "宅地建物取引業法の第三十九条は「手付の額の制限等」を定める。 本文冒頭: 宅地建物取引業者は、自ら売主となる宅地又は建物の売買契約の締結に際して、代金の額の十分の二を超える額の手付を受領することができない。"
