article_caption: "（売買契約等に係る件数等の公表）"
description: "宅地建物取引業法の第五十条の七は「売買契約等に係る件数等の公表」を定める。 本文冒頭: 指定流通機構は、当該指定流通機構に登録された宅地又は建物について、国土交通省令で定めるところにより、毎月の売買又は交換の契約に係る件数その他国土交通省令で定める事項を公表しなければならない。"
