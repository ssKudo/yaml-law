description: "宅地建物取引業法の第六十六条は「免許の取消し」を定める。 本文冒頭: 国土交通大臣又は都道府県知事は、その免許を受けた宅地建物取引業者が次の各号のいずれかに該当する場合においては、当該免許を取り消さなければならない。"
