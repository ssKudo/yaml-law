article_caption: "（廃業等の届出）"
description: "宅地建物取引業法の第十一条は「廃業等の届出」を定める。 本文冒頭: 宅地建物取引業者が次の各号のいずれかに該当することとなつた場合においては、当該各号に掲げる者は、その日（第一号の場合にあつては、その事実を知つた日）から三十日以内に、その旨をその免許を受けた国土交通大臣又は都道府県知事に届け出なければならない。"
