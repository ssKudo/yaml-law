description: "宅地建物取引業法の第十六条の十二は「監督命令等」を定める。 本文冒頭: 国土交通大臣は、試験事務の適正な実施を確保するため必要があると認めるときは、指定試験機関に対し、試験事務に関し監督上必要な命令をすることができる。"
