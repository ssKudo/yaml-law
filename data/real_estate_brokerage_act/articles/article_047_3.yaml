article_title: "第四十七条の三"
article_caption: "（宅地建物取引業の業務に関し行つた行為の取消しの制限）"
description: "宅地建物取引業法の第四十七条の三は「宅地建物取引業の業務に関し行つた行為の取消しの制限」を定める。 本文冒頭: 宅地建物取引業者（個人に限り、未成年者を除く。）が宅地建物取引業の業務に関し行つた行為は、行為能力の制限によつては取り消すことができない。"
