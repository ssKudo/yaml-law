article_caption: "（解任命令）"
description: "宅地建物取引業法の第六十四条の二十一は「解任命令」を定める。 本文冒頭: 国土交通大臣は、宅地建物取引業保証協会の役員が、この法律、この法律に基づく命令若しくは処分に違反したとき、又はその在任により当該宅地建物取引業保証協会が第六十四条の二第一項第四号に掲げる要件に適合しなくなるときは、当該宅地建物取引業保証協会に対し、その役員を解任すべきことを命ずることができる。"
