article_caption: "（講習業務の実施に係る義務）"
description: "宅地建物取引業法の第十七条の七は「講習業務の実施に係る義務」を定める。 本文冒頭: 登録講習機関は、公正に、かつ、第十七条の五第一項の規定及び国土交通省令で定める基準に適合する方法により講習業務を行わなければならない。"
