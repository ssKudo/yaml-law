article_title: "第六十四条の五"
article_caption: "（苦情の解決）"
description: "宅地建物取引業法の第六十四条の五は「苦情の解決」を定める。 本文冒頭: 宅地建物取引業保証協会は、宅地建物取引業者の相手方等から社員の取り扱つた宅地建物取引業に係る取引に関する苦情について解決の申出があつたときは、その相談に応じ、申出人に必要な助言をし、当該苦情に係る事情を調査するとともに、当該社員に対し当該苦情の内容を通知してその迅速な処理を求めなければならない。"
