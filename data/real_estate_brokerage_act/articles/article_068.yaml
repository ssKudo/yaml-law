article_caption: "（宅地建物取引士としてすべき事務の禁止等）"
description: "宅地建物取引業法の第六十八条は「宅地建物取引士としてすべき事務の禁止等」を定める。 本文冒頭: 都道府県知事は、その登録を受けている宅地建物取引士が次の各号のいずれかに該当する場合においては、当該宅地建物取引士に対し、必要な指示をすることができる。"
