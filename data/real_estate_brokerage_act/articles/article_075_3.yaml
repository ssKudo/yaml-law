article_title: "第七十五条の三"
article_caption: "（宅地建物取引業者の使用人等の秘密を守る義務）"
description: "宅地建物取引業法の第七十五条の三は「宅地建物取引業者の使用人等の秘密を守る義務」を定める。 本文冒頭: 宅地建物取引業者の使用人その他の従業者は、正当な理由がある場合でなければ、宅地建物取引業の業務を補助したことについて知り得た秘密を他に漏らしてはならない。"
