article_caption: "（他の指定流通機構による登録業務の実施等）"
description: "宅地建物取引業法の第五十条の十五は「他の指定流通機構による登録業務の実施等」を定める。 本文冒頭: 国土交通大臣は、第五十条の十三第一項の規定による登録業務の全部若しくは一部の休止若しくは廃止の届出があつたとき、前条第一項の規定により指定を取り消したとき若しくは登録業務の全部若しくは一部の停止を命じたとき、又は指定流通機構が天災その他の事態により登録業務の全部若しくは一部を実施することが困難となつた場合において必要があると認めるときは、当該登録業務の全部又…"
