article_title: "第十六条の五"
article_caption: "（委任の公示等）"
description: "宅地建物取引業法の第十六条の五は「委任の公示等」を定める。 本文冒頭: 第十六条の二第一項の規定により指定試験機関にその試験事務を行わせることとした都道府県知事（以下「委任都道府県知事」という。）は、当該指定試験機関の名称、主たる事務所の所在地及び当該試験事務を取り扱う事務所の所在地並びに当該指定試験機関に試験事務を行わせることとした日を公示しなければならない。"
