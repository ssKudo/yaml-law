description: "宅地建物取引業法の第十六条の十一は「帳簿の備付け等」を定める。 本文冒頭: 指定試験機関は、国土交通省令で定めるところにより、試験事務に関する事項で国土交通省令で定めるものを記載した帳簿を備え、保存しなければならない。"
