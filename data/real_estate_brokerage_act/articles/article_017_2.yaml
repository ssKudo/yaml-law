article_caption: "（指定試験機関がした処分等に係る審査請求）"
description: "宅地建物取引業法の第十七条の二は「指定試験機関がした処分等に係る審査請求」を定める。 本文冒頭: 指定試験機関が行う試験事務に係る処分又はその不作為については、国土交通大臣に対し、審査請求をすることができる。"
