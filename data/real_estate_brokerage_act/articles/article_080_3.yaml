description: "宅地建物取引業法の第八十条の三の規定。 本文冒頭: 第八十条の三 第十六条の十五第二項又は第十七条の十四の規定による試験事務又は講習業務の停止の命令に違反したときは、その違反行為をした指定試験機関の役員若しくは職員又は登録講習機関（その者が法人である場合にあつては、その役員）若しくはその職員（第八十三条の二において「指定試験機関等の役員等」という。）は、一年以下の拘禁刑又は百万円以下の罰金に処する。"
