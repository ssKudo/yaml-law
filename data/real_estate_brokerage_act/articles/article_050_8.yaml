article_title: "第五十条の八"
article_caption: "（事業計画等）"
description: "宅地建物取引業法の第五十条の八は「事業計画等」を定める。 本文冒頭: 指定流通機構は、毎事業年度、事業計画及び収支予算を作成し、当該事業年度の開始前に（指定を受けた日の属する事業年度にあつては、その指定を受けた後遅滞なく）、国土交通大臣の認可を受けなければならない。"
