description: "宅地建物取引業法の第三十条は「営業保証金の取戻し」を定める。 本文冒頭: 第三条第二項の有効期間（同条第四項に規定する場合にあつては、同項の規定によりなお効力を有することとされる期間を含む。第七十六条において同じ。）が満了したとき、第十一条第二項の規定により免許が効力を失つたとき、同条第一項第一号若しくは第二号に該当することとなつたとき、又は第二十五条第七項、第六十六条若しくは第六十七条第一項の規定により免許を取り消されたときは、…"
