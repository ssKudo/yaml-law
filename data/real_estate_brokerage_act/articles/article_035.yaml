description: "宅地建物取引業法の第三十五条は「重要事項の説明等」を定める。 本文冒頭: 宅地建物取引業者は、宅地若しくは建物の売買、交換若しくは貸借の相手方若しくは代理を依頼した者又は宅地建物取引業者が行う媒介に係る売買、交換若しくは貸借の各当事者（以下「宅地建物取引業者の相手方等」という。）に対して、その者が取得し、又は借りようとしている宅地又は建物に関し、その売買、交換又は貸借の契約が成立するまでの間に、宅地建物取引士をして、少なくとも次に…"
