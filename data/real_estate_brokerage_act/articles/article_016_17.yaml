article_title: "第十六条の十七"
article_caption: "（委任都道府県知事による試験の実施）"
description: "宅地建物取引業法の第十六条の十七は「委任都道府県知事による試験の実施」を定める。 本文冒頭: 委任都道府県知事は、指定試験機関が第十六条の十四第一項の規定により試験事務の全部若しくは一部を休止したとき、国土交通大臣が第十六条の十五第二項の規定により指定試験機関に対し試験事務の全部若しくは一部の停止を命じたとき、又は指定試験機関が天災その他の事由により試験事務の全部若しくは一部を実施することが困難となつた場合において国土交通大臣が必要があると認めるとき…"
