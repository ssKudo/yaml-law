article_caption: "（宅地建物取引士の業務処理の原則）"
description: "宅地建物取引業法の第十五条は「宅地建物取引士の業務処理の原則」を定める。 本文冒頭: 宅地建物取引士は、宅地建物取引業の業務に従事するときは、宅地又は建物の取引の専門家として、購入者等の利益の保護及び円滑な宅地又は建物の流通に資するよう、公正かつ誠実にこの法律に定める事務を行うとともに、宅地建物取引業に関連する業務に従事する者との連携に努めなければならない。"
