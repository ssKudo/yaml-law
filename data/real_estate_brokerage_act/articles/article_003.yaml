description: "宅地建物取引業法の第三条は「免許」を定める。 本文冒頭: 宅地建物取引業を営もうとする者は、二以上の都道府県の区域内に事務所（本店、支店その他の政令で定めるものをいう。以下同じ。）を設置してその事業を営もうとする場合にあつては国土交通大臣の、一の都道府県の区域内にのみ事務所を設置してその事業を営もうとする場合にあつては当該事務所の所在地を管轄する都道府県知事の免許を受けなければならない。"
