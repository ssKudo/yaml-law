description: "宅地建物取引業法の第二十七条は「営業保証金の還付」を定める。 本文冒頭: 宅地建物取引業者と宅地建物取引業に関し取引をした者（宅地建物取引業者に該当する者を除く。）は、その取引により生じた債権に関し、宅地建物取引業者が供託した営業保証金について、その債権の弁済を受ける権利を有する。"
