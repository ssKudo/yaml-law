article_title: "第四十二条"
article_caption: "（宅地又は建物の割賦販売の契約の解除等の制限）"
description: "宅地建物取引業法の第四十二条は「宅地又は建物の割賦販売の契約の解除等の制限」を定める。 本文冒頭: 宅地建物取引業者は、みずから売主となる宅地又は建物の割賦販売の契約について賦払金の支払の義務が履行されない場合においては、三十日以上の相当の期間を定めてその支払を書面で催告し、その期間内にその義務が履行されないときでなければ、賦払金の支払の遅滞を理由として、契約を解除し、又は支払時期の到来していない賦払金の支払を請求することができない。"
