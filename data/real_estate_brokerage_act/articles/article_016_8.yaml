article_caption: "（秘密保持義務等）"
description: "宅地建物取引業法の第十六条の八は「秘密保持義務等」を定める。 本文冒頭: 指定試験機関の役員若しくは職員（前条第一項の試験委員を含む。次項において同じ。）又はこれらの職にあつた者は、試験事務に関して知り得た秘密を漏らしてはならない。"
