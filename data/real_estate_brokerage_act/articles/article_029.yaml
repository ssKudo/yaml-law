description: "宅地建物取引業法の第二十九条は「営業保証金の保管替え等」を定める。 本文冒頭: 宅地建物取引業者は、その主たる事務所を移転したためその最寄りの供託所が変更した場合において、金銭のみをもつて営業保証金を供託しているときは、法務省令・国土交通省令の定めるところにより、遅滞なく、費用を予納して、営業保証金を供託している供託所に対し、移転後の主たる事務所の最寄りの供託所への営業保証金の保管替えを請求し、その他のときは、遅滞なく、営業保証金を移転…"
