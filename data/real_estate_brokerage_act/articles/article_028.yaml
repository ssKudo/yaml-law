article_caption: "（営業保証金の不足額の供託）"
description: "宅地建物取引業法の第二十八条は「営業保証金の不足額の供託」を定める。 本文冒頭: 宅地建物取引業者は、前条第一項の権利を有する者がその権利を実行したため、営業保証金が第二十五条第二項の政令で定める額に不足することとなつたときは、法務省令・国土交通省令で定める日から二週間以内にその不足額を供託しなければならない。"
