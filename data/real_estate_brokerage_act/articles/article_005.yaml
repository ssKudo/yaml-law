description: "宅地建物取引業法の第五条は「免許の基準」を定める。 本文冒頭: 国土交通大臣又は都道府県知事は、第三条第一項の免許を受けようとする者が次の各号のいずれかに該当する場合又は免許申請書若しくはその添付書類中に重要な事項について虚偽の記載があり、若しくは重要な事実の記載が欠けている場合においては、免許をしてはならない。"
