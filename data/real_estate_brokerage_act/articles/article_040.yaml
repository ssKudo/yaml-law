article_title: "第四十条"
article_caption: "（担保責任についての特約の制限）"
description: "宅地建物取引業法の第四十条は「担保責任についての特約の制限」を定める。 本文冒頭: 宅地建物取引業者は、自ら売主となる宅地又は建物の売買契約において、その目的物が種類又は品質に関して契約の内容に適合しない場合におけるその不適合を担保すべき責任に関し、民法（明治二十九年法律第八十九号）第五百六十六条に規定する期間についてその目的物の引渡しの日から二年以上となる特約をする場合を除き、同条に規定するものより買主に不利となる特約をしてはならない。"
