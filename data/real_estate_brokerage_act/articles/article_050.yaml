article_caption: "（標識の掲示等）"
description: "宅地建物取引業法の第五十条は「標識の掲示等」を定める。 本文冒頭: 宅地建物取引業者は、事務所等及び事務所等以外の国土交通省令で定めるその業務を行う場所ごとに、公衆の見やすい場所に、国土交通省令で定める標識を掲げなければならない。"
