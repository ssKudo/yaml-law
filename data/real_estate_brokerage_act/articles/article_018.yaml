article_caption: "（宅地建物取引士の登録）"
description: "宅地建物取引業法の第十八条は「宅地建物取引士の登録」を定める。 本文冒頭: 試験に合格した者で、宅地若しくは建物の取引に関し国土交通省令で定める期間以上の実務の経験を有するもの又は国土交通大臣がその実務の経験を有するものと同等以上の能力を有すると認めたものは、国土交通省令の定めるところにより、当該試験を行つた都道府県知事の登録を受けることができる。"
