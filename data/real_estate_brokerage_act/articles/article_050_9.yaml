article_title: "第五十条の九"
article_caption: "（登録業務に関する情報の目的外使用の禁止）"
description: "宅地建物取引業法の第五十条の九は「登録業務に関する情報の目的外使用の禁止」を定める。 本文冒頭: 指定流通機構の役員若しくは職員又はこれらの職にあつた者は、登録業務に関して得られた情報を、第五十条の三第一項に規定する業務の用に供する目的以外に使用してはならない。"
