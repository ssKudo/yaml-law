article_title: "第六十四条"
article_caption: "（指定の取消し等）"
description: "宅地建物取引業法の第六十四条は「指定の取消し等」を定める。 本文冒頭: 国土交通大臣は、第六十三条の三第二項において準用する第五十四条第一項又は第六十二条第二項の規定により指定を取り消す場合のほか、指定保管機関が次の各号の一に該当する場合においては、当該指定保管機関に対し、その指定を取り消し、又は六月以内の期間を定めて手付金等保管事業の全部若しくは一部の停止を命ずることができる。"
