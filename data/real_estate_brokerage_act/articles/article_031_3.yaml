article_title: "第三十一条の三"
article_caption: "（宅地建物取引士の設置）"
description: "宅地建物取引業法の第三十一条の三は「宅地建物取引士の設置」を定める。 本文冒頭: 宅地建物取引業者は、その事務所その他国土交通省令で定める場所（以下この条及び第五十条第一項において「事務所等」という。）ごとに、事務所等の規模、業務内容等を考慮して国土交通省令で定める数の成年者である専任の宅地建物取引士を置かなければならない。"
