description: "宅地建物取引業法の第六十九条は「聴聞の特例」を定める。 本文冒頭: 国土交通大臣又は都道府県知事は、第六十五条又は第六十八条の規定による処分をしようとするときは、行政手続法第十三条第一項の規定による意見陳述のための手続の区分にかかわらず、聴聞を行わなければならない。"
