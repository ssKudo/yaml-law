description: "宅地建物取引業法の第七十五条は「名称の使用制限」を定める。 本文冒頭: 宅地建物取引業協会及び宅地建物取引業協会連合会でない者は、宅地建物取引業協会又は宅地建物取引業協会連合会という文字をその名称中に用いてはならない。"
