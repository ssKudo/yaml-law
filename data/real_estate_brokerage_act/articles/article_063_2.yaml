article_title: "第六十三条の二"
article_caption: "（報告及び検査）"
description: "宅地建物取引業法の第六十三条の二は「報告及び検査」を定める。 本文冒頭: 国土交通大臣は、手付金等保証事業の適正な運営を確保するため必要があると認めるときは、指定保証機関に対しその業務に関して報告若しくは資料の提出を命じ、又はその職員をしてその業務を行う場所に立ち入り、業務若しくは財産の状況若しくは帳簿、書類その他業務に関係のある物件を検査させることができる。"
