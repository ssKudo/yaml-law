article_title: "第三十二条"
article_caption: "（誇大広告等の禁止）"
description: "宅地建物取引業法の第三十二条は「誇大広告等の禁止」を定める。 本文冒頭: 宅地建物取引業者は、その業務に関して広告をするときは、当該広告に係る宅地又は建物の所在、規模、形質若しくは現在若しくは将来の利用の制限、環境若しくは交通その他の利便又は代金、借賃等の対価の額若しくはその支払方法若しくは代金若しくは交換差金に関する金銭の貸借のあつせんについて、著しく事実に相違する表示をし、又は実際のものよりも著しく優良であり、若しくは有利であ…"
