article_caption: "（宅地建物取引業協会及び宅地建物取引業協会連合会）"
description: "宅地建物取引業法の第七十四条は「宅地建物取引業協会及び宅地建物取引業協会連合会」を定める。 本文冒頭: その名称中に宅地建物取引業協会という文字を用いる一般社団法人（次項に規定するものを除く。）は、宅地建物取引業の適正な運営を確保するとともに宅地建物取引業の健全な発達を図るため、社員の指導及び連絡に関する事務を行うことを目的とし、かつ、一の都道府県の区域内において事業を行う旨及び宅地建物取引業者を社員とする旨の定款の定めがあるものでなければならない。"
