description: "宅地建物取引業法の第六十五条は「指示及び業務の停止」を定める。 本文冒頭: 国土交通大臣又は都道府県知事は、その免許（第五十条の二第一項の認可を含む。次項において同じ。）を受けた宅地建物取引業者が次の各号のいずれかに該当する場合又はこの法律の規定若しくは特定住宅瑕疵担保責任の履行の確保等に関する法律（平成十九年法律第六十六号。以下この条において「履行確保法」という。）第十一条第一項若しくは第六項、第十二条第一項、第十三条、第十五条第…"
