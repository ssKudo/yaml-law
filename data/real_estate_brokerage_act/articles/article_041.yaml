description: "宅地建物取引業法の第四十一条は「手付金等の保全」を定める。 本文冒頭: 宅地建物取引業者は、宅地の造成又は建築に関する工事の完了前において行う当該工事に係る宅地又は建物の売買で自ら売主となるものに関しては、次の各号のいずれかに掲げる措置を講じた後でなければ、買主から手付金等（代金の全部又は一部として授受される金銭及び手付金その他の名義をもつて授受される金銭で代金に充当されるものであつて、契約の締結の日以後当該宅地又は建物の引渡し…"
