article_caption: "（報告及び検査）"
description: "宅地建物取引業法の第七十二条は「報告及び検査」を定める。 本文冒頭: 国土交通大臣は、宅地建物取引業を営むすべての者に対して、都道府県知事は、当該都道府県の区域内で宅地建物取引業を営む者に対して、宅地建物取引業の適正な運営を確保するため必要があると認めるときは、その業務について必要な報告を求め、又はその職員に事務所その他その業務を行なう場所に立ち入り、帳簿、書類その他業務に関係のある物件を検査させることができる。"
