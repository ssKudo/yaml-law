description: "宅地建物取引業法の第六十三条は「事業報告書等の提出」を定める。 本文冒頭: 指定保証機関は、毎事業年度開始前に、収支の見積りその他国土交通省令で定める事項を記載した事業計画書を作成し、国土交通大臣に提出しなければならない。"
