article_caption: "（信託会社等に関する特例）"
description: "宅地建物取引業法の第七十七条は「信託会社等に関する特例」を定める。 本文冒頭: 第三条から第七条まで、第十二条、第二十五条第七項、第六十六条及び第六十七条第一項の規定は、信託業法（平成十六年法律第百五十四号）第三条又は第五十三条第一項の免許を受けた信託会社（政令で定めるものを除く。次項及び第三項において同じ。）には、適用しない。"
