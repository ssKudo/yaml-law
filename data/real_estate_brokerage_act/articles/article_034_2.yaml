article_caption: "（媒介契約）"
description: "宅地建物取引業法の第三十四条の二は「媒介契約」を定める。 本文冒頭: 宅地建物取引業者は、宅地又は建物の売買又は交換の媒介の契約（以下この条において「媒介契約」という。）を締結したときは、遅滞なく、次に掲げる事項を記載した書面を作成して記名押印し、依頼者にこれを交付しなければならない。"
