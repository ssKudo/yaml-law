article_caption: "（書面の交付）"
description: "宅地建物取引業法の第三十七条は「書面の交付」を定める。 本文冒頭: 宅地建物取引業者は、宅地又は建物の売買又は交換に関し、自ら当事者として契約を締結したときはその相手方に、当事者を代理して契約を締結したときはその相手方及び代理を依頼した者に、その媒介により契約が成立したときは当該契約の各当事者に、遅滞なく、次に掲げる事項を記載した書面を交付しなければならない。"
