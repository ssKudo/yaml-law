article_caption: "（宅地建物取引士証の交付等）"
description: "宅地建物取引業法の第二十二条の二は「宅地建物取引士証の交付等」を定める。 本文冒頭: 第十八条第一項の登録を受けている者は、登録をしている都道府県知事に対し、宅地建物取引士証の交付を申請することができる。"
