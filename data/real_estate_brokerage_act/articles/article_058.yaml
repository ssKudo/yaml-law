article_caption: "（支払備金の積立て）"
description: "宅地建物取引業法の第五十八条は「支払備金の積立て」を定める。 本文冒頭: 指定保証機関は、決算期ごとに、次の各号の一に掲げる金額がある場合においては、支払備金として当該各号に掲げる金額を積み立てなければならない。"
