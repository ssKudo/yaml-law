article_title: "第十七条の十四"
article_caption: "（登録の取消し等）"
description: "宅地建物取引業法の第十七条の十四は「登録の取消し等」を定める。 本文冒頭: 国土交通大臣は、登録講習機関が次の各号のいずれかに該当するときは、その登録を取り消し、又は期間を定めて講習業務の全部若しくは一部の停止を命ずることができる。"
