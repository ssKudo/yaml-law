article_title: "第六十四条の七"
article_caption: "（弁済業務保証金の供託）"
description: "宅地建物取引業法の第六十四条の七は「弁済業務保証金の供託」を定める。 本文冒頭: 宅地建物取引業保証協会は、第六十四条の九第一項又は第二項の規定により弁済業務保証金分担金の納付を受けたときは、その日から一週間以内に、その納付を受けた額に相当する額の弁済業務保証金を供託しなければならない。"
