article_caption: "（従業者の教育）"
description: "宅地建物取引業法の第三十一条の二は「従業者の教育」を定める。 本文冒頭: 宅地建物取引業者は、その従業者に対し、その業務を適正に実施させるため、必要な教育を行うよう努めなければならない。"
