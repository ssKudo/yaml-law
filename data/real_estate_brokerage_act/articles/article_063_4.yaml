description: "宅地建物取引業法の第六十三条の四は「事業方法書の変更」を定める。 本文冒頭: 指定保管機関は、前条第二項において準用する第五十一条第三項第一号の事業方法書を変更しようとするときは、国土交通大臣の認可を受けなければならない。"
