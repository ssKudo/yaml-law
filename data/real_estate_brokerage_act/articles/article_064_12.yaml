article_title: "第六十四条の十二"
article_caption: "（弁済業務保証金準備金）"
description: "宅地建物取引業法の第六十四条の十二は「弁済業務保証金準備金」を定める。 本文冒頭: 宅地建物取引業保証協会は、第六十四条の八第三項の規定により弁済業務保証金を供託する場合において還付充当金の納付がなかつたときの弁済業務保証金の供託に充てるため、弁済業務保証金準備金を積み立てなければならない。"
