article_title: "第六十四条の十三"
article_caption: "（営業保証金の供託の免除）"
description: "宅地建物取引業法の第六十四条の十三は「営業保証金の供託の免除」を定める。 本文冒頭: 宅地建物取引業保証協会の社員は、第六十四条の八第一項の規定により国土交通大臣の指定する弁済業務開始日以後においては、宅地建物取引業者が供託すべき営業保証金を供託することを要しない。"
