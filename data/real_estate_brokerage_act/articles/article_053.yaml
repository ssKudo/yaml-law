article_caption: "（変更の届出）"
description: "宅地建物取引業法の第五十三条は「変更の届出」を定める。 本文冒頭: 指定保証機関は、第五十一条第二項各号に掲げる事項又は同条第三項第一号若しくは第三号に掲げる書類に記載した事項について変更があつた場合においては、国土交通省令の定めるところにより、二週間以内に、その旨を国土交通大臣に届け出なければならない。"
