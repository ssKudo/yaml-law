article_caption: "（試験委員）"
description: "宅地建物取引業法の第十六条の七は「試験委員」を定める。 本文冒頭: 指定試験機関は、国土交通省令で定める要件を備える者のうちから宅地建物取引士資格試験委員（以下「試験委員」という。）を選任し、試験の問題の作成及び採点を行わせなければならない。"
