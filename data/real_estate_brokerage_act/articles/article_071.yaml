article_title: "第七十一条"
article_caption: "（指導等）"
description: "宅地建物取引業法の第七十一条は「指導等」を定める。 本文冒頭: 国土交通大臣はすべての宅地建物取引業者に対して、都道府県知事は当該都道府県の区域内で宅地建物取引業を営む宅地建物取引業者に対して、宅地建物取引業の適正な運営を確保し、又は宅地建物取引業の健全な発達を図るため必要な指導、助言及び勧告をすることができる。"
