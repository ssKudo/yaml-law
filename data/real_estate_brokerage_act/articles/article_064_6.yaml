article_caption: "（宅地建物取引業に関する研修）"
description: "宅地建物取引業法の第六十四条の六は「宅地建物取引業に関する研修」を定める。 本文冒頭: 宅地建物取引業保証協会は、一定の課程を定め、宅地建物取引士の職務に関し必要な知識及び能力についての研修その他宅地建物取引業の業務に従事し、又は従事しようとする者に対する宅地建物取引業に関する研修を実施しなければならない。"
