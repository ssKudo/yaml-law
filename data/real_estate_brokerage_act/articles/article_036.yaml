description: "宅地建物取引業法の第三十六条は「契約締結等の時期の制限」を定める。 本文冒頭: 宅地建物取引業者は、宅地の造成又は建物の建築に関する工事の完了前においては、当該工事に関し必要とされる都市計画法第二十九条第一項又は第二項の許可、建築基準法第六条第一項の確認その他法令に基づく許可等の処分で政令で定めるものがあつた後でなければ、当該工事に係る宅地又は建物につき、自ら当事者として、若しくは当事者を代理してその売買若しくは交換の契約を締結し、又は…"
