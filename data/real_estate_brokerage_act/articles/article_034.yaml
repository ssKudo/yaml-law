article_title: "第三十四条"
article_caption: "（取引態様の明示）"
description: "宅地建物取引業法の第三十四条は「取引態様の明示」を定める。 本文冒頭: 宅地建物取引業者は、宅地又は建物の売買、交換又は貸借に関する広告をするときは、自己が契約の当事者となつて当該売買若しくは交換を成立させるか、代理人として当該売買、交換若しくは貸借を成立させるか、又は媒介して当該売買、交換若しくは貸借を成立させるかの別（次項において「取引態様の別」という。）を明示しなければならない。"
