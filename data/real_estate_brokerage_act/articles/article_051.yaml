article_caption: "（指定）"
description: "宅地建物取引業法の第五十一条は「指定」を定める。 本文冒頭: 第四十一条第一項第一号の指定（以下この節において「指定」という。）は、宅地又は建物の売買に関し宅地建物取引業者が買主から受領する手付金等の返還債務を保証する事業（以下「手付金等保証事業」という。）を営もうとする者の申請により行う。"
