article_title: "第六十四条の二十三"
article_caption: "（指定の取消し等の場合の営業保証金の供託）"
description: "宅地建物取引業法の第六十四条の二十三は「指定の取消し等の場合の営業保証金の供託」を定める。 本文冒頭: 宅地建物取引業保証協会が第六十四条の二第一項の規定による指定を取り消され、又は解散した場合においては、当該宅地建物取引業保証協会の社員であつた宅地建物取引業者は、前条第二項の規定による公示の日から二週間以内に、第二十五条第一項から第三項までの規定により営業保証金を供託しなければならない。"
