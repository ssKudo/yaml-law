article_caption: "（取引一任代理等に係る特例）"
description: "宅地建物取引業法の第五十条の二は「取引一任代理等に係る特例」を定める。 本文冒頭: 宅地建物取引業者が、宅地又は建物の売買、交換又は貸借に係る判断の全部又は一部を次に掲げる契約により一任されるとともに当該判断に基づきこれらの取引の代理又は媒介を行うこと（以下「取引一任代理等」という。）について、あらかじめ、国土交通省令で定めるところにより、国土交通大臣の認可を受けたときは、第三十四条の二及び第三十四条の三の規定は、当該宅地建物取引業者が行う…"
