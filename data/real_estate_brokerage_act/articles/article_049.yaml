article_caption: "（帳簿の備付け）"
description: "宅地建物取引業法の第四十九条は「帳簿の備付け」を定める。 本文冒頭: 宅地建物取引業者は、国土交通省令の定めるところにより、その事務所ごとに、その業務に関する帳簿を備え、宅地建物取引業に関し取引のあつたつど、その年月日、その取引に係る宅地又は建物の所在及び面積その他国土交通省令で定める事項を記載しなければならない。"
