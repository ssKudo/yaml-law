description: "宅地建物取引業法の第六十三条の五は「寄託金保管簿」を定める。 本文冒頭: 指定保管機関は、国土交通省令で定めるところにより、寄託金保管簿を備え、国土交通省令で定める事項を記載し、これを保存しなければならない。"
