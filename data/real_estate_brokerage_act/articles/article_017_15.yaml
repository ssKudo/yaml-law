description: "宅地建物取引業法の第十七条の十五は「帳簿の記載」を定める。 本文冒頭: 登録講習機関は、国土交通省令で定めるところにより、帳簿を備え、講習業務に関し国土交通省令で定める事項を記載し、これを保存しなければならない。"
