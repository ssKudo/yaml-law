article_caption: "（指定の公示等）"
description: "宅地建物取引業法の第十六条の四は「指定の公示等」を定める。 本文冒頭: 国土交通大臣は、第十六条の二第一項の規定による指定をしたときは、当該指定を受けた者の名称及び主たる事務所の所在地並びに当該指定をした日を公示しなければならない。"
