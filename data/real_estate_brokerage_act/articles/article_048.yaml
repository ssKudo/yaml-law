article_caption: "（証明書の携帯等）"
description: "宅地建物取引業法の第四十八条は「証明書の携帯等」を定める。 本文冒頭: 宅地建物取引業者は、国土交通省令の定めるところにより、従業者に、その従業者であることを証する証明書を携帯させなければ、その者をその業務に従事させてはならない。"
