description: "宅地建物取引業法の第三条の二は「免許の条件」を定める。 本文冒頭: 国土交通大臣又は都道府県知事は、前条第一項の免許（同条第三項の免許の更新を含む。第二十五条第六項を除き、以下同じ。）に条件を付し、及びこれを変更することができる。"
