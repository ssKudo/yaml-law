article_caption: "（登録基準等）"
description: "宅地建物取引業法の第十七条の五は「登録基準等」を定める。 本文冒頭: 国土交通大臣は、第十七条の三の規定により登録を申請した者の行う登録講習が、別表の上欄に掲げる科目について、それぞれ同表の下欄に掲げる講師によつて行われるものであるときは、その登録をしなければならない。"
