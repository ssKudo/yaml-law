description: "宅地建物取引業法の第四十一条の二の規定。 本文冒頭: 一　国土交通大臣が指定する者（以下「指定保管機関」という。）との間において、宅地建物取引業者が自己に代理して当該指定保管機関に当該手付金等を受領させることとするとともに、当該指定保管機関が、当該宅地建物取引業者が受領した手付金等の額に相当する額の金銭を保管することを約する契約（以下「手付金等寄託契約」という。）を締結し、かつ、当該手付金等寄託契約を証する書面…"
