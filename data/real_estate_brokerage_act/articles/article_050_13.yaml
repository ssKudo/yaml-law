article_title: "第五十条の十三"
article_caption: "（登録業務の休廃止）"
description: "宅地建物取引業法の第五十条の十三は「登録業務の休廃止」を定める。 本文冒頭: 指定流通機構は、登録業務の全部又は一部を休止し、又は廃止しようとするときは、休止し、又は廃止しようとする日の三十日前までに、国土交通省令で定める事項を国土交通大臣に届け出なければならない。"
