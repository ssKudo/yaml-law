article_title: "第六十四条の十"
article_caption: "（還付充当金の納付等）"
description: "宅地建物取引業法の第六十四条の十は「還付充当金の納付等」を定める。 本文冒頭: 宅地建物取引業保証協会は、第六十四条の八第一項の権利の実行により弁済業務保証金の還付があつたときは、当該還付に係る社員又は社員であつた者に対し、当該還付額に相当する額の還付充当金を宅地建物取引業保証協会に納付すべきことを通知しなければならない。"
