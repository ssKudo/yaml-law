description: "宅地建物取引業法の第四条は「免許の申請」を定める。 本文冒頭: 第三条第一項の免許を受けようとする者は、二以上の都道府県の区域内に事務所を設置してその事業を営もうとする場合にあつては国土交通大臣に、一の都道府県の区域内にのみ事務所を設置してその事業を営もうとする場合にあつては当該事務所の所在地を管轄する都道府県知事に、次に掲げる事項を記載した免許申請書を提出しなければならない。"
