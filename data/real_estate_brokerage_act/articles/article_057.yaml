article_caption: "（責任準備金の計上）"
description: "宅地建物取引業法の第五十七条は「責任準備金の計上」を定める。 本文冒頭: 指定保証機関は、事業年度末においてまだ経過していない保証契約があるときは、次に掲げる金額のうちいずれか多い金額を、事業年度ごとに責任準備金として計上しなければならない。"
