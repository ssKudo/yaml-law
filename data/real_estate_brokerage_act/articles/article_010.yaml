article_caption: "（宅地建物取引業者名簿等の閲覧）"
description: "宅地建物取引業法の第十条は「宅地建物取引業者名簿等の閲覧」を定める。 本文冒頭: 国土交通大臣又は都道府県知事は、国土交通省令の定めるところにより、宅地建物取引業者名簿並びに第四条第二項第一号、同項第三号から第五号まで（前条第二項において準用する場合を含む。）並びに第四条第二項第六号及び第七号に掲げる書類（第七十八条の三第一項において「特定書類」という。）又はこれらの写しを一般の閲覧に供しなければならない。"
