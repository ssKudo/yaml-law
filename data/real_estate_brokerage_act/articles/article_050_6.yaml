article_title: "第五十条の六"
article_caption: "（登録を証する書面の発行）"
description: "宅地建物取引業法の第五十条の六は「登録を証する書面の発行」を定める。 本文冒頭: 指定流通機構は、第三十四条の二第五項の規定による登録があつたときは、国土交通省令で定めるところにより、当該登録をした宅地建物取引業者に対し、当該登録を証する書面を発行しなければならない。"
