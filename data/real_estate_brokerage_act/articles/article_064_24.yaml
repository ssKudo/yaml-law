article_caption: "（指定の取消し等の場合の弁済業務）"
description: "宅地建物取引業法の第六十四条の二十四は「指定の取消し等の場合の弁済業務」を定める。 本文冒頭: 第六十四条の二第一項の規定による指定を取り消され、又は解散した宅地建物取引業保証協会（以下この条及び次条において「旧協会」という。）は、第六十四条の二十二第二項の規定による公示の日から一週間以内に、指定を取り消され、又は解散した日において社員であつた宅地建物取引業者に係る宅地建物取引業に関する取引により生じた債権に関し第六十四条の八第一項の権利を有する者に対…"
