article_caption: "（業務の休廃止）"
description: "宅地建物取引業法の第十七条の十は「業務の休廃止」を定める。 本文冒頭: 登録講習機関は、講習業務の全部又は一部を休止し、又は廃止しようとするときは、国土交通省令で定めるところにより、あらかじめ、その旨を国土交通大臣に届け出なければならない。"
