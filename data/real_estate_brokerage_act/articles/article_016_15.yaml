article_caption: "（指定の取消し等）"
description: "宅地建物取引業法の第十六条の十五は「指定の取消し等」を定める。 本文冒頭: 国土交通大臣は、指定試験機関が第十六条の三第二項各号（第三号を除く。）の一に該当するに至つたときは、当該指定試験機関の指定を取り消さなければならない。"
