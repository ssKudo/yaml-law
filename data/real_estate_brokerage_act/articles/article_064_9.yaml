article_caption: "（弁済業務保証金分担金の納付等）"
description: "宅地建物取引業法の第六十四条の九は「弁済業務保証金分担金の納付等」を定める。 本文冒頭: 次の各号に掲げる者は、当該各号に掲げる日までに、弁済業務保証金に充てるため、主たる事務所及びその他の事務所ごとに政令で定める額の弁済業務保証金分担金を当該宅地建物取引業保証協会に納付しなければならない。"
