article_caption: "（弁済業務保証金の取戻し等）"
description: "宅地建物取引業法の第六十四条の十一は「弁済業務保証金の取戻し等」を定める。 本文冒頭: 宅地建物取引業保証協会は、社員が社員の地位を失つたときは当該社員であつた者が第六十四条の九第一項及び第二項の規定により納付した弁済業務保証金分担金の額に相当する額の弁済業務保証金を、社員がその一部の事務所を廃止したため当該社員につき同条第一項及び第二項の規定により納付した弁済業務保証金分担金の額が同条第一項の政令で定める額を超えることになつたときはその超過額…"
