description: "宅地建物取引業法の第五十条の二の四は「不動産信託受益権等の売買等に係る特例」を定める。 本文冒頭: 金融商品取引業者（金融商品取引法第二条第九項に規定する金融商品取引業者をいう。）、金融商品仲介業者（同条第十二項に規定する金融商品仲介業者をいう。）又は金融サービス仲介業者（金融サービスの提供及び利用環境の整備等に関する法律（平成十二年法律第百一号）第十一条第六項に規定する金融サービス仲介業者をいい、同条第四項に規定する有価証券等仲介業務の種別に係る同法第十…"
