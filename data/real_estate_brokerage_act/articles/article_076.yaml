article_caption: "（免許の取消し等に伴う取引の結了）"
description: "宅地建物取引業法の第七十六条は「免許の取消し等に伴う取引の結了」を定める。 本文冒頭: 第三条第二項の有効期間が満了したとき、第十一条第二項の規定により免許が効力を失つたとき、又は宅地建物取引業者が第十一条第一項第一号若しくは第二号に該当したとき、若しくは第二十五条第七項、第六十六条若しくは第六十七条第一項の規定により免許を取り消されたときは、当該宅地建物取引業者であつた者又はその一般承継人は、当該宅地建物取引業者が締結した契約に基づく取引を結…"
