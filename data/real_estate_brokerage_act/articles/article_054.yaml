article_title: "第五十四条"
article_caption: "（事業の不開始又は休止に基づく指定の取消し）"
description: "宅地建物取引業法の第五十四条は「事業の不開始又は休止に基づく指定の取消し」を定める。 本文冒頭: 国土交通大臣は、第六十二条第二項の規定により指定を取り消す場合のほか、指定保証機関が指定を受けた日から三月以内に手付金等保証事業を開始しないとき、又は引き続き三月以上その手付金等保証事業を休止したときは、当該指定保証機関の指定を取り消すことができる。"
