article_caption: "（国土交通省令への委任）"
description: "宅地建物取引業法の第二十四条は「国土交通省令への委任」を定める。 本文冒頭: この章に定めるもののほか、試験、登録講習、登録講習機関、指定試験機関、第十八条第一項の登録、その移転及び宅地建物取引士証に関し必要な事項は、国土交通省令で定める。"
