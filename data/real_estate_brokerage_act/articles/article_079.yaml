description: "宅地建物取引業法の第七十九条の規定。 本文冒頭: 一　不正の手段によつて第三条第一項の免許を受けた者 二　第十二条第一項の規定に違反した者 三　第十三条第一項の規定に違反して他人に宅地建物取引業を営ませた者 四　第六十五条第二項又は第四項の規定による業務の停止の命令に違反して業務を営んだ者。"
