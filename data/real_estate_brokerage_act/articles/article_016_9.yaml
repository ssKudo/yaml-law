description: "宅地建物取引業法の第十六条の九は「試験事務規程」を定める。 本文冒頭: 指定試験機関は、国土交通省令で定める試験事務の実施に関する事項について試験事務規程を定め、国土交通大臣の認可を受けなければならない。"
