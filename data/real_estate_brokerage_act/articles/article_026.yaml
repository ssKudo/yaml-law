article_caption: "（事務所新設の場合の営業保証金）"
description: "宅地建物取引業法の第二十六条は「事務所新設の場合の営業保証金」を定める。 本文冒頭: 宅地建物取引業者は、事業の開始後新たに事務所を設置したとき（第七条第一項各号の一に該当する場合において事務所の増設があつたときを含むものとする。）は、当該事務所につき前条第二項の政令で定める額の営業保証金を供託しなければならない。"
