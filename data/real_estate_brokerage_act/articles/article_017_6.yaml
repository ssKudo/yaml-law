article_caption: "（登録の更新）"
description: "宅地建物取引業法の第十七条の六は「登録の更新」を定める。 本文冒頭: 第十六条第三項の登録は、三年を下らない政令で定める期間ごとにその更新を受けなければ、その期間の経過によつて、その効力を失う。"
