article_caption: "（免許換えの場合における従前の免許の効力）"
description: "宅地建物取引業法の第七条は「免許換えの場合における従前の免許の効力」を定める。 本文冒頭: 宅地建物取引業者が第三条第一項の免許を受けた後次の各号の一に該当して引き続き宅地建物取引業を営もうとする場合において同項の規定により国土交通大臣又は都道府県知事の免許を受けたときは、その者に係る従前の国土交通大臣又は都道府県知事の免許は、その効力を失う。"
