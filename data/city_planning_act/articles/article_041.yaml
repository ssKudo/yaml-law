article_caption: "（建築物の建蔽率等の指定）"
description: "用途地域が定められていない土地における開発許可の際、知事が必要に応じて建蔽率や高さ、壁面位置などの建築制限を定めることができ、その制限内の建築を義務付けることを定めている。"
