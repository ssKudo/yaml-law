article_caption: "（準都市計画区域について都市計画区域が指定された場合における都市計画の取扱い）"
description: "既存の準都市計画区域について新たに都市計画区域が指定された場合、重複する区域内の既定の都市計画は、新指定の都市計画区域について定められたものとみなすことを規定している。"
