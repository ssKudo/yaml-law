article_caption: "（開発許可を受けた土地における建築等の制限）"
description: "開発許可を受けた区域において、工事完了公告の後は予定された建築物以外の新築や改築、用途変更を行ってはならないとし、知事の許可がある場合などの例外を規定している。"
