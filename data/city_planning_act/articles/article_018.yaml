article_caption: "（都道府県の都市計画の決定）"
description: "都道府県が都市計画を決定するにあたり、関係市町村への意見聴取や都市計画審議会の議を経る手続、および国の利害に重大な関係がある場合の国土交通大臣との協議・同意要件を規定している。"
