article_title: "第六十条の二"
article_caption: "（認可又は承認の申請の義務等）"
description: "施行予定者が定められている都市計画において、告示の日から2年以内に事業の認可または承認の申請を行わなければならない義務と、申請がない場合の公告手続きを定めている。"
