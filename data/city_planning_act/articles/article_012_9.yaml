article_title: "第十二条の九"
article_caption: "（住居と住居以外の用途とを適正に配分する地区整備計画）"
description: "地区整備計画において、住居と非住居の用途を適正に配分するため、住宅用途を含む建築物とそれ以外の建築物で容積率の最高限度を区分して設定し、住宅建築を誘導できる手法について規定している。"
