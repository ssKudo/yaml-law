article_num: "58_6"
article_title: "第五十八条の六"
article_caption: "（国及び地方公共団体の責務）"
description: "遊休土地転換利用促進地区内およびその周辺地域における計画的な土地利用を増進するため、国や地方公共団体が都市計画の決定や土地区画整理事業の施行などの措置を講ずる努力義務を規定している。"
