article_caption: "（都市計画の基本理念）"
description: "都市計画の基本理念として、農林漁業との健全な調和を図りながら、健康的で文化的な都市生活および機能的な都市活動を確保し、土地の適正な制限のもとでの合理的な利用を定めている。"
