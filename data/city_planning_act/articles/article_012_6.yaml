article_title: "第十二条の六"
article_caption: "（建築物の容積率の最高限度を区域の特性に応じたものと公共施設の整備状況に応じたものとに区分して定める地区整備計画）"
description: "公共施設の未整備区域において適正な土地利用を図るため、地区整備計画で建築物の容積率の最高限度を「区域の特性に応じたもの」と「公共施設の整備状況に応じたもの」の2つに区分して定めることができる旨を規定している。"
