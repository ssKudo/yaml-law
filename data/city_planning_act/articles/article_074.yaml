article_title: "第七十四条"
article_caption: "（生活再建のための措置）"
description: "都市計画事業のために土地を提供し生活基盤を失う被収用者に対し、施行者が生活再建措置（代替地の取得や就業支援など）のあっせんに努めるべきことを規定している。"
