article_title: "第十二条の七"
article_caption: "（区域を区分して建築物の容積を適正に配分する地区整備計画）"
description: "公共施設が整備された区域において、適正な容積配分によって合理的な土地利用を促進するため、地区整備計画の区域を細分化して異なる容積率の最高限度を設定する「容積適正配分型地区計画」の要件を規定している。"
