article_caption: "（高度利用と都市機能の更新とを図る地区整備計画）"
description: "用途地域内で公共施設が整った区域において、土地の合理的・健全な高度利用と都市機能 of 更新を図るため、地区整備計画で建築物の容積率の最低限度や建蔽率、建築面積の最低限度等を義務づける規定を定めている。"
