article_caption: "（区域の特性に応じた高さ、配列及び形態を備えた建築物の整備を誘導する地区整備計画）"
description: "地区整備計画において、区域の特性に合わせた建築物の整備を誘導するために定める壁面の位置の制限、工作物設置の制限、および高さの最高限度について規定している。"
