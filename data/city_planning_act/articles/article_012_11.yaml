article_title: "第十二条の十一"
article_caption: "（道路の上空又は路面下において建築物等の建築又は建設を行うための地区整備計画）"
description: "地区整備計画において、市街地の環境確保と土地の高度利用を図るため、道路の上空や路面下における建築物の建築を可能とする区域（道路敷地の併用区域）及び空間・地下の限界等の規定を定めている。"
