article_caption: "（他の行政機関等との調整等）"
description: "国土交通大臣や都道府県・市町村が都市計画を決定・変更する際に、あらかじめ農林水産大臣、経済産業大臣、環境大臣などの関係行政機関や、施設の管理者等と行うべき協議・調整手続を規定している。"
