article_title: "第十二条の十二"
article_caption: "（適正な配置の特定大規模建築物を整備するための地区整備計画）"
description: "開発整備促進区の地区整備計画において、大規模な劇場、店舗、飲食店などの特定大規模建築物を適正に配置・整備するために、誘導すべき用途やその敷地として利用すべき土地の区域の指定について規定している。"
