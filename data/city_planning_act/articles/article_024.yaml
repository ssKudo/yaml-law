article_caption: "（国土交通大臣の指示等）"
description: "国の利害に重大な関係がある事項について、国土交通大臣が都道府県や市町村に対して都市計画の決定・変更等の措置を指示できること、および地方自治体が指示に従わない場合の代執行等の規定を定めている。"
