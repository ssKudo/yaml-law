article_caption: "（計画提案に対する都道府県又は市町村の判断等）"
description: "計画提案が行われた際に、都道府県や市町村が提案内容を踏まえた都市計画の決定・変更の必要性を遅滞なく判断し、必要と認める場合は都市計画案を作成しなければならない義務を規定している。"
