article_title: "第五条の二"
article_caption: "（準都市計画区域）"
description: "都市計画区域外で土地利用の整序や環境保全を行わないと将来の都市整備に支障が生じるおそれがある区域を、都道府県が「準都市計画区域」として指定できる旨とその指定手続等を規定している。"
