description: "住宅の品質確保の促進等に関する法律の第百四条の規定。 本文冒頭: 一　第十四条、第四十八条（第六十一条第三項において準用する場合を含む。）又は第六十九条第一項（第八十二条第三項において準用する場合を含む。）の規定に違反して、その職務に関して知り得た秘密を漏らし、又は自己の利益のために使用した者 二　第二十四条第二項、第二十八条第二項、第五十五条第二項、第六十五条第二項又は第九十一条第一項の規定による業務の停止の命令に違反し…"
