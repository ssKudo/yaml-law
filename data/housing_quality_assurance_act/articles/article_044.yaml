article_caption: "（登録）"
description: "住宅の品質確保の促進等に関する法律の第四十四条は「登録」を定める。 本文冒頭: 第三十一条第一項又は第三十三条第一項の登録（以下この節において単に「登録」という。）は、それぞれ住宅型式性能認定及び第三十一条第三項の規定による公示又は第三十三条第一項の認証、同条第三項の規定による公示及び第三十六条第一項の認証の更新（以下この節において「認定等」という。）の業務を行おうとする者の申請により行う。"
