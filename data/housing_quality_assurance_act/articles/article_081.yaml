article_caption: "（国土交通省令への委任）"
description: "住宅の品質確保の促進等に関する法律の第八十一条は「国土交通省令への委任」を定める。 本文冒頭: この法律に規定するもののほか、住宅紛争処理の手続及びこれに要する費用に関し必要な事項は、国土交通省令で定める。"
