description: "住宅の品質確保の促進等に関する法律の第三十三条は「型式住宅部分等製造者の認証」を定める。 本文冒頭: 第四十四条から第四十六条までの規定の定めるところにより国土交通大臣の登録（第四十四条第二項第二号に掲げる業務の種別に係るものに限る。）を受けた者は、申請により、規格化された型式の住宅の部分又は住宅で国土交通大臣が定めるもの（以下この節において「型式住宅部分等」という。）の製造又は新築（以下この節において単に「製造」という。）をする者について、当該型式住宅部分…"
