description: "住宅の品質確保の促進等に関する法律の第九十三条は「センターへの情報提供等」を定める。 本文冒頭: 国土交通大臣は、センターに対し、支援等の業務の実施に関し必要な情報及び資料の提供又は指導及び助言を行うものとする。"
