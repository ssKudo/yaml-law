article_caption: "（認証型式住宅部分等に係る住宅性能評価の特例）"
description: "住宅の品質確保の促進等に関する法律の第四十条は「認証型式住宅部分等に係る住宅性能評価の特例」を定める。 本文冒頭: 認証型式住宅部分等製造者が製造をするその認証に係る型式住宅部分等（以下この節において「認証型式住宅部分等」という。）は、設計された住宅に係る住宅性能評価において、その認証に係る型式に適合するものとみなす。"
