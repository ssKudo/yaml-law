description: "住宅の品質確保の促進等に関する法律の第二十五条は「登録」を定める。 本文冒頭: 第十三条の登録（以下この節において単に「登録」という。）は、同条の講習の実施に関する業務（以下「講習の業務」という。）を行おうとする者の申請により行う。"
