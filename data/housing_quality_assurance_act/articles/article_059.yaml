description: "住宅の品質確保の促進等に関する法律の第五十九条は「審査のための試験」を定める。 本文冒頭: 国土交通大臣は、特別評価方法認定のための審査に当たっては、審査に係る特別の建築材料若しくは構造方法又は特別の試験方法若しくは計算方法に関する試験、分析又は測定（以下単に「試験」という。）であって、第六十一条から第六十三条までの規定の定めるところにより国土交通大臣の登録を受けた者（以下「登録試験機関」という。）が行うもの（当該登録試験機関が外国にある事務所によ…"
