description: "住宅の品質確保の促進等に関する法律の第六十六条は「指定住宅紛争処理機関の指定等」を定める。 本文冒頭: 国土交通大臣は、弁護士会又は一般社団法人若しくは一般財団法人であって、次条第一項に規定する業務（以下この章において「紛争処理の業務」という。）を公正かつ適確に行うことができると認められるものを、その申請により、紛争処理の業務を行う者として指定することができる。"
