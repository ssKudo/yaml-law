article_caption: "（認定等業務規程）"
description: "住宅の品質確保の促進等に関する法律の第四十九条は「認定等業務規程」を定める。 本文冒頭: 登録住宅型式性能認定等機関は、認定等の業務に関する規程（以下この節において「認定等業務規程」という。）を定め、認定等の業務の開始前に、国土交通大臣に届け出なければならない。"
