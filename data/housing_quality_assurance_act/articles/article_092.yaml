article_caption: "（指定を取り消した場合における経過措置）"
description: "住宅の品質確保の促進等に関する法律の第九十二条は「指定を取り消した場合における経過措置」を定める。 本文冒頭: 前条第一項の規定により指定を取り消した場合において、国土交通大臣がその取消し後に新たにセンターを指定したときは、取消しに係るセンターの評価住宅関係業務に係る財産は、新たに指定を受けたセンターに帰属する。"
