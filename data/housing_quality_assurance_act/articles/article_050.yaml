article_caption: "（適合命令）"
description: "住宅の品質確保の促進等に関する法律の第五十条は「適合命令」を定める。 本文冒頭: 国土交通大臣は、登録住宅型式性能認定等機関（登録外国住宅型式性能認定等機関を除く。）が第四十六条第一項各号のいずれかに適合しなくなったと認めるときは、その登録住宅型式性能認定等機関に対し、これらの規定に適合するため必要な措置をとるべきことを命ずることができる。"
