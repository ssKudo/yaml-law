article_caption: "（特別評価方法認定）"
description: "住宅の品質確保の促進等に関する法律の第五十八条は「特別評価方法認定」を定める。 本文冒頭: 国土交通大臣は、申請により、特別評価方法認定（日本住宅性能表示基準に従って表示すべき性能に関し、評価方法基準に従った方法に代えて、特別の建築材料若しくは構造方法に応じて又は特別の試験方法若しくは計算方法を用いて評価する方法を認定することをいう。以下同じ。）をすることができる。"
