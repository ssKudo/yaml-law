article_title: "第九十八条の二"
article_caption: "（内閣総理大臣への資料提供等）"
description: "住宅の品質確保の促進等に関する法律の第九十八条の二は「内閣総理大臣への資料提供等」を定める。 本文冒頭: 内閣総理大臣は、住宅の性能に関する表示に関し、個人である住宅購入者等の利益の保護を図るため必要があると認めるときは、国土交通大臣に対し、資料の提供、説明その他必要な協力を求めることができる。"
