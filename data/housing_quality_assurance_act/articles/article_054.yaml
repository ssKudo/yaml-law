description: "住宅の品質確保の促進等に関する法律の第五十四条は「認定等についての申請及び国土交通大臣の命令」を定める。 本文冒頭: 住宅型式性能認定又は第三十三条第一項の認証を申請した者は、その申請に係る型式又は型式住宅部分等の製造をする者について、登録住宅型式性能認定等機関（登録外国住宅型式性能認定等機関を除く。以下この項及び次項において同じ。）が認定等の業務を行わない場合又は登録住宅型式性能認定等機関の認定等の結果に異議のある場合は、国土交通大臣に対し、登録住宅型式性能認定等機関が認…"
