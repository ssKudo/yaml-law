article_caption: "（改善命令）"
description: "住宅の品質確保の促進等に関する法律の第五十一条は「改善命令」を定める。 本文冒頭: 国土交通大臣は、登録住宅型式性能認定等機関（登録外国住宅型式性能認定等機関を除く。）が第四十四条第三項において準用する第十五条の規定に違反していると認めるときは、その登録住宅型式性能認定等機関に対し、認定等の業務を行うべきこと又は認定等の業務の方法その他の業務の方法の改善に関し必要な措置をとるべきことを命ずることができる。"
