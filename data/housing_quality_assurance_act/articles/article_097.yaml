article_title: "第九十七条"
article_caption: "（瑕疵かし担保責任の期間の伸長等）"
description: "住宅の品質確保の促進等に関する法律の第九十七条は「瑕疵かし担保責任の期間の伸長等」を定める。 本文冒頭: 住宅新築請負契約又は新築住宅の売買契約においては、請負人が第九十四条第一項に規定する瑕疵かしその他の住宅の瑕疵かしについて同項に規定する担保の責任を負うべき期間又は売主が第九十五条第一項に規定する瑕疵かしその他の住宅の瑕疵かしについて同項に規定する担保の責任を負うべき期間は、注文者又は買主に引き渡した時から二十年以内とすることができる。"
