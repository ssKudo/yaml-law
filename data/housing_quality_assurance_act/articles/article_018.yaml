description: "住宅の品質確保の促進等に関する法律の第十八条は「財務諸表等の備付け及び閲覧等」を定める。 本文冒頭: 登録住宅性能評価機関は、毎事業年度経過後三月以内に、その事業年度の財産目録、貸借対照表及び損益計算書又は収支計算書並びに事業報告書（その作成に代えて電磁的記録（電子的方式、磁気的方式その他の人の知覚によっては認識することができない方式で作られる記録であって、電子計算機による情報処理の用に供されるものをいう。以下この条において同じ。）の作成がされている場合にお…"
