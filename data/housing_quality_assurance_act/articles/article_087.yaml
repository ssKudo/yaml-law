article_num: "87"
article_title: "第八十七条"
article_caption: "（負担金の徴収）"
description: "住宅の品質確保の促進等に関する法律の第八十七条は「負担金の徴収」を定める。 本文冒頭: センターは、第八十三条第一項第一号から第六号までの業務（以下この節において「評価住宅関係業務」という。）の実施に必要な経費に充てるため、登録住宅性能評価機関から負担金を徴収することができる。"
