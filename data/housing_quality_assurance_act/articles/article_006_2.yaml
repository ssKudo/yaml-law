description: "住宅の品質確保の促進等に関する法律の第六条の二は「長期優良住宅の普及の促進に関する法律の特例」を定める。 本文冒頭: 長期優良住宅の普及の促進に関する法律（平成二十年法律第八十七号）第五条第一項から第七項までの規定による認定の申請（同法第八条第一項の規定による変更の認定の申請を含む。）をする者は、あらかじめ、国土交通省令で定めるところにより、登録住宅性能評価機関に対し、当該申請に係る住宅の構造及び設備が長期使用構造等（同法第二条第四項に規定する長期使用構造等をいう。以下この…"
