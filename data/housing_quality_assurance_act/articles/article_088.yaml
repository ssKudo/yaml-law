description: "住宅の品質確保の促進等に関する法律の第八十八条は「区分経理」を定める。 本文冒頭: センターは、国土交通省令で定めるところにより、評価住宅関係業務に係る経理とその他の業務に係る経理とを区分して整理しなければならない。"
