article_title: "第六十七条"
article_caption: "（業務）"
description: "住宅の品質確保の促進等に関する法律の第六十七条は「業務」を定める。 本文冒頭: 指定住宅紛争処理機関は、建設住宅性能評価書が交付された住宅（以下この章において「評価住宅」という。）の建設工事の請負契約又は売買契約に関する紛争（以下この節において「紛争」という。）の当事者の双方又は一方からの申請により、当該紛争のあっせん、調停及び仲裁（以下この章において「住宅紛争処理」という。）の業務を行うものとする。"
