article_caption: "（申請手数料）"
description: "住宅の品質確保の促進等に関する法律の第七十三条は「申請手数料」を定める。 本文冒頭: 住宅紛争処理の申請をする者は、国土交通省令で定めるところにより、実費を超えない範囲内において国土交通省令で定める額の申請手数料を指定住宅紛争処理機関に納めなければならない。"
