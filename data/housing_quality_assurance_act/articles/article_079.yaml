description: "住宅の品質確保の促進等に関する法律の第七十九条は「業務改善命令」を定める。 本文冒頭: 国土交通大臣は、紛争処理の業務の運営に関し改善が必要であると認めるときは、指定住宅紛争処理機関に対し、その改善に必要な措置をとるべきことを命ずることができる。"
