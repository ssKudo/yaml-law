article_title: "第四十一条"
article_caption: "（認証の失効）"
description: "住宅の品質確保の促進等に関する法律の第四十一条は「認証の失効」を定める。 本文冒頭: 第三十三条第一項の認証は、当該認証に係る住宅型式性能認定が第五十三条第二項の規定により効力を失ったときは、その効力を失う。"
