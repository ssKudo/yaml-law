description: "住宅の品質確保の促進等に関する法律の第三十六条は「認証の更新」を定める。 本文冒頭: 第三十三条第一項の認証は、五年以上十年以内において政令で定める期間ごとにその更新を受けなければ、その期間の経過によって、その効力を失う。"
