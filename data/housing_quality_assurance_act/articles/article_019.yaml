article_caption: "（帳簿の備付け等）"
description: "住宅の品質確保の促進等に関する法律の第十九条は「帳簿の備付け等」を定める。 本文冒頭: 登録住宅性能評価機関は、国土交通省令で定めるところにより、評価の業務に関する事項で国土交通省令で定めるものを記載した帳簿を備え付け、これを保存しなければならない。"
