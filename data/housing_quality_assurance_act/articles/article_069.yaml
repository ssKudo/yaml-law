article_caption: "（秘密保持義務等）"
description: "住宅の品質確保の促進等に関する法律の第六十九条は「秘密保持義務等」を定める。 本文冒頭: 指定住宅紛争処理機関の紛争処理委員並びにその役員及び職員並びにこれらの職にあった者は、紛争処理の業務に関して知り得た秘密を漏らし、又は自己の利益のために使用してはならない。"
