description: "住宅の品質確保の促進等に関する法律の第七十五条は「指定住宅紛争処理機関の指定の申請の命令」を定める。 本文冒頭: 国土交通大臣は、指定住宅紛争処理機関の指定の申請がなく、又は指定を受けた指定住宅紛争処理機関のみでは紛争処理の業務が適当かつ十分に行われないと認めるときは、第八十二条第一項の規定により指定した者に対し、指定住宅紛争処理機関の指定を申請すべきことを命ずることができる。"
