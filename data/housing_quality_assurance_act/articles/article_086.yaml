article_title: "第八十六条"
article_caption: "（事業計画等）"
description: "住宅の品質確保の促進等に関する法律の第八十六条は「事業計画等」を定める。 本文冒頭: センターは、毎事業年度、支援等の業務に係る事業計画及び収支予算を作成し、当該事業年度の開始前に（指定を受けた日の属する事業年度にあっては、その指定を受けた後遅滞なく）、国土交通大臣の認可を受けなければならない。"
