article_title: "第六条"
article_caption: "（住宅性能評価書等と契約内容）"
description: "住宅の品質確保の促進等に関する法律の第六条は「住宅性能評価書等と契約内容」を定める。 本文冒頭: 住宅の建設工事の請負人は、設計された住宅に係る住宅性能評価書（以下「設計住宅性能評価書」という。）若しくはその写しを請負契約書に添付し、又は注文者に対し設計住宅性能評価書若しくはその写しを交付した場合においては、当該設計住宅性能評価書又はその写しに表示された性能を有する住宅の建設工事を行うことを契約したものとみなす。"
