article_caption: "（経過措置）"
description: "住宅の品質確保の促進等に関する法律の第百条は「経過措置」を定める。 本文冒頭: この法律の規定に基づき命令を制定し、又は改廃する場合においては、その命令で、その制定又は改廃に伴い合理的に必要と判断される範囲内において、所要の経過措置（罰則に関する経過措置を含む。）を定めることができる。"
