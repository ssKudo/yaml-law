article_title: "第九十五条"
article_caption: "（新築住宅の売主の瑕疵かし担保責任）"
description: "住宅の品質確保の促進等に関する法律の第九十五条は「新築住宅の売主の瑕疵かし担保責任」を定める。 本文冒頭: 新築住宅の売買契約においては、売主は、買主に引き渡した時（当該新築住宅が住宅新築請負契約に基づき請負人から当該売主に引き渡されたものである場合にあっては、その引渡しの時）から十年間、住宅の構造耐力上主要な部分等の瑕疵かしについて、民法第四百十五条、第五百四十一条、第五百四十二条、第五百六十二条及び第五百六十三条に規定する担保の責任を負う。"
