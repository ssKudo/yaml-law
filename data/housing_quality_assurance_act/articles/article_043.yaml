article_caption: "（標章の禁止）"
description: "住宅の品質確保の促進等に関する法律の第四十三条は「標章の禁止」を定める。 本文冒頭: 国土交通大臣は、認証型式住宅部分等製造者（外国において本邦に輸出される型式住宅部分等の製造をするもの（以下「認証外国型式住宅部分等製造者」という。）を除く。以下この項において同じ。）が次の各号のいずれかに該当するときは、当該認証型式住宅部分等製造者に対し、二年以内の期間を定めて、当該認証型式住宅部分等に第三十九条第一項の標章を付することを禁止することができる…"
