article_caption: "（秘密保持義務）"
description: "住宅の品質確保の促進等に関する法律の第四十八条は「秘密保持義務」を定める。 本文冒頭: 登録住宅型式性能認定等機関（外国にある事務所により認定等の業務を行うもの（以下「登録外国住宅型式性能認定等機関」という。）を除く。）（その者が法人である場合にあっては、その役員）及びその職員（認定員を含む。）並びにこれらの者であった者は、認定等の業務に関して知り得た秘密を漏らし、又は自己の利益のために使用してはならない。"
