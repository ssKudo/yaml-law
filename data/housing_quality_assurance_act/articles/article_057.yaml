article_caption: "（手数料）"
description: "住宅の品質確保の促進等に関する法律の第五十七条は「手数料」を定める。 本文冒頭: 前条第一項の規定により国土交通大臣が行う認定等の申請をしようとする者は、国土交通省令で定めるところにより、実費を勘案して国土交通省令で定める額の手数料を国に納めなければならない。"
