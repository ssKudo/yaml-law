article_title: "第二十三条"
article_caption: "（評価の業務の休廃止等）"
description: "住宅の品質確保の促進等に関する法律の第二十三条は「評価の業務の休廃止等」を定める。 本文冒頭: 登録住宅性能評価機関は、評価の業務の全部又は一部を休止し、又は廃止しようとするときは、国土交通省令で定めるところにより、あらかじめ、その旨を国土交通大臣に届け出なければならない。"
