description: "住宅の品質確保の促進等に関する法律の第五条は「住宅性能評価」を定める。 本文冒頭: 第七条から第十条までの規定の定めるところにより国土交通大臣の登録を受けた者（以下「登録住宅性能評価機関」という。）は、申請により、住宅性能評価（設計された住宅又は建設された住宅について、日本住宅性能表示基準に従って表示すべき性能に関し、評価方法基準（第五十八条第一項の特別評価方法認定を受けた方法を用いる場合における当該方法を含む。第三十一条第一項において同じ…"
