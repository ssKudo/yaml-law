article_caption: "（登録基準等）"
description: "住宅の品質確保の促進等に関する法律の第二十七条は「登録基準等」を定める。 本文冒頭: 国土交通大臣は、登録の申請をした者（以下この項において「登録申請者」という。）が次に掲げる基準の全てに適合しているときは、その登録をしなければならない。"
