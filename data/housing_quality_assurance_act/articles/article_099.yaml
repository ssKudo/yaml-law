article_caption: "（権限の委任）"
description: "住宅の品質確保の促進等に関する法律の第九十九条は「権限の委任」を定める。 本文冒頭: この法律に規定する国土交通大臣の権限は、国土交通省令で定めるところにより、その一部を地方整備局長又は北海道開発局長に委任することができる。"
