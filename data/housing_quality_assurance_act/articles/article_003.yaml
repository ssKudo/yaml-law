description: "住宅の品質確保の促進等に関する法律の第三条は「日本住宅性能表示基準」を定める。 本文冒頭: 国土交通大臣及び内閣総理大臣は、住宅の性能に関する表示の適正化を図るため、日本住宅性能表示基準を定めなければならない。"
