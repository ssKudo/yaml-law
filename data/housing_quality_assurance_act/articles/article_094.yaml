description: "住宅の品質確保の促進等に関する法律の第九十四条は「住宅の新築工事の請負人の瑕疵かし担保責任」を定める。 本文冒頭: 住宅を新築する建設工事の請負契約（以下「住宅新築請負契約」という。）においては、請負人は、注文者に引き渡した時から十年間、住宅のうち構造耐力上主要な部分又は雨水の浸入を防止する部分として政令で定めるもの（次条において「住宅の構造耐力上主要な部分等」という。）の瑕疵かし（構造耐力又は雨水の浸入に影響のないものを除く。次条において同じ。）について、民法（明治二十…"
