article_caption: "（訴訟手続の中止）"
description: "住宅の品質確保の促進等に関する法律の第七十三条の三は「訴訟手続の中止」を定める。 本文冒頭: 紛争について当該紛争の当事者間に訴訟が係属する場合において、次の各号に掲げる事由のいずれかに該当し、かつ、当該紛争の当事者の共同の申立てがあるときは、受訴裁判所は、四月以内の期間を定めて訴訟手続を中止する旨の決定をすることができる。"
