description: "住宅の品質確保の促進等に関する法律の第六十一条は「登録」を定める。 本文冒頭: 第五十九条第一項の登録（以下この節において単に「登録」という。）は、特別評価方法認定のための審査に必要な試験を行おうとする者の申請により行う。"
