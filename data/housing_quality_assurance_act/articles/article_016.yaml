article_caption: "（評価業務規程）"
description: "住宅の品質確保の促進等に関する法律の第十六条は「評価業務規程」を定める。 本文冒頭: 登録住宅性能評価機関は、評価の業務に関する規程（以下この節において「評価業務規程」という。）を定め、評価の業務の開始前に、国土交通大臣に届け出なければならない。"
