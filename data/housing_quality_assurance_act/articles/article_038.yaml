article_caption: "（型式適合義務等）"
description: "住宅の品質確保の促進等に関する法律の第三十八条は「型式適合義務等」を定める。 本文冒頭: 認証型式住宅部分等製造者は、その認証に係る型式住宅部分等の製造をするときは、当該型式住宅部分等がその認証に係る型式に適合するようにしなければならない。"
