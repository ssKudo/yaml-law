description: "住宅の品質確保の促進等に関する法律の第四十二条は「報告、検査等」を定める。 本文冒頭: 国土交通大臣は、第三十七条、第三十八条、第三十九条第二項並びに次条第一項及び第二項の規定の施行に必要な限度において、認証型式住宅部分等製造者に対しその業務に関し必要な報告を求め、又はその職員に、認証型式住宅部分等製造者の工場、営業所、事務所、倉庫その他の事業場に立ち入り、認証型式住宅部分等の製造設備若しくは検査設備、帳簿、書類その他の物件を検査させ、若しくは…"
