description: "住宅の品質確保の促進等に関する法律の第十七条は「登録の区分等の掲示等」を定める。 本文冒頭: 登録住宅性能評価機関は、国土交通省令で定めるところにより、登録の区分その他国土交通省令で定める事項について、その事務所において公衆に見やすいように掲示するとともに、電気通信回線に接続して行う自動公衆送信（公衆によって直接受信されることを目的として公衆からの求めに応じ自動的に送信を行うことをいい、放送又は有線放送に該当するものを除く。第六十六条第四項において同…"
