description: "住宅の品質確保の促進等に関する法律の第十条は「登録の公示等」を定める。 本文冒頭: 国土交通大臣は、登録をしたときは、前条第二項第二号から第五号までに掲げる事項その他国土交通省令で定める事項を公示しなければならない。"
