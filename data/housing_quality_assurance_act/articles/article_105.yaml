description: "住宅の品質確保の促進等に関する法律の第百五条の規定。 本文冒頭: 一　第三十八条第二項の規定に違反して、検査を行わず、検査記録を作成せず、虚偽の検査記録を作成し、又は検査記録を保存しなかった者 二　第三十九条第二項の規定に違反した者。"
