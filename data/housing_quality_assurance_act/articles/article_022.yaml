article_title: "第二十二条"
article_caption: "（報告、検査等）"
description: "住宅の品質確保の促進等に関する法律の第二十二条は「報告、検査等」を定める。 本文冒頭: 国土交通大臣は、評価の業務の公正かつ適確な実施を確保するため必要があると認めるときは、登録住宅性能評価機関に対し評価の業務若しくは経理の状況に関し必要な報告を求め、又はその職員に、登録住宅性能評価機関の事務所に立ち入り、評価の業務の状況若しくは設備、帳簿、書類その他の物件を検査させ、若しくは関係者に質問させることができる。"
