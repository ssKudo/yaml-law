article_caption: "（支援等業務規程）"
description: "住宅の品質確保の促進等に関する法律の第八十四条は「支援等業務規程」を定める。 本文冒頭: センターは、支援等の業務に関する規程（以下この節において「支援等業務規程」という。）を定め、支援等の業務の開始前に、国土交通大臣の認可を受けなければならない。"
