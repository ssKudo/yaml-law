description: "住宅の品質確保の促進等に関する法律の第六十八条は「紛争処理委員」を定める。 本文冒頭: 指定住宅紛争処理機関は、人格が高潔で識見の高い者のうちから、国土交通省令で定める数以上の紛争処理委員を選任しなければならない。"
