description: "住宅の品質確保の促進等に関する法律の第二十条は「適合命令」を定める。 本文冒頭: 国土交通大臣は、登録住宅性能評価機関が第九条第一項各号のいずれかに適合しなくなったと認めるときは、その登録住宅性能評価機関に対し、これらの規定に適合するため必要な措置をとるべきことを命ずることができる。"
