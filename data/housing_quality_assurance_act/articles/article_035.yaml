article_caption: "（認証の基準）"
description: "住宅の品質確保の促進等に関する法律の第三十五条は「認証の基準」を定める。 本文冒頭: 第三十三条第一項の登録を受けた者は、同項の申請が次に掲げる基準に適合していると認めるときは、同項の認証をしなければならない。"
