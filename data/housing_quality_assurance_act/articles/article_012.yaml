description: "住宅の品質確保の促進等に関する法律の第十二条は「承継」を定める。 本文冒頭: 登録住宅性能評価機関が当該登録に係る事業の全部を譲渡し、又は登録住宅性能評価機関について相続、合併若しくは分割（当該登録に係る事業の全部を承継させるものに限る。）があったときは、その事業の全部を譲り受けた者又は相続人（相続人が二人以上ある場合において、その全員の同意により当該事業を承継すべき相続人を選定したときは、その者。以下この項及び第三十七条において同じ…"
