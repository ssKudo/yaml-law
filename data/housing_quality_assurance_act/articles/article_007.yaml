description: "住宅の品質確保の促進等に関する法律の第七条は「登録」を定める。 本文冒頭: 第五条第一項の登録（第十三条を除き、以下この節において単に「登録」という。）は、同項に規定する業務（以下この節において「評価の業務」という。）を行おうとする者の申請により行う。"
