description: "住宅の品質確保の促進等に関する法律の第百八条の規定。 本文冒頭: 一　第十二条第二項（第二十五条第二項、第四十四条第三項又は第六十一条第三項において準用する場合を含む。）の規定による届出をせず、又は虚偽の届出をした者 二　第十八条第一項（第二十五条第二項、第四十四条第三項又は第六十一条第三項において準用する場合を含む。）の規定に違反して財務諸表等を備えて置かず、財務諸表等に記載すべき事項を記載せず、若しくは虚偽の記載をし、…"
