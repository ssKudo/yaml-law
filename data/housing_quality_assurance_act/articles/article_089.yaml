article_caption: "（監督命令）"
description: "住宅の品質確保の促進等に関する法律の第八十九条は「監督命令」を定める。 本文冒頭: 国土交通大臣は、支援等の業務の公正かつ適確な実施を確保するため必要があると認めるときは、センターに対し、支援等の業務に関し監督上必要な命令をすることができる。"
