description: "住宅の品質確保の促進等に関する法律の第四条は「日本住宅性能表示基準の呼称の禁止」を定める。 本文冒頭: 何人も、日本住宅性能表示基準でない住宅の性能の表示に関する基準について、日本住宅性能表示基準という名称又はこれと紛らわしい名称を用いてはならない。"
