description: "住宅の品質確保の促進等に関する法律の第三十一条は「住宅型式性能認定」を定める。 本文冒頭: 第四十四条から第四十六条までの規定の定めるところにより国土交通大臣の登録（第四十四条第二項第一号に掲げる業務の種別に係るものに限る。）を受けた者は、申請により、住宅型式性能認定（住宅又はその部分で国土交通大臣が定めるものの型式について評価方法基準に従って評価し、当該型式が日本住宅性能表示基準に従って表示すべき性能を有する旨を認定することをいい、当該登録を受け…"
