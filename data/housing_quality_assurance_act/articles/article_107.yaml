description: "住宅の品質確保の促進等に関する法律の第百七条の規定。 本文冒頭: 第百七条 法人の代表者又は法人若しくは人の代理人、使用人その他の従業者がその法人又は人の業務に関して第百三条から前条までの違反行為をした場合においては、その行為者を罰するほか、その法人又は人に対して各本条の罰金刑を科する。"
