article_caption: "（登録の取消し等）"
description: "住宅の品質確保の促進等に関する法律の第二十八条は「登録の取消し等」を定める。 本文冒頭: 国土交通大臣は、登録講習機関が第二十六条第一号、第三号又は第四号に該当するに至ったときは、その登録を取り消さなければならない。"
