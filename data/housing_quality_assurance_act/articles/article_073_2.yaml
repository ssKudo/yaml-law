description: "住宅の品質確保の促進等に関する法律の第七十三条の二は「時効の完成猶予」を定める。 本文冒頭: あっせん又は調停に係る紛争についてあっせん又は調停による解決の見込みがないことを理由に指定住宅紛争処理機関により当該あっせん又は調停が打ち切られた場合において、当該あっせん又は調停の申請をした当該紛争の当事者がその旨の通知を受けた日から一月以内に当該あっせん又は調停の目的となった請求について訴えを提起したときは、時効の完成猶予に関しては、当該あっせん又は調停…"
