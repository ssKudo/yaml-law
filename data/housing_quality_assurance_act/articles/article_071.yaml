article_title: "第七十一条"
article_caption: "（説明又は資料提出の請求）"
description: "住宅の品質確保の促進等に関する法律の第七十一条は「説明又は資料提出の請求」を定める。 本文冒頭: 指定住宅紛争処理機関は、紛争処理の業務の実施に必要な限度において、登録住宅性能評価機関、認証型式住宅部分等製造者、登録住宅型式性能認定等機関又は登録試験機関（次項において「登録住宅性能評価機関等」という。）に対して、第八十二条第一項の規定による指定を受けた者を経由して、文書若しくは口頭による説明又は資料の提出を求めることができる。"
