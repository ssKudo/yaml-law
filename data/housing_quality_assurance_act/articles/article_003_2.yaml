article_caption: "（評価方法基準）"
description: "住宅の品質確保の促進等に関する法律の第三条の二は「評価方法基準」を定める。 本文冒頭: 国土交通大臣は、日本住宅性能表示基準を定める場合には、併せて、日本住宅性能表示基準に従って表示すべき住宅の性能に関する評価（評価のための検査を含む。以下同じ。）の方法の基準（以下「評価方法基準」という。）を定めるものとする。"
