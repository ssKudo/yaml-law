article_title: "第十五条"
article_caption: "（評価の業務の義務）"
description: "住宅の品質確保の促進等に関する法律の第十五条は「評価の業務の義務」を定める。 本文冒頭: 登録住宅性能評価機関は、評価の業務を行うべきことを求められたときは、正当な理由がある場合を除き、遅滞なく、評価の業務を行わなければならない。"
