description: "住宅の品質確保の促進等に関する法律の第二条は「定義」を定める。 本文冒頭: この法律において「住宅」とは、人の居住の用に供する家屋又は家屋の部分（人の居住の用以外の用に供する家屋の部分との共用に供する部分を含む。）をいう。"
