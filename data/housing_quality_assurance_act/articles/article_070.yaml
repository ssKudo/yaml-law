article_caption: "（紛争処理の業務の義務）"
description: "住宅の品質確保の促進等に関する法律の第七十条は「紛争処理の業務の義務」を定める。 本文冒頭: 指定住宅紛争処理機関は、紛争処理の業務を行うべきことを求められたときは、正当な理由がある場合を除き、遅滞なく、紛争処理の業務を行わなければならない。"
