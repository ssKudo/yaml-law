description: "住宅の品質確保の促進等に関する法律の第七十四条は「技術的基準」を定める。 本文冒頭: 国土交通大臣は、指定住宅紛争処理機関による住宅に係る紛争の迅速かつ適正な解決に資するため、住宅紛争処理の参考となるべき技術的基準を定めることができる。"
