article_title: "第十四条"
article_caption: "（秘密保持義務）"
description: "住宅の品質確保の促進等に関する法律の第十四条は「秘密保持義務」を定める。 本文冒頭: 登録住宅性能評価機関（その者が法人である場合にあっては、その役員）及びその職員（評価員を含む。）並びにこれらの者であった者は、評価の業務（第六条の二第三項又は第四項に規定する確認の業務を含む。以下この節において同じ。）に関して知り得た秘密を漏らし、又は自己の利益のために使用してはならない。"
