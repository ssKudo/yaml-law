description: "住宅の品質確保の促進等に関する法律の第三十九条は「特別な標章等」を定める。 本文冒頭: 認証型式住宅部分等製造者は、その認証に係る型式住宅部分等の製造をしたときは、これに当該型式住宅部分等が認証型式住宅部分等製造者が製造をした型式住宅部分等であることを示す国土交通省令で定める方式による特別な標章を付することができる。"
