article_title: "第十三条"
article_caption: "（評価員）"
description: "住宅の品質確保の促進等に関する法律の第十三条は「評価員」を定める。 本文冒頭: 登録住宅性能評価機関は、別表各号の上欄に掲げる住宅性能評価を行う住宅の区分に応じ、それぞれ当該各号の中欄に掲げる者に該当する者であって、第二十五条から第二十七条までの規定の定めるところにより国土交通大臣の登録を受けた者（以下「登録講習機関」という。）が行う講習の課程を修了したもののうちから評価員を選任しなければならない。"
