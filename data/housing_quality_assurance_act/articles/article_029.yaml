description: "住宅の品質確保の促進等に関する法律の第二十九条は「国土交通大臣による講習の業務の実施」を定める。 本文冒頭: 国土交通大臣は、次の各号のいずれかに該当するときその他必要があると認めるときは、講習の業務の全部又は一部を自ら行うことができる。"
