description: "消防法の第二十一条の十二の規定。 本文冒頭: 第二十一条の十二 総務大臣は、第二十一条の九第一項（前条第三項において準用する場合を含む。以下この条において同じ。）の規定による表示が付されている検定対象機械器具等で第二十一条の八第二項（前条第三項において準用する場合を含む。）の規定によりその型式適合検定の合格の決定が取り消されたもの若しくは第二十一条の十（前条第三項において準用する場合を含む。）の規定によ…"
