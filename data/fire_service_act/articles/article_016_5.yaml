article_caption: null
description: "消防法の第十六条の五の規定。 本文冒頭: 消防吏員又は警察官は、危険物の移送に伴う火災の防止のため特に必要があると認める場合には、走行中の移動タンク貯蔵所を停止させ、当該移動タンク貯蔵所に乗車している危険物取扱者に対し、危険物取扱者免状の提示を求めることができる。"
