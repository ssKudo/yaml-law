description: "消防法の第二十一条の十の規定。 本文冒頭: 第二十一条の十 型式承認の効力が第二十一条の五第一項の規定による型式承認の効力を失わせる処分、同項に規定する期間の経過又は第二十一条の六第一項の規定による処分により失われたときは、当該型式承認に係る検定対象機械器具等に係る協会又は第二十一条の三第一項の規定による登録を受けた法人の既に行つた型式適合検定の合格の効力は、失われるものとする。"
