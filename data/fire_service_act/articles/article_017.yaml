description: "消防法の第十七条の規定。 本文冒頭: 市町村は、その地方の気候又は風土の特殊性により、前項の消防用設備等の技術上の基準に関する政令又はこれに基づく命令の規定のみによつては防火の目的を充分に達し難いと認めるときは、条例で、同項の消防用設備等の技術上の基準に関して、当該政令又はこれに基づく命令の規定と異なる規定を設けることができる。"
