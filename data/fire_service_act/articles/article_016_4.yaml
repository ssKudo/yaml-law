description: "消防法の第十六条の四の規定。 本文冒頭: 第十三条の二十三の規定により総務大臣が指定する機関で市町村長以外のもの（以下この条において「指定講習機関」という。）が行う危険物の取扱作業の保安に関する講習を受けようとする者は、政令で定めるところにより、実費を勘案して政令で定める額の手数料を当該指定講習機関に納めなければならない。"
