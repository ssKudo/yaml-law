description: "消防法の第十七条の六の規定。 本文冒頭: 甲種消防設備士免状の交付を受けている者（以下「甲種消防設備士」という。）が行うことができる工事又は整備の種類及び乙種消防設備士免状の交付を受けている者（以下「乙種消防設備士」という。）が行うことができる整備の種類は、これらの消防設備士免状の種類に応じて総務省令で定める。"
