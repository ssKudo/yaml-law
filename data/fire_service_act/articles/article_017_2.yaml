description: "消防法の第十七条の二の規定。 本文冒頭: 性能評価を受けようとする者は、総務省令で定めるところにより、申請書に設備等設置維持計画その他総務省令で定める書類を添えて、協会又は前項の規定による登録を受けた法人に申請しなければならない。"
