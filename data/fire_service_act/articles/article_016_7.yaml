description: "消防法の第十六条の七の規定。 本文冒頭: 第十六条の七 消防本部若しくは消防署の設置若しくは廃止又は市町村の廃置分合若しくは境界変更があつたことにより、新たに消防本部及び消防署が置かれることとなつた市町村若しくは消防本部及び消防署が置かれないこととなつた市町村の区域又は当該廃置分合若しくは境界変更に係る市町村の区域に係る第十一条、第十一条の二、第十一条の四、第十一条の五第一項及び第二項、第十二条第二…"
