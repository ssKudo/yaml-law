description: "消防法の第十七条の十四の規定。 本文冒頭: 第十七条の十四 甲種消防設備士は、第十七条の五の規定に基づく政令で定める工事をしようとするときは、その工事に着手しようとする日の十日前までに、総務省令で定めるところにより、工事整備対象設備等の種類、工事の場所その他必要な事項を消防長又は消防署長に届け出なければならない。"
