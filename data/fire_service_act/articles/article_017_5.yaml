description: "消防法の第十七条の五の規定。 本文冒頭: 一　第十条第四項の技術上の基準又は設備等技術基準に従つて設置しなければならない消防用設備等 二　設備等設置維持計画に従つて設置しなければならない特殊消防用設備等。"
