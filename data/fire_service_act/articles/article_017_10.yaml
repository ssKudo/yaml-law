description: "消防法の第十七条の十の規定。 本文冒頭: 第十七条の十 消防設備士は、総務省令で定めるところにより、都道府県知事（総務大臣が指定する市町村長その他の機関を含む。）が行う工事整備対象設備等の工事又は整備に関する講習を受けなければならない。"
