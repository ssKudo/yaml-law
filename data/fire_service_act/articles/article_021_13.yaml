description: "消防法の第二十一条の十三の規定。 本文冒頭: 一　販売業者等が第二十一条の二第四項の規定に違反して、検定対象機械器具等を販売し、又は検定対象機械器具等のうち消防の用に供する機械器具若しくは設備を設置、変更若しくは修理の請負に係る工事に使用したこと。"
