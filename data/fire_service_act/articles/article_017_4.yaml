article_caption: null
description: "消防法の第十七条の四の規定。 本文冒頭: 消防長又は消防署長は、第十七条第一項の防火対象物における同条第三項の規定による認定を受けた特殊消防用設備等が設備等設置維持計画に従つて設置され、又は維持されていないと認めるときは、当該防火対象物の関係者で権原を有するものに対し、当該設備等設置維持計画に従つてこれを設置すべきこと、又はその維持のため必要な措置をなすべきことを命ずることができる。"
