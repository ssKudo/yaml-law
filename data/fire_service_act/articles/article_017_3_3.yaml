description: "消防法の第十七条の三の三の規定。 本文冒頭: 第十七条の三の三 第十七条第一項の防火対象物（政令で定めるものを除く。）の関係者は、当該防火対象物における消防用設備等又は特殊消防用設備等（第八条の二の二第一項の防火対象物にあつては、消防用設備等又は特殊消防用設備等の機能）について、総務省令で定めるところにより、定期に、当該防火対象物のうち政令で定めるものにあつては消防設備士免状の交付を受けている者又は総務…"
