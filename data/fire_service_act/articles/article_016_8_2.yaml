description: "消防法の第十六条の八の二の規定。 本文冒頭: 第十六条の八の二 総務大臣は、公共の安全の維持又は災害の発生の防止のため緊急の必要があると認めるときは、政令で定めるところにより、都道府県知事又は市町村長に対し、この章又は前条の規定に基づく政令の規定により都道府県知事又は市町村長が行うこととされる事務のうち政令で定めるものの処理について指示することができる。"
