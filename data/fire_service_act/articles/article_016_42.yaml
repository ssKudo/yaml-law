description: "消防法の第十六条の四十二の規定。 本文冒頭: 協会は、前項の規定により財務諸表を総務大臣に提出するときは、これに当該事業年度の事業報告書及び予算の区分に従い作成した決算報告書並びに財務諸表及び決算報告書に関する監事の意見書を添付しなければならない。"
