description: "消防法の第十七条の二の二の規定。 本文冒頭: 総務大臣は、前項の申請があつたときは、同項の設備等設置維持計画及び評価結果を記載した書面により、当該申請に係る設備等設置維持計画に従つて設置し、及び維持する場合における特殊消防用設備等が第十七条第一項の政令若しくはこれに基づく命令又は同条第二項の規定に基づく条例で定める技術上の基準に従つて設置し、及び維持しなければならない消防用設備等と同等以上の性能を有して…"
