description: "消防法の第十七条の三の二の規定。 本文冒頭: 第十七条の三の二 第十七条第一項の防火対象物のうち特定防火対象物その他の政令で定めるものの関係者は、同項の政令若しくはこれに基づく命令若しくは同条第二項の規定に基づく条例で定める技術上の基準（第十七条の二の五第一項前段又は前条第一項前段に規定する場合には、それぞれ第十七条の二の五第一項後段又は前条第一項後段の規定により適用されることとなる技術上の基準とする。…"
