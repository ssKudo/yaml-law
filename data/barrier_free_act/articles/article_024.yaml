article_caption: "（高齢者、障害者等が円滑に利用できる建築物の容積率の特例）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第二十四条は「高齢者、障害者等が円滑に利用できる建築物の容積率の特例」を定める。 本文冒頭: 建築物特定施設（建築基準法第五十二条第六項第一号に規定する昇降機並びに同項第二号に規定する共同住宅及び老人ホーム等の共用の廊下及び階段を除く。）の床面積が高齢者、障害者等の円滑な利用を確保するため通常の床面積よりも著しく大きい建築物で、主務大臣が高齢者、障害者等の円滑な利用を確保する上で有効と認めて定める基準に適合するものについては、当該建築物を同条第十四項…"
