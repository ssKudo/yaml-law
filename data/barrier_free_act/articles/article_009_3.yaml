article_caption: "（指導及び助言）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第九条の三は「指導及び助言」を定める。 本文冒頭: 主務大臣は、旅客施設及び車両等の移動等円滑化を促進するため必要があると認めるときは、公共交通事業者等に対し、前条第一項に規定する判断の基準となるべき事項を勘案して、同項各号に掲げる事項の実施について必要な指導及び助言をすることができる。"
