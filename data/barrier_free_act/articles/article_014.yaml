article_caption: "（特別特定建築物の建築主等の基準適合義務等）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第十四条は「特別特定建築物の建築主等の基準適合義務等」を定める。 本文冒頭: 建築主等は、特別特定建築物の政令で定める規模以上の建築（用途の変更をして特別特定建築物にすることを含む。以下この条において同じ。）をしようとするときは、当該特別特定建築物（以下この条において「新築特別特定建築物」という。）を、移動等円滑化のために必要な建築物特定施設の構造及び配置に関する政令で定める基準（以下「建築物移動等円滑化基準」という。）に適合させなけ…"
