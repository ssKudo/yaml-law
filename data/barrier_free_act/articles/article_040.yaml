description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第四十条は「地方債についての配慮」を定める。 本文冒頭: 地方公共団体が、基本構想を達成するために行う事業に要する経費に充てるために起こす地方債については、法令の範囲内において、資金事情及び当該地方公共団体の財政事情が許す限り、特別の配慮をするものとする。"
