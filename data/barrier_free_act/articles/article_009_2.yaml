article_title: "第九条の二"
article_caption: "（公共交通事業者等の判断の基準となるべき事項）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第九条の二は「公共交通事業者等の判断の基準となるべき事項」を定める。 本文冒頭: 主務大臣は、旅客施設及び車両等の移動等円滑化を促進するため、次に掲げる事項並びに移動等円滑化のために公共交通事業者等が講ずる措置によって達成すべき目標及び当該目標を達成するために当該事項と併せて講ずべき措置に関し、公共交通事業者等の判断の基準となるべき事項を定め、これを公表するものとする。"
