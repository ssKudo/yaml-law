description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第二十六条は「協議会」を定める。 本文冒頭: 基本構想を作成しようとする市町村は、基本構想の作成に関する協議及び基本構想の実施（実施の状況についての調査、分析及び評価を含む。）に係る連絡調整を行うための協議会（以下この条において「協議会」という。）を組織することができる。"
