article_caption: "（主務大臣等）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第五十四条は「主務大臣等」を定める。 本文冒頭: 第三条第一項、第三項及び第四項における主務大臣は、同条第二項第二号に掲げる事項については国土交通大臣とし、その他の事項については国土交通大臣、国家公安委員会、総務大臣及び文部科学大臣とする。"
