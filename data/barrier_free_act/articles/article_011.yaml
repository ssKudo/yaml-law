article_title: "第十一条"
article_caption: "（路外駐車場管理者等の基準適合義務等）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第十一条は「路外駐車場管理者等の基準適合義務等」を定める。 本文冒頭: 路外駐車場管理者等は、特定路外駐車場を設置するときは、当該特定路外駐車場（以下この条において「新設特定路外駐車場」という。）を、移動等円滑化のために必要な特定路外駐車場の構造及び設備に関する主務省令で定める基準（以下「路外駐車場移動等円滑化基準」という。）に適合させなければならない。"
