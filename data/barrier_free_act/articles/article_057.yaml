article_caption: "（道路法の適用）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第五十七条は「道路法の適用」を定める。 本文冒頭: 第三十二条第五項の規定により道路管理者に代わってその権限を行う市町村は、道路法第八章の規定の適用については、道路管理者とみなす。"
