article_title: "第二十三条"
article_caption: "（既存の特定建築物に設けるエレベーターについての建築基準法の特例）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第二十三条は「既存の特定建築物に設けるエレベーターについての建築基準法の特例」を定める。 本文冒頭: この法律の施行の際現に存する特定建築物に専ら車椅子を使用している者の利用に供するエレベーターを設置する場合において、当該エレベーターが次に掲げる基準に適合し、所管行政庁が防火上及び避難上支障がないと認めたときは、当該特定建築物に対する建築基準法第二十七条第二項の規定の適用については、当該エレベーターの構造は耐火構造（同法第二条第七号に規定する耐火構造をいう。…"
