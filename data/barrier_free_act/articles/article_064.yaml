description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第六十四条の規定。 本文冒頭: 第六十四条 法人の代表者又は法人若しくは人の代理人、使用人その他の従業者が、その法人又は人の業務に関し、第五十九条から前条までの違反行為をしたときは、行為者を罰するほか、その法人又は人に対しても各本条の刑を科する。"
