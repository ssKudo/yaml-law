description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第四十五条は「移動等円滑化経路協定区域からの除外」を定める。 本文冒頭: 移動等円滑化経路協定区域内の土地（土地区画整理法第九十八条第一項の規定により仮換地として指定された土地にあっては、当該土地に対応する従前の土地）で当該移動等円滑化経路協定の効力が及ばない者の所有するものの全部又は一部について借地権等が消滅した場合においては、当該借地権等の目的となっていた土地（同項の規定により仮換地として指定された土地に対応する従前の土地にあ…"
