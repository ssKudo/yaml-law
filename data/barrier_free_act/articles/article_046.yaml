description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第四十六条は「移動等円滑化経路協定の効力」を定める。 本文冒頭: 第四十三条第二項（第四十四条第二項において準用する場合を含む。）の規定による認可の公告のあった移動等円滑化経路協定は、その公告のあった後において当該移動等円滑化経路協定区域内の土地所有者等となった者（当該移動等円滑化経路協定について第四十一条第一項又は第四十四条第一項の規定による合意をしなかった者の有する土地の所有権を承継した者を除く。）に対しても、その効力…"
