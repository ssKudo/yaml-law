article_caption: "（地方公共団体の責務）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第五条は「地方公共団体の責務」を定める。 本文冒頭: 地方公共団体は、国の施策に準じて、移動等円滑化を促進するために必要な措置を講ずるよう努めなければならない。"
