description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第一条の二は「基本理念」を定める。 本文冒頭: この法律に基づく措置は、高齢者、障害者等にとって日常生活又は社会生活を営む上で障壁となるような社会における事物、制度、慣行、観念その他一切のものの除去に資すること及び全ての国民が年齢、障害の有無その他の事情によって分け隔てられることなく共生する社会の実現に資することを旨として、行われなければならない。"
