article_caption: "（建築物特定事業の実施）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第三十五条は「建築物特定事業の実施」を定める。 本文冒頭: 第二十五条第一項の規定により基本構想が作成されたときは、関係する建築主等は、単独で又は共同して、当該基本構想に即して建築物特定事業を実施するための計画（以下この条において「建築物特定事業計画」という。）を作成し、これに基づき、当該建築物特定事業を実施するものとする。"
