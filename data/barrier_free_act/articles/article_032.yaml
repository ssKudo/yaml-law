article_caption: "（市町村による国道等に係る道路特定事業の実施）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第三十二条は「市町村による国道等に係る道路特定事業の実施」を定める。 本文冒頭: 第二十五条第五項の規定により基本構想において道路特定事業を実施する者として市町村（道路法第十七条第一項の指定市を除く。以下この条及び第五十五条から第五十七条までにおいて同じ。）が定められたときは、前条第一項、同法第十二条ただし書及び第十五条並びに昭和三十九年道路法改正法附則第三項の規定にかかわらず、市町村は、単独で又は他の市町村若しくは道路管理者と共同して、…"
