article_title: "第十七条"
article_caption: "（特定建築物の建築等及び維持保全の計画の認定）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第十七条は「特定建築物の建築等及び維持保全の計画の認定」を定める。 本文冒頭: 建築主等は、特定建築物の建築、修繕又は模様替（修繕又は模様替にあっては、建築物特定施設に係るものに限る。以下「建築等」という。）をしようとするときは、主務省令で定めるところにより、特定建築物の建築等及び維持保全の計画を作成し、所管行政庁の認定を申請することができる。"
