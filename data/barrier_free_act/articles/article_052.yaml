article_caption: "（国の援助）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第五十二条は「国の援助」を定める。 本文冒頭: 国は、地方公共団体が移動等円滑化の促進に関する施策を円滑に実施することができるよう、地方公共団体に対し、助言、指導その他の必要な援助を行うよう努めなければならない。"
