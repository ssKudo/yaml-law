description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第三条は「基本方針」を定める。 本文冒頭: 主務大臣は、移動等円滑化を総合的かつ計画的に推進するため、移動等円滑化の促進に関する基本方針（以下「基本方針」という。）を定めるものとする。"
