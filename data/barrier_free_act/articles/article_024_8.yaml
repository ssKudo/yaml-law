article_title: "第二十四条の八"
article_caption: "（施設設置管理者による市町村に対する情報の提供）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第二十四条の八は「施設設置管理者による市町村に対する情報の提供」を定める。 本文冒頭: 公共交通事業者等及び道路管理者は、前条の規定により情報の収集、整理及び提供を行う市町村の求めがあったときは、主務省令で定めるところにより、高齢者、障害者等が旅客施設及び特定道路を利用するために必要となる情報を当該市町村に提供しなければならない。"
