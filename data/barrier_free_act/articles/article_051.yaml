description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第五十一条は「借主の地位」を定める。 本文冒頭: 移動等円滑化経路協定に定める事項が建築物その他の工作物の借主の権限に係る場合においては、その移動等円滑化経路協定については、当該建築物その他の工作物の借主を土地所有者等とみなして、この章の規定を適用する。"
