article_caption: "（一の所有者による移動等円滑化経路協定の設定）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第五十条は「一の所有者による移動等円滑化経路協定の設定」を定める。 本文冒頭: 移動等円滑化促進地区内又は重点整備地区内の一団の土地で、一の所有者以外に土地所有者等が存しないものの所有者は、移動等円滑化のため必要があると認めるときは、市町村長の認可を受けて、当該土地の区域を移動等円滑化経路協定区域とする移動等円滑化経路協定を定めることができる。"
