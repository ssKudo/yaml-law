article_title: "第十六条"
article_caption: "（特定建築物の建築主等の努力義務等）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第十六条は「特定建築物の建築主等の努力義務等」を定める。 本文冒頭: 建築主等は、特定建築物（特別特定建築物を除く。以下この条において同じ。）の建築（用途の変更をして特定建築物にすることを含む。次条第一項において同じ。）をしようとするときは、当該特定建築物を建築物移動等円滑化基準に適合させるために必要な措置を講ずるよう努めなければならない。"
