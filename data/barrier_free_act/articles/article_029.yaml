description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第二十九条は「公共交通特定事業計画の認定」を定める。 本文冒頭: 公共交通事業者等は、主務省令で定めるところにより、主務大臣に対し、公共交通特定事業計画が重点整備地区における移動等円滑化を適切かつ確実に推進するために適当なものである旨の認定を申請することができる。"
