description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第四条は「国の責務」を定める。 本文冒頭: 国は、高齢者、障害者等、地方公共団体、施設設置管理者その他の関係者と協力して、基本方針及びこれに基づく施設設置管理者の講ずべき措置の内容その他の移動等円滑化の促進のための施策の内容について、移動等円滑化の進展の状況等を勘案しつつ、関係行政機関及びこれらの者で構成する会議における定期的な評価その他これらの者の意見を反映させるために必要な措置を講じた上で、適時に…"
