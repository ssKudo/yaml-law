article_title: "第九条"
article_caption: "（旅客施設及び車両等に係る基準適合性審査等）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第九条は「旅客施設及び車両等に係る基準適合性審査等」を定める。 本文冒頭: 主務大臣は、新設旅客施設等について鉄道事業法その他の法令の規定で政令で定めるものによる許可、認可その他の処分の申請があった場合には、当該処分に係る法令に定める基準のほか、公共交通移動等円滑化基準に適合するかどうかを審査しなければならない。"
