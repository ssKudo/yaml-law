article_title: "第三十七条"
article_caption: "（生活関連施設又は一般交通用施設の整備等）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第三十七条は「生活関連施設又は一般交通用施設の整備等」を定める。 本文冒頭: 国及び地方公共団体は、基本構想において定められた生活関連施設又は一般交通用施設の整備、土地区画整理事業、市街地再開発事業その他の市街地開発事業の施行その他の必要な措置を講ずるよう努めなければならない。"
