article_title: "第六条"
article_caption: "（施設設置管理者等の責務）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第六条は「施設設置管理者等の責務」を定める。 本文冒頭: 施設設置管理者その他の高齢者、障害者等が日常生活又は社会生活において利用する施設を設置し、又は管理する者は、移動等円滑化のために必要な措置を講ずるよう努めなければならない。"
