article_title: "第十三条"
article_caption: "（公園管理者等の基準適合義務等）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第十三条は「公園管理者等の基準適合義務等」を定める。 本文冒頭: 公園管理者等は、特定公園施設の新設、増設又は改築を行うときは、当該特定公園施設（以下この条において「新設特定公園施設」という。）を、移動等円滑化のために必要な特定公園施設の設置に関する条例（国の設置に係る都市公園にあっては、主務省令）で定める基準（以下この条において「都市公園移動等円滑化基準」という。）に適合させなければならない。"
