description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第二十二条は「特定建築物の建築等及び維持保全の計画の認定の取消し」を定める。 本文冒頭: 所管行政庁は、認定建築主等が前条の規定による処分に違反したときは、第十七条第三項の認定を取り消すことができる。"
