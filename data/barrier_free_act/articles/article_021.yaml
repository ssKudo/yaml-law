article_caption: "（認定建築主等に対する改善命令）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第二十一条は「認定建築主等に対する改善命令」を定める。 本文冒頭: 所管行政庁は、認定建築主等が第十七条第三項の認定を受けた計画に従って認定特定建築物の建築等又は維持保全を行っていないと認めるときは、当該認定建築主等に対し、その改善に必要な措置をとるべきことを命ずることができる。"
