article_title: "第二十五条"
article_caption: "（移動等円滑化基本構想）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第二十五条は「移動等円滑化基本構想」を定める。 本文冒頭: 市町村は、基本方針（移動等円滑化促進方針が作成されているときは、基本方針及び移動等円滑化促進方針。以下同じ。）に基づき、単独で又は共同して、当該市町村の区域内の重点整備地区について、移動等円滑化に係る事業の重点的かつ一体的な推進に関する基本的な構想（以下「基本構想」という。）を作成するよう努めるものとする。"
