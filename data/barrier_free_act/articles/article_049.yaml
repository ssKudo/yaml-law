article_title: "第四十九条"
article_caption: "（土地の共有者等の取扱い）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第四十九条は「土地の共有者等の取扱い」を定める。 本文冒頭: 土地又は借地権等が数人の共有に属するときは、第四十一条第一項、第四十四条第一項、第四十七条第一項及び前条第一項の規定の適用については、合わせて一の所有者又は借地権等を有する者とみなす。"
