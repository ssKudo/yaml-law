article_title: "第五十六条"
article_caption: "（事務の区分）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第五十六条は「事務の区分」を定める。 本文冒頭: 第三十二条の規定により国道に関して市町村が処理することとされている事務（費用の負担及び徴収に関するものを除く。）は、地方自治法（昭和二十二年法律第六十七号）第二条第九項第一号に規定する第一号法定受託事務とする。"
