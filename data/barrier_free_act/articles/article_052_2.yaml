description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第五十二条の二は「資金の確保等」を定める。 本文冒頭: 国は、移動等円滑化を促進するために必要な資金の確保その他の措置を講ずるよう努めなければならない。"
