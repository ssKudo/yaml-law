description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第六十一条の規定。 本文冒頭: 一　第九条の四の規定による提出をしなかった者 二　第九条の五の規定による報告をせず、又は虚偽の報告をした者 三　第十二条第一項又は第二項の規定に違反して、届出をせず、又は虚偽の届出をした者。"
