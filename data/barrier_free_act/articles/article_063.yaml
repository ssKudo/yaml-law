description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第六十三条の規定。 本文冒頭: 一　第五十三条第二項の規定による報告をせず、若しくは虚偽の報告をし、又は同項の規定による検査を拒み、妨げ、若しくは忌避し、若しくは質問に対して陳述をせず、若しくは虚偽の陳述をした者 二　第五十三条第四項又は第五項の規定による報告をせず、又は虚偽の報告をした者。"
