description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第二十四条の六は「行為の届出等」を定める。 本文冒頭: 移動等円滑化促進方針において定められた移動等円滑化促進地区の区域において、旅客施設の建設、道路の新設その他の行為であって当該区域における移動等円滑化の促進に支障を及ぼすおそれのあるものとして政令で定めるものをしようとする公共交通事業者等又は道路管理者は、当該行為に着手する日の三十日前までに、主務省令で定めるところにより、行為の種類、場所、設計又は施行方法、着…"
