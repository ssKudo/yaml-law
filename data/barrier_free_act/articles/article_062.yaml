description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第六十二条の規定。 本文冒頭: 一　第二十条第二項の規定に違反して、表示を付した者 二　第二十四条の六第一項又は第二項の規定に違反して、届出をせず、又は虚偽の届出をして、同条第一項本文又は第二項に規定する行為をした者 三　第五十三条第三項の規定による報告をせず、若しくは虚偽の報告をし、又は同項の規定による検査を拒み、妨げ、若しくは忌避し、若しくは質問に対して陳述をせず、若しくは虚偽の陳述を…"
