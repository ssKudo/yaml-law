description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第四十二条は「認可の申請に係る移動等円滑化経路協定の縦覧等」を定める。 本文冒頭: 市町村長は、前条第三項の認可の申請があったときは、主務省令で定めるところにより、その旨を公告し、当該移動等円滑化経路協定を公告の日から二週間関係人の縦覧に供さなければならない。"
