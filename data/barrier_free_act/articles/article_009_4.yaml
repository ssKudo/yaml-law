description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第九条の四は「計画の作成」を定める。 本文冒頭: 公共交通事業者等（旅客が相当数であることその他の主務省令で定める要件に該当する者に限る。次条から第九条の七までにおいて同じ。）は、毎年度、主務省令で定めるところにより、第九条の二第一項に規定する判断の基準となるべき事項において定められた同項の目標に関し、その達成のための計画を作成し、主務大臣に提出しなければならない。"
