article_caption: "（移動等円滑化の進展の状況に関する評価）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第五十二条の四は「移動等円滑化の進展の状況に関する評価」を定める。 本文冒頭: 国は、移動等円滑化を促進するため、関係行政機関及び高齢者、障害者等、地方公共団体、施設設置管理者その他の関係者で構成する会議を設け、定期的に、移動等円滑化の進展の状況を把握し、及び評価するよう努めなければならない。"
