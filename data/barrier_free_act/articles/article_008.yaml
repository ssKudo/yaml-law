article_caption: "（公共交通事業者等の基準適合義務等）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第八条は「公共交通事業者等の基準適合義務等」を定める。 本文冒頭: 公共交通事業者等は、旅客施設を新たに建設し、若しくは旅客施設について主務省令で定める大規模な改良を行うとき又は車両等を新たにその事業の用に供するときは、当該旅客施設又は車両等（以下「新設旅客施設等」という。）を、移動等円滑化のために必要な旅客施設又は車両等の構造及び設備に関する主務省令で定める基準（以下「公共交通移動等円滑化基準」という。）に適合させなければ…"
