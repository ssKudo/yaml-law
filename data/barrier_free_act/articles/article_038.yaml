description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第三十八条は「基本構想に基づく事業の実施に係る命令等」を定める。 本文冒頭: 市町村は、第二十八条第一項の公共交通特定事業、第三十三条第一項の路外駐車場特定事業、第三十四条第一項の都市公園特定事業（公園管理者が実施すべきものを除く。）又は第三十五条第一項の建築物特定事業若しくは第三十六条の二第一項の教育啓発特定事業（いずれも国又は地方公共団体が実施すべきものを除く。）（以下この条において「公共交通特定事業等」と総称する。）が実施されて…"
