description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第四十三条は「移動等円滑化経路協定の認可」を定める。 本文冒頭: 市町村長は、第四十一条第三項の認可の申請が次の各号のいずれにも該当するときは、同項の認可をしなければならない。"
