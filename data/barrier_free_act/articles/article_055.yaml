article_title: "第五十五条"
article_caption: "（不服申立て）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第五十五条は「不服申立て」を定める。 本文冒頭: 市町村が第三十二条第五項の規定により道路管理者に代わってした処分に不服がある者は、当該市町村の長に対して審査請求をし、その裁決に不服がある者は、主務大臣に対して再審査請求をすることができる。"
