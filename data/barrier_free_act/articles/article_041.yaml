description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第四十一条は「移動等円滑化経路協定の締結等」を定める。 本文冒頭: 移動等円滑化促進地区内又は重点整備地区内の一団の土地の所有者及び建築物その他の工作物の所有を目的とする借地権その他の当該土地を使用する権利（臨時設備その他一時使用のため設定されたことが明らかなものを除く。以下「借地権等」という。）を有する者（土地区画整理法第九十八条第一項（大都市地域における住宅及び住宅地の供給の促進に関する特別措置法（昭和五十年法律第六十七…"
