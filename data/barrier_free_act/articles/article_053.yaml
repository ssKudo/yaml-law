article_title: "第五十三条"
article_caption: "（報告及び立入検査）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第五十三条は「報告及び立入検査」を定める。 本文冒頭: 主務大臣は、この法律の施行に必要な限度において、主務省令で定めるところにより、公共交通事業者等に対し、移動等円滑化のための事業に関し報告をさせ、又はその職員に、公共交通事業者等の事務所その他の事業場若しくは車両等に立ち入り、旅客施設、車両等若しくは帳簿、書類その他の物件を検査させ、若しくは関係者に質問させることができる。"
