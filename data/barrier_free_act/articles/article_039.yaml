description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第三十九条は「土地区画整理事業の換地計画において定める保留地の特例」を定める。 本文冒頭: 基本構想において定められた土地区画整理事業であって土地区画整理法第三条第四項、第三条の二又は第三条の三の規定により施行するものの換地計画（基本構想において定められた重点整備地区の区域内の宅地について定められたものに限る。）においては、重点整備地区の区域内の住民その他の者の共同の福祉又は利便のために必要な生活関連施設又は一般交通用施設で国、地方公共団体、公共交…"
