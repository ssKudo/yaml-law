description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第十二条は「特定路外駐車場に係る基準適合命令等」を定める。 本文冒頭: 路外駐車場管理者等は、特定路外駐車場を設置するときは、あらかじめ、主務省令で定めるところにより、その旨を都道府県知事（市の区域内にあっては、当該市の長。以下「知事等」という。）に届け出なければならない。"
