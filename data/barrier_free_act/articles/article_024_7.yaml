article_title: "第二十四条の七"
article_caption: "（市町村による情報の収集、整理及び提供）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第二十四条の七は「市町村による情報の収集、整理及び提供」を定める。 本文冒頭: 第二十四条の二第四項の規定により移動等円滑化促進方針において市町村が行う移動等円滑化に関する情報の収集、整理及び提供に関する事項が定められたときは、市町村は、当該移動等円滑化促進方針に基づき移動等円滑化に関する事項についての情報の収集、整理及び提供を行うものとする。"
