description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第四十七条は「移動等円滑化経路協定の認可の公告のあった後移動等円滑化経路協定に加わる手続等」を定める。 本文冒頭: 移動等円滑化経路協定区域内の土地の所有者（土地区画整理法第九十八条第一項の規定により仮換地として指定された土地にあっては、当該土地に対応する従前の土地の所有者）で当該移動等円滑化経路協定の効力が及ばないものは、第四十三条第二項（第四十四条第二項において準用する場合を含む。）の規定による認可の公告があった後いつでも、市町村長に対して書面でその意思を表示すること…"
