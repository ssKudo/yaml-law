description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第三十六条は「交通安全特定事業の実施」を定める。 本文冒頭: 第二十五条第一項の規定により基本構想が作成されたときは、関係する公安委員会は、単独で又は共同して、当該基本構想に即して交通安全特定事業を実施するための計画（以下「交通安全特定事業計画」という。）を作成し、これに基づき、当該交通安全特定事業を実施するものとする。"
