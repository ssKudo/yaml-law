article_title: "第二十条"
article_caption: "（認定特定建築物の表示等）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第二十条は「認定特定建築物の表示等」を定める。 本文冒頭: 認定建築主等は、認定特定建築物の建築等をしたときは、当該認定特定建築物、その敷地又はその利用に関する広告その他の主務省令で定めるもの（次項において「広告等」という。）に、主務省令で定めるところにより、当該認定特定建築物が第十七条第三項の認定を受けている旨の表示を付することができる。"
