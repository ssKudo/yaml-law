description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第四十四条は「移動等円滑化経路協定の変更」を定める。 本文冒頭: 移動等円滑化経路協定区域内における土地所有者等（当該移動等円滑化経路協定の効力が及ばない者を除く。）は、移動等円滑化経路協定において定めた事項を変更しようとする場合においては、その全員の合意をもってその旨を定め、市町村長の認可を受けなければならない。"
