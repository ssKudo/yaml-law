description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第三十条は「公共交通特定事業計画に係る地方債の特例」を定める。 本文冒頭: 地方公共団体が、前条第二項の認定に係る公共交通特定事業計画に基づく公共交通特定事業で主務省令で定めるものに関する助成を行おうとする場合においては、当該助成に要する経費であって地方財政法（昭和二十三年法律第百九号）第五条各号に規定する経費のいずれにも該当しないものは、同条第五号に規定する経費とみなす。"
