description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第四十八条は「移動等円滑化経路協定の廃止」を定める。 本文冒頭: 移動等円滑化経路協定区域内の土地所有者等（当該移動等円滑化経路協定の効力が及ばない者を除く。）は、第四十一条第三項又は第四十四条第一項の認可を受けた移動等円滑化経路協定を廃止しようとする場合においては、その過半数の合意をもってその旨を定め、市町村長の認可を受けなければならない。"
