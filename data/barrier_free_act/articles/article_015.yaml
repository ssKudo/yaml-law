article_caption: "（特別特定建築物に係る基準適合命令等）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第十五条は「特別特定建築物に係る基準適合命令等」を定める。 本文冒頭: 所管行政庁は、前条第一項から第三項までの規定に違反している事実があると認めるときは、建築主等に対し、当該違反を是正するために必要な措置をとるべきことを命ずることができる。"
