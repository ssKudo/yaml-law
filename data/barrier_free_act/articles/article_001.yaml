article_caption: "（目的）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第一条は「目的」を定める。 本文冒頭: この法律は、高齢者、障害者等の自立した日常生活及び社会生活を確保することの重要性に鑑み、公共交通機関の旅客施設及び車両等、道路、路外駐車場、公園施設並びに建築物の構造及び設備を改善するための措置、一定の地区における旅客施設、建築物等及びこれらの間の経路を構成する道路、駅前広場、通路その他の施設の一体的な整備を推進するための措置、移動等円滑化に関する国民の理解…"
