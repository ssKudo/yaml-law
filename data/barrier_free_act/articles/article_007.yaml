article_caption: "（国民の責務）"
description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第七条は「国民の責務」を定める。 本文冒頭: 国民は、高齢者、障害者等の自立した日常生活及び社会生活を確保することの重要性について理解を深めるとともに、これらの者が公共交通機関を利用して移動するために必要となる支援、これらの者の高齢者障害者等用施設等の円滑な利用を確保する上で必要となる適正な配慮その他のこれらの者の円滑な移動及び施設の利用を確保するために必要な協力をするよう努めなければならない。"
