description: "高齢者、障害者等の移動等の円滑化の促進に関する法律の第九条の六は「公表」を定める。 本文冒頭: 公共交通事業者等は、毎年度、主務省令で定めるところにより、第九条の四の計画の内容、当該計画に基づく措置の実施の状況その他主務省令で定める移動等円滑化に関する情報を公表しなければならない。"
