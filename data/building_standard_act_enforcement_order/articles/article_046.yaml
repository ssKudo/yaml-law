article_caption: "（構造耐力上必要な軸組等）"
description: "木造建築物の地震力・風圧力に対する安全性を確保するため、各階・各方向に設けるべき構造耐力上必要な壁（耐力壁）や筋かいなどの軸組量の計算基準および配置方法を規定した条文。"
