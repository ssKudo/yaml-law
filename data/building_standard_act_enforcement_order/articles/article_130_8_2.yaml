article_caption: "（第二種住居地域等内に建築してはならない建築物の店舗、飲食店等に類する用途）"
description: "住居地域、準住居地域、又は近隣商業地域内において、原則として建築してはならない劇場、映画館、演芸場、観覧場等の用途に供する建築物の規模や制限を定めた条文。"
