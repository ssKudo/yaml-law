article_title: "第百三十七条の十八"
article_caption: "（建築物の用途を変更して特殊建築物とする場合に建築主事の確認等を要しない類似の用途）"
description: "建築物の用途を変更して特殊建築物とする際、類似の用途間（劇場から映画館、ホテルから旅館など）での変更であれば、用途制限に基づく確認申請（建築主事の確認等）を不要とする類似用途のグループ範囲を定めた条文。"
