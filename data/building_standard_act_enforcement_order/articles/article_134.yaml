article_caption: "（前面道路の反対側に公園、広場、水面その他これらに類するものがある場合）"
description: "前面道路の反対側に水面、線路敷地、広場、公園その他これらに類するものがある場合において、道路斜線制限を緩和するため、それらの幅の半分または全幅を前面道路幅に加算してみなす境界線の位置を定めた条文。"
