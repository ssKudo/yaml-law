article_caption: "（根切り工事、山留め工事等を行う場合の危害の防止）"
description: "建築工事現場における根切り工事（土掘削）、山留め工事（土留め）について、周辺地盤の崩壊や構造物の転倒、地下水流入等による危害を防止するための安全基準及び計測管理要件を定めた条文。"
