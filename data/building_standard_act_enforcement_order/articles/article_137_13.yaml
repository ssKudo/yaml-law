article_title: "第百三十七条の十三"
article_caption: "（技術的基準から除かれる防火区画）"
description: "既存不適格建築物の増築等において、現行の技術的基準を全面的に適用することを免除し、例外的に適用を除外できる防火区画（竪穴区画、面積区画等）の範囲及び条件を定めた条文。"
