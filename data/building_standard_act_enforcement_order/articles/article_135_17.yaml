description: "敷地の地盤面が前面道路や隣地地盤面より低い場合など、高低差がある場合の斜線制限の算定にあたって、高低差の2分の1（又は一定の算定式による数値）だけ高い位置に地盤面があるものとみなす高低差の算定基準を定めた条文。"
