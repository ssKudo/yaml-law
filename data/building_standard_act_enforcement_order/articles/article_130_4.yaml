article_caption: "（第一種低層住居専用地域内に建築することができる公益上必要な建築物）"
description: "第一種低層住居専用地域内に建築することができる公益上必要な建築物として、郵便局、交番、公衆電話所、電気・ガス等の供給供給設備、鉄道施設、水路・下水道施設等の範囲を定めた条文。"
