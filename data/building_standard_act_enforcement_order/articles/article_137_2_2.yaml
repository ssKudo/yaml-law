article_title: "第百三十七条の二の二"
article_caption: "（大規模の建築物の主要構造部等関係）"
description: "大規模な既存不適格建築物の増築又は改築において、主要構造部（柱・梁・壁・床等）の耐火・準耐火構造要件や防火・安全措置を緩和するための具体的な技術的基準を定めた条文。"
