article_caption: "（一団地内の空地及び一団地の面積の規模）"
description: "団地内の複数建築物（一団地）において、敷地内に有効な空地（公園・広場等）が十分に確保されている場合に、各建築物の敷地境界の規定を緩和する一団地認定の基準を定めた条文。"
