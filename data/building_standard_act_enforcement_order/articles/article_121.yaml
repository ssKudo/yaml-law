article_caption: "（二以上の直通階段を設ける場合）"
description: "劇場、店舗、共同住宅、六階以上の階などにおいて、二方向避難を確保するために二以上の直通階段の設置を義務付ける階の規模・用途、および階段重複区間の制限を定めた条文。"
