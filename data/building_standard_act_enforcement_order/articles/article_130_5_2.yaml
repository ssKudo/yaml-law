article_title: "第百三十条の五の二"
article_caption: "（第二種低層住居専用地域及び田園住居地域内に建築することができる店舗、飲食店等の建築物）"
description: "第一種中高層住居専用地域又は第二種中高層住居専用地域内に新築できる店舗、飲食店等の建築物について、床面積（500平方メートル以下）及び階数（2階以下）の制限、並びに業態（日用品店舗、食堂、理美容店など）の範囲を定めた条文。"
