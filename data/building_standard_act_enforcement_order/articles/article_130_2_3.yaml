article_caption: "（卸売市場等の用途に供する特殊建築物の位置に対する制限の緩和）"
description: "都市計画決定を受けていない卸売市場、と畜場、火葬場、ごみ焼却場等の位置制限の緩和（法第51条ただし書）において、特定行政庁が許可する新築・増築又は用途変更の規模や基準を定めた条文。"
