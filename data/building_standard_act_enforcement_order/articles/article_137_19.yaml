article_caption: "（建築物の用途を変更する場合に法第二十七条等の規定を準用しない類似の用途等）"
description: "建築物の用途変更にあたり、変更前後の用途が類似の用途（各種学校から小学校、博物館から図書館など）である場合に、避難施設規定や構造安全基準等の適用（法第27条等）を免除・緩和する基準を定めた条文。"
