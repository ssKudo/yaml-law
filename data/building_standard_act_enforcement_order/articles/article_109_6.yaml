article_caption: "（延焼防止上有効な空地の技術的基準）"
description: "大規模木造等において、防火壁の設置を免除するために必要な「延焼防止上有効な空地」の技術的基準として、境界線からの所要水平距離（建物高相当以上）を定めた条文。"
