article_caption: "（エレベーターの安全装置）"
description: "エレベーターの安全装置の構造基準として、制動装置（非常止め）、かごの上部挟まれ防止、地震時緊急停止着床、かご内と外部の非常通話連絡、および停電時予備照明の設置義務などを定めた条文。"
