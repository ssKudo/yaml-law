article_caption: "（準景観地区内の建築物に係る制限）"
description: "準景観地区内において良好な景観を保全するため、都市計画及び条例に基づいて制限される建築物の高さ（最高限度・最低限度）、壁面の位置、敷地面積の最低限度に関する適合基準を定めた条文。"
