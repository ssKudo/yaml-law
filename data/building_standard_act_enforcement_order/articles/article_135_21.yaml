article_caption: "（建蔽率の制限の緩和に当たり建築物から除かれる部分）"
description: "前面道路高さ制限等の緩和（セットバック緩和）を受けるにあたり、建築物の後退距離を算定する基準から除外することができる、ポーチ、バルコニー、手すり、及び特定行政庁が認める部分の基準を定めた条文。"
