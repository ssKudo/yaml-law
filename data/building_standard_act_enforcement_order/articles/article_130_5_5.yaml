article_caption: "（第一種中高層住居専用地域内に建築してはならない附属建築物）"
description: "第一種中高層住居専用地域又は第二種中高層住居専用地域において、原則として建築してはならない建築物（病院、大学、専修学校、図書館等）の範囲及びその例外について定めた条文。"
