article_caption: "（給水、排水その他の配管設備の設置及び構造）"
description: "建築物に設ける給水、排水その他の配管設備の設置及び構造について、腐食防止、主要構造部貫通時の支障防止、昇降路内設置禁止、防火区画貫通時の措置、飲料水タンクの衛生管理基準などを詳細に定めた条文。"
