article_caption: "（防火性能に関する技術的基準）"
description: "建築物の周囲で発生した通常の火災に対し、外壁や軒裏に求められる「防火性能」の技術的基準（30分間の構造耐力保持、非加熱面の可燃物燃焼温度上昇防止）を定めた条文。"
