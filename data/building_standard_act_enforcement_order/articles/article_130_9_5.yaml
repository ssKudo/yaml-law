article_caption: "（近隣商業地域及び準工業地域内に建築してはならない建築物）"
description: "準工業地域、商業地域、又は工業地域において、周囲の騒音や安全確保の観点から、原則として隣接建築してはならない学校や病院等の範囲を定めた条文。"
