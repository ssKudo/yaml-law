article_title: "第百三十条の十"
article_caption: "（第一種低層住居専用地域等内における建築物の高さの制限の緩和に係る敷地内の空地等）"
description: "第一種低層住居専用地域等における建築物の高さ制限の緩和（法第55条第2項）を受けるために必要となる、敷地内に確保すべき空地面積の割合（建蔽率に応じた割合）及び敷地規模（原則1500平方メートル以上）を定めた条文。"
