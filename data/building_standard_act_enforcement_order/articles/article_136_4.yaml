article_caption: "（基礎工事用機械等の転倒による危害の防止）"
description: "建築工事等で使用する基礎工事用機械（杭打ち機、移動式クレーン等）について、風圧や地盤の不同沈下による「転倒危害」を防止するための地盤補強、ワイヤー固定等の安全基準を定めた条文。"
