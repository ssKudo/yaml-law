article_title: "第百三十五条の十九"
article_caption: "（容積率の算定に当たり建築物から除かれる部分）"
description: "前面道路高さ制限（道路斜線制限）の後退距離（セットバック距離）を算定する際、軒高、ポーチ、バルコニー、門・塀、及び高さ1.2m以下の部分など、算定の対象（後退線の基準）から除外できる建築物部分を定めた条文。"
