article_title: "第百三十六条の二の二"
article_caption: "（防火地域又は準防火地域内の建築物の屋根の性能に関する技術的基準）"
description: "防火地域又は準防火地域内の建築物の屋根について、火の粉による火災の発生を防ぐため、主要構造や仕上げに不燃材料を使用するなどの技術的基準（屋根の性能）を定めた条文。"
