article_caption: "（物品販売業を営む店舗における避難階段等の幅）"
description: "物品販売業を営む店舗（百貨店など）において、避難時の混雑と滞留を防ぐために各階の避難階段・特別避難階段及びその出入口に求める最小有効幅の算定式を定めた条文。"
