article_title: "第百二十九条の十三の二"
article_caption: "（非常用の昇降機の設置を要しない建築物）"
description: "非常用エレベーターの設置義務（高さ31メートル超）が免除される建築物として、最上部が機械室等のみの建物、31m超の床面積合計が500平方メートル以下の建物、または耐火区画が細分化された建物などの範囲を定めた条文。"
