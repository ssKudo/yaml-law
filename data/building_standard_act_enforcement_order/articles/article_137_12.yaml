article_num: "137_12"
article_title: "第百三十七条の十二"
article_caption: "（大規模の修繕又は大規模の模様替）"
description: "既存不適格建築物を大規模の修繕又は大規模の模様替を行う際、一律に現行法を遡及適用せず、構造耐力や防火安全上の重大な支障がない範囲で適用を緩和する基準を定めた条文。"
