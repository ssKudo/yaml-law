article_title: "第百三十六条の五"
article_caption: "（落下物に対する防護）"
description: "高所作業を伴う建築工事現場において、ボルトや工具、仮設資材等の「落下物」が周辺に被害を及ぼさないよう、朝顔（傾斜した防護棚）や防音シート、防網の設置基準を定めた条文。"
