article_title: "第百三十条の十二"
article_caption: "（前面道路との関係についての建築物の各部分の高さの制限に係る建築物の後退距離の算定の特例）"
description: "道路斜線制限等の適用において、前面道路からの建築物の後退距離を算定する際、後退していないもの（除外）とみなさずに算定に含めることができる物置（軒高2.3m以下・床面積5㎡以下）、ポーチ、高さ2m以下の門・塀、高さ1.2m以下の部分等の緩和対象を定めた条文。"
