article_title: "第百三十一条"
article_caption: "（前面道路との関係についての建築物の各部分の高さの制限の緩和）"
description: "道路斜線制限等の前面道路幅員に応じた各部分の高さ制限に関して、前面道路の反対側に水面や線路がある場合の後退距離算定や、前面道路と高低差がある場合の緩和など、高さ制限の特例基準を定めた条文。"
