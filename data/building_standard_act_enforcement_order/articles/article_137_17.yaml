article_caption: "（公共事業の施行等による敷地面積の減少について法第三条等の規定を準用する事業）"
description: "公共事業の施行（道路拡幅、土地区画整理等）により敷地面積が減少して既存不適格となった場合において、建築制限や建蔽率・容積率等の緩和措置を受けることができる対象事業を定めた条文。"
