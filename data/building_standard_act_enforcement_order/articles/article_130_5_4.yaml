article_caption: "（第一種中高層住居専用地域内に建築することができる公益上必要な建築物）"
description: "第一種中高層住居専用地域又は第二種中高層住居専用地域内に新築できる公益上必要な建築物として、郵便局、交番、電気・ガス・水道設備、鉄道施設等の詳細範囲を定めた条文。"
