article_title: "第百十五条の二"
article_caption: "（防火壁又は防火床の設置を要しない建築物に関する技術的基準等）"
description: "延べ面積1000平方メートルを超える大規模な木造建築物等において、防火壁又は防火床の設置が免除されるための詳細な技術的基準（階数・床面積割合、防火構造、火気使用室の区画、構造計算等）を定めた条文。"
