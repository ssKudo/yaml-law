article_title: "第百三十条の三"
article_caption: "（第一種低層住居専用地域内に建築することができる兼用住宅）"
description: "第一種低層住居専用地域内に新築できる兼用住宅について、居住部分の床面積割合（全体の1/2以上）、兼用する特定用途（事務所、日用品店舗、理美容店、学習塾など）の範囲、及び店舗部分の床面積制限（50平方メートル以下）などの要件を定めた条文。"
