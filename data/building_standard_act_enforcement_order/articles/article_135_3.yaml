article_caption: "（隣地との関係についての建築物の各部分の高さの制限の緩和）"
description: "隣地境界線との関係における建築物の高さの制限（隣地斜線制限）について、隣地境界線の外側にある水面、線路敷地、広場、公園、又は隣地高低差がある場合における斜線制限の緩和措置を定めた条文。"
