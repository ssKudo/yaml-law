article_caption: "（耐火建築物等としなければならない特殊建築物関係）"
description: "既存不適格建築物の増築等において、火気を使用する室等についてスプリンクラーや不燃材料仕上げ等の防火上必要な措置を講じた場合に、その他の構造制限を緩和する基準を定めた条文。"
