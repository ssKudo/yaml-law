article_caption: "（田園住居地域内に建築してはならない建築物）"
description: "準工業地域、商業地域、又は工業地域において、原則として建築してはならない特定の工場・危険物施設（爆薬、塩素、亜硫酸等の危険物製造・貯蔵など）の範囲を定めた条文。"
