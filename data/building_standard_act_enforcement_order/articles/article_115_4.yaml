article_num: "115_4"
article_title: "第百十五条の四"
article_caption: "（自動車車庫等の用途に供してはならない準耐火建築物）"
description: "火災拡大を防止するため、主要構造部が準耐火構造であっても自動車車庫や自動車修理工場の用途に供してはならない、耐火性能が一部不十分な準耐火建築物の区分を定めた条文。"
