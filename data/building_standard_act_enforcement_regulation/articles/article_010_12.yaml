article_title: "第十条の十二"
article_caption: "（死亡等の届出）"
description: "建築基準適合判定資格者が死亡、あるいは欠格事由への該当や精神機能障害の状態になった際に、相続人や本人等の届出義務者、必要となる届出様式および医師の診断書などの添付書類について規定しています。"
