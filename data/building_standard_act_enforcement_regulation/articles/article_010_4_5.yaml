article_title: "第十条の四の五"
article_caption: "（市街地の環境を害するおそれがない機械室等の基準）"
description: "容積率不算入の対象となる機械室等の設置基準として、敷地が接する道路幅員（8メートル以上）、敷地面積（1000平方メートル以上）、および延べ面積に対する機械室等の床面積比率などを規定しています。"
