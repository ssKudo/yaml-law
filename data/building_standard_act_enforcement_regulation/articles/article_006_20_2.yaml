article_caption: "（心身の故障により認知等を適切に行うことができない状態となつた場合の届出）"
description: "特定建築物調査員が心身 of 故障等により業務継続が困難な精神状態になった際に、本人や法定代理人が医師の診断書を添えて届け出る義務（別記第三十七号の八の二様式）を定めています。"
