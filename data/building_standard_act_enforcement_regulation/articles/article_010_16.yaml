article_caption: "（一の敷地とみなすこと等による制限の緩和に係る認定又は許可の申請等）"
description: "複数の建築物を一の敷地とみなして規制を緩和する認定または許可の申請に必要な書類（付近見取図、配置図、計画書等）や、関係権利者の同意書、特定行政庁による決定通知の手続を定めています。"
