article_caption: "（全体計画の変更に係る認定を要しない軽微な変更）"
description: "全体計画認定を受けた計画の変更のうち、変更後も建築基準に適合することが明らかな変更や、工事の着手・完了予定日の3ヶ月以内の変更など、変更認定を必要としない軽微な変更の範囲を規定しています。"
