article_title: "第十条の四の十五"
article_caption: "（高度地区内における建築物の高さの制限の緩和を受ける構造上やむを得ない建築物）"
description: "高度地区内において高さの最高限度の緩和が認められる建築物として、省エネ改修や再生可能エネルギー設備の導入等の工事を行うことにより、その最高限度を超える必要最小限の建築物を規定しています。"
