article_caption: "（主要構造部のうち防火上及び避難上支障がない部分の位置等の表示）"
description: "建築基準法施行令に基づき、主要構造部のうち防火上および避難上支障がないと認められる部分を有する建築物において、その部分の位置等を出入口などの見やすい場所に表示することを義務付けています。"
