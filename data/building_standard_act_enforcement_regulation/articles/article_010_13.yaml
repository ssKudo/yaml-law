article_title: "第十条の十三"
article_caption: "（登録の消除の申請及び登録証の返納）"
description: "建築基準適合判定資格者が自主的に登録消除を申請する際の手続と、死亡や処分等により登録が消除された場合に登録証を10日以内に国土交通大臣に返納する義務を規定しています。"
