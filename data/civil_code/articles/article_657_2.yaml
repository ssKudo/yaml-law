article_title: "第六百五十七条の二"
article_caption: "（寄託物受取り前の寄託者による寄託の解除等）"
description: "民法の第六百五十七条の二は「寄託物受取り前の寄託者による寄託の解除等」を定める。 本文冒頭: 寄託者は、受寄者が寄託物を受け取るまで、契約の解除をすることができる。"
