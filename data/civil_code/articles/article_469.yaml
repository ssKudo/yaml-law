article_title: "第四百六十九条"
article_caption: "（債権の譲渡における相殺権）"
description: "民法の第四百六十九条は「債権の譲渡における相殺権」を定める。 本文冒頭: 債務者は、対抗要件具備時より前に取得した譲渡人に対する債権による相殺をもって譲受人に対抗することができる。"
