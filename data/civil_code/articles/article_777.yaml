article_title: "第七百七十七条"
article_caption: "（嫡出否認の訴えの出訴期間）"
description: "民法の第七百七十七条は「嫡出否認の訴えの出訴期間」を定める。 本文冒頭: 次の各号に掲げる否認権の行使に係る嫡出否認の訴えは、それぞれ当該各号に定める時から三年以内に提起しなければならない。"
