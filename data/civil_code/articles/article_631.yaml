article_title: "第六百三十一条"
article_caption: "（使用者についての破産手続の開始による解約の申入れ）"
description: "民法の第六百三十一条は「使用者についての破産手続の開始による解約の申入れ」を定める。 本文冒頭: 使用者が破産手続開始の決定を受けた場合には、雇用に期間の定めがあるときであっても、労働者又は破産管財人は、第六百二十七条の規定により解約の申入れをすることができる。"
