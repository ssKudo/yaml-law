article_caption: "（遺言執行者の権利義務）"
description: "民法の第千十二条は「遺言執行者の権利義務」を定める。 本文冒頭: 遺言執行者は、遺言の内容を実現するため、相続財産の管理その他遺言の執行に必要な一切の行為をする権利義務を有する。"
