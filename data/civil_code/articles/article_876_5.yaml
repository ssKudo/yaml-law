article_num: "876_5"
article_title: "第八百七十六条の五"
article_caption: "（保佐の事務及び保佐人の任務の終了等）"
description: "民法の第八百七十六条の五は「保佐の事務及び保佐人の任務の終了等」を定める。 本文冒頭: 保佐人は、保佐の事務を行うに当たっては、被保佐人の意思を尊重し、かつ、その心身の状態及び生活の状況に配慮しなければならない。"
