article_caption: "（供託物の取戻し）"
description: "民法の第四百九十六条は「供託物の取戻し」を定める。 本文冒頭: 債権者が供託を受諾せず、又は供託を有効と宣告した判決が確定しない間は、弁済者は、供託物を取り戻すことができる。"
