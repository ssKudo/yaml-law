article_title: "第三百九十五条"
article_caption: "（抵当建物使用者の引渡しの猶予）"
description: "民法の第三百九十五条は「抵当建物使用者の引渡しの猶予」を定める。 本文冒頭: 抵当権者に対抗することができない賃貸借により抵当権の目的である建物の使用又は収益をする者であって次に掲げるもの（次項において「抵当建物使用者」という。）は、その建物の競売における買受人の買受けの時から六箇月を経過するまでは、その建物を買受人に引き渡すことを要しない。"
