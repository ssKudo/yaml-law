article_title: "第五百二十条の十五"
article_caption: "（記名式所持人払証券の善意取得）"
description: "民法の第五百二十条の十五は「記名式所持人払証券の善意取得」を定める。 本文冒頭: 何らかの事由により記名式所持人払証券の占有を失った者がある場合において、その所持人が前条の規定によりその権利を証明するときは、その所持人は、その証券を返還する義務を負わない。"
