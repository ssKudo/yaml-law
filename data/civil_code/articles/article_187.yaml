article_title: "第百八十七条"
article_caption: "（占有の承継）"
description: "民法の第百八十七条は「占有の承継」を定める。 本文冒頭: 占有者の承継人は、その選択に従い、自己の占有のみを主張し、又は自己の占有に前の占有者の占有を併せて主張することができる。"
