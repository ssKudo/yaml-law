article_title: "第六百七条"
article_caption: "（賃借人の意思に反する保存行為）"
description: "民法の第六百七条は「賃借人の意思に反する保存行為」を定める。 本文冒頭: 賃貸人が賃借人の意思に反して保存行為をしようとする場合において、そのために賃借人が賃借をした目的を達することができなくなるときは、賃借人は、契約の解除をすることができる。"
