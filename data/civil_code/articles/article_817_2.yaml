article_title: "第八百十七条の二"
article_caption: "（特別養子縁組の成立）"
description: "民法の第八百十七条の二は「特別養子縁組の成立」を定める。 本文冒頭: 家庭裁判所は、次条から第八百十七条の七までに定める要件があるときは、養親となる者の請求により、実方の血族との親族関係が終了する縁組（以下この款において「特別養子縁組」という。）を成立させることができる。"
