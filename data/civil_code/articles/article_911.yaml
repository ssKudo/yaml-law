article_caption: "（共同相続人間の担保責任）"
description: "民法の第九百十一条は「共同相続人間の担保責任」を定める。 本文冒頭: 各共同相続人は、他の共同相続人に対して、売主と同じく、その相続分に応じて担保の責任を負う。"
