article_caption: "（期間の定めのない賃貸借の解約の申入れ）"
description: "民法の第六百十七条は「期間の定めのない賃貸借の解約の申入れ」を定める。 本文冒頭: 当事者が賃貸借の期間を定めなかったときは、各当事者は、いつでも解約の申入れをすることができる。"
