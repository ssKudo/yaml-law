article_title: "第六百九十三条"
article_caption: "（終身定期金債権の存続の宣告）"
description: "民法の第六百九十三条は「終身定期金債権の存続の宣告」を定める。 本文冒頭: 終身定期金債務者の責めに帰すべき事由によって第六百八十九条に規定する死亡が生じたときは、裁判所は、終身定期金債権者又はその相続人の請求により、終身定期金債権が相当の期間存続することを宣告することができる。"
