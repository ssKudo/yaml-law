article_title: "第四百十七条の二"
article_caption: "（中間利息の控除）"
description: "民法の第四百十七条の二は「中間利息の控除」を定める。 本文冒頭: 将来において取得すべき利益についての損害賠償の額を定める場合において、その利益を取得すべき時までの利息相当額を控除するときは、その損害賠償の請求権が生じた時点における法定利率により、これをする。"
