article_title: "第七百七十三条"
article_caption: "（父を定めることを目的とする訴え）"
description: "民法の第七百七十三条は「父を定めることを目的とする訴え」を定める。 本文冒頭: 第七百三十二条の規定に違反して婚姻をした女が出産した場合において、前条の規定によりその子の父を定めることができないときは、裁判所が、これを定める。"
