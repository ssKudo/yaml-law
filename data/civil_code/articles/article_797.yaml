article_caption: "（十五歳未満の者を養子とする縁組）"
description: "民法の第七百九十七条は「十五歳未満の者を養子とする縁組」を定める。 本文冒頭: 養子となる者が十五歳未満であるときは、その法定代理人が、これに代わって、縁組の承諾をすることができる。"
