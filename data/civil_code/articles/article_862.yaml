article_title: "第八百六十二条"
article_caption: "（後見人の報酬）"
description: "民法の第八百六十二条は「後見人の報酬」を定める。 本文冒頭: 家庭裁判所は、後見人及び被後見人の資力その他の事情によって、被後見人の財産の中から、相当な報酬を後見人に与えることができる。"
