article_title: "第二百五十九条"
article_caption: "（共有に関する債権の弁済）"
description: "民法の第二百五十九条は「共有に関する債権の弁済」を定める。 本文冒頭: 共有者の一人が他の共有者に対して共有に関する債権を有するときは、分割に際し、債務者に帰属すべき共有物の部分をもって、その弁済に充てることができる。"
