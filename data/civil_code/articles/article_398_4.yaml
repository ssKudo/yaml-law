article_title: "第三百九十八条の四"
article_caption: "（根抵当権の被担保債権の範囲及び債務者の変更）"
description: "民法の第三百九十八条の四は「根抵当権の被担保債権の範囲及び債務者の変更」を定める。 本文冒頭: 元本の確定前においては、根抵当権の担保すべき債権の範囲の変更をすることができる。"
