article_num: "907"
article_title: "第九百七条"
article_caption: "（遺産の分割の協議又は審判）"
description: "民法の第九百七条は「遺産の分割の協議又は審判」を定める。 本文冒頭: 共同相続人は、次条第一項の規定により被相続人が遺言で禁じた場合又は同条第二項の規定により分割をしない旨の契約をした場合を除き、いつでも、その協議で、遺産の全部又は一部の分割をすることができる。"
