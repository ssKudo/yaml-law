article_caption: "（債権者代位権の要件）"
description: "民法の第四百二十三条は「債権者代位権の要件」を定める。 本文冒頭: 債権者は、自己の債権を保全するため必要があるときは、債務者に属する権利（以下「被代位権利」という。）を行使することができる。"
