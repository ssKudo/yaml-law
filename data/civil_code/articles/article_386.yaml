article_title: "第三百八十六条"
article_caption: "（抵当権消滅請求の効果）"
description: "民法の第三百八十六条は「抵当権消滅請求の効果」を定める。 本文冒頭: 登記をしたすべての債権者が抵当不動産の第三取得者の提供した代価又は金額を承諾し、かつ、抵当不動産の第三取得者がその承諾を得た代価又は金額を払い渡し又は供託したときは、抵当権は、消滅する。"
