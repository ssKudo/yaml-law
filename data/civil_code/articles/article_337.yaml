article_caption: "（不動産保存の先取特権の登記）"
description: "民法の第三百三十七条は「不動産保存の先取特権の登記」を定める。 本文冒頭: 不動産の保存の先取特権の効力を保存するためには、保存行為が完了した後直ちに登記をしなければならない。"
