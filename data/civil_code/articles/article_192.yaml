article_caption: "（即時取得）"
description: "民法の第百九十二条は「即時取得」を定める。 本文冒頭: 取引行為によって、平穏に、かつ、公然と動産の占有を始めた者は、善意であり、かつ、過失がないときは、即時にその動産について行使する権利を取得する。"
