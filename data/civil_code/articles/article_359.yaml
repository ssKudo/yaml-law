article_title: "第三百五十九条"
article_caption: "（設定行為に別段の定めがある場合等）"
description: "民法の第三百五十九条は「設定行為に別段の定めがある場合等」を定める。 本文冒頭: 前三条の規定は、設定行為に別段の定めがあるとき、又は担保不動産収益執行（民事執行法第百八十条第二号に規定する担保不動産収益執行をいう。以下同じ。）の開始があったときは、適用しない。"
