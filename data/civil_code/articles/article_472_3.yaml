article_caption: "（免責的債務引受における引受人の求償権）"
description: "民法の第四百七十二条の三は「免責的債務引受における引受人の求償権」を定める。 本文冒頭: 免責的債務引受の引受人は、債務者に対して求償権を取得しない。"
