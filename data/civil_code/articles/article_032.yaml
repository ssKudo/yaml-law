article_title: "第三十二条"
article_caption: "（失踪の宣告の取消し）"
description: "民法の第三十二条は「失踪の宣告の取消し」を定める。 本文冒頭: 失踪者が生存すること又は前条に規定する時と異なる時に死亡したことの証明があったときは、家庭裁判所は、本人又は利害関係人の請求により、失踪の宣告を取り消さなければならない。"
