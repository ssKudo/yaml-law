article_caption: "（農業労務の先取特権）"
description: "民法の第三百二十三条は「農業労務の先取特権」を定める。 本文冒頭: 農業の労務の先取特権は、その労務に従事する者の最後の一年間の賃金に関し、その労務によって生じた果実について存在する。"
