article_title: "第百九条"
article_caption: "（代理権授与の表示による表見代理等）"
description: "民法の第百九条は「代理権授与の表示による表見代理等」を定める。 本文冒頭: 第三者に対して他人に代理権を与えた旨を表示した者は、その代理権の範囲内においてその他人が第三者との間でした行為について、その責任を負う。"
