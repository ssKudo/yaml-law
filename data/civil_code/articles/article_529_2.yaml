article_title: "第五百二十九条の二"
article_caption: "（指定した行為をする期間の定めのある懸賞広告）"
description: "民法の第五百二十九条の二は「指定した行為をする期間の定めのある懸賞広告」を定める。 本文冒頭: 懸賞広告者は、その指定した行為をする期間を定めてした広告を撤回することができない。"
