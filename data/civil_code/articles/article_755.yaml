article_caption: "（夫婦の財産関係）"
description: "民法の第七百五十五条は「夫婦の財産関係」を定める。 本文冒頭: 夫婦が、婚姻の届出前に、その財産について別段の契約をしなかったときは、その財産関係は、次款に定めるところによる。"
