article_title: "第百六十九条"
article_caption: "（判決で確定した権利の消滅時効）"
description: "民法の第百六十九条は「判決で確定した権利の消滅時効」を定める。 本文冒頭: 確定判決又は確定判決と同一の効力を有するものによって確定した権利については、十年より短い時効期間の定めがあるものであっても、その時効期間は、十年とする。"
