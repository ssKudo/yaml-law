article_title: "第四百六十五条"
article_caption: "（共同保証人間の求償権）"
description: "民法の第四百六十五条は「共同保証人間の求償権」を定める。 本文冒頭: 第四百四十二条から第四百四十四条までの規定は、数人の保証人がある場合において、そのうちの一人の保証人が、主たる債務が不可分であるため又は各保証人が全額を弁済すべき旨の特約があるため、その全額又は自己の負担部分を超える額を弁済したときについて準用する。"
