article_title: "第四百六十四条"
article_caption: "（連帯債務又は不可分債務の保証人の求償権）"
description: "民法の第四百六十四条は「連帯債務又は不可分債務の保証人の求償権」を定める。 本文冒頭: 連帯債務者又は不可分債務者の一人のために保証をした者は、他の債務者に対し、その負担部分のみについて求償権を有する。"
