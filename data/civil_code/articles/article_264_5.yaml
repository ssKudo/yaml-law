article_title: "第二百六十四条の五"
article_caption: "（所有者不明土地管理人の義務）"
description: "民法の第二百六十四条の五は「所有者不明土地管理人の義務」を定める。 本文冒頭: 所有者不明土地管理人は、所有者不明土地等の所有者（その共有持分を有する者を含む。）のために、善良な管理者の注意をもって、その権限を行使しなければならない。"
