article_title: "第五百七十七条"
article_caption: "（抵当権等の登記がある場合の買主による代金の支払の拒絶）"
description: "民法の第五百七十七条は「抵当権等の登記がある場合の買主による代金の支払の拒絶」を定める。 本文冒頭: 買い受けた不動産について契約の内容に適合しない抵当権の登記があるときは、買主は、抵当権消滅請求の手続が終わるまで、その代金の支払を拒むことができる。"
