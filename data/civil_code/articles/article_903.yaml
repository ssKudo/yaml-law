article_title: "第九百三条"
article_caption: "（特別受益者の相続分）"
description: "民法の第九百三条は「特別受益者の相続分」を定める。 本文冒頭: 共同相続人中に、被相続人から、遺贈を受け、又は婚姻若しくは養子縁組のため若しくは生計の資本として贈与を受けた者があるときは、被相続人が相続開始の時において有した財産の価額にその贈与の価額を加えたものを相続財産とみなし、第九百条から第九百二条までの規定により算定した相続分の中からその遺贈又は贈与の価額を控除した残額をもってその者の相続分とする。"
