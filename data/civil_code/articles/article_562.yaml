article_title: "第五百六十二条"
article_caption: "（買主の追完請求権）"
description: "民法の第五百六十二条は「買主の追完請求権」を定める。 本文冒頭: 引き渡された目的物が種類、品質又は数量に関して契約の内容に適合しないものであるときは、買主は、売主に対し、目的物の修補、代替物の引渡し又は不足分の引渡しによる履行の追完を請求することができる。"
