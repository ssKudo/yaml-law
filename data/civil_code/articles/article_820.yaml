article_title: "第八百二十条"
article_caption: "（監護及び教育の権利義務）"
description: "民法の第八百二十条は「監護及び教育の権利義務」を定める。 本文冒頭: 親権を行う者は、子の利益のために子の監護及び教育をする権利を有し、義務を負う。"
