article_title: "第七百四十七条"
article_caption: "（詐欺又は強迫による婚姻の取消し）"
description: "民法の第七百四十七条は「詐欺又は強迫による婚姻の取消し」を定める。 本文冒頭: 詐欺又は強迫によって婚姻をした者は、その婚姻の取消しを家庭裁判所に請求することができる。"
