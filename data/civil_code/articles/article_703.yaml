article_title: "第七百三条"
article_caption: "（不当利得の返還義務）"
description: "民法の第七百三条は「不当利得の返還義務」を定める。 本文冒頭: 法律上の原因なく他人の財産又は労務によって利益を受け、そのために他人に損失を及ぼした者（以下この章において「受益者」という。）は、その利益の存する限度において、これを返還する義務を負う。"
