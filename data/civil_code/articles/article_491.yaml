article_num: "491"
article_title: "第四百九十一条"
article_caption: "（数個の給付をすべき場合の充当）"
description: "民法の第四百九十一条は「数個の給付をすべき場合の充当」を定める。 本文冒頭: 一個の債務の弁済として数個の給付をすべき場合において、弁済をする者がその債務の全部を消滅させるのに足りない給付をしたときは、前三条の規定を準用する。"
