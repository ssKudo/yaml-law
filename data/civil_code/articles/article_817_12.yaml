article_title: "第八百十七条の十二"
article_caption: "（親の責務等）"
description: "民法の第八百十七条の十二は「親の責務等」を定める。 本文冒頭: 父母は、子の心身の健全な発達を図るため、その子の人格を尊重するとともに、その子の年齢及び発達の程度に配慮してその子を養育しなければならず、かつ、その子が自己と同程度の生活を維持することができるよう扶養しなければならない。"
