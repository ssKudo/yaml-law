article_title: "第二百五十二条"
article_caption: "（共有物の管理）"
description: "民法の第二百五十二条は「共有物の管理」を定める。 本文冒頭: 共有物の管理に関する事項（次条第一項に規定する共有物の管理者の選任及び解任を含み、共有物に前条第一項に規定する変更を加えるものを除く。次項において同じ。）は、各共有者の持分の価格に従い、その過半数で決する。"
