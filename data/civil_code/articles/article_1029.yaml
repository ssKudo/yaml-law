description: "民法の第千二十九条は「審判による配偶者居住権の取得」を定める。 本文冒頭: 遺産の分割の請求を受けた家庭裁判所は、次に掲げる場合に限り、配偶者が配偶者居住権を取得する旨を定めることができる。"
