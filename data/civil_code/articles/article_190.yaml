article_title: "第百九十条"
article_caption: "（悪意の占有者による果実の返還等）"
description: "民法の第百九十条は「悪意の占有者による果実の返還等」を定める。 本文冒頭: 悪意の占有者は、果実を返還し、かつ、既に消費し、過失によって損傷し、又は収取を怠った果実の代価を償還する義務を負う。"
