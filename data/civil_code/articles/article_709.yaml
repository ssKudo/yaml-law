article_title: "第七百九条"
article_caption: "（不法行為による損害賠償）"
description: "民法の第七百九条は「不法行為による損害賠償」を定める。 本文冒頭: 故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。"
