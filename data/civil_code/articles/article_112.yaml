article_title: "第百十二条"
article_caption: "（代理権消滅後の表見代理等）"
description: "民法の第百十二条は「代理権消滅後の表見代理等」を定める。 本文冒頭: 他人に代理権を与えた者は、代理権の消滅後にその代理権の範囲内においてその他人が第三者との間でした行為について、代理権の消滅の事実を知らなかった第三者に対してその責任を負う。"
