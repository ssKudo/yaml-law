article_caption: "（所有権の取得時効）"
description: "民法の第百六十二条は「所有権の取得時効」を定める。 本文冒頭: 二十年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。"
