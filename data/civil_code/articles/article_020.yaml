article_title: "第二十条"
article_caption: "（制限行為能力者の相手方の催告権）"
description: "民法の第二十条は「制限行為能力者の相手方の催告権」を定める。 本文冒頭: 制限行為能力者の相手方は、その制限行為能力者が行為能力者（行為能力の制限を受けない者をいう。以下同じ。）となった後、その者に対し、一箇月以上の期間を定めて、その期間内にその取り消すことができる行為を追認するかどうかを確答すべき旨の催告をすることができる。"
