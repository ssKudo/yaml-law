article_title: "第八百三十七条"
article_caption: "（親権又は管理権の辞任及び回復）"
description: "民法の第八百三十七条は「親権又は管理権の辞任及び回復」を定める。 本文冒頭: 親権を行う父又は母は、やむを得ない事由があるときは、家庭裁判所の許可を得て、親権又は管理権を辞することができる。"
