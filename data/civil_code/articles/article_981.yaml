article_num: "981"
article_title: "第九百八十一条"
article_caption: "（署名又は押印が不能の場合）"
description: "民法の第九百八十一条は「署名又は押印が不能の場合」を定める。 本文冒頭: 第九百七十七条から第九百七十九条までの場合において、署名又は印を押すことのできない者があるときは、立会人又は証人は、その事由を付記しなければならない。"
