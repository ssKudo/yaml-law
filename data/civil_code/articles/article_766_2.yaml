article_title: "第七百六十六条の二"
article_caption: "（審判による父母以外の親族と子との交流の定め）"
description: "民法の第七百六十六条の二は「審判による父母以外の親族と子との交流の定め」を定める。 本文冒頭: 家庭裁判所は、前条第二項又は第三項の場合において、子の利益のため特に必要があると認めるときは、同条第一項に規定する子の監護について必要な事項として父母以外の親族と子との交流を実施する旨を定めることができる。"
