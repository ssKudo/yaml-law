article_title: "第八百四十五条"
article_caption: "（辞任した後見人による新たな後見人の選任の請求）"
description: "民法の第八百四十五条は「辞任した後見人による新たな後見人の選任の請求」を定める。 本文冒頭: 後見人がその任務を辞したことによって新たに後見人を選任する必要が生じたときは、その後見人は、遅滞なく新たな後見人の選任を家庭裁判所に請求しなければならない。"
