article_num: "465_3"
article_title: "第四百六十五条の三"
article_caption: "（個人貸金等根保証契約の元本確定期日）"
description: "民法の第四百六十五条の三は「個人貸金等根保証契約の元本確定期日」を定める。 本文冒頭: 個人根保証契約であってその主たる債務の範囲に金銭の貸渡し又は手形の割引を受けることによって負担する債務（以下「貸金等債務」という。）が含まれるもの（以下「個人貸金等根保証契約」という。）において主たる債務の元本の確定すべき期日（以下「元本確定期日」という。）の定めがある場合において、その元本確定期日がその個人貸金等根保証契約の締結の日から五年を経過する日より…"
