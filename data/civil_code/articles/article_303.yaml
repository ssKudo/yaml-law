article_caption: "（先取特権の内容）"
description: "民法の第三百三条は「先取特権の内容」を定める。 本文冒頭: 先取特権者は、この法律その他の法律の規定に従い、その債務者の財産について、他の債権者に先立って自己の債権の弁済を受ける権利を有する。"
