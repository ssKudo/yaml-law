article_title: "第三百九十八条の十六"
article_caption: "（共同根抵当）"
description: "民法の第三百九十八条の十六は「共同根抵当」を定める。 本文冒頭: 第三百九十二条及び第三百九十三条の規定は、根抵当権については、その設定と同時に同一の債権の担保として数個の不動産につき根抵当権が設定された旨の登記をした場合に限り、適用する。"
