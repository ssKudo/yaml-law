article_title: "第六百五条の二"
article_caption: "（不動産の賃貸人たる地位の移転）"
description: "民法の第六百五条の二は「不動産の賃貸人たる地位の移転」を定める。 本文冒頭: 前条、借地借家法（平成三年法律第九十号）第十条又は第三十一条その他の法令の規定による賃貸借の対抗要件を備えた場合において、その不動産が譲渡されたときは、その不動産の賃貸人たる地位は、その譲受人に移転する。"
