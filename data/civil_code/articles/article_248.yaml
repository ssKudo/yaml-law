article_title: "第二百四十八条"
article_caption: "（付合、混和又は加工に伴う償金の請求）"
description: "民法の第二百四十八条は「付合、混和又は加工に伴う償金の請求」を定める。 本文冒頭: 第二百四十二条から前条までの規定の適用によって損失を受けた者は、第七百三条及び第七百四条の規定に従い、その償金を請求することができる。"
