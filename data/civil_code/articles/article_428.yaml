article_title: "第四百二十八条"
article_caption: "（不可分債権）"
description: "民法の第四百二十八条は「不可分債権」を定める。 本文冒頭: 次款（連帯債権）の規定（第四百三十三条及び第四百三十五条の規定を除く。）は、債権の目的がその性質上不可分である場合において、数人の債権者があるときについて準用する。"
