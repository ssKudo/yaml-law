article_title: "第八百三十条"
article_caption: "（第三者が無償で子に与えた財産の管理）"
description: "民法の第八百三十条は「第三者が無償で子に与えた財産の管理」を定める。 本文冒頭: 無償で子に財産を与える第三者が、親権を行う父又は母にこれを管理させない意思を表示したときは、その財産は、父又は母の管理に属しないものとする。"
