article_caption: "（特定の債権者に対する担保の供与等の特則）"
description: "民法の第四百二十四条の三は「特定の債権者に対する担保の供与等の特則」を定める。 本文冒頭: 債務者がした既存の債務についての担保の供与又は債務の消滅に関する行為について、債権者は、次に掲げる要件のいずれにも該当する場合に限り、詐害行為取消請求をすることができる。"
