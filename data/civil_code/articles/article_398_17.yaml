article_title: "第三百九十八条の十七"
article_caption: "（共同根抵当の変更等）"
description: "民法の第三百九十八条の十七は「共同根抵当の変更等」を定める。 本文冒頭: 前条の登記がされている根抵当権の担保すべき債権の範囲、債務者若しくは極度額の変更又はその譲渡若しくは一部譲渡は、その根抵当権が設定されているすべての不動産について登記をしなければ、その効力を生じない。"
