article_title: "第四百五十六条"
article_caption: "（数人の保証人がある場合）"
description: "民法の第四百五十六条は「数人の保証人がある場合」を定める。 本文冒頭: 数人の保証人がある場合には、それらの保証人が各別の行為により債務を負担したときであっても、第四百二十七条の規定を適用する。"
