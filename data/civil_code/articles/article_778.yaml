description: "民法の第七百七十八条の規定。 本文冒頭: 一　第七百七十二条第四項の規定により読み替えられた同条第三項の規定により新たに子の父と定められた者の否認権　新たに子の父と定められた者が当該子に係る嫡出否認の裁判が確定したことを知った時 二　子の否認権　子が前号の裁判が確定したことを知った時 三　母の否認権　母が第一号の裁判が確定したことを知った時 四　前夫の否認権　前夫が第一号の裁判が確定したことを知った…"
