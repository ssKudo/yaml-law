article_title: "第七百六十六条"
article_caption: "（離婚後の子の監護に関する事項の定め等）"
description: "民法の第七百六十六条は「離婚後の子の監護に関する事項の定め等」を定める。 本文冒頭: 父母が協議上の離婚をするときは、子の監護をすべき者又は子の監護の分掌、父又は母と子との交流、子の監護に要する費用の分担その他の子の監護について必要な事項は、その協議で定める。"
