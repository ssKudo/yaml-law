article_num: "482"
article_title: "第四百八十二条"
article_caption: "（代物弁済）"
description: "民法の第四百八十二条は「代物弁済」を定める。 本文冒頭: 弁済をすることができる者（以下「弁済者」という。）が、債権者との間で、債務者の負担した給付に代えて他の給付をすることにより債務を消滅させる旨の契約をした場合において、その弁済者が当該他の給付をしたときは、その給付は、弁済と同一の効力を有する。"
