article_num: "821"
article_title: "第八百二十一条"
article_caption: "（子の人格の尊重等）"
description: "民法の第八百二十一条は「子の人格の尊重等」を定める。 本文冒頭: 親権を行う者は、前条の規定による監護及び教育をするに当たっては、子の人格を尊重するとともに、その年齢及び発達の程度に配慮しなければならず、かつ、体罰その他の子の心身の健全な発達に有害な影響を及ぼす言動をしてはならない。"
