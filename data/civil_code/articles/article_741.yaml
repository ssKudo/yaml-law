article_title: "第七百四十一条"
article_caption: "（外国に在る日本人間の婚姻の方式）"
description: "民法の第七百四十一条は「外国に在る日本人間の婚姻の方式」を定める。 本文冒頭: 外国に在る日本人間で婚姻をしようとするときは、その国に駐在する日本の大使、公使又は領事にその届出をすることができる。"
