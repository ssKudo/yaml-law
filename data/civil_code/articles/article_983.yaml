article_num: "983"
article_title: "第九百八十三条"
article_caption: "（特別の方式による遺言の効力）"
description: "民法の第九百八十三条は「特別の方式による遺言の効力」を定める。 本文冒頭: 第九百七十六条から前条までの規定によりした遺言は、遺言者が普通の方式によって遺言をすることができるようになった時から六箇月間生存するときは、その効力を生じない。"
