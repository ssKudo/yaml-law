article_title: "第七百十一条"
article_caption: "（近親者に対する損害の賠償）"
description: "民法の第七百十一条は「近親者に対する損害の賠償」を定める。 本文冒頭: 他人の生命を侵害した者は、被害者の父母、配偶者及び子に対しては、その財産権が侵害されなかった場合においても、損害の賠償をしなければならない。"
