article_title: "第七百二十九条"
article_caption: "（離縁による親族関係の終了）"
description: "民法の第七百二十九条は「離縁による親族関係の終了」を定める。 本文冒頭: 養子及びその配偶者並びに養子の直系卑属及びその配偶者と養親及びその血族との親族関係は、離縁によって終了する。"
