article_num: "398_22"
article_title: "第三百九十八条の二十二"
article_caption: "（根抵当権の消滅請求）"
description: "民法の第三百九十八条の二十二は「根抵当権の消滅請求」を定める。 本文冒頭: 元本の確定後において現に存する債務の額が根抵当権の極度額を超えるときは、他人の債務を担保するためその根抵当権を設定した者又は抵当不動産について所有権、地上権、永小作権若しくは第三者に対抗することができる賃借権を取得した第三者は、その極度額に相当する金額を払い渡し又は供託して、その根抵当権の消滅請求をすることができる。"
