article_title: "第九百七十二条"
article_caption: "（秘密証書遺言の方式の特則）"
description: "民法の第九百七十二条は「秘密証書遺言の方式の特則」を定める。 本文冒頭: 口がきけない者が秘密証書によって遺言をする場合には、遺言者は、公証人及び証人の前で、その証書は自己の遺言書である旨並びにその筆者の氏名及び住所を通訳人の通訳により申述し、又は封紙に自書して、第九百七十条第一項第三号の申述に代えなければならない。"
