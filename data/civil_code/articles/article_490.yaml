article_num: "490"
article_title: "第四百九十条"
article_caption: "（合意による弁済の充当）"
description: "民法の第四百九十条は「合意による弁済の充当」を定める。 本文冒頭: 前二条の規定にかかわらず、弁済をする者と弁済を受領する者との間に弁済の充当の順序に関する合意があるときは、その順序に従い、その弁済を充当する。"
