article_num: "949"
article_title: "第九百四十九条"
article_caption: "（財産分離の請求の防止等）"
description: "民法の第九百四十九条は「財産分離の請求の防止等」を定める。 本文冒頭: 相続人は、その固有財産をもって相続債権者若しくは受遺者に弁済をし、又はこれに相当の担保を供して、財産分離の請求を防止し、又はその効力を消滅させることができる。"
