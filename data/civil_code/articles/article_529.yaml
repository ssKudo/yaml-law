article_title: "第五百二十九条"
article_caption: "（懸賞広告）"
description: "民法の第五百二十九条は「懸賞広告」を定める。 本文冒頭: ある行為をした者に一定の報酬を与える旨を広告した者（以下「懸賞広告者」という。）は、その行為をした者がその広告を知っていたかどうかにかかわらず、その者に対してその報酬を与える義務を負う。"
