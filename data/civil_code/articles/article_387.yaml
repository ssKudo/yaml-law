article_title: "第三百八十七条"
article_caption: "（抵当権者の同意の登記がある場合の賃貸借の対抗力）"
description: "民法の第三百八十七条は「抵当権者の同意の登記がある場合の賃貸借の対抗力」を定める。 本文冒頭: 登記をした賃貸借は、その登記前に登記をした抵当権を有するすべての者が同意をし、かつ、その同意の登記があるときは、その同意をした抵当権者に対抗することができる。"
