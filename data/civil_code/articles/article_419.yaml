article_caption: "（金銭債務の特則）"
description: "民法の第四百十九条は「金銭債務の特則」を定める。 本文冒頭: 金銭の給付を目的とする債務の不履行については、その損害賠償の額は、債務者が遅滞の責任を負った最初の時点における法定利率によって定める。"
