article_title: "第二百八十二条"
article_caption: "（地役権の不可分性）"
description: "民法の第二百八十二条は「地役権の不可分性」を定める。 本文冒頭: 土地の共有者の一人は、その持分につき、その土地のために又はその土地について存する地役権を消滅させることができない。"
