article_title: "第九百三十二条"
article_caption: "（弁済のための相続財産の換価）"
description: "民法の第九百三十二条は「弁済のための相続財産の換価」を定める。 本文冒頭: 前三条の規定に従って弁済をするにつき相続財産を売却する必要があるときは、限定承認者は、これを競売に付さなければならない。"
