article_title: "第八百十七条の十"
article_caption: "（特別養子縁組の離縁）"
description: "民法の第八百十七条の十は「特別養子縁組の離縁」を定める。 本文冒頭: 次の各号のいずれにも該当する場合において、養子の利益のため特に必要があると認めるときは、家庭裁判所は、養子、実父母又は検察官の請求により、特別養子縁組の当事者を離縁させることができる。"
