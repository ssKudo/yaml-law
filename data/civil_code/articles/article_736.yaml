article_title: "第七百三十六条"
article_caption: "（養親子等の間の婚姻の禁止）"
description: "民法の第七百三十六条は「養親子等の間の婚姻の禁止」を定める。 本文冒頭: 養子若しくはその配偶者又は養子の直系卑属若しくはその配偶者と養親又はその直系尊属との間では、第七百二十九条の規定により親族関係が終了した後でも、婚姻をすることができない。"
