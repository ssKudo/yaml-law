article_title: "第六百九条"
article_caption: "（減収による賃料の減額請求）"
description: "民法の第六百九条は「減収による賃料の減額請求」を定める。 本文冒頭: 耕作又は牧畜を目的とする土地の賃借人は、不可抗力によって賃料より少ない収益を得たときは、その収益の額に至るまで、賃料の減額を請求することができる。"
