article_caption: "（消費寄託）"
description: "民法の第六百六十六条は「消費寄託」を定める。 本文冒頭: 受寄者が契約により寄託物を消費することができる場合には、受寄者は、寄託された物と種類、品質及び数量の同じ物をもって返還しなければならない。"
