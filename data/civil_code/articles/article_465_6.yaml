subsection: "第五款 保証債務"
division: "第三目 事業に係る債務についての保証契約の特則"
article_num: "465_6"
article_title: "第四百六十五条の六"
article_caption: "（公正証書の作成と保証の効力）"
description: "民法の第四百六十五条の六は「公正証書の作成と保証の効力」を定める。 本文冒頭: 事業のために負担した貸金等債務を主たる債務とする保証契約又は主たる債務の範囲に事業のために負担する貸金等債務が含まれる根保証契約は、その契約の締結に先立ち、その締結の日前一箇月以内に作成された公正証書で保証人になろうとする者が保証債務を履行する意思を表示していなければ、その効力を生じない。"
keywords: ["民法", "公正証書の作成と保証の効力"]
