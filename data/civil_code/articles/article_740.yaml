article_title: "第七百四十条"
article_caption: "（婚姻の届出の受理）"
description: "民法の第七百四十条は「婚姻の届出の受理」を定める。 本文冒頭: 婚姻の届出は、その婚姻が第七百三十一条、第七百三十二条、第七百三十四条から第七百三十六条まで及び前条第二項の規定その他の法令の規定に違反しないことを認めた後でなければ、受理することができない。"
