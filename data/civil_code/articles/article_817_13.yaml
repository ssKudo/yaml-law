article_title: "第八百十七条の十三"
article_caption: "（親子の交流等）"
description: "民法の第八百十七条の十三は「親子の交流等」を定める。 本文冒頭: 第七百六十六条（第七百四十九条、第七百七十一条及び第七百八十八条において準用する場合を含む。）の場合のほか、子と別居する父又は母その他の親族と当該子との交流について必要な事項は、父母の協議で定める。"
