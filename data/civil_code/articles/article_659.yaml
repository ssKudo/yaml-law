article_caption: "（無報酬の受寄者の注意義務）"
description: "民法の第六百五十九条は「無報酬の受寄者の注意義務」を定める。 本文冒頭: 無報酬の受寄者は、自己の財産に対するのと同一の注意をもって、寄託物を保管する義務を負う。"
