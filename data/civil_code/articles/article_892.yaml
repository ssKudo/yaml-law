article_num: "892"
article_title: "第八百九十二条"
article_caption: "（推定相続人の廃除）"
description: "民法の第八百九十二条は「推定相続人の廃除」を定める。 本文冒頭: 遺留分を有する推定相続人（相続が開始した場合に相続人となるべき者をいう。以下同じ。）が、被相続人に対して虐待をし、若しくはこれに重大な侮辱を加えたとき、又は推定相続人にその他の著しい非行があったときは、被相続人は、その推定相続人の廃除を家庭裁判所に請求することができる。"
