article_title: "第四百四十四条"
article_caption: "（償還をする資力のない者の負担部分の分担）"
description: "民法の第四百四十四条は「償還をする資力のない者の負担部分の分担」を定める。 本文冒頭: 連帯債務者の中に償還をする資力のない者があるときは、その償還をすることができない部分は、求償者及び他の資力のある者の間で、各自の負担部分に応じて分割して負担する。"
