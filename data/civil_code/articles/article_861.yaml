article_title: "第八百六十一条"
article_caption: "（支出金額の予定及び後見の事務の費用）"
description: "民法の第八百六十一条は「支出金額の予定及び後見の事務の費用」を定める。 本文冒頭: 後見人は、その就職の初めにおいて、被後見人の生活、教育又は療養看護及び財産の管理のために毎年支出すべき金額を予定しなければならない。"
