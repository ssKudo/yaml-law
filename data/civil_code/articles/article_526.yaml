article_num: "526"
article_title: "第五百二十六条"
article_caption: "（申込者の死亡等）"
description: "民法の第五百二十六条は「申込者の死亡等」を定める。 本文冒頭: 申込者が申込みの通知を発した後に死亡し、意思能力を有しない常況にある者となり、又は行為能力の制限を受けた場合において、申込者がその事実が生じたとすればその申込みは効力を有しない旨の意思を表示していたとき、又はその相手方が承諾の通知を発するまでにその事実が生じたことを知ったときは、その申込みは、その効力を有しない。"
