article_title: "第八百六十三条"
article_caption: "（後見の事務の監督）"
description: "民法の第八百六十三条は「後見の事務の監督」を定める。 本文冒頭: 後見監督人又は家庭裁判所は、いつでも、後見人に対し後見の事務の報告若しくは財産の目録の提出を求め、又は後見の事務若しくは被後見人の財産の状況を調査することができる。"
