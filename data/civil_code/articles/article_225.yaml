article_title: "第二百二十五条"
article_caption: "（囲障の設置）"
description: "民法の第二百二十五条は「囲障の設置」を定める。 本文冒頭: 二棟の建物がその所有者を異にし、かつ、その間に空地があるときは、各所有者は、他の所有者と共同の費用で、その境界に囲障を設けることができる。"
