article_title: "第二百十五条"
article_caption: "（水流の障害の除去）"
description: "民法の第二百十五条は「水流の障害の除去」を定める。 本文冒頭: 水流が天災その他避けることのできない事変により低地において閉塞そくしたときは、高地の所有者は、自己の費用で、水流の障害を除去するため必要な工事をすることができる。"
