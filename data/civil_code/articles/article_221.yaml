article_title: "第二百二十一条"
article_caption: "（通水用工作物の使用）"
description: "民法の第二百二十一条は「通水用工作物の使用」を定める。 本文冒頭: 土地の所有者は、その所有地の水を通過させるため、高地又は低地の所有者が設けた工作物を使用することができる。"
