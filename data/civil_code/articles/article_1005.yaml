article_caption: "（過料）"
description: "民法の第千五条は「過料」を定める。 本文冒頭: 前条の規定により遺言書を提出することを怠り、その検認を経ないで遺言を執行し、又は家庭裁判所外においてその開封をした者は、五万円以下の過料に処する。"
