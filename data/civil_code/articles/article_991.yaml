article_title: "第九百九十一条"
article_caption: "（受遺者による担保の請求）"
description: "民法の第九百九十一条は「受遺者による担保の請求」を定める。 本文冒頭: 受遺者は、遺贈が弁済期に至らない間は、遺贈義務者に対して相当の担保を請求することができる。"
