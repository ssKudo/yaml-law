article_title: "第九百九十四条"
article_caption: "（受遺者の死亡による遺贈の失効）"
description: "民法の第九百九十四条は「受遺者の死亡による遺贈の失効」を定める。 本文冒頭: 遺贈は、遺言者の死亡以前に受遺者が死亡したときは、その効力を生じない。"
