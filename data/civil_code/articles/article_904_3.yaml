article_title: "第九百四条の三"
article_caption: "（期間経過後の遺産の分割における相続分）"
description: "民法の第九百四条の三は「期間経過後の遺産の分割における相続分」を定める。 本文冒頭: 前三条の規定は、相続開始の時から十年を経過した後にする遺産の分割については、適用しない。"
