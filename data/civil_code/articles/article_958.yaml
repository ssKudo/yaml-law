article_title: "第九百五十八条"
article_caption: "（権利を主張する者がない場合）"
description: "民法の第九百五十八条は「権利を主張する者がない場合」を定める。 本文冒頭: 第九百五十二条第二項の期間内に相続人としての権利を主張する者がないときは、相続人並びに相続財産の清算人に知れなかった相続債権者及び受遺者は、その権利を行使することができない。"
