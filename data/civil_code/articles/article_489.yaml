article_num: "489"
article_title: "第四百八十九条"
article_caption: "（元本、利息及び費用を支払うべき場合の充当）"
description: "民法の第四百八十九条は「元本、利息及び費用を支払うべき場合の充当」を定める。 本文冒頭: 債務者が一個又は数個の債務について元本のほか利息及び費用を支払うべき場合（債務者が数個の債務を負担する場合にあっては、同一の債権者に対して同種の給付を目的とする数個の債務を負担するときに限る。）において、弁済をする者がその債務の全部を消滅させるのに足りない給付をしたときは、これを順次に費用、利息及び元本に充当しなければならない。"
