article_title: "第百五十三条"
article_caption: "（時効の完成猶予又は更新の効力が及ぶ者の範囲）"
description: "民法の第百五十三条は「時効の完成猶予又は更新の効力が及ぶ者の範囲」を定める。 本文冒頭: 第百四十七条又は第百四十八条の規定による時効の完成猶予又は更新は、完成猶予又は更新の事由が生じた当事者及びその承継人の間においてのみ、その効力を有する。"
