article_caption: "（記名式所持人払証券の所持人の権利の推定）"
description: "民法の第五百二十条の十四は「記名式所持人払証券の所持人の権利の推定」を定める。 本文冒頭: 記名式所持人払証券の所持人は、証券上の権利を適法に有するものと推定する。"
