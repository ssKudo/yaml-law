article_title: "第八百三十五条"
article_caption: "（管理権喪失の審判）"
description: "民法の第八百三十五条は「管理権喪失の審判」を定める。 本文冒頭: 父又は母による管理権の行使が困難又は不適当であることにより子の利益を害するときは、家庭裁判所は、子、その親族、未成年後見人、未成年後見監督人又は検察官の請求により、その父又は母について、管理権喪失の審判をすることができる。"
