article_title: "第三百四十二条"
article_caption: "（質権の内容）"
description: "民法の第三百四十二条は「質権の内容」を定める。 本文冒頭: 質権者は、その債権の担保として債務者又は第三者から受け取った物を占有し、かつ、その物について他の債権者に先立って自己の債権の弁済を受ける権利を有する。"
