article_caption: "（脱退した組合員の責任等）"
description: "民法の第六百八十条の二は「脱退した組合員の責任等」を定める。 本文冒頭: 脱退した組合員は、その脱退前に生じた組合の債務について、従前の責任の範囲内でこれを弁済する責任を負う。"
