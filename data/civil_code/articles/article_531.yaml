article_title: "第五百三十一条"
article_caption: "（懸賞広告の報酬を受ける権利）"
description: "民法の第五百三十一条は「懸賞広告の報酬を受ける権利」を定める。 本文冒頭: 広告に定めた行為をした者が数人あるときは、最初にその行為をした者のみが報酬を受ける権利を有する。"
