article_caption: "（受遺者に対する弁済）"
description: "民法の第九百三十一条は「受遺者に対する弁済」を定める。 本文冒頭: 限定承認者は、前二条の規定に従って各相続債権者に弁済をした後でなければ、受遺者に弁済をすることができない。"
