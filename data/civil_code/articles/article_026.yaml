article_num: "26"
article_title: "第二十六条"
article_caption: "（管理人の改任）"
description: "民法の第二十六条は「管理人の改任」を定める。 本文冒頭: 不在者が管理人を置いた場合において、その不在者の生死が明らかでないときは、家庭裁判所は、利害関係人又は検察官の請求により、管理人を改任することができる。"
