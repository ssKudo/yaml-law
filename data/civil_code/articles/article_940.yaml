article_title: "第九百四十条"
article_caption: "（相続の放棄をした者による管理）"
description: "民法の第九百四十条は「相続の放棄をした者による管理」を定める。 本文冒頭: 相続の放棄をした者は、その放棄の時に相続財産に属する財産を現に占有しているときは、相続人又は第九百五十二条第一項の相続財産の清算人に対して当該財産を引き渡すまでの間、自己の財産におけるのと同一の注意をもって、その財産を保存しなければならない。"
