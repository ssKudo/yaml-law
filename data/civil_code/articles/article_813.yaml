article_title: "第八百十三条"
article_caption: "（離縁の届出の受理）"
description: "民法の第八百十三条は「離縁の届出の受理」を定める。 本文冒頭: 離縁の届出は、その離縁が前条において準用する第七百三十九条第二項の規定並びに第八百十一条及び第八百十一条の二の規定その他の法令の規定に違反しないことを認めた後でなければ、受理することができない。"
