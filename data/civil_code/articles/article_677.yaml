article_title: "第六百七十七条"
article_caption: "（組合財産に対する組合員の債権者の権利の行使の禁止）"
description: "民法の第六百七十七条は「組合財産に対する組合員の債権者の権利の行使の禁止」を定める。 本文冒頭: 組合員の債権者は、組合財産についてその権利を行使することができない。"
