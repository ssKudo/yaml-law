article_title: "第四百八十一条"
article_caption: "（差押えを受けた債権の第三債務者の弁済）"
description: "民法の第四百八十一条は「差押えを受けた債権の第三債務者の弁済」を定める。 本文冒頭: 差押えを受けた債権の第三債務者が自己の債権者に弁済をしたときは、差押債権者は、その受けた損害の限度において更に弁済をすべき旨を第三債務者に請求することができる。"
