article_num: "717"
article_title: "第七百十七条"
article_caption: "（土地の工作物等の占有者及び所有者の責任）"
description: "民法の第七百十七条は「土地の工作物等の占有者及び所有者の責任」を定める。 本文冒頭: 土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じたときは、その工作物の占有者は、被害者に対してその損害を賠償する責任を負う。"
