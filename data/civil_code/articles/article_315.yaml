article_title: "第三百十五条"
article_caption: "（不動産賃貸の先取特権の被担保債権の範囲）"
description: "民法の第三百十五条は「不動産賃貸の先取特権の被担保債権の範囲」を定める。 本文冒頭: 賃借人の財産のすべてを清算する場合には、賃貸人の先取特権は、前期、当期及び次期の賃料その他の債務並びに前期及び当期に生じた損害の賠償債務についてのみ存在する。"
