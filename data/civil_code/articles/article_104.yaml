article_title: "第百四条"
article_caption: "（任意代理人による復代理人の選任）"
description: "民法の第百四条は「任意代理人による復代理人の選任」を定める。 本文冒頭: 委任による代理人は、本人の許諾を得たとき、又はやむを得ない事由があるときでなければ、復代理人を選任することができない。"
