article_title: "第六百二十六条"
article_caption: "（期間の定めのある雇用の解除）"
description: "民法の第六百二十六条は「期間の定めのある雇用の解除」を定める。 本文冒頭: 雇用の期間が五年を超え、又はその終期が不確定であるときは、当事者の一方は、五年を経過した後、いつでも契約の解除をすることができる。"
