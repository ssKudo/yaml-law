article_caption: "（直系尊属及び兄弟姉妹の相続権）"
description: "民法の第八百八十九条は「直系尊属及び兄弟姉妹の相続権」を定める。 本文冒頭: 次に掲げる者は、第八百八十七条の規定により相続人となるべき者がない場合には、次に掲げる順序の順位に従って相続人となる。"
