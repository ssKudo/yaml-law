article_caption: "（終身定期金契約）"
description: "民法の第六百八十九条は「終身定期金契約」を定める。 本文冒頭: 終身定期金契約は、当事者の一方が、自己、相手方又は第三者の死亡に至るまで、定期に金銭その他の物を相手方又は第三者に給付することを約することによって、その効力を生ずる。"
