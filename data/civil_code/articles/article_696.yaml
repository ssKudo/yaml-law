article_title: "第六百九十六条"
article_caption: "（和解の効力）"
description: "民法の第六百九十六条は「和解の効力」を定める。 本文冒頭: 当事者の一方が和解によって争いの目的である権利を有するものと認められ、又は相手方がこれを有しないものと認められた場合において、その当事者の一方が従来その権利を有していなかった旨の確証又は相手方がこれを有していた旨の確証が得られたときは、その権利は、和解によってその当事者の一方に移転し、又は消滅したものとする。"
