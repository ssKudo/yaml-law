article_caption: "（後見に関して生じた債権の消滅時効）"
description: "民法の第八百七十五条は「後見に関して生じた債権の消滅時効」を定める。 本文冒頭: 第八百三十二条の規定は、後見人又は後見監督人と被後見人との間において後見に関して生じた債権の消滅時効について準用する。"
