article_title: "第四百八十八条"
article_caption: "（同種の給付を目的とする数個の債務がある場合の充当）"
description: "民法の第四百八十八条は「同種の給付を目的とする数個の債務がある場合の充当」を定める。 本文冒頭: 債務者が同一の債権者に対して同種の給付を目的とする数個の債務を負担する場合において、弁済として提供した給付が全ての債務を消滅させるのに足りないとき（次条第一項に規定する場合を除く。）は、弁済をする者は、給付の時に、その弁済を充当すべき債務を指定することができる。"
