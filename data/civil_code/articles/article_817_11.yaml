article_title: "第八百十七条の十一"
article_caption: "（離縁による実方との親族関係の回復）"
description: "民法の第八百十七条の十一は「離縁による実方との親族関係の回復」を定める。 本文冒頭: 養子と実父母及びその血族との間においては、離縁の日から、特別養子縁組によって終了した親族関係と同一の親族関係を生ずる。"
