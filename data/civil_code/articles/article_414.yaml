article_num: "414"
article_title: "第四百十四条"
article_caption: "（履行の強制）"
description: "民法の第四百十四条は「履行の強制」を定める。 本文冒頭: 債務者が任意に債務の履行をしないときは、債権者は、民事執行法その他強制執行の手続に関する法令の規定に従い、直接強制、代替執行、間接強制その他の方法による履行の強制を裁判所に請求することができる。"
