article_title: "第八百一条"
article_caption: "（外国に在る日本人間の縁組の方式）"
description: "民法の第八百一条は「外国に在る日本人間の縁組の方式」を定める。 本文冒頭: 外国に在る日本人間で縁組をしようとするときは、その国に駐在する日本の大使、公使又は領事にその届出をすることができる。"
