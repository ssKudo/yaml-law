article_title: "第八百五十九条の二"
article_caption: "（成年後見人が数人ある場合の権限の行使等）"
description: "民法の第八百五十九条の二は「成年後見人が数人ある場合の権限の行使等」を定める。 本文冒頭: 成年後見人が数人あるときは、家庭裁判所は、職権で、数人の成年後見人が、共同して又は事務を分掌して、その権限を行使すべきことを定めることができる。"
