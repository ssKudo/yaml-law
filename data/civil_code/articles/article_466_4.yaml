article_title: "第四百六十六条の四"
article_caption: "（譲渡制限の意思表示がされた債権の差押え）"
description: "民法の第四百六十六条の四は「譲渡制限の意思表示がされた債権の差押え」を定める。 本文冒頭: 第四百六十六条第三項の規定は、譲渡制限の意思表示がされた債権に対する強制執行をした差押債権者に対しては、適用しない。"
