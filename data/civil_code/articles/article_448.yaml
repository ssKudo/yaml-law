article_title: "第四百四十八条"
article_caption: "（保証人の負担と主たる債務の目的又は態様）"
description: "民法の第四百四十八条は「保証人の負担と主たる債務の目的又は態様」を定める。 本文冒頭: 保証人の負担が債務の目的又は態様において主たる債務より重いときは、これを主たる債務の限度に減縮する。"
