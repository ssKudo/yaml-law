article_title: "第八百七条"
article_caption: "（養子が未成年者である場合の無許可縁組の取消し）"
description: "民法の第八百七条は「養子が未成年者である場合の無許可縁組の取消し」を定める。 本文冒頭: 第七百九十八条の規定に違反した縁組は、養子、その実方の親族又は養子に代わって縁組の承諾をした者から、その取消しを家庭裁判所に請求することができる。"
