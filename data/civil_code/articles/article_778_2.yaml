description: "民法の第七百七十八条の二の規定。 本文冒頭: ２子は、その父と継続して同居した期間（当該期間が二以上あるときは、そのうち最も長い期間）が三年を下回るときは、第七百七十七条（第二号に係る部分に限る。）及び前条（第二号に係る部分に限る。）の規定にかかわらず、二十一歳に達するまでの間、嫡出否認の訴えを提起することができる。"
