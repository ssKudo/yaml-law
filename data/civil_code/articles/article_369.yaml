article_caption: "（抵当権の内容）"
description: "民法の第三百六十九条は「抵当権の内容」を定める。 本文冒頭: 抵当権者は、債務者又は第三者が占有を移転しないで債務の担保に供した不動産について、他の債権者に先立って自己の債権の弁済を受ける権利を有する。"
