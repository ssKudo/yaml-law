article_title: "第四百三十二条"
article_caption: "（連帯債権者による履行の請求等）"
description: "民法の第四百三十二条は「連帯債権者による履行の請求等」を定める。 本文冒頭: 債権の目的がその性質上可分である場合において、法令の規定又は当事者の意思表示によって数人が連帯して債権を有するときは、各債権者は、全ての債権者のために全部又は一部の履行を請求することができ、債務者は、全ての債権者のために各債権者に対して履行をすることができる。"
