article_title: "第百三十条"
article_caption: "（条件の成就の妨害等）"
description: "民法の第百三十条は「条件の成就の妨害等」を定める。 本文冒頭: 条件が成就することによって不利益を受ける当事者が故意にその条件の成就を妨げたときは、相手方は、その条件が成就したものとみなすことができる。"
