article_title: "第四百七十八条"
article_caption: "（受領権者としての外観を有する者に対する弁済）"
description: "民法の第四百七十八条は「受領権者としての外観を有する者に対する弁済」を定める。 本文冒頭: 受領権者（債権者及び法令の規定又は当事者の意思表示によって弁済を受領する権限を付与された第三者をいう。以下同じ。）以外の者であって取引上の社会通念に照らして受領権者としての外観を有するものに対してした弁済は、その弁済をした者が善意であり、かつ、過失がなかったときに限り、その効力を有する。"
