article_title: "第七百六十六条の三"
article_caption: "（子の監護に要する費用の分担の定めがない場合の特例）"
description: "民法の第七百六十六条の三は「子の監護に要する費用の分担の定めがない場合の特例」を定める。 本文冒頭: 父母が子の監護に要する費用の分担についての定めをすることなく協議上の離婚をした場合には、父母の一方であって離婚の時から引き続きその子の監護を主として行うものは、他の一方に対し、離婚の日から、次に掲げる日のいずれか早い日までの間、毎月末に、その子の監護に要する費用の分担として、父母の扶養を受けるべき子の最低限度の生活の維持に要する標準的な費用の額その他の事情を…"
