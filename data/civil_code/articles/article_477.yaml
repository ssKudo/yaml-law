article_title: "第四百七十七条"
article_caption: "（預金又は貯金の口座に対する払込みによる弁済）"
description: "民法の第四百七十七条は「預金又は貯金の口座に対する払込みによる弁済」を定める。 本文冒頭: 債権者の預金又は貯金の口座に対する払込みによってする弁済は、債権者がその預金又は貯金に係る債権の債務者に対してその払込みに係る金額の払戻しを請求する権利を取得した時に、その効力を生ずる。"
