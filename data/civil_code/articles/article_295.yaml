article_caption: "（留置権の内容）"
description: "民法の第二百九十五条は「留置権の内容」を定める。 本文冒頭: 他人の物の占有者は、その物に関して生じた債権を有するときは、その債権の弁済を受けるまで、その物を留置することができる。"
