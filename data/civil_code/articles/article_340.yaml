article_title: "第三百四十条"
article_caption: "（不動産売買の先取特権の登記）"
description: "民法の第三百四十条は「不動産売買の先取特権の登記」を定める。 本文冒頭: 不動産の売買の先取特権の効力を保存するためには、売買契約と同時に、不動産の代価又はその利息の弁済がされていない旨を登記しなければならない。"
