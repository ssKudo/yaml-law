article_title: "第五百六十三条"
article_caption: "（買主の代金減額請求権）"
description: "民法の第五百六十三条は「買主の代金減額請求権」を定める。 本文冒頭: 前条第一項本文に規定する場合において、買主が相当の期間を定めて履行の追完の催告をし、その期間内に履行の追完がないときは、買主は、その不適合の程度に応じて代金の減額を請求することができる。"
