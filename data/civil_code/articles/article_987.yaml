article_title: "第九百八十七条"
article_caption: "（受遺者に対する遺贈の承認又は放棄の催告）"
description: "民法の第九百八十七条は「受遺者に対する遺贈の承認又は放棄の催告」を定める。 本文冒頭: 遺贈義務者（遺贈の履行をする義務を負う者をいう。以下この節において同じ。）その他の利害関係人は、受遺者に対し、相当の期間を定めて、その期間内に遺贈の承認又は放棄をすべき旨の催告をすることができる。"
