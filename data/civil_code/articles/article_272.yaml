article_title: "第二百七十二条"
article_caption: "（永小作権の譲渡又は土地の賃貸）"
description: "民法の第二百七十二条は「永小作権の譲渡又は土地の賃貸」を定める。 本文冒頭: 永小作人は、その権利を他人に譲り渡し、又はその権利の存続期間内において耕作若しくは牧畜のため土地を賃貸することができる。"
