article_caption: "（永小作権の消滅請求）"
description: "民法の第二百七十六条は「永小作権の消滅請求」を定める。 本文冒頭: 永小作人が引き続き二年以上小作料の支払を怠ったときは、土地の所有者は、永小作権の消滅を請求することができる。"
