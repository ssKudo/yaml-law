article_title: "第七百七十八条の三"
article_caption: "（子の監護に要した費用の償還の制限）"
description: "民法の第七百七十八条の三は「子の監護に要した費用の償還の制限」を定める。 本文冒頭: 第七百七十四条の規定により嫡出であることが否認された場合であっても、子は、父であった者が支出した子の監護に要した費用を償還する義務を負わない。"
