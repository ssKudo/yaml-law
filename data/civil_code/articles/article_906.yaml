article_title: "第九百六条"
article_caption: "（遺産の分割の基準）"
description: "民法の第九百六条は「遺産の分割の基準」を定める。 本文冒頭: 遺産の分割は、遺産に属する物又は権利の種類及び性質、各相続人の年齢、職業、心身の状態及び生活の状況その他一切の事情を考慮してこれをする。"
