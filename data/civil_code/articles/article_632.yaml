article_caption: "（請負）"
description: "民法の第六百三十二条は「請負」を定める。 本文冒頭: 請負は、当事者の一方がある仕事を完成することを約し、相手方がその仕事の結果に対してその報酬を支払うことを約することによって、その効力を生ずる。"
