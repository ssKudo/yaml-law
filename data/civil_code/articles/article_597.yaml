article_title: "第五百九十七条"
article_caption: "（期間満了等による使用貸借の終了）"
description: "民法の第五百九十七条は「期間満了等による使用貸借の終了」を定める。 本文冒頭: 当事者が使用貸借の期間を定めたときは、使用貸借は、その期間が満了することによって終了する。"
