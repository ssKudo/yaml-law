article_title: "第三百五十四条"
article_caption: "（動産質権の実行）"
description: "民法の第三百五十四条は「動産質権の実行」を定める。 本文冒頭: 動産質権者は、その債権の弁済を受けないときは、正当な理由がある場合に限り、鑑定人の評価に従い質物をもって直ちに弁済に充てることを裁判所に請求することができる。"
