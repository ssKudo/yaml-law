article_title: "第百七条"
article_caption: "（代理権の濫用）"
description: "民法の第百七条は「代理権の濫用」を定める。 本文冒頭: 代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合において、相手方がその目的を知り、又は知ることができたときは、その行為は、代理権を有しない者がした行為とみなす。"
