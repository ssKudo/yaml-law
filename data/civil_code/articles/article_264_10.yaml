article_title: "第二百六十四条の十"
article_caption: "（管理不全土地管理人の権限）"
description: "民法の第二百六十四条の十は「管理不全土地管理人の権限」を定める。 本文冒頭: 管理不全土地管理人は、管理不全土地管理命令の対象とされた土地及び管理不全土地管理命令の効力が及ぶ動産並びにその管理、処分その他の事由により管理不全土地管理人が得た財産（以下「管理不全土地等」という。）の管理及び処分をする権限を有する。"
