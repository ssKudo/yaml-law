article_title: "第二百四十条"
article_caption: "（遺失物の拾得）"
description: "民法の第二百四十条は「遺失物の拾得」を定める。 本文冒頭: 遺失物は、遺失物法（平成十八年法律第七十三号）の定めるところに従い公告をした後三箇月以内にその所有者が判明しないときは、これを拾得した者がその所有権を取得する。"
