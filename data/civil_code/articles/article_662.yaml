article_title: "第六百六十二条"
article_caption: "（寄託者による返還請求等）"
description: "民法の第六百六十二条は「寄託者による返還請求等」を定める。 本文冒頭: 当事者が寄託物の返還の時期を定めたときであっても、寄託者は、いつでもその返還を請求することができる。"
