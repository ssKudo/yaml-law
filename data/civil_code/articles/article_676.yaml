article_title: "第六百七十六条"
article_caption: "（組合員の持分の処分及び組合財産の分割）"
description: "民法の第六百七十六条は「組合員の持分の処分及び組合財産の分割」を定める。 本文冒頭: 組合員は、組合財産についてその持分を処分したときは、その処分をもって組合及び組合と取引をした第三者に対抗することができない。"
