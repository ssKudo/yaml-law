article_title: "第六百十五条"
article_caption: "（賃借人の通知義務）"
description: "民法の第六百十五条は「賃借人の通知義務」を定める。 本文冒頭: 賃借物が修繕を要し、又は賃借物について権利を主張する者があるときは、賃借人は、遅滞なくその旨を賃貸人に通知しなければならない。"
