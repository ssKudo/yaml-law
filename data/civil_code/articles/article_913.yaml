article_title: "第九百十三条"
article_caption: "（資力のない共同相続人がある場合の担保責任の分担）"
description: "民法の第九百十三条は「資力のない共同相続人がある場合の担保責任の分担」を定める。 本文冒頭: 担保の責任を負う共同相続人中に償還をする資力のない者があるときは、その償還することができない部分は、求償者及び他の資力のある者が、それぞれその相続分に応じて分担する。"
