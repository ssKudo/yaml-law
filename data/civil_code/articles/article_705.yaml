article_title: "第七百五条"
article_caption: "（債務の不存在を知ってした弁済）"
description: "民法の第七百五条は「債務の不存在を知ってした弁済」を定める。 本文冒頭: 債務の弁済として給付をした者は、その時において債務の存在しないことを知っていたときは、その給付したものの返還を請求することができない。"
