article_title: "第五百四十八条"
article_caption: "（解除権者の故意による目的物の損傷等による解除権の消滅）"
description: "民法の第五百四十八条は「解除権者の故意による目的物の損傷等による解除権の消滅」を定める。 本文冒頭: 解除権を有する者が故意若しくは過失によって契約の目的物を著しく損傷し、若しくは返還することができなくなったとき、又は加工若しくは改造によってこれを他の種類の物に変えたときは、解除権は、消滅する。"
