article_num: "466_2"
article_title: "第四百六十六条の二"
article_caption: "（譲渡制限の意思表示がされた債権に係る債務者の供託）"
description: "民法の第四百六十六条の二は「譲渡制限の意思表示がされた債権に係る債務者の供託」を定める。 本文冒頭: 債務者は、譲渡制限の意思表示がされた金銭の給付を目的とする債権が譲渡されたときは、その債権の全額に相当する金銭を債務の履行地（債務の履行地が債権者の現在の住所により定まる場合にあっては、譲渡人の現在の住所を含む。次条において同じ。）の供託所に供託することができる。"
