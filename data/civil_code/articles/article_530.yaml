article_caption: "（懸賞広告の撤回の方法）"
description: "民法の第五百三十条は「懸賞広告の撤回の方法」を定める。 本文冒頭: 前の広告と同一の方法による広告の撤回は、これを知らない者に対しても、その効力を有する。"
