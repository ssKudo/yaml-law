article_title: "第三百二十七条"
article_caption: "（不動産工事の先取特権）"
description: "民法の第三百二十七条は「不動産工事の先取特権」を定める。 本文冒頭: 不動産の工事の先取特権は、工事の設計、施工又は監理をする者が債務者の不動産に関してした工事の費用に関し、その不動産について存在する。"
