description: "民法の第九百四条の規定。 本文冒頭: 第九百四条 前条に規定する贈与の価額は、受贈者の行為によって、その目的である財産が滅失し、又はその価格の増減があったときであっても、相続開始の時においてなお原状のままであるものとみなしてこれを定める。"
