article_title: "第八百二十五条"
article_caption: "（父母の一方が共同の名義でした行為の効力）"
description: "民法の第八百二十五条は「父母の一方が共同の名義でした行為の効力」を定める。 本文冒頭: 父母が共同して親権を行う場合において、父母の一方が、共同の名義で、子に代わって法律行為をし又は子がこれをすることに同意したときは、その行為は、他の一方の意思に反したときであっても、そのためにその効力を妨げられない。"
