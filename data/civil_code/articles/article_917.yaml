description: "民法の第九百十七条の規定。 本文冒頭: 第九百十七条 相続人が未成年者又は成年被後見人であるときは、第九百十五条第一項の期間は、その法定代理人が未成年者又は成年被後見人のために相続の開始があったことを知った時から起算する。"
