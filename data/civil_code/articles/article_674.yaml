article_caption: "（組合員の損益分配の割合）"
description: "民法の第六百七十四条は「組合員の損益分配の割合」を定める。 本文冒頭: 当事者が損益分配の割合を定めなかったときは、その割合は、各組合員の出資の価額に応じて定める。"
