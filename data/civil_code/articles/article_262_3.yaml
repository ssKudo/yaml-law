article_title: "第二百六十二条の三"
article_caption: "（所在等不明共有者の持分の譲渡）"
description: "民法の第二百六十二条の三は「所在等不明共有者の持分の譲渡」を定める。 本文冒頭: 不動産が数人の共有に属する場合において、共有者が他の共有者を知ることができず、又はその所在を知ることができないときは、裁判所は、共有者の請求により、その共有者に、当該他の共有者（以下この条において「所在等不明共有者」という。）以外の共有者の全員が特定の者に対してその有する持分の全部を譲渡することを停止条件として所在等不明共有者の持分を当該特定の者に譲渡する権…"
