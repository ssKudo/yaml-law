article_num: "511"
article_title: "第五百十一条"
article_caption: "（差押えを受けた債権を受働債権とする相殺の禁止）"
description: "民法の第五百十一条は「差押えを受けた債権を受働債権とする相殺の禁止」を定める。 本文冒頭: 差押えを受けた債権の第三債務者は、差押え後に取得した債権による相殺をもって差押債権者に対抗することはできないが、差押え前に取得した債権による相殺をもって対抗することができる。"
