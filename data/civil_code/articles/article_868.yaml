article_num: "868"
article_title: "第八百六十八条"
article_caption: "（財産に関する権限のみを有する未成年後見人）"
description: "民法の第八百六十八条は「財産に関する権限のみを有する未成年後見人」を定める。 本文冒頭: 親権を行う者が管理権を有しない場合には、未成年後見人は、財産に関する権限のみを有する。"
