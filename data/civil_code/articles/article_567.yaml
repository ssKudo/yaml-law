article_title: "第五百六十七条"
article_caption: "（目的物の滅失等についての危険の移転）"
description: "民法の第五百六十七条は「目的物の滅失等についての危険の移転」を定める。 本文冒頭: 売主が買主に目的物（売買の目的として特定したものに限る。以下この条において同じ。）を引き渡した場合において、その引渡しがあった時以後にその目的物が当事者双方の責めに帰することができない事由によって滅失し、又は損傷したときは、買主は、その滅失又は損傷を理由として、履行の追完の請求、代金の減額の請求、損害賠償の請求及び契約の解除をすることができない。"
