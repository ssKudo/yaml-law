article_title: "第四百五十一条"
article_caption: "（他の担保の供与）"
description: "民法の第四百五十一条は「他の担保の供与」を定める。 本文冒頭: 債務者は、前条第一項各号に掲げる要件を具備する保証人を立てることができないときは、他の担保を供してこれに代えることができる。"
