article_caption: "（債権者の交替による更改）"
description: "民法の第五百十五条は「債権者の交替による更改」を定める。 本文冒頭: 債権者の交替による更改は、更改前の債権者、更改後に債権者となる者及び債務者の契約によってすることができる。"
