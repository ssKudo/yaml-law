article_title: "第十八条"
article_caption: "（補助開始の審判等の取消し）"
description: "民法の第十八条は「補助開始の審判等の取消し」を定める。 本文冒頭: 第十五条第一項本文に規定する原因が消滅したときは、家庭裁判所は、本人、配偶者、四親等内の親族、未成年後見人、未成年後見監督人、補助人、補助監督人又は検察官の請求により、補助開始の審判を取り消さなければならない。"
