article_title: "第六百六十一条"
article_caption: "（寄託者による損害賠償）"
description: "民法の第六百六十一条は「寄託者による損害賠償」を定める。 本文冒頭: 寄託者は、寄託物の性質又は瑕疵によって生じた損害を受寄者に賠償しなければならない。"
