article_title: "第六百六十四条の二"
article_caption: "（損害賠償及び費用の償還の請求権についての期間の制限）"
description: "民法の第六百六十四条の二は「損害賠償及び費用の償還の請求権についての期間の制限」を定める。 本文冒頭: 寄託物の一部滅失又は損傷によって生じた損害の賠償及び受寄者が支出した費用の償還は、寄託者が返還を受けた時から一年以内に請求しなければならない。"
