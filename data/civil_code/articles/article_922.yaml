article_title: "第九百二十二条"
article_caption: "（限定承認）"
description: "民法の第九百二十二条は「限定承認」を定める。 本文冒頭: 相続人は、相続によって得た財産の限度においてのみ被相続人の債務及び遺贈を弁済すべきことを留保して、相続の承認をすることができる。"
