article_num: "398_9"
article_title: "第三百九十八条の九"
article_caption: "（根抵当権者又は債務者の合併）"
description: "民法の第三百九十八条の九は「根抵当権者又は債務者の合併」を定める。 本文冒頭: 元本の確定前に根抵当権者について合併があったときは、根抵当権は、合併の時に存する債権のほか、合併後存続する法人又は合併によって設立された法人が合併後に取得する債権を担保する。"
