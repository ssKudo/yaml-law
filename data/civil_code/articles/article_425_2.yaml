article_title: "第四百二十五条の二"
article_caption: "（債務者の受けた反対給付に関する受益者の権利）"
description: "民法の第四百二十五条の二は「債務者の受けた反対給付に関する受益者の権利」を定める。 本文冒頭: 債務者がした財産の処分に関する行為（債務の消滅に関する行為を除く。）が取り消されたときは、受益者は、債務者に対し、その財産を取得するためにした反対給付の返還を請求することができる。"
