article_caption: "（減収による解除）"
description: "民法の第六百十条は「減収による解除」を定める。 本文冒頭: 前条の場合において、同条の賃借人は、不可抗力によって引き続き二年以上賃料より少ない収益を得たときは、契約の解除をすることができる。"
