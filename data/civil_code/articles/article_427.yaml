article_title: "第四百二十七条"
article_caption: "（分割債権及び分割債務）"
description: "民法の第四百二十七条は「分割債権及び分割債務」を定める。 本文冒頭: 数人の債権者又は債務者がある場合において、別段の意思表示がないときは、各債権者又は各債務者は、それぞれ等しい割合で権利を有し、又は義務を負う。"
