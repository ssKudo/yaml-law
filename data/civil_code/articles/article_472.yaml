article_title: "第四百七十二条"
article_caption: "（免責的債務引受の要件及び効果）"
description: "民法の第四百七十二条は「免責的債務引受の要件及び効果」を定める。 本文冒頭: 免責的債務引受の引受人は債務者が債権者に対して負担する債務と同一の内容の債務を負担し、債務者は自己の債務を免れる。"
