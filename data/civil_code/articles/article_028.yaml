article_caption: "（管理人の権限）"
description: "民法の第二十八条は「管理人の権限」を定める。 本文冒頭: 管理人は、第百三条に規定する権限を超える行為を必要とするときは、家庭裁判所の許可を得て、その行為をすることができる。"
