article_num: "398_8"
article_title: "第三百九十八条の八"
article_caption: "（根抵当権者又は債務者の相続）"
description: "民法の第三百九十八条の八は「根抵当権者又は債務者の相続」を定める。 本文冒頭: 元本の確定前に根抵当権者について相続が開始したときは、根抵当権は、相続開始の時に存する債権のほか、相続人と根抵当権設定者との合意により定めた相続人が相続の開始後に取得する債権を担保する。"
