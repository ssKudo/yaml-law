article_title: "第二百十六条"
article_caption: "（水流に関する工作物の修繕等）"
description: "民法の第二百十六条は「水流に関する工作物の修繕等」を定める。 本文冒頭: 他の土地に貯水、排水又は引水のために設けられた工作物の破壊又は閉塞により、自己の土地に損害が及び、又は及ぶおそれがある場合には、その土地の所有者は、当該他の土地の所有者に、工作物の修繕若しくは障害の除去をさせ、又は必要があるときは予防工事をさせることができる。"
