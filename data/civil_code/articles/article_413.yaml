article_num: "413"
article_title: "第四百十三条"
article_caption: "（受領遅滞）"
description: "民法の第四百十三条は「受領遅滞」を定める。 本文冒頭: 債権者が債務の履行を受けることを拒み、又は受けることができない場合において、その債務の目的が特定物の引渡しであるときは、債務者は、履行の提供をした時からその引渡しをするまで、自己の財産に対するのと同一の注意をもって、その物を保存すれば足りる。"
