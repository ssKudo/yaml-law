article_title: "第八百二十四条"
article_caption: "（財産の管理及び代表）"
description: "民法の第八百二十四条は「財産の管理及び代表」を定める。 本文冒頭: 親権を行う者は、子の財産を管理し、かつ、その財産に関する法律行為についてその子を代表する。"
