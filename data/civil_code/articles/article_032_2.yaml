description: "民法の第三十二条の二の規定。 本文冒頭: 第三十二条の二 数人の者が死亡した場合において、そのうちの一人が他の者の死亡後になお生存していたことが明らかでないときは、これらの者は、同時に死亡したものと推定する。"
