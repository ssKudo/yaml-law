article_num: "413_2"
article_title: "第四百十三条の二"
article_caption: "（履行遅滞中又は受領遅滞中の履行不能と帰責事由）"
description: "民法の第四百十三条の二は「履行遅滞中又は受領遅滞中の履行不能と帰責事由」を定める。 本文冒頭: 債務者がその債務について遅滞の責任を負っている間に当事者双方の責めに帰することができない事由によってその債務の履行が不能となったときは、その履行の不能は、債務者の責めに帰すべき事由によるものとみなす。"
