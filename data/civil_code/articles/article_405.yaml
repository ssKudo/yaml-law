article_title: "第四百五条"
article_caption: "（利息の元本への組入れ）"
description: "民法の第四百五条は「利息の元本への組入れ」を定める。 本文冒頭: 利息の支払が一年分以上延滞した場合において、債権者が催告をしても、債務者がその利息を支払わないときは、債権者は、これを元本に組み入れることができる。"
