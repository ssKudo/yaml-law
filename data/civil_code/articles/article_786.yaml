article_num: "786"
article_title: "第七百八十六条"
article_caption: "（認知の無効の訴え）"
description: "民法の第七百八十六条は「認知の無効の訴え」を定める。 本文冒頭: 次の各号に掲げる者は、それぞれ当該各号に定める時（第七百八十三条第一項の規定による認知がされた場合にあっては、子の出生の時）から七年以内に限り、認知について反対の事実があることを理由として、認知の無効の訴えを提起することができる。"
