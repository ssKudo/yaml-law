article_title: "第六百十八条"
article_caption: "（期間の定めのある賃貸借の解約をする権利の留保）"
description: "民法の第六百十八条は「期間の定めのある賃貸借の解約をする権利の留保」を定める。 本文冒頭: 当事者が賃貸借の期間を定めた場合であっても、その一方又は双方がその期間内に解約をする権利を留保したときは、前条の規定を準用する。"
