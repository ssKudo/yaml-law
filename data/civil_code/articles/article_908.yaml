article_title: "第九百八条"
article_caption: "（遺産の分割の方法の指定及び遺産の分割の禁止）"
description: "民法の第九百八条は「遺産の分割の方法の指定及び遺産の分割の禁止」を定める。 本文冒頭: 被相続人は、遺言で、遺産の分割の方法を定め、若しくはこれを定めることを第三者に委託し、又は相続開始の時から五年を超えない期間を定めて、遺産の分割を禁ずることができる。"
