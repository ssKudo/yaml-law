article_title: "第六百六十九条"
article_caption: "（金銭出資の不履行の責任）"
description: "民法の第六百六十九条は「金銭出資の不履行の責任」を定める。 本文冒頭: 金銭を出資の目的とした場合において、組合員がその出資をすることを怠ったときは、その利息を支払うほか、損害の賠償をしなければならない。"
