article_num: "841"
article_title: "第八百四十一条"
article_caption: "（父母による未成年後見人の選任の請求）"
description: "民法の第八百四十一条は「父母による未成年後見人の選任の請求」を定める。 本文冒頭: 父若しくは母が親権若しくは管理権を辞し、又は父若しくは母について親権喪失、親権停止若しくは管理権喪失の審判があったことによって未成年後見人を選任する必要が生じたときは、その父又は母は、遅滞なく未成年後見人の選任を家庭裁判所に請求しなければならない。"
