article_title: "第八百四十九条"
article_caption: "（後見監督人の選任）"
description: "民法の第八百四十九条は「後見監督人の選任」を定める。 本文冒頭: 家庭裁判所は、必要があると認めるときは、被後見人、その親族若しくは後見人の請求により又は職権で、後見監督人を選任することができる。"
