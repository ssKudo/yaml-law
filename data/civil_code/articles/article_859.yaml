article_title: "第八百五十九条"
article_caption: "（財産の管理及び代表）"
description: "民法の第八百五十九条は「財産の管理及び代表」を定める。 本文冒頭: 後見人は、被後見人の財産を管理し、かつ、その財産に関する法律行為について被後見人を代表する。"
