article_num: "988"
article_title: "第九百八十八条"
article_caption: "（受遺者の相続人による遺贈の承認又は放棄）"
description: "民法の第九百八十八条は「受遺者の相続人による遺贈の承認又は放棄」を定める。 本文冒頭: 受遺者が遺贈の承認又は放棄をしないで死亡したときは、その相続人は、自己の相続権の範囲内で、遺贈の承認又は放棄をすることができる。"
