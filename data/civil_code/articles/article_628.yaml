article_title: "第六百二十八条"
article_caption: "（やむを得ない事由による雇用の解除）"
description: "民法の第六百二十八条は「やむを得ない事由による雇用の解除」を定める。 本文冒頭: 当事者が雇用の期間を定めた場合であっても、やむを得ない事由があるときは、各当事者は、直ちに契約の解除をすることができる。"
