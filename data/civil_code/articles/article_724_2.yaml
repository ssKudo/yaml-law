article_title: "第七百二十四条の二"
article_caption: "（人の生命又は身体を害する不法行為による損害賠償請求権の消滅時効）"
description: "民法の第七百二十四条の二は「人の生命又は身体を害する不法行為による損害賠償請求権の消滅時効」を定める。 本文冒頭: 人の生命又は身体を害する不法行為による損害賠償請求権の消滅時効についての前条第一号の規定の適用については、同号中「三年間」とあるのは、「五年間」とする。"
