article_num: "710"
article_title: "第七百十条"
article_caption: "（財産以外の損害の賠償）"
description: "民法の第七百十条は「財産以外の損害の賠償」を定める。 本文冒頭: 他人の身体、自由若しくは名誉を侵害した場合又は他人の財産権を侵害した場合のいずれであるかを問わず、前条の規定により損害賠償の責任を負う者は、財産以外の損害に対しても、その賠償をしなければならない。"
