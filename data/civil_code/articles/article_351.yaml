article_num: "351"
article_title: "第三百五十一条"
article_caption: "（物上保証人の求償権）"
description: "民法の第三百五十一条は「物上保証人の求償権」を定める。 本文冒頭: 他人の債務を担保するため質権を設定した者は、その債務を弁済し、又は質権の実行によって質物の所有権を失ったときは、保証債務に関する規定に従い、債務者に対して求償権を有する。"
