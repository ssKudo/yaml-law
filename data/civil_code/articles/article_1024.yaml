article_caption: "（遺言書又は遺贈の目的物の破棄）"
description: "民法の第千二十四条は「遺言書又は遺贈の目的物の破棄」を定める。 本文冒頭: 遺言者が故意に遺言書を破棄したときは、その破棄した部分については、遺言を撤回したものとみなす。"
