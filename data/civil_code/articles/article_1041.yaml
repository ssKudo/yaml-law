description: "民法の第千四十一条は「使用貸借等の規定の準用」を定める。 本文冒頭: 第五百九十七条第三項、第六百条、第六百十六条の二、第千三十二条第二項、第千三十三条及び第千三十四条の規定は、配偶者短期居住権について準用する。"
