article_caption: "（使用貸借の規定の準用）"
description: "民法の第六百二十二条は「使用貸借の規定の準用」を定める。 本文冒頭: 第五百九十七条第一項、第五百九十九条第一項及び第二項並びに第六百条の規定は、賃貸借について準用する。"
