article_num: "541"
article_title: "第五百四十一条"
article_caption: "（催告による解除）"
description: "民法の第五百四十一条は「催告による解除」を定める。 本文冒頭: 当事者の一方がその債務を履行しない場合において、相手方が相当の期間を定めてその履行の催告をし、その期間内に履行がないときは、相手方は、契約の解除をすることができる。"
