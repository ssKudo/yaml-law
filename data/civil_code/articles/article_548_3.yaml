article_title: "第五百四十八条の三"
article_caption: "（定型約款の内容の表示）"
description: "民法の第五百四十八条の三は「定型約款の内容の表示」を定める。 本文冒頭: 定型取引を行い、又は行おうとする定型約款準備者は、定型取引合意の前又は定型取引合意の後相当の期間内に相手方から請求があった場合には、遅滞なく、相当な方法でその定型約款の内容を示さなければならない。"
