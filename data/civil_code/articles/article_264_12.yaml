article_title: "第二百六十四条の十二"
article_caption: "（管理不全土地管理人の解任及び辞任）"
description: "民法の第二百六十四条の十二は「管理不全土地管理人の解任及び辞任」を定める。 本文冒頭: 管理不全土地管理人がその任務に違反して管理不全土地等に著しい損害を与えたことその他重要な事由があるときは、裁判所は、利害関係人の請求により、管理不全土地管理人を解任することができる。"
