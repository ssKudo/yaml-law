article_title: "第百八十五条"
article_caption: "（占有の性質の変更）"
description: "民法の第百八十五条は「占有の性質の変更」を定める。 本文冒頭: 権原の性質上占有者に所有の意思がないものとされる場合には、その占有者が、自己に占有をさせた者に対して所有の意思があることを表示し、又は新たな権原により更に所有の意思をもって占有を始めるのでなければ、占有の性質は、変わらない。"
