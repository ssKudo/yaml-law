article_num: "424_9"
article_title: "第四百二十四条の九"
article_caption: "（債権者への支払又は引渡し）"
description: "民法の第四百二十四条の九は「債権者への支払又は引渡し」を定める。 本文冒頭: 債権者は、第四百二十四条の六第一項前段又は第二項前段の規定により受益者又は転得者に対して財産の返還を請求する場合において、その返還の請求が金銭の支払又は動産の引渡しを求めるものであるときは、受益者に対してその支払又は引渡しを、転得者に対してその引渡しを、自己に対してすることを求めることができる。"
keywords: ["民法", "債権者への支払又は引渡し"]
