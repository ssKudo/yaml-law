article_title: "第七百六十五条"
article_caption: "（離婚の届出の受理）"
description: "民法の第七百六十五条は「離婚の届出の受理」を定める。 本文冒頭: 離婚の届出は、その離婚が前条において準用する第七百三十九条第二項の規定その他の法令の規定に違反しないこと及び夫婦間に成年に達しない子がある場合には次の各号のいずれかに該当することを認めた後でなければ、受理することができない。"
