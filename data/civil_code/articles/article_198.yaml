article_title: "第百九十八条"
article_caption: "（占有保持の訴え）"
description: "民法の第百九十八条は「占有保持の訴え」を定める。 本文冒頭: 占有者がその占有を妨害されたときは、占有保持の訴えにより、その妨害の停止及び損害の賠償を請求することができる。"
