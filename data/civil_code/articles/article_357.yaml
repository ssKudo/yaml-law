article_title: "第三百五十七条"
article_caption: "（不動産質権者による管理の費用等の負担）"
description: "民法の第三百五十七条は「不動産質権者による管理の費用等の負担」を定める。 本文冒頭: 不動産質権者は、管理の費用を支払い、その他不動産に関する負担を負う。"
