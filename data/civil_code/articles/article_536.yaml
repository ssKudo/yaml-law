article_title: "第五百三十六条"
article_caption: "（債務者の危険負担等）"
description: "民法の第五百三十六条は「債務者の危険負担等」を定める。 本文冒頭: 当事者双方の責めに帰することができない事由によって債務を履行することができなくなったときは、債権者は、反対給付の履行を拒むことができる。"
