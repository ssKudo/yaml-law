article_title: "第七百二十七条"
article_caption: "（縁組による親族関係の発生）"
description: "民法の第七百二十七条は「縁組による親族関係の発生」を定める。 本文冒頭: 養子と養親及びその血族との間においては、養子縁組の日から、血族間におけるのと同一の親族関係を生ずる。"
