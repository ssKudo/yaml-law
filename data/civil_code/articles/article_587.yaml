article_caption: "（消費貸借）"
description: "民法の第五百八十七条は「消費貸借」を定める。 本文冒頭: 消費貸借は、当事者の一方が種類、品質及び数量の同じ物をもって返還をすることを約して相手方から金銭その他の物を受け取ることによって、その効力を生ずる。"
