description: "民法の第三十七条は「外国法人の登記」を定める。 本文冒頭: 外国法人（第三十五条第一項ただし書に規定する外国法人に限る。以下この条において同じ。）が日本に事務所を設けたときは、三週間以内に、その事務所の所在地において、次に掲げる事項を登記しなければならない。"
