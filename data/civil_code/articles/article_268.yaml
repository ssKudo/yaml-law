article_caption: "（地上権の存続期間）"
description: "民法の第二百六十八条は「地上権の存続期間」を定める。 本文冒頭: 設定行為で地上権の存続期間を定めなかった場合において、別段の慣習がないときは、地上権者は、いつでもその権利を放棄することができる。"
