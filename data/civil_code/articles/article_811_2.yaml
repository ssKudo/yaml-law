article_title: "第八百十一条の二"
article_caption: "（夫婦である養親と未成年者との離縁）"
description: "民法の第八百十一条の二は「夫婦である養親と未成年者との離縁」を定める。 本文冒頭: 養親が夫婦である場合において未成年者と離縁をするには、夫婦が共にしなければならない。"
