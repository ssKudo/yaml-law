article_caption: "（売買）"
description: "民法の第五百五十五条は「売買」を定める。 本文冒頭: 売買は、当事者の一方がある財産権を相手方に移転することを約し、相手方がこれに対してその代金を支払うことを約することによって、その効力を生ずる。"
