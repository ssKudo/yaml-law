article_title: "第九百九十五条"
article_caption: "（遺贈の無効又は失効の場合の財産の帰属）"
description: "民法の第九百九十五条は「遺贈の無効又は失効の場合の財産の帰属」を定める。 本文冒頭: 遺贈が、その効力を生じないとき、又は放棄によってその効力を失ったときは、受遺者が受けるべきであったものは、相続人に帰属する。"
