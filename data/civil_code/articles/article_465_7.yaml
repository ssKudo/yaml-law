article_num: "465_7"
article_title: "第四百六十五条の七"
article_caption: "（保証に係る公正証書の方式の特則）"
description: "民法の第四百六十五条の七は「保証に係る公正証書の方式の特則」を定める。 本文冒頭: 前条第一項の保証契約又は根保証契約の保証人になろうとする者が口がきけない者である場合には、公証人の前で、同条第二項第一号イ又はロに掲げる契約の区分に応じ、それぞれ当該イ又はロに定める事項を通訳人の通訳により申述し、又は自書して、同号の口授に代えなければならない。"
