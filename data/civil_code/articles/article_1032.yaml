article_caption: "（配偶者による使用及び収益）"
description: "民法の第千三十二条は「配偶者による使用及び収益」を定める。 本文冒頭: 配偶者は、従前の用法に従い、善良な管理者の注意をもって、居住建物の使用及び収益をしなければならない。"
