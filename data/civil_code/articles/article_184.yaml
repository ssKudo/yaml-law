article_title: "第百八十四条"
article_caption: "（指図による占有移転）"
description: "民法の第百八十四条は「指図による占有移転」を定める。 本文冒頭: 代理人によって占有をする場合において、本人がその代理人に対して以後第三者のためにその物を占有することを命じ、その第三者がこれを承諾したときは、その第三者は、占有権を取得する。"
