article_title: "第三百二十六条"
article_caption: "（不動産保存の先取特権）"
description: "民法の第三百二十六条は「不動産保存の先取特権」を定める。 本文冒頭: 不動産の保存の先取特権は、不動産の保存のために要した費用又は不動産に関する権利の保存、承認若しくは実行のために要した費用に関し、その不動産について存在する。"
