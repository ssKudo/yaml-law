article_title: "第百十八条"
article_caption: "（単独行為の無権代理）"
description: "民法の第百十八条は「単独行為の無権代理」を定める。 本文冒頭: 単独行為については、その行為の時において、相手方が、代理人と称する者が代理権を有しないで行為をすることに同意し、又はその代理権を争わなかったときに限り、第百十三条から前条までの規定を準用する。"
