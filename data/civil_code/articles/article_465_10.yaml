article_caption: "（契約締結時の情報の提供義務）"
description: "民法の第四百六十五条の十は「契約締結時の情報の提供義務」を定める。 本文冒頭: 主たる債務者は、事業のために負担する債務を主たる債務とする保証又は主たる債務の範囲に事業のために負担する債務が含まれる根保証の委託をするときは、委託を受ける者に対し、次に掲げる事項に関する情報を提供しなければならない。"
