article_caption: "（催告の抗弁）"
description: "民法の第四百五十二条は「催告の抗弁」を定める。 本文冒頭: 債権者が保証人に債務の履行を請求したときは、保証人は、まず主たる債務者に催告をすべき旨を請求することができる。"
