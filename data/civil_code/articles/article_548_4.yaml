article_title: "第五百四十八条の四"
article_caption: "（定型約款の変更）"
description: "民法の第五百四十八条の四は「定型約款の変更」を定める。 本文冒頭: 定型約款準備者は、次に掲げる場合には、定型約款の変更をすることにより、変更後の定型約款の条項について合意があったものとみなし、個別に相手方と合意をすることなく契約の内容を変更することができる。"
