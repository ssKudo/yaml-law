article_num: "860_2"
article_title: "第八百六十条の二"
article_caption: "（成年後見人による郵便物等の管理）"
description: "民法の第八百六十条の二は「成年後見人による郵便物等の管理」を定める。 本文冒頭: 家庭裁判所は、成年後見人がその事務を行うに当たって必要があると認めるときは、成年後見人の請求により、信書の送達の事業を行う者に対し、期間を定めて、成年被後見人に宛てた郵便物又は民間事業者による信書の送達に関する法律（平成十四年法律第九十九号）第二条第三項に規定する信書便物（次条において「郵便物等」という。）を成年後見人に配達すべき旨を嘱託することができる。"
