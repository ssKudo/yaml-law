article_num: "876_9"
article_title: "第八百七十六条の九"
article_caption: "（補助人に代理権を付与する旨の審判）"
description: "民法の第八百七十六条の九は「補助人に代理権を付与する旨の審判」を定める。 本文冒頭: 家庭裁判所は、第十五条第一項本文に規定する者又は補助人若しくは補助監督人の請求によって、被補助人のために特定の法律行為について補助人に代理権を付与する旨の審判をすることができる。"
