article_num: "453"
article_title: "第四百五十三条"
article_caption: "（検索の抗弁）"
description: "民法の第四百五十三条は「検索の抗弁」を定める。 本文冒頭: 債権者が前条の規定に従い主たる債務者に催告をした後であっても、保証人が主たる債務者に弁済をする資力があり、かつ、執行が容易であることを証明したときは、債権者は、まず主たる債務者の財産について執行をしなければならない。"
