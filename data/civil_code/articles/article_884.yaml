article_title: "第八百八十四条"
article_caption: "（相続回復請求権）"
description: "民法の第八百八十四条は「相続回復請求権」を定める。 本文冒頭: 相続回復の請求権は、相続人又はその法定代理人が相続権を侵害された事実を知った時から五年間行使しないときは、時効によって消滅する。"
