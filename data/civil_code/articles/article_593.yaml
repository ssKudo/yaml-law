article_title: "第五百九十三条"
article_caption: "（使用貸借）"
description: "民法の第五百九十三条は「使用貸借」を定める。 本文冒頭: 使用貸借は、当事者の一方がある物を引き渡すことを約し、相手方がその受け取った物について無償で使用及び収益をして契約が終了したときに返還をすることを約することによって、その効力を生ずる。"
