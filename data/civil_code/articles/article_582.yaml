article_title: "第五百八十二条"
article_caption: "（買戻権の代位行使）"
description: "民法の第五百八十二条は「買戻権の代位行使」を定める。 本文冒頭: 売主の債権者が第四百二十三条の規定により売主に代わって買戻しをしようとするときは、買主は、裁判所において選任した鑑定人の評価に従い、不動産の現在の価額から売主が返還すべき金額を控除した残額に達するまで売主の債務を弁済し、なお残余があるときはこれを売主に返還して、買戻権を消滅させることができる。"
keywords: ["民法", "買戻権の代位行使"]
