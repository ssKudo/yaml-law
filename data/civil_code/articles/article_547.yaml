article_title: "第五百四十七条"
article_caption: "（催告による解除権の消滅）"
description: "民法の第五百四十七条は「催告による解除権の消滅」を定める。 本文冒頭: 解除権の行使について期間の定めがないときは、相手方は、解除権を有する者に対し、相当の期間を定めて、その期間内に解除をするかどうかを確答すべき旨の催告をすることができる。"
