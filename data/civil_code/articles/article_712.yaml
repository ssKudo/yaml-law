article_title: "第七百十二条"
article_caption: "（責任能力）"
description: "民法の第七百十二条は「責任能力」を定める。 本文冒頭: 未成年者は、他人に損害を加えた場合において、自己の行為の責任を弁識するに足りる知能を備えていなかったときは、その行為について賠償の責任を負わない。"
