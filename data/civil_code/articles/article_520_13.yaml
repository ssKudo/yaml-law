article_num: "520_13"
article_title: "第五百二十条の十三"
article_caption: "（記名式所持人払証券の譲渡）"
description: "民法の第五百二十条の十三は「記名式所持人払証券の譲渡」を定める。 本文冒頭: 記名式所持人払証券（債権者を指名する記載がされている証券であって、その所持人に弁済をすべき旨が付記されているものをいう。以下同じ。）の譲渡は、その証券を交付しなければ、その効力を生じない。"
