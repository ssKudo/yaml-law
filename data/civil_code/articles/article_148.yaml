article_title: "第百四十八条"
article_caption: "（強制執行等による時効の完成猶予及び更新）"
description: "民法の第百四十八条は「強制執行等による時効の完成猶予及び更新」を定める。 本文冒頭: 次に掲げる事由がある場合には、その事由が終了する（申立ての取下げ又は法律の規定に従わないことによる取消しによってその事由が終了した場合にあっては、その終了の時から六箇月を経過する）までの間は、時効は、完成しない。"
