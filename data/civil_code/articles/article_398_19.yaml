article_title: "第三百九十八条の十九"
article_caption: "（根抵当権の元本の確定請求）"
description: "民法の第三百九十八条の十九は「根抵当権の元本の確定請求」を定める。 本文冒頭: 根抵当権設定者は、根抵当権の設定の時から三年を経過したときは、担保すべき元本の確定を請求することができる。"
