article_num: "431"
article_title: "第四百三十一条"
article_caption: "（可分債権又は可分債務への変更）"
description: "民法の第四百三十一条は「可分債権又は可分債務への変更」を定める。 本文冒頭: 不可分債権が可分債権となったときは、各債権者は自己が権利を有する部分についてのみ履行を請求することができ、不可分債務が可分債務となったときは、各債務者はその負担部分についてのみ履行の責任を負う。"
