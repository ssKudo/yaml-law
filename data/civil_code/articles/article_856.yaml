article_title: "第八百五十六条"
article_caption: "（被後見人が包括財産を取得した場合についての準用）"
description: "民法の第八百五十六条は「被後見人が包括財産を取得した場合についての準用」を定める。 本文冒頭: 前三条の規定は、後見人が就職した後被後見人が包括財産を取得した場合について準用する。"
