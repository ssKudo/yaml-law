article_title: "第七百九十一条"
article_caption: "（子の氏の変更）"
description: "民法の第七百九十一条は「子の氏の変更」を定める。 本文冒頭: 子が父又は母と氏を異にする場合には、子は、家庭裁判所の許可を得て、戸籍法の定めるところにより届け出ることによって、その父又は母の氏を称することができる。"
