article_num: "613"
article_title: "第六百十三条"
article_caption: "（転貸の効果）"
description: "民法の第六百十三条は「転貸の効果」を定める。 本文冒頭: 賃借人が適法に賃借物を転貸したときは、転借人は、賃貸人と賃借人との間の賃貸借に基づく賃借人の債務の範囲を限度として、賃貸人に対して転貸借に基づく債務を直接履行する義務を負う。"
