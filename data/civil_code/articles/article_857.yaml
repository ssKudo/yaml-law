article_title: "第八百五十七条"
article_caption: "（未成年被後見人の身上の監護に関する権利義務）"
description: "民法の第八百五十七条は「未成年被後見人の身上の監護に関する権利義務」を定める。 本文冒頭: 未成年後見人は、第八百二十条から第八百二十三条までに規定する事項について、親権を行う者と同一の権利義務を有する。"
