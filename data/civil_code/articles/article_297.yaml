article_title: "第二百九十七条"
article_caption: "（留置権者による果実の収取）"
description: "民法の第二百九十七条は「留置権者による果実の収取」を定める。 本文冒頭: 留置権者は、留置物から生ずる果実を収取し、他の債権者に先立って、これを自己の債権の弁済に充当することができる。"
