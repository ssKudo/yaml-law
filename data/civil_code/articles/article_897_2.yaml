article_title: "第八百九十七条の二"
article_caption: "（相続財産の保存）"
description: "民法の第八百九十七条の二は「相続財産の保存」を定める。 本文冒頭: 家庭裁判所は、利害関係人又は検察官の請求によって、いつでも、相続財産の管理人の選任その他の相続財産の保存に必要な処分を命ずることができる。"
