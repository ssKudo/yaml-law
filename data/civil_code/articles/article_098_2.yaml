article_title: "第九十八条の二"
article_caption: "（意思表示の受領能力）"
description: "民法の第九十八条の二は「意思表示の受領能力」を定める。 本文冒頭: 意思表示の相手方がその意思表示を受けた時に意思能力を有しなかったとき又は未成年者若しくは成年被後見人であったときは、その意思表示をもってその相手方に対抗することができない。"
