article_caption: "（共益費用の先取特権）"
description: "民法の第三百七条は「共益費用の先取特権」を定める。 本文冒頭: 共益の費用の先取特権は、各債権者の共同の利益のためにされた債務者の財産の保存、清算又は配当に関する費用について存在する。"
