description: "民法の第二百五十八条の二の規定。 本文冒頭: ２共有物の持分が相続財産に属する場合において、相続開始の時から十年を経過したときは、前項の規定にかかわらず、相続財産に属する共有物の持分について前条の規定による分割をすることができる。"
