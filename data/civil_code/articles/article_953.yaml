article_title: "第九百五十三条"
article_caption: "（不在者の財産の管理人に関する規定の準用）"
description: "民法の第九百五十三条は「不在者の財産の管理人に関する規定の準用」を定める。 本文冒頭: 第二十七条から第二十九条までの規定は、前条第一項の相続財産の清算人（以下この章において単に「相続財産の清算人」という。）について準用する。"
