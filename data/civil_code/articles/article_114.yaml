article_title: "第百十四条"
article_caption: "（無権代理の相手方の催告権）"
description: "民法の第百十四条は「無権代理の相手方の催告権」を定める。 本文冒頭: 前条の場合において、相手方は、本人に対し、相当の期間を定めて、その期間内に追認をするかどうかを確答すべき旨の催告をすることができる。"
