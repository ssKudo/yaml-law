article_title: "第五百二十条の二"
article_caption: "（指図証券の譲渡）"
description: "民法の第五百二十条の二は「指図証券の譲渡」を定める。 本文冒頭: 指図証券の譲渡は、その証券に譲渡の裏書をして譲受人に交付しなければ、その効力を生じない。"
