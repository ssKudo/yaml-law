article_title: "第二百九十一条"
article_caption: "（地役権の消滅時効）"
description: "民法の第二百九十一条は「地役権の消滅時効」を定める。 本文冒頭: 第百六十六条第二項に規定する消滅時効の期間は、継続的でなく行使される地役権については最後の行使の時から起算し、継続的に行使される地役権についてはその行使を妨げる事実が生じた時から起算する。"
