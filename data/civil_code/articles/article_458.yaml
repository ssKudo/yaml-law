article_caption: "（連帯保証人について生じた事由の効力）"
description: "民法の第四百五十八条は「連帯保証人について生じた事由の効力」を定める。 本文冒頭: 第四百三十八条、第四百三十九条第一項、第四百四十条及び第四百四十一条の規定は、主たる債務者と連帯して債務を負担する保証人について生じた事由について準用する。"
