article_title: "第七百二条"
article_caption: "（管理者による費用の償還請求等）"
description: "民法の第七百二条は「管理者による費用の償還請求等」を定める。 本文冒頭: 管理者は、本人のために有益な費用を支出したときは、本人に対し、その償還を請求することができる。"
