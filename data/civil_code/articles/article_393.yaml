article_title: "第三百九十三条"
article_caption: "（共同抵当における代位の付記登記）"
description: "民法の第三百九十三条は「共同抵当における代位の付記登記」を定める。 本文冒頭: 前条第二項後段の規定により代位によって抵当権を行使する者は、その抵当権の登記にその代位を付記することができる。"
