article_title: "第五百九十九条"
article_caption: "（借主による収去等）"
description: "民法の第五百九十九条は「借主による収去等」を定める。 本文冒頭: 借主は、借用物を受け取った後にこれに附属させた物がある場合において、使用貸借が終了したときは、その附属させた物を収去する義務を負う。"
