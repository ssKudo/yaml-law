article_title: "第二百六十一条"
article_caption: "（分割における共有者の担保責任）"
description: "民法の第二百六十一条は「分割における共有者の担保責任」を定める。 本文冒頭: 各共有者は、他の共有者が分割によって取得した物について、売主と同じく、その持分に応じて担保の責任を負う。"
