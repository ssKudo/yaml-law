article_title: "第十七条"
article_caption: "（補助人の同意を要する旨の審判等）"
description: "民法の第十七条は「補助人の同意を要する旨の審判等」を定める。 本文冒頭: 家庭裁判所は、第十五条第一項本文に規定する者又は補助人若しくは補助監督人の請求により、被補助人が特定の法律行為をするにはその補助人の同意を得なければならない旨の審判をすることができる。"
