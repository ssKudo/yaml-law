article_title: "第百四十五条"
article_caption: "（時効の援用）"
description: "民法の第百四十五条は「時効の援用」を定める。 本文冒頭: 時効は、当事者（消滅時効にあっては、保証人、物上保証人、第三取得者その他権利の消滅について正当な利益を有する者を含む。）が援用しなければ、裁判所がこれによって裁判をすることができない。"
