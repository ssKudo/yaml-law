article_title: "第三百三十五条"
article_caption: "（一般の先取特権の効力）"
description: "民法の第三百三十五条は「一般の先取特権の効力」を定める。 本文冒頭: 一般の先取特権者は、まず不動産以外の財産から弁済を受け、なお不足があるのでなければ、不動産から弁済を受けることができない。"
