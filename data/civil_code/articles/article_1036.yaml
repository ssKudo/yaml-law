article_caption: "（使用貸借及び賃貸借の規定の準用）"
description: "民法の第千三十六条は「使用貸借及び賃貸借の規定の準用」を定める。 本文冒頭: 第五百九十七条第一項及び第三項、第六百条、第六百十三条並びに第六百十六条の二の規定は、配偶者居住権について準用する。"
