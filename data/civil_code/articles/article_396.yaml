article_title: "第三百九十六条"
article_caption: "（抵当権の消滅時効）"
description: "民法の第三百九十六条は「抵当権の消滅時効」を定める。 本文冒頭: 抵当権は、債務者及び抵当権設定者に対しては、その担保する債権と同時でなければ、時効によって消滅しない。"
