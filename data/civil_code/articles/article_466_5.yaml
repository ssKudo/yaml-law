article_num: "466_5"
article_title: "第四百六十六条の五"
article_caption: "（預金債権又は貯金債権に係る譲渡制限の意思表示の効力）"
description: "民法の第四百六十六条の五は「預金債権又は貯金債権に係る譲渡制限の意思表示の効力」を定める。 本文冒頭: 預金口座又は貯金口座に係る預金又は貯金に係る債権（以下「預貯金債権」という。）について当事者がした譲渡制限の意思表示は、第四百六十六条第二項の規定にかかわらず、その譲渡制限の意思表示がされたことを知り、又は重大な過失によって知らなかった譲受人その他の第三者に対抗することができる。"
keywords: ["民法", "預金債権又は貯金債権に係る譲渡制限の意思表示の効力"]
