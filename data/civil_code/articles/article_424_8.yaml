article_title: "第四百二十四条の八"
article_caption: "（詐害行為の取消しの範囲）"
description: "民法の第四百二十四条の八は「詐害行為の取消しの範囲」を定める。 本文冒頭: 債権者は、詐害行為取消請求をする場合において、債務者がした行為の目的が可分であるときは、自己の債権の額の限度においてのみ、その行為の取消しを請求することができる。"
