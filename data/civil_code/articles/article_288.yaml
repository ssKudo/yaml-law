article_title: "第二百八十八条"
article_caption: "（承役地の所有者の工作物の使用）"
description: "民法の第二百八十八条は「承役地の所有者の工作物の使用」を定める。 本文冒頭: 承役地の所有者は、地役権の行使を妨げない範囲内において、その行使のために承役地の上に設けられた工作物を使用することができる。"
