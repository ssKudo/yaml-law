article_title: "第千一条"
article_caption: "（債権の遺贈の物上代位）"
description: "民法の第千一条は「債権の遺贈の物上代位」を定める。 本文冒頭: 債権を遺贈の目的とした場合において、遺言者が弁済を受け、かつ、その受け取った物がなお相続財産中に在るときは、その物を遺贈の目的としたものと推定する。"
