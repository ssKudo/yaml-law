article_title: "第八百四十条"
article_caption: "（未成年後見人の選任）"
description: "民法の第八百四十条は「未成年後見人の選任」を定める。 本文冒頭: 前条の規定により未成年後見人となるべき者がないときは、家庭裁判所は、未成年被後見人又はその親族その他の利害関係人の請求によって、未成年後見人を選任する。"
