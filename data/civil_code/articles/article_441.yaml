article_num: "441"
article_title: "第四百四十一条"
article_caption: "（相対的効力の原則）"
description: "民法の第四百四十一条は「相対的効力の原則」を定める。 本文冒頭: 第四百三十八条、第四百三十九条第一項及び前条に規定する場合を除き、連帯債務者の一人について生じた事由は、他の連帯債務者に対してその効力を生じない。"
