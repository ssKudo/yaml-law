article_title: "第五百二十条の六"
article_caption: "（指図証券の譲渡における債務者の抗弁の制限）"
description: "民法の第五百二十条の六は「指図証券の譲渡における債務者の抗弁の制限」を定める。 本文冒頭: 指図証券の債務者は、その証券に記載した事項及びその証券の性質から当然に生ずる結果を除き、その証券の譲渡前の債権者に対抗することができた事由をもって善意の譲受人に対抗することができない。"
