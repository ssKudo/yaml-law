article_title: "第九百九十三条"
article_caption: "（遺贈義務者による費用の償還請求）"
description: "民法の第九百九十三条は「遺贈義務者による費用の償還請求」を定める。 本文冒頭: 第二百九十九条の規定は、遺贈義務者が遺言者の死亡後に遺贈の目的物について費用を支出した場合について準用する。"
