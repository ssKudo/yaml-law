article_title: "第五百三十七条"
article_caption: "（第三者のためにする契約）"
description: "民法の第五百三十七条は「第三者のためにする契約」を定める。 本文冒頭: 契約により当事者の一方が第三者に対してある給付をすることを約したときは、その第三者は、債務者に対して直接にその給付を請求する権利を有する。"
