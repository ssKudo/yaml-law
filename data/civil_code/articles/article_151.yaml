article_title: "第百五十一条"
article_caption: "（協議を行う旨の合意による時効の完成猶予）"
description: "民法の第百五十一条は「協議を行う旨の合意による時効の完成猶予」を定める。 本文冒頭: 権利についての協議を行う旨の合意が書面でされたときは、次に掲げる時のいずれか早い時までの間は、時効は、完成しない。"
