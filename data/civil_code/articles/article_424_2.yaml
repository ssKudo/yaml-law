article_title: "第四百二十四条の二"
article_caption: "（相当の対価を得てした財産の処分行為の特則）"
description: "民法の第四百二十四条の二は「相当の対価を得てした財産の処分行為の特則」を定める。 本文冒頭: 債務者が、その有する財産を処分する行為をした場合において、受益者から相当の対価を取得しているときは、債権者は、次に掲げる要件のいずれにも該当する場合に限り、その行為について、詐害行為取消請求をすることができる。"
