article_title: "第三百九十八条の七"
article_caption: "（根抵当権の被担保債権の譲渡等）"
description: "民法の第三百九十八条の七は「根抵当権の被担保債権の譲渡等」を定める。 本文冒頭: 元本の確定前に根抵当権者から債権を取得した者は、その債権について根抵当権を行使することができない。"
