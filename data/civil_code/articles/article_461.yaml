article_num: "461"
article_title: "第四百六十一条"
article_caption: "（主たる債務者が保証人に対して償還をする場合）"
description: "民法の第四百六十一条は「主たる債務者が保証人に対して償還をする場合」を定める。 本文冒頭: 前条の規定により主たる債務者が保証人に対して償還をする場合において、債権者が全部の弁済を受けない間は、主たる債務者は、保証人に担保を供させ、又は保証人に対して自己に免責を得させることを請求することができる。"
