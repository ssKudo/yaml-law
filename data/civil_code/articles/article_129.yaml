article_title: "第百二十九条"
article_caption: "（条件の成否未定の間における権利の処分等）"
description: "民法の第百二十九条は「条件の成否未定の間における権利の処分等」を定める。 本文冒頭: 条件の成否が未定である間における当事者の権利義務は、一般の規定に従い、処分し、相続し、若しくは保存し、又はそのために担保を供することができる。"
