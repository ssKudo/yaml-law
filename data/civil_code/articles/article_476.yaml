article_title: "第四百七十六条"
article_caption: "（弁済として引き渡した物の消費又は譲渡がされた場合の弁済の効力等）"
description: "民法の第四百七十六条は「弁済として引き渡した物の消費又は譲渡がされた場合の弁済の効力等」を定める。 本文冒頭: 前条の場合において、債権者が弁済として受領した物を善意で消費し、又は譲り渡したときは、その弁済は、有効とする。"
