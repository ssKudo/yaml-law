article_title: "第六百五十条"
article_caption: "（受任者による費用等の償還請求等）"
description: "民法の第六百五十条は「受任者による費用等の償還請求等」を定める。 本文冒頭: 受任者は、委任事務を処理するのに必要と認められる費用を支出したときは、委任者に対し、その費用及び支出の日以後におけるその利息の償還を請求することができる。"
