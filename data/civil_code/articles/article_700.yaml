article_title: "第七百条"
article_caption: "（管理者による事務管理の継続）"
description: "民法の第七百条は「管理者による事務管理の継続」を定める。 本文冒頭: 管理者は、本人又はその相続人若しくは法定代理人が管理をすることができるに至るまで、事務管理を継続しなければならない。"
