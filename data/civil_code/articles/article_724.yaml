article_caption: "（不法行為による損害賠償請求権の消滅時効）"
description: "民法の第七百二十四条は「不法行為による損害賠償請求権の消滅時効」を定める。 本文冒頭: 不法行為による損害賠償の請求権は、次に掲げる場合には、時効によって消滅する。"
