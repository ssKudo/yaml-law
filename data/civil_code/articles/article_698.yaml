article_num: "698"
article_title: "第六百九十八条"
article_caption: "（緊急事務管理）"
description: "民法の第六百九十八条は「緊急事務管理」を定める。 本文冒頭: 管理者は、本人の身体、名誉又は財産に対する急迫の危害を免れさせるために事務管理をしたときは、悪意又は重大な過失があるのでなければ、これによって生じた損害を賠償する責任を負わない。"
