article_title: "第八百七十六条の三"
article_caption: "（保佐監督人）"
description: "民法の第八百七十六条の三は「保佐監督人」を定める。 本文冒頭: 家庭裁判所は、必要があると認めるときは、被保佐人、その親族若しくは保佐人の請求により又は職権で、保佐監督人を選任することができる。"
