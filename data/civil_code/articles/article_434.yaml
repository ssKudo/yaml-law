article_title: "第四百三十四条"
article_caption: "（連帯債権者の一人との間の相殺）"
description: "民法の第四百三十四条は「連帯債権者の一人との間の相殺」を定める。 本文冒頭: 債務者が連帯債権者の一人に対して債権を有する場合において、その債務者が相殺を援用したときは、その相殺は、他の連帯債権者に対しても、その効力を生ずる。"
