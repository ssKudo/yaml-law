article_title: "第百六十四条"
article_caption: "（占有の中止等による取得時効の中断）"
description: "民法の第百六十四条は「占有の中止等による取得時効の中断」を定める。 本文冒頭: 第百六十二条の規定による時効は、占有者が任意にその占有を中止し、又は他人によってその占有を奪われたときは、中断する。"
