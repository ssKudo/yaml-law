article_num: "769"
article_title: "第七百六十九条"
article_caption: "（離婚による復氏の際の権利の承継）"
description: "民法の第七百六十九条は「離婚による復氏の際の権利の承継」を定める。 本文冒頭: 婚姻によって氏を改めた夫又は妻が、第八百九十七条第一項の権利を承継した後、協議上の離婚をしたときは、当事者その他の関係人の協議で、その権利を承継すべき者を定めなければならない。"
