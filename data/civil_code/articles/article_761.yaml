article_title: "第七百六十一条"
article_caption: "（日常の家事に関する債務の連帯責任）"
description: "民法の第七百六十一条は「日常の家事に関する債務の連帯責任」を定める。 本文冒頭: 夫婦の一方が日常の家事に関して第三者と法律行為をしたときは、他の一方は、これによって生じた債務について、連帯してその責任を負う。"
