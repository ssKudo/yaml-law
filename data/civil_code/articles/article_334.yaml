article_title: "第三百三十四条"
article_caption: "（先取特権と動産質権との競合）"
description: "民法の第三百三十四条は「先取特権と動産質権との競合」を定める。 本文冒頭: 先取特権と動産質権とが競合する場合には、動産質権者は、第三百三十条の規定による第一順位の先取特権者と同一の権利を有する。"
