article_title: "第四百五十七条"
article_caption: "（主たる債務者について生じた事由の効力）"
description: "民法の第四百五十七条は「主たる債務者について生じた事由の効力」を定める。 本文冒頭: 主たる債務者に対する履行の請求その他の事由による時効の完成猶予及び更新は、保証人に対しても、その効力を生ずる。"
