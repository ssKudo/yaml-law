article_title: "第六百九十七条"
article_caption: "（事務管理）"
description: "民法の第六百九十七条は「事務管理」を定める。 本文冒頭: 義務なく他人のために事務の管理を始めた者（以下この章において「管理者」という。）は、その事務の性質に従い、最も本人の利益に適合する方法によって、その事務の管理（以下「事務管理」という。）をしなければならない。"
