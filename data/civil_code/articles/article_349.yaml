article_num: "349"
article_title: "第三百四十九条"
article_caption: "（契約による質物の処分の禁止）"
description: "民法の第三百四十九条は「契約による質物の処分の禁止」を定める。 本文冒頭: 質権設定者は、設定行為又は債務の弁済期前の契約において、質権者に弁済として質物の所有権を取得させ、その他法律に定める方法によらないで質物を処分させることを約することができない。"
