article_title: "第百六十条"
article_caption: "（相続財産に関する時効の完成猶予）"
description: "民法の第百六十条は「相続財産に関する時効の完成猶予」を定める。 本文冒頭: 相続財産に関しては、相続人が確定した時、管理人が選任された時又は破産手続開始の決定があった時から六箇月を経過するまでの間は、時効は、完成しない。"
