article_title: "第八百七十六条の八"
article_caption: "（補助監督人）"
description: "民法の第八百七十六条の八は「補助監督人」を定める。 本文冒頭: 家庭裁判所は、必要があると認めるときは、被補助人、その親族若しくは補助人の請求により又は職権で、補助監督人を選任することができる。"
