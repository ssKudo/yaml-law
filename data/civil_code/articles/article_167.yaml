article_title: "第百六十七条"
article_caption: "（人の生命又は身体の侵害による損害賠償請求権の消滅時効）"
description: "民法の第百六十七条は「人の生命又は身体の侵害による損害賠償請求権の消滅時効」を定める。 本文冒頭: 人の生命又は身体の侵害による損害賠償請求権の消滅時効についての前条第一項第二号の規定の適用については、同号中「十年間」とあるのは、「二十年間」とする。"
