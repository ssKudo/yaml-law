article_title: "第九百九十八条"
article_caption: "（遺贈義務者の引渡義務）"
description: "民法の第九百九十八条は「遺贈義務者の引渡義務」を定める。 本文冒頭: 遺贈義務者は、遺贈の目的である物又は権利を、相続開始の時（その後に当該物又は権利について遺贈の目的として特定した場合にあっては、その特定した時）の状態で引き渡し、又は移転する義務を負う。"
