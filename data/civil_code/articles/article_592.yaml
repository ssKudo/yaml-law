article_title: "第五百九十二条"
article_caption: "（価額の償還）"
description: "民法の第五百九十二条は「価額の償還」を定める。 本文冒頭: 借主が貸主から受け取った物と種類、品質及び数量の同じ物をもって返還をすることができなくなったときは、その時における物の価額を償還しなければならない。"
