article_caption: "（受遺者又は受贈者の負担額）"
description: "民法の第千四十七条は「受遺者又は受贈者の負担額」を定める。 本文冒頭: 受遺者又は受贈者は、次の各号の定めるところに従い、遺贈（特定財産承継遺言による財産の承継又は相続分の指定による遺産の取得を含む。以下この章において同じ。）又は贈与（遺留分を算定するための財産の価額に算入されるものに限る。以下この章において同じ。）の目的の価額（受遺者又は受贈者が相続人である場合にあっては、当該価額から第千四十二条の規定による遺留分として当該相…"
