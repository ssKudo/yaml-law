article_title: "第八百七十六条の十"
article_caption: "（補助の事務及び補助人の任務の終了等）"
description: "民法の第八百七十六条の十は「補助の事務及び補助人の任務の終了等」を定める。 本文冒頭: 第六百四十四条、第八百五十九条の二、第八百五十九条の三、第八百六十一条第二項、第八百六十二条、第八百六十三条及び第八百七十六条の五第一項の規定は補助の事務について、第八百二十四条ただし書の規定は補助人が前条第一項の代理権を付与する旨の審判に基づき被補助人を代表する場合について準用する。"
