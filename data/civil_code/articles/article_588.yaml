article_title: "第五百八十八条"
article_caption: "（準消費貸借）"
description: "民法の第五百八十八条は「準消費貸借」を定める。 本文冒頭: 金銭その他の物を給付する義務を負う者がある場合において、当事者がその物を消費貸借の目的とすることを約したときは、消費貸借は、これによって成立したものとみなす。"
