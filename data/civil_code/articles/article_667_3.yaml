article_num: "667_3"
article_title: "第六百六十七条の三"
article_caption: "（組合員の一人についての意思表示の無効等）"
description: "民法の第六百六十七条の三は「組合員の一人についての意思表示の無効等」を定める。 本文冒頭: 組合員の一人について意思表示の無効又は取消しの原因があっても、他の組合員の間においては、組合契約は、その効力を妨げられない。"
