article_num: "948"
article_title: "第九百四十八条"
article_caption: "（相続人の固有財産からの弁済）"
description: "民法の第九百四十八条は「相続人の固有財産からの弁済」を定める。 本文冒頭: 財産分離の請求をした者及び配当加入の申出をした者は、相続財産をもって全部の弁済を受けることができなかった場合に限り、相続人の固有財産についてその権利を行使することができる。"
