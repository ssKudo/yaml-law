article_title: "第八百二十四条の三"
article_caption: "（監護者の権利義務）"
description: "民法の第八百二十四条の三は「監護者の権利義務」を定める。 本文冒頭: 第七百六十六条（第七百四十九条、第七百七十一条及び第七百八十八条において準用する場合を含む。）の規定により定められた子の監護をすべき者は、第八百二十条から第八百二十三条までに規定する事項について、親権を行う者と同一の権利義務を有する。"
