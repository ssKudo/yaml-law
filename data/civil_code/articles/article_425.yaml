article_title: "第四百二十五条"
article_caption: "（認容判決の効力が及ぶ者の範囲）"
description: "民法の第四百二十五条は「認容判決の効力が及ぶ者の範囲」を定める。 本文冒頭: 詐害行為取消請求を認容する確定判決は、債務者及びその全ての債権者に対してもその効力を有する。"
