article_title: "第六百八十一条"
article_caption: "（脱退した組合員の持分の払戻し）"
description: "民法の第六百八十一条は「脱退した組合員の持分の払戻し」を定める。 本文冒頭: 脱退した組合員と他の組合員との間の計算は、脱退の時における組合財産の状況に従ってしなければならない。"
