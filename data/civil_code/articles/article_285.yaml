article_title: "第二百八十五条"
article_caption: "（用水地役権）"
description: "民法の第二百八十五条は「用水地役権」を定める。 本文冒頭: 用水地役権の承役地（地役権者以外の者の土地であって、要役地の便益に供されるものをいう。以下同じ。）において、水が要役地及び承役地の需要に比して不足するときは、その各土地の需要に応じて、まずこれを生活用に供し、その残余を他の用途に供するものとする。"
