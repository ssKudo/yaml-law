article_title: "第五百七十九条"
article_caption: "（買戻しの特約）"
description: "民法の第五百七十九条は「買戻しの特約」を定める。 本文冒頭: 不動産の売主は、売買契約と同時にした買戻しの特約により、買主が支払った代金（別段の合意をした場合にあっては、その合意により定めた金額。第五百八十三条第一項において同じ。）及び契約の費用を返還して、売買の解除をすることができる。"
