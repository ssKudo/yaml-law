article_title: "第四百五十八条の三"
article_caption: "（主たる債務者が期限の利益を喪失した場合における情報の提供義務）"
description: "民法の第四百五十八条の三は「主たる債務者が期限の利益を喪失した場合における情報の提供義務」を定める。 本文冒頭: 主たる債務者が期限の利益を有する場合において、その利益を喪失したときは、債権者は、保証人に対し、その利益の喪失を知った時から二箇月以内に、その旨を通知しなければならない。"
