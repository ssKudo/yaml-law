article_num: "433"
article_title: "第四百三十三条"
article_caption: "（連帯債権者の一人との間の更改又は免除）"
description: "民法の第四百三十三条は「連帯債権者の一人との間の更改又は免除」を定める。 本文冒頭: 連帯債権者の一人と債務者との間に更改又は免除があったときは、その連帯債権者がその権利を失わなければ分与されるべき利益に係る部分については、他の連帯債権者は、履行を請求することができない。"
