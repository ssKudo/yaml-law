article_title: "第六百十二条"
article_caption: "（賃借権の譲渡及び転貸の制限）"
description: "民法の第六百十二条は「賃借権の譲渡及び転貸の制限」を定める。 本文冒頭: 賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、又は賃借物を転貸することができない。"
