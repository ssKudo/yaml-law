description: "民法の第四百六十五条の二は「個人根保証契約の保証人の責任等」を定める。 本文冒頭: 一定の範囲に属する不特定の債務を主たる債務とする保証契約（以下「根保証契約」という。）であって保証人が法人でないもの（以下「個人根保証契約」という。）の保証人は、主たる債務の元本、主たる債務に関する利息、違約金、損害賠償その他その債務に従たる全てのもの及びその保証債務について約定された違約金又は損害賠償の額について、その全部に係る極度額を限度として、その履行…"
