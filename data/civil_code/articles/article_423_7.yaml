article_num: "423_7"
article_title: "第四百二十三条の七"
article_caption: "（登記又は登録の請求権を保全するための債権者代位権）"
description: "民法の第四百二十三条の七は「登記又は登録の請求権を保全するための債権者代位権」を定める。 本文冒頭: 登記又は登録をしなければ権利の得喪及び変更を第三者に対抗することができない財産を譲り受けた者は、その譲渡人が第三者に対して有する登記手続又は登録手続をすべきことを請求する権利を行使しないときは、その権利を行使することができる。"
