article_title: "第二百八十九条"
article_caption: "（承役地の時効取得による地役権の消滅）"
description: "民法の第二百八十九条は「承役地の時効取得による地役権の消滅」を定める。 本文冒頭: 承役地の占有者が取得時効に必要な要件を具備する占有をしたときは、地役権は、これによって消滅する。"
