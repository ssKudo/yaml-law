article_caption: "（仮差押え等による時効の完成猶予）"
description: "民法の第百四十九条は「仮差押え等による時効の完成猶予」を定める。 本文冒頭: 次に掲げる事由がある場合には、その事由が終了した時から六箇月を経過するまでの間は、時効は、完成しない。"
