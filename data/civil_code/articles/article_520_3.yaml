description: "民法の第五百二十条の三は「指図証券の裏書の方式」を定める。 本文冒頭: 指図証券の譲渡については、その指図証券の性質に応じ、手形法（昭和七年法律第二十号）中裏書の方式に関する規定を準用する。"
