article_num: "893"
article_title: "第八百九十三条"
article_caption: "（遺言による推定相続人の廃除）"
description: "民法の第八百九十三条は「遺言による推定相続人の廃除」を定める。 本文冒頭: 被相続人が遺言で推定相続人を廃除する意思を表示したときは、遺言執行者は、その遺言が効力を生じた後、遅滞なく、その推定相続人の廃除を家庭裁判所に請求しなければならない。"
