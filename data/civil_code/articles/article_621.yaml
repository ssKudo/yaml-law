article_title: "第六百二十一条"
article_caption: "（賃借人の原状回復義務）"
description: "民法の第六百二十一条は「賃借人の原状回復義務」を定める。 本文冒頭: 賃借人は、賃借物を受け取った後にこれに生じた損傷（通常の使用及び収益によって生じた賃借物の損耗並びに賃借物の経年変化を除く。以下この条において同じ。）がある場合において、賃貸借が終了したときは、その損傷を原状に復する義務を負う。"
