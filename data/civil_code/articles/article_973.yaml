article_title: "第九百七十三条"
article_caption: "（成年被後見人の遺言）"
description: "民法の第九百七十三条は「成年被後見人の遺言」を定める。 本文冒頭: 成年被後見人が事理を弁識する能力を一時回復した時において遺言をするには、医師二人以上の立会いがなければならない。"
