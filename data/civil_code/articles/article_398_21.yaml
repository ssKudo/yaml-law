article_num: "398_21"
article_title: "第三百九十八条の二十一"
article_caption: "（根抵当権の極度額の減額請求）"
description: "民法の第三百九十八条の二十一は「根抵当権の極度額の減額請求」を定める。 本文冒頭: 元本の確定後においては、根抵当権設定者は、その根抵当権の極度額を、現に存する債務の額と以後二年間に生ずべき利息その他の定期金及び債務の不履行による損害賠償の額とを加えた額に減額することを請求することができる。"
