article_title: "第百五十八条"
article_caption: "（未成年者又は成年被後見人と時効の完成猶予）"
description: "民法の第百五十八条は「未成年者又は成年被後見人と時効の完成猶予」を定める。 本文冒頭: 時効の期間の満了前六箇月以内の間に未成年者又は成年被後見人に法定代理人がないときは、その未成年者若しくは成年被後見人が行為能力者となった時又は法定代理人が就職した時から六箇月を経過するまでの間は、その未成年者又は成年被後見人に対して、時効は、完成しない。"
