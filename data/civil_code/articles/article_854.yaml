article_caption: "（財産の目録の作成前の権限）"
description: "民法の第八百五十四条は「財産の目録の作成前の権限」を定める。 本文冒頭: 後見人は、財産の目録の作成を終わるまでは、急迫の必要がある行為のみをする権限を有する。"
