article_title: "第四百二十三条の四"
article_caption: "（相手方の抗弁）"
description: "民法の第四百二十三条の四は「相手方の抗弁」を定める。 本文冒頭: 債権者が被代位権利を行使したときは、相手方は、債務者に対して主張することができる抗弁をもって、債権者に対抗することができる。"
