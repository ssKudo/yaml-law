article_title: "第三百九十七条"
article_caption: "（抵当不動産の時効取得による抵当権の消滅）"
description: "民法の第三百九十七条は「抵当不動産の時効取得による抵当権の消滅」を定める。 本文冒頭: 債務者又は抵当権設定者でない者が抵当不動産について取得時効に必要な要件を具備する占有をしたときは、抵当権は、これによって消滅する。"
