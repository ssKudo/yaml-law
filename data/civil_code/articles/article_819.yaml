article_title: "第八百十九条"
article_caption: "（離婚又は認知の場合の親権者）"
description: "民法の第八百十九条は「離婚又は認知の場合の親権者」を定める。 本文冒頭: 父母が協議上の離婚をするときは、その協議で、その双方又は一方を親権者と定める。"
