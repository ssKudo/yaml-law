article_title: "第百九十三条"
article_caption: "（盗品又は遺失物の回復）"
description: "民法の第百九十三条は「盗品又は遺失物の回復」を定める。 本文冒頭: 前条の場合において、占有物が盗品又は遺失物であるときは、被害者又は遺失者は、盗難又は遺失の時から二年間、占有者に対してその物の回復を請求することができる。"
