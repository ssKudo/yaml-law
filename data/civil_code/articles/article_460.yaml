article_title: "第四百六十条"
article_caption: "（委託を受けた保証人の事前の求償権）"
description: "民法の第四百六十条は「委託を受けた保証人の事前の求償権」を定める。 本文冒頭: 保証人は、主たる債務者の委託を受けて保証をした場合において、次に掲げるときは、主たる債務者に対して、あらかじめ、求償権を行使することができる。"
