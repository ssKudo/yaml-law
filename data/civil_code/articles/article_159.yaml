article_title: "第百五十九条"
article_caption: "（夫婦間の権利の時効の完成猶予）"
description: "民法の第百五十九条は「夫婦間の権利の時効の完成猶予」を定める。 本文冒頭: 夫婦の一方が他の一方に対して有する権利については、婚姻の解消の時から六箇月を経過するまでの間は、時効は、完成しない。"
