article_caption: "（使用者の権利の譲渡の制限等）"
description: "民法の第六百二十五条は「使用者の権利の譲渡の制限等」を定める。 本文冒頭: 使用者は、労働者の承諾を得なければ、その権利を第三者に譲り渡すことができない。"
