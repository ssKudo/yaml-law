article_title: "第九百五十条"
article_caption: "（相続人の債権者の請求による財産分離）"
description: "民法の第九百五十条は「相続人の債権者の請求による財産分離」を定める。 本文冒頭: 相続人が限定承認をすることができる間又は相続財産が相続人の固有財産と混合しない間は、相続人の債権者は、家庭裁判所に対して財産分離の請求をすることができる。"
