article_caption: "（一部弁済による代位）"
description: "民法の第五百二条は「一部弁済による代位」を定める。 本文冒頭: 債権の一部について代位弁済があったときは、代位者は、債権者の同意を得て、その弁済をした価額に応じて、債権者とともにその権利を行使することができる。"
