article_caption: "（選択債権における選択権の帰属）"
description: "民法の第四百六条は「選択債権における選択権の帰属」を定める。 本文冒頭: 債権の目的が数個の給付の中から選択によって定まるときは、その選択権は、債務者に属する。"
