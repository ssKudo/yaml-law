article_title: "第百六十三条"
article_caption: "（所有権以外の財産権の取得時効）"
description: "民法の第百六十三条は「所有権以外の財産権の取得時効」を定める。 本文冒頭: 所有権以外の財産権を、自己のためにする意思をもって、平穏に、かつ、公然と行使する者は、前条の区別に従い二十年又は十年を経過した後、その権利を取得する。"
