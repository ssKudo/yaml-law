article_title: "第九百九条の二"
article_caption: "（遺産の分割前における預貯金債権の行使）"
description: "民法の第九百九条の二は「遺産の分割前における預貯金債権の行使」を定める。 本文冒頭: 各共同相続人は、遺産に属する預貯金債権のうち相続開始の時の債権額の三分の一に第九百条及び第九百一条の規定により算定した当該共同相続人の相続分を乗じた額（標準的な当面の必要生計費、平均的な葬式の費用の額その他の事情を勘案して預貯金債権の債務者ごとに法務省令で定める額を限度とする。）については、単独でその権利を行使することができる。"
