article_title: "第九十二条"
article_caption: "（任意規定と異なる慣習）"
description: "民法の第九十二条は「任意規定と異なる慣習」を定める。 本文冒頭: 法令中の公の秩序に関しない規定と異なる慣習がある場合において、法律行為の当事者がその慣習による意思を有しているものと認められるときは、その慣習に従う。"
