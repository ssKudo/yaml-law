description: "民法の第四百六十六条の三の規定。 本文冒頭: 第四百六十六条の三 前条第一項に規定する場合において、譲渡人について破産手続開始の決定があったときは、譲受人（同項の債権の全額を譲り受けた者であって、その債権の譲渡を債務者その他の第三者に対抗することができるものに限る。）は、譲渡制限の意思表示がされたことを知り、又は重大な過失によって知らなかったときであっても、債務者にその債権の全額に相当する金銭を債務の履…"
