article_caption: "（受領権者以外の者に対する弁済）"
description: "民法の第四百七十九条は「受領権者以外の者に対する弁済」を定める。 本文冒頭: 前条の場合を除き、受領権者以外の者に対してした弁済は、債権者がこれによって利益を受けた限度においてのみ、その効力を有する。"
