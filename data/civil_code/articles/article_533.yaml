article_num: "533"
article_title: "第五百三十三条"
article_caption: "（同時履行の抗弁）"
description: "民法の第五百三十三条は「同時履行の抗弁」を定める。 本文冒頭: 双務契約の当事者の一方は、相手方がその債務の履行（債務の履行に代わる損害賠償の債務の履行を含む。）を提供するまでは、自己の債務の履行を拒むことができる。"
