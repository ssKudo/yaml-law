article_title: "第四百六十七条"
article_caption: "（債権の譲渡の対抗要件）"
description: "民法の第四百六十七条は「債権の譲渡の対抗要件」を定める。 本文冒頭: 債権の譲渡（現に発生していない債権の譲渡を含む。）は、譲渡人が債務者に通知をし、又は債務者が承諾をしなければ、債務者その他の第三者に対抗することができない。"
