article_title: "第八百六十四条"
article_caption: "（後見監督人の同意を要する行為）"
description: "民法の第八百六十四条は「後見監督人の同意を要する行為」を定める。 本文冒頭: 後見人が、被後見人に代わって営業若しくは第十三条第一項各号に掲げる行為をし、又は未成年被後見人がこれをすることに同意するには、後見監督人があるときは、その同意を得なければならない。"
