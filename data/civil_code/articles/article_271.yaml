article_title: "第二百七十一条"
article_caption: "（永小作人による土地の変更の制限）"
description: "民法の第二百七十一条は「永小作人による土地の変更の制限」を定める。 本文冒頭: 永小作人は、土地に対して、回復することのできない損害を生ずべき変更を加えることができない。"
