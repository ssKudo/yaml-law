article_title: "第九百四十七条"
article_caption: "（相続債権者及び受遺者に対する弁済）"
description: "民法の第九百四十七条は「相続債権者及び受遺者に対する弁済」を定める。 本文冒頭: 相続人は、第九百四十一条第一項及び第二項の期間の満了前には、相続債権者及び受遺者に対して弁済を拒むことができる。"
