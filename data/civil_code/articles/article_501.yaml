article_caption: "（弁済による代位の効果）"
description: "民法の第五百一条は「弁済による代位の効果」を定める。 本文冒頭: 前二条の規定により債権者に代位した者は、債権の効力及び担保としてその債権者が有していた一切の権利を行使することができる。"
