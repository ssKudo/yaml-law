article_title: "第三百二十二条"
article_caption: "（種苗又は肥料の供給の先取特権）"
description: "民法の第三百二十二条は「種苗又は肥料の供給の先取特権」を定める。 本文冒頭: 種苗又は肥料の供給の先取特権は、種苗又は肥料の代価及びその利息に関し、その種苗又は肥料を用いた後一年以内にこれを用いた土地から生じた果実（蚕種又は蚕の飼養に供した桑葉の使用によって生じた物を含む。）について存在する。"
