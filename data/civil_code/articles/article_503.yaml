article_title: "第五百三条"
article_caption: "（債権者による債権証書の交付等）"
description: "民法の第五百三条は「債権者による債権証書の交付等」を定める。 本文冒頭: 代位弁済によって全部の弁済を受けた債権者は、債権に関する証書及び自己の占有する担保物を代位者に交付しなければならない。"
