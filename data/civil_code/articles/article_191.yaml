article_title: "第百九十一条"
article_caption: "（占有者による損害賠償）"
description: "民法の第百九十一条は「占有者による損害賠償」を定める。 本文冒頭: 占有物が占有者の責めに帰すべき事由によって滅失し、又は損傷したときは、その回復者に対し、悪意の占有者はその損害の全部の賠償をする義務を負い、善意の占有者はその滅失又は損傷によって現に利益を受けている限度において賠償をする義務を負う。"
