article_title: "第二百五十五条"
article_caption: "（持分の放棄及び共有者の死亡）"
description: "民法の第二百五十五条は「持分の放棄及び共有者の死亡」を定める。 本文冒頭: 共有者の一人が、その持分を放棄したとき、又は死亡して相続人がないときは、その持分は、他の共有者に帰属する。"
