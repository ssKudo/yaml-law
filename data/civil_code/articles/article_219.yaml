article_caption: "（水流の変更）"
description: "民法の第二百十九条は「水流の変更」を定める。 本文冒頭: 溝、堀その他の水流地の所有者は、対岸の土地が他人の所有に属するときは、その水路又は幅員を変更してはならない。"
