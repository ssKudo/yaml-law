article_caption: "（扶養の順位）"
description: "民法の第八百七十八条は「扶養の順位」を定める。 本文冒頭: 扶養をする義務のある者が数人ある場合において、扶養をすべき者の順序について、当事者間に協議が調わないとき、又は協議をすることができないときは、家庭裁判所が、これを定める。"
