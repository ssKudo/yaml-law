article_title: "第三百三十八条"
article_caption: "（不動産工事の先取特権の登記）"
description: "民法の第三百三十八条は「不動産工事の先取特権の登記」を定める。 本文冒頭: 不動産の工事の先取特権の効力を保存するためには、工事を始める前にその費用の予算額を登記しなければならない。"
