article_title: "第五百四十三条"
article_caption: "（債権者の責めに帰すべき事由による場合）"
description: "民法の第五百四十三条は「債権者の責めに帰すべき事由による場合」を定める。 本文冒頭: 債務の不履行が債権者の責めに帰すべき事由によるものであるときは、債権者は、前二条の規定による契約の解除をすることができない。"
