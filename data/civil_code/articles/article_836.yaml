article_title: "第八百三十六条"
article_caption: "（親権喪失、親権停止又は管理権喪失の審判の取消し）"
description: "民法の第八百三十六条は「親権喪失、親権停止又は管理権喪失の審判の取消し」を定める。 本文冒頭: 第八百三十四条本文、第八百三十四条の二第一項又は前条に規定する原因が消滅したときは、家庭裁判所は、本人又はその親族の請求によって、それぞれ親権喪失、親権停止又は管理権喪失の審判を取り消すことができる。"
