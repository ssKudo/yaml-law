article_title: "第三百六十四条"
article_caption: "（債権を目的とする質権の対抗要件）"
description: "民法の第三百六十四条は「債権を目的とする質権の対抗要件」を定める。 本文冒頭: 債権を目的とする質権の設定（現に発生していない債権を目的とするものを含む。）は、第四百六十七条の規定に従い、第三債務者にその質権の設定を通知し、又は第三債務者がこれを承諾しなければ、これをもって第三債務者その他の第三者に対抗することができない。"
