article_caption: "（遺言執行者の行為の効果）"
description: "民法の第千十五条は「遺言執行者の行為の効果」を定める。 本文冒頭: 遺言執行者がその権限内において遺言執行者であることを示してした行為は、相続人に対して直接にその効力を生ずる。"
