article_title: "第六百八条"
article_caption: "（賃借人による費用の償還請求）"
description: "民法の第六百八条は「賃借人による費用の償還請求」を定める。 本文冒頭: 賃借人は、賃借物について賃貸人の負担に属する必要費を支出したときは、賃貸人に対し、直ちにその償還を請求することができる。"
