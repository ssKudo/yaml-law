article_title: "第五百二十八条"
article_caption: "（申込みに変更を加えた承諾）"
description: "民法の第五百二十八条は「申込みに変更を加えた承諾」を定める。 本文冒頭: 承諾者が、申込みに条件を付し、その他変更を加えてこれを承諾したときは、その申込みの拒絶とともに新たな申込みをしたものとみなす。"
