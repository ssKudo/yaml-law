description: "民法の第百五十四条の規定。 本文冒頭: 第百五十四条 第百四十八条第一項各号又は第百四十九条各号に掲げる事由に係る手続は、時効の利益を受ける者に対してしないときは、その者に通知をした後でなければ、第百四十八条又は第百四十九条の規定による時効の完成猶予又は更新の効力を生じない。"
