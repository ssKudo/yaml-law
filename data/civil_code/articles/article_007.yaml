article_title: "第七条"
article_caption: "（後見開始の審判）"
description: "民法の第七条は「後見開始の審判」を定める。 本文冒頭: 精神上の障害により事理を弁識する能力を欠く常況にある者については、家庭裁判所は、本人、配偶者、四親等内の親族、未成年後見人、未成年後見監督人、保佐人、保佐監督人、補助人、補助監督人又は検察官の請求により、後見開始の審判をすることができる。"
