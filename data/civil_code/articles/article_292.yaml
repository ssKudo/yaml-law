description: "民法の第二百九十二条の規定。 本文冒頭: 第二百九十二条 要役地が数人の共有に属する場合において、その一人のために時効の完成猶予又は更新があるときは、その完成猶予又は更新は、他の共有者のためにも、その効力を生ずる。"
