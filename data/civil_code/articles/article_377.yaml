article_title: "第三百七十七条"
article_caption: "（抵当権の処分の対抗要件）"
description: "民法の第三百七十七条は「抵当権の処分の対抗要件」を定める。 本文冒頭: 前条の場合には、第四百六十七条の規定に従い、主たる債務者に抵当権の処分を通知し、又は主たる債務者がこれを承諾しなければ、これをもって主たる債務者、保証人、抵当権設定者及びこれらの者の承継人に対抗することができない。"
