article_title: "第五百六十条"
article_caption: "（権利移転の対抗要件に係る売主の義務）"
description: "民法の第五百六十条は「権利移転の対抗要件に係る売主の義務」を定める。 本文冒頭: 売主は、買主に対し、登記、登録その他の売買の目的である権利の移転についての対抗要件を備えさせる義務を負う。"
