article_title: "第五百七十条"
article_caption: "（抵当権等がある場合の買主による費用の償還請求）"
description: "民法の第五百七十条は「抵当権等がある場合の買主による費用の償還請求」を定める。 本文冒頭: 買い受けた不動産について契約の内容に適合しない先取特権、質権又は抵当権が存していた場合において、買主が費用を支出してその不動産の所有権を保存したときは、買主は、売主に対し、その費用の償還を請求することができる。"
