article_title: "第二百四十三条"
article_caption: "（動産の付合）"
description: "民法の第二百四十三条は「動産の付合」を定める。 本文冒頭: 所有者を異にする数個の動産が、付合により、損傷しなければ分離することができなくなったときは、その合成物の所有権は、主たる動産の所有者に帰属する。"
