article_title: "第九百五条"
article_caption: "（相続分の取戻権）"
description: "民法の第九百五条は「相続分の取戻権」を定める。 本文冒頭: 共同相続人の一人が遺産の分割前にその相続分を第三者に譲り渡したときは、他の共同相続人は、その価額及び費用を償還して、その相続分を譲り受けることができる。"
