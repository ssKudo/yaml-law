article_caption: "（共同不法行為者の責任）"
description: "民法の第七百十九条は「共同不法行為者の責任」を定める。 本文冒頭: 数人が共同の不法行為によって他人に損害を加えたときは、各自が連帯してその損害を賠償する責任を負う。"
