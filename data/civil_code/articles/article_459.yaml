article_num: "459"
article_title: "第四百五十九条"
article_caption: "（委託を受けた保証人の求償権）"
description: "民法の第四百五十九条は「委託を受けた保証人の求償権」を定める。 本文冒頭: 保証人が主たる債務者の委託を受けて保証をした場合において、主たる債務者に代わって弁済その他自己の財産をもって債務を消滅させる行為（以下「債務の消滅行為」という。）をしたときは、その保証人は、主たる債務者に対し、そのために支出した財産の額（その財産の額がその債務の消滅行為によって消滅した主たる債務の額を超える場合にあっては、その消滅した額）の求償権を有する。"
