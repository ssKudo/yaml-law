article_title: "第七百六十二条"
article_caption: "（夫婦間における財産の帰属）"
description: "民法の第七百六十二条は「夫婦間における財産の帰属」を定める。 本文冒頭: 夫婦の一方が婚姻前から有する財産及び婚姻中自己の名で得た財産は、その特有財産（夫婦の一方が単独で有する財産をいう。）とする。"
