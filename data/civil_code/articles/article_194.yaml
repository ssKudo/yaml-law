description: "民法の第百九十四条の規定。 本文冒頭: 第百九十四条 占有者が、盗品又は遺失物を、競売若しくは公の市場において、又はその物と同種の物を販売する商人から、善意で買い受けたときは、被害者又は遺失者は、占有者が支払った代価を弁償しなければ、その物を回復することができない。"
