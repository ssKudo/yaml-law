article_title: "第三百八条の二"
article_caption: "（子の監護費用の先取特権）"
description: "民法の第三百八条の二は「子の監護費用の先取特権」を定める。 本文冒頭: 子の監護の費用の先取特権は、次に掲げる義務に係る確定期限の定めのある定期金債権の各期における定期金のうち子の監護に要する費用として相当な額（子の監護に要する標準的な費用その他の事情を勘案して当該定期金により扶養を受けるべき子の数に応じて法務省令で定めるところにより算定した額）について存在する。"
