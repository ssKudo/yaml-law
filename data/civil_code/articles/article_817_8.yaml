article_title: "第八百十七条の八"
article_caption: "（監護の状況）"
description: "民法の第八百十七条の八は「監護の状況」を定める。 本文冒頭: 特別養子縁組を成立させるには、養親となる者が養子となる者を六箇月以上の期間監護した状況を考慮しなければならない。"
