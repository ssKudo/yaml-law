article_title: "第六百三十七条"
article_caption: "（目的物の種類又は品質に関する担保責任の期間の制限）"
description: "民法の第六百三十七条は「目的物の種類又は品質に関する担保責任の期間の制限」を定める。 本文冒頭: 前条本文に規定する場合において、注文者がその不適合を知った時から一年以内にその旨を請負人に通知しないときは、注文者は、その不適合を理由として、履行の追完の請求、報酬の減額の請求、損害賠償の請求及び契約の解除をすることができない。"
