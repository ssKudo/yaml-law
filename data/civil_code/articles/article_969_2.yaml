article_title: "第九百六十九条の二"
article_caption: "（公正証書遺言の方式の特則）"
description: "民法の第九百六十九条の二は「公正証書遺言の方式の特則」を定める。 本文冒頭: 口がきけない者が公正証書によって遺言をする場合には、遺言者は、公証人及び証人の前で、遺言の趣旨を通訳人の通訳により申述し、又は自書して、前条第一項第二号の口授に代えなければならない。"
