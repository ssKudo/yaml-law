article_num: "25"
article_title: "第二十五条"
article_caption: "（不在者の財産の管理）"
description: "民法の第二十五条は「不在者の財産の管理」を定める。 本文冒頭: 従来の住所又は居所を去った者（以下「不在者」という。）がその財産の管理人（以下この節において単に「管理人」という。）を置かなかったときは、家庭裁判所は、利害関係人又は検察官の請求により、その財産の管理について必要な処分を命ずることができる。"
