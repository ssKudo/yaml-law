article_caption: "（旅館宿泊の先取特権）"
description: "民法の第三百十七条は「旅館宿泊の先取特権」を定める。 本文冒頭: 旅館の宿泊の先取特権は、宿泊客が負担すべき宿泊料及び飲食料に関し、その旅館に在るその宿泊客の手荷物について存在する。"
