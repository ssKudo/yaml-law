article_caption: "（先取特権と第三取得者）"
description: "民法の第三百三十三条は「先取特権と第三取得者」を定める。 本文冒頭: 先取特権は、債務者がその目的である動産をその第三取得者に引き渡した後は、その動産について行使することができない。"
