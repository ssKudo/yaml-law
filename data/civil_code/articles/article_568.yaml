article_title: "第五百六十八条"
article_caption: "（競売における担保責任等）"
description: "民法の第五百六十八条は「競売における担保責任等」を定める。 本文冒頭: 民事執行法その他の法律の規定に基づく競売（以下この条において単に「競売」という。）における買受人は、第五百四十一条及び第五百四十二条の規定並びに第五百六十三条（第五百六十五条において準用する場合を含む。）の規定により、債務者に対し、契約の解除をし、又は代金の減額を請求することができる。"
