article_title: "第九百十条"
article_caption: "（相続の開始後に認知された者の価額の支払請求権）"
description: "民法の第九百十条は「相続の開始後に認知された者の価額の支払請求権」を定める。 本文冒頭: 相続の開始後認知によって相続人となった者が遺産の分割を請求しようとする場合において、他の共同相続人が既にその分割その他の処分をしたときは、価額のみによる支払の請求権を有する。"
