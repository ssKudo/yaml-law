article_title: "第四百七十一条"
article_caption: "（併存的債務引受における引受人の抗弁等）"
description: "民法の第四百七十一条は「併存的債務引受における引受人の抗弁等」を定める。 本文冒頭: 引受人は、併存的債務引受により負担した自己の債務について、その効力が生じた時に債務者が主張することができた抗弁をもって債権者に対抗することができる。"
