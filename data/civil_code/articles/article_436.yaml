article_num: "436"
article_title: "第四百三十六条"
article_caption: "（連帯債務者に対する履行の請求）"
description: "民法の第四百三十六条は「連帯債務者に対する履行の請求」を定める。 本文冒頭: 債務の目的がその性質上可分である場合において、法令の規定又は当事者の意思表示によって数人が連帯して債務を負担するときは、債権者は、その連帯債務者の一人に対し、又は同時に若しくは順次に全ての連帯債務者に対し、全部又は一部の履行を請求することができる。"
