article_title: "第六百六十五条の二"
article_caption: "（混合寄託）"
description: "民法の第六百六十五条の二は「混合寄託」を定める。 本文冒頭: 複数の者が寄託した物の種類及び品質が同一である場合には、受寄者は、各寄託者の承諾を得たときに限り、これらを混合して保管することができる。"
