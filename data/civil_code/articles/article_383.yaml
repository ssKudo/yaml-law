description: "民法の第三百八十三条は「抵当権消滅請求の手続」を定める。 本文冒頭: 抵当不動産の第三取得者は、抵当権消滅請求をするときは、登記をした各債権者に対し、次に掲げる書面を送付しなければならない。"
