article_title: "第四百五十九条の二"
article_caption: "（委託を受けた保証人が弁済期前に弁済等をした場合の求償権）"
description: "民法の第四百五十九条の二は「委託を受けた保証人が弁済期前に弁済等をした場合の求償権」を定める。 本文冒頭: 保証人が主たる債務者の委託を受けて保証をした場合において、主たる債務の弁済期前に債務の消滅行為をしたときは、その保証人は、主たる債務者に対し、主たる債務者がその当時利益を受けた限度において求償権を有する。"
