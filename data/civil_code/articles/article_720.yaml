article_title: "第七百二十条"
article_caption: "（正当防衛及び緊急避難）"
description: "民法の第七百二十条は「正当防衛及び緊急避難」を定める。 本文冒頭: 他人の不法行為に対し、自己又は第三者の権利又は法律上保護される利益を防衛するため、やむを得ず加害行為をした者は、損害賠償の責任を負わない。"
