article_title: "第五百七十六条"
article_caption: "（権利を取得することができない等のおそれがある場合の買主による代金の支払の拒絶）"
description: "民法の第五百七十六条は「権利を取得することができない等のおそれがある場合の買主による代金の支払の拒絶」を定める。 本文冒頭: 売買の目的について権利を主張する者があることその他の事由により、買主がその買い受けた権利の全部若しくは一部を取得することができず、又は失うおそれがあるときは、買主は、その危険の程度に応じて、代金の全部又は一部の支払を拒むことができる。"
