article_title: "第五百三十九条の二"
article_caption: null
description: "民法の第五百三十九条の二の規定。 本文冒頭: 第五百三十九条の二 契約の当事者の一方が第三者との間で契約上の地位を譲渡する旨の合意をした場合において、その契約の相手方がその譲渡を承諾したときは、契約上の地位は、その第三者に移転する。"
