article_num: "442"
article_title: "第四百四十二条"
article_caption: "（連帯債務者間の求償権）"
description: "民法の第四百四十二条は「連帯債務者間の求償権」を定める。 本文冒頭: 連帯債務者の一人が弁済をし、その他自己の財産をもって共同の免責を得たときは、その連帯債務者は、その免責を得た額が自己の負担部分を超えるかどうかにかかわらず、他の連帯債務者に対し、その免責を得るために支出した財産の額（その財産の額が共同の免責を得た額を超える場合にあっては、その免責を得た額）のうち各自の負担部分に応じた額の求償権を有する。"
