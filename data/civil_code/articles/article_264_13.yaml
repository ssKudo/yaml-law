article_title: "第二百六十四条の十三"
article_caption: "（管理不全土地管理人の報酬等）"
description: "民法の第二百六十四条の十三は「管理不全土地管理人の報酬等」を定める。 本文冒頭: 管理不全土地管理人は、管理不全土地等から裁判所が定める額の費用の前払及び報酬を受けることができる。"
