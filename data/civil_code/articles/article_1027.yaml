article_title: "第千二十七条"
article_caption: "（負担付遺贈に係る遺言の取消し）"
description: "民法の第千二十七条は「負担付遺贈に係る遺言の取消し」を定める。 本文冒頭: 負担付遺贈を受けた者がその負担した義務を履行しないときは、相続人は、相当の期間を定めてその履行の催告をすることができる。"
