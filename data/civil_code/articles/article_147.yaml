article_title: "第百四十七条"
article_caption: "（裁判上の請求等による時効の完成猶予及び更新）"
description: "民法の第百四十七条は「裁判上の請求等による時効の完成猶予及び更新」を定める。 本文冒頭: 次に掲げる事由がある場合には、その事由が終了する（確定判決又は確定判決と同一の効力を有するものによって権利が確定することなくその事由が終了した場合にあっては、その終了の時から六箇月を経過する）までの間は、時効は、完成しない。"
