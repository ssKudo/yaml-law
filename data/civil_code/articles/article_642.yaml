article_caption: "（注文者についての破産手続の開始による解除）"
description: "民法の第六百四十二条は「注文者についての破産手続の開始による解除」を定める。 本文冒頭: 注文者が破産手続開始の決定を受けたときは、請負人又は破産管財人は、契約の解除をすることができる。"
