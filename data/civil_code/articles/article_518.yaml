article_num: "518"
article_title: "第五百十八条"
article_caption: "（更改後の債務への担保の移転）"
description: "民法の第五百十八条は「更改後の債務への担保の移転」を定める。 本文冒頭: 債権者（債権者の交替による更改にあっては、更改前の債権者）は、更改前の債務の目的の限度において、その債務の担保として設定された質権又は抵当権を更改後の債務に移すことができる。"
