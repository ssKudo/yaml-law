article_caption: "（雇用）"
description: "民法の第六百二十三条は「雇用」を定める。 本文冒頭: 雇用は、当事者の一方が相手方に対して労働に従事することを約し、相手方がこれに対してその報酬を与えることを約することによって、その効力を生ずる。"
