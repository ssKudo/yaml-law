article_title: "第七百四十九条"
article_caption: "（離婚の規定の準用）"
description: "民法の第七百四十九条は「離婚の規定の準用」を定める。 本文冒頭: 第七百二十八条第一項、第七百六十六条から第七百六十九条まで、第七百九十条第一項ただし書並びに第八百十九条第二項、第三項及び第五項から第七項までの規定は、婚姻の取消しについて準用する。"
