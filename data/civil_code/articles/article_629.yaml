article_title: "第六百二十九条"
article_caption: "（雇用の更新の推定等）"
description: "民法の第六百二十九条は「雇用の更新の推定等」を定める。 本文冒頭: 雇用の期間が満了した後労働者が引き続きその労働に従事する場合において、使用者がこれを知りながら異議を述べないときは、従前の雇用と同一の条件で更に雇用をしたものと推定する。"
