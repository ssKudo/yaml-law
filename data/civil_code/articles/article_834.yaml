article_title: "第八百三十四条"
article_caption: "（親権喪失の審判）"
description: "民法の第八百三十四条は「親権喪失の審判」を定める。 本文冒頭: 父又は母による虐待又は悪意の遺棄があるときその他父又は母による親権の行使が著しく困難又は不適当であることにより子の利益を著しく害するときは、家庭裁判所は、子、その親族、未成年後見人、未成年後見監督人又は検察官の請求により、その父又は母について、親権喪失の審判をすることができる。"
