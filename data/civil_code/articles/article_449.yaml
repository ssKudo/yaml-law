article_num: "449"
article_title: "第四百四十九条"
article_caption: "（取り消すことができる債務の保証）"
description: "民法の第四百四十九条は「取り消すことができる債務の保証」を定める。 本文冒頭: 行為能力の制限によって取り消すことができる債務を保証した者は、保証契約の時においてその取消しの原因を知っていたときは、主たる債務の不履行の場合又はその債務の取消しの場合においてこれと同一の目的を有する独立の債務を負担したものと推定する。"
