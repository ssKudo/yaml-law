article_title: "第二百四十七条"
article_caption: "（付合、混和又は加工の効果）"
description: "民法の第二百四十七条は「付合、混和又は加工の効果」を定める。 本文冒頭: 第二百四十二条から前条までの規定により物の所有権が消滅したときは、その物について存する他の権利も、消滅する。"
