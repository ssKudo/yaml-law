article_title: "第千四十二条"
article_caption: "（遺留分の帰属及びその割合）"
description: "民法の第千四十二条は「遺留分の帰属及びその割合」を定める。 本文冒頭: 兄弟姉妹以外の相続人は、遺留分として、次条第一項に規定する遺留分を算定するための財産の価額に、次の各号に掲げる区分に応じてそれぞれ当該各号に定める割合を乗じた額を受ける。"
