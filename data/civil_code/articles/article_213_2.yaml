article_num: "213_2"
article_title: "第二百十三条の二"
article_caption: "（継続的給付を受けるための設備の設置権等）"
description: "民法の第二百十三条の二は「継続的給付を受けるための設備の設置権等」を定める。 本文冒頭: 土地の所有者は、他の土地に設備を設置し、又は他人が所有する設備を使用しなければ電気、ガス又は水道水の供給その他これらに類する継続的給付（以下この項及び次条第一項において「継続的給付」という。）を受けることができないときは、継続的給付を受けるため必要な範囲内で、他の土地に設備を設置し、又は他人が所有する設備を使用することができる。"
