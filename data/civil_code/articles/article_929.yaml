article_title: "第九百二十九条"
article_caption: "（公告期間満了後の弁済）"
description: "民法の第九百二十九条は「公告期間満了後の弁済」を定める。 本文冒頭: 第九百二十七条第一項の期間が満了した後は、限定承認者は、相続財産をもって、その期間内に同項の申出をした相続債権者その他知れている相続債権者に、それぞれその債権額の割合に応じて弁済をしなければならない。"
