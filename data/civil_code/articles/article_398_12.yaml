article_caption: "（根抵当権の譲渡）"
description: "民法の第三百九十八条の十二は「根抵当権の譲渡」を定める。 本文冒頭: 元本の確定前においては、根抵当権者は、根抵当権設定者の承諾を得て、その根抵当権を譲り渡すことができる。"
