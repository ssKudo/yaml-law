article_title: "第四百六十二条"
article_caption: "（委託を受けない保証人の求償権）"
description: "民法の第四百六十二条は「委託を受けない保証人の求償権」を定める。 本文冒頭: 第四百五十九条の二第一項の規定は、主たる債務者の委託を受けないで保証をした者が債務の消滅行為をした場合について準用する。"
