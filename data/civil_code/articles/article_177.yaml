article_title: "第百七十七条"
article_caption: "（不動産に関する物権の変動の対抗要件）"
description: "民法の第百七十七条は「不動産に関する物権の変動の対抗要件」を定める。 本文冒頭: 不動産に関する物権の得喪及び変更は、不動産登記法（平成十六年法律第百二十三号）その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。"
