article_title: "第四百十五条"
article_caption: "（債務不履行による損害賠償）"
description: "民法の第四百十五条は「債務不履行による損害賠償」を定める。 本文冒頭: 債務者がその債務の本旨に従った履行をしないとき又は債務の履行が不能であるときは、債権者は、これによって生じた損害の賠償を請求することができる。"
