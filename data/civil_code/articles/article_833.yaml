article_caption: "（子に代わる親権の行使）"
description: "民法の第八百三十三条は「子に代わる親権の行使」を定める。 本文冒頭: 父又は母が成年に達しない子であるときは、当該子について親権を行う者が当該子に代わって親権を行う。"
