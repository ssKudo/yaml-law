article_caption: "（短期賃貸借）"
description: "民法の第六百二条は「短期賃貸借」を定める。 本文冒頭: 処分の権限を有しない者が賃貸借をする場合には、次の各号に掲げる賃貸借は、それぞれ当該各号に定める期間を超えることができない。"
