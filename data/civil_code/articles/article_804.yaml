article_title: "第八百四条"
article_caption: "（養親が二十歳未満の者である場合の縁組の取消し）"
description: "民法の第八百四条は「養親が二十歳未満の者である場合の縁組の取消し」を定める。 本文冒頭: 第七百九十二条の規定に違反した縁組は、養親又はその法定代理人から、その取消しを家庭裁判所に請求することができる。"
