article_title: "第五百七十二条"
article_caption: "（担保責任を負わない旨の特約）"
description: "民法の第五百七十二条は「担保責任を負わない旨の特約」を定める。 本文冒頭: 売主は、第五百六十二条第一項本文又は第五百六十五条に規定する場合における担保の責任を負わない旨の特約をしたときであっても、知りながら告げなかった事実及び自ら第三者のために設定し又は第三者に譲り渡した権利については、その責任を免れることができない。"
