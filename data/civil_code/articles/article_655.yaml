article_caption: "（委任の終了の対抗要件）"
description: "民法の第六百五十五条は「委任の終了の対抗要件」を定める。 本文冒頭: 委任の終了事由は、これを相手方に通知したとき、又は相手方がこれを知っていたときでなければ、これをもってその相手方に対抗することができない。"
