article_title: "第十条"
article_caption: "（後見開始の審判の取消し）"
description: "民法の第十条は「後見開始の審判の取消し」を定める。 本文冒頭: 第七条に規定する原因が消滅したときは、家庭裁判所は、本人、配偶者、四親等内の親族、後見人（未成年後見人及び成年後見人をいう。以下同じ。）、後見監督人（未成年後見監督人及び成年後見監督人をいう。以下同じ。）又は検察官の請求により、後見開始の審判を取り消さなければならない。"
