article_title: "第八百七十九条"
article_caption: "（扶養の程度又は方法）"
description: "民法の第八百七十九条は「扶養の程度又は方法」を定める。 本文冒頭: 扶養の程度又は方法について、当事者間に協議が調わないとき、又は協議をすることができないときは、扶養権利者の需要、扶養義務者の資力その他一切の事情を考慮して、家庭裁判所が、これを定める。"
