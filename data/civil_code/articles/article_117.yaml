article_title: "第百十七条"
article_caption: "（無権代理人の責任）"
description: "民法の第百十七条は「無権代理人の責任」を定める。 本文冒頭: 他人の代理人として契約をした者は、自己の代理権を証明したとき、又は本人の追認を得たときを除き、相手方の選択に従い、相手方に対して履行又は損害賠償の責任を負う。"
