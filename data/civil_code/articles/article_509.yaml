article_caption: "（不法行為等により生じた債権を受働債権とする相殺の禁止）"
description: "民法の第五百九条は「不法行為等により生じた債権を受働債権とする相殺の禁止」を定める。 本文冒頭: 次に掲げる債務の債務者は、相殺をもって債権者に対抗することができない。"
