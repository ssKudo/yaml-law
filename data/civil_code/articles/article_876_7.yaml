article_title: "第八百七十六条の七"
article_caption: "（補助人及び臨時補助人の選任等）"
description: "民法の第八百七十六条の七は「補助人及び臨時補助人の選任等」を定める。 本文冒頭: 家庭裁判所は、補助開始の審判をするときは、職権で、補助人を選任する。"
