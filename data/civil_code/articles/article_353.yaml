article_caption: "（質物の占有の回復）"
description: "民法の第三百五十三条は「質物の占有の回復」を定める。 本文冒頭: 動産質権者は、質物の占有を奪われたときは、占有回収の訴えによってのみ、その質物を回復することができる。"
