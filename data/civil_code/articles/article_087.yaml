article_title: "第八十七条"
article_caption: "（主物及び従物）"
description: "民法の第八十七条は「主物及び従物」を定める。 本文冒頭: 物の所有者が、その物の常用に供するため、自己の所有に属する他の物をこれに附属させたときは、その附属させた物を従物とする。"
