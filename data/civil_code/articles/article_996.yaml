article_title: "第九百九十六条"
article_caption: "（相続財産に属しない権利の遺贈）"
description: "民法の第九百九十六条は「相続財産に属しない権利の遺贈」を定める。 本文冒頭: 遺贈は、その目的である権利が遺言者の死亡の時において相続財産に属しなかったときは、その効力を生じない。"
