article_num: "504"
article_title: "第五百四条"
article_caption: "（債権者による担保の喪失等）"
description: "民法の第五百四条は「債権者による担保の喪失等」を定める。 本文冒頭: 弁済をするについて正当な利益を有する者（以下この項において「代位権者」という。）がある場合において、債権者が故意又は過失によってその担保を喪失し、又は減少させたときは、その代位権者は、代位をするに当たって担保の喪失又は減少によって償還を受けることができなくなる限度において、その責任を免れる。"
