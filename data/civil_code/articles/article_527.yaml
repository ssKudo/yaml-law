article_title: "第五百二十七条"
article_caption: "（承諾の通知を必要としない場合における契約の成立時期）"
description: "民法の第五百二十七条は「承諾の通知を必要としない場合における契約の成立時期」を定める。 本文冒頭: 申込者の意思表示又は取引上の慣習により承諾の通知を必要としない場合には、契約は、承諾の意思表示と認めるべき事実があった時に成立する。"
