article_title: "第九百七十九条"
article_caption: "（船舶遭難者の遺言）"
description: "民法の第九百七十九条は「船舶遭難者の遺言」を定める。 本文冒頭: 船舶が遭難した場合において、当該船舶中に在って死亡の危急に迫った者は、証人二人以上の立会いをもって口頭で遺言をすることができる。"
