article_title: "第三百八十八条"
article_caption: "（法定地上権）"
description: "民法の第三百八十八条は「法定地上権」を定める。 本文冒頭: 土地及びその上に存する建物が同一の所有者に属する場合において、その土地又は建物につき抵当権が設定され、その実行により所有者を異にするに至ったときは、その建物について、地上権が設定されたものとみなす。"
