article_num: "976"
article_title: "第九百七十六条"
article_caption: "（死亡の危急に迫った者の遺言）"
description: "民法の第九百七十六条は「死亡の危急に迫った者の遺言」を定める。 本文冒頭: 疾病その他の事由によって死亡の危急に迫った者が遺言をしようとするときは、証人三人以上の立会いをもって、その一人に遺言の趣旨を口授して、これをすることができる。"
