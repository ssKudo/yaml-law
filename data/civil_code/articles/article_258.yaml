article_title: "第二百五十八条"
article_caption: "（裁判による共有物の分割）"
description: "民法の第二百五十八条は「裁判による共有物の分割」を定める。 本文冒頭: 共有物の分割について共有者間に協議が調わないとき、又は協議をすることができないときは、その分割を裁判所に請求することができる。"
