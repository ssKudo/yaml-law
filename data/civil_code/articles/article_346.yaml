article_title: "第三百四十六条"
article_caption: "（質権の被担保債権の範囲）"
description: "民法の第三百四十六条は「質権の被担保債権の範囲」を定める。 本文冒頭: 質権は、元本、利息、違約金、質権の実行の費用、質物の保存の費用及び債務の不履行又は質物の隠れた瑕疵によって生じた損害の賠償を担保する。"
