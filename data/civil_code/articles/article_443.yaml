article_title: "第四百四十三条"
article_caption: "（通知を怠った連帯債務者の求償の制限）"
description: "民法の第四百四十三条は「通知を怠った連帯債務者の求償の制限」を定める。 本文冒頭: 他の連帯債務者があることを知りながら、連帯債務者の一人が共同の免責を得ることを他の連帯債務者に通知しないで弁済をし、その他自己の財産をもって共同の免責を得た場合において、他の連帯債務者は、債権者に対抗することができる事由を有していたときは、その負担部分について、その事由をもってその免責を得た連帯債務者に対抗することができる。"
