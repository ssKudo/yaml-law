article_title: "第四百九十七条"
article_caption: "（供託に適しない物等）"
description: "民法の第四百九十七条は「供託に適しない物等」を定める。 本文冒頭: 弁済者は、次に掲げる場合には、裁判所の許可を得て、弁済の目的物を競売に付し、その代金を供託することができる。"
