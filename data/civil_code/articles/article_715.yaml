article_title: "第七百十五条"
article_caption: "（使用者等の責任）"
description: "民法の第七百十五条は「使用者等の責任」を定める。 本文冒頭: ある事業のために他人を使用する者は、被用者がその事業の執行について第三者に加えた損害を賠償する責任を負う。"
