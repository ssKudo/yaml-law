article_title: "第千四十三条"
article_caption: "（遺留分を算定するための財産の価額）"
description: "民法の第千四十三条は「遺留分を算定するための財産の価額」を定める。 本文冒頭: 遺留分を算定するための財産の価額は、被相続人が相続開始の時において有した財産の価額にその贈与した財産の価額を加えた額から債務の全額を控除した額とする。"
