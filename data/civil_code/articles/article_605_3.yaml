article_title: "第六百五条の三"
article_caption: "（合意による不動産の賃貸人たる地位の移転）"
description: "民法の第六百五条の三は「合意による不動産の賃貸人たる地位の移転」を定める。 本文冒頭: 不動産の譲渡人が賃貸人であるときは、その賃貸人たる地位は、賃借人の承諾を要しないで、譲渡人と譲受人との合意により、譲受人に移転させることができる。"
