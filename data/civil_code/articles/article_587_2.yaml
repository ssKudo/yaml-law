article_num: "587_2"
article_title: "第五百八十七条の二"
article_caption: "（書面でする消費貸借等）"
description: "民法の第五百八十七条の二は「書面でする消費貸借等」を定める。 本文冒頭: 前条の規定にかかわらず、書面でする消費貸借は、当事者の一方が金銭その他の物を引き渡すことを約し、相手方がその受け取った物と種類、品質及び数量の同じ物をもって返還をすることを約することによって、その効力を生ずる。"
