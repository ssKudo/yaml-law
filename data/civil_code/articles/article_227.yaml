article_title: "第二百二十七条"
article_caption: "（相隣者の一人による囲障の設置）"
description: "民法の第二百二十七条は「相隣者の一人による囲障の設置」を定める。 本文冒頭: 相隣者の一人は、第二百二十五条第二項に規定する材料より良好なものを用い、又は同項に規定する高さを増して囲障を設けることができる。"
