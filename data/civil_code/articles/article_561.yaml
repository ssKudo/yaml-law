article_num: "561"
article_title: "第五百六十一条"
article_caption: "（他人の権利の売買における売主の義務）"
description: "民法の第五百六十一条は「他人の権利の売買における売主の義務」を定める。 本文冒頭: 他人の権利（権利の一部が他人に属する場合におけるその権利の一部を含む。）を売買の目的としたときは、売主は、その権利を取得して買主に移転する義務を負う。"
