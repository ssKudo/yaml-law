article_num: "465_8"
article_title: "第四百六十五条の八"
article_caption: "（公正証書の作成と求償権についての保証の効力）"
description: "民法の第四百六十五条の八は「公正証書の作成と求償権についての保証の効力」を定める。 本文冒頭: 第四百六十五条の六第一項及び第二項並びに前条の規定は、事業のために負担した貸金等債務を主たる債務とする保証契約又は主たる債務の範囲に事業のために負担する貸金等債務が含まれる根保証契約の保証人の主たる債務者に対する求償権に係る債務を主たる債務とする保証契約について準用する。"
