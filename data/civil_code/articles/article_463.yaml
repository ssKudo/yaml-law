article_num: "463"
article_title: "第四百六十三条"
article_caption: "（通知を怠った保証人の求償の制限等）"
description: "民法の第四百六十三条は「通知を怠った保証人の求償の制限等」を定める。 本文冒頭: 保証人が主たる債務者の委託を受けて保証をした場合において、主たる債務者にあらかじめ通知しないで債務の消滅行為をしたときは、主たる債務者は、債権者に対抗することができた事由をもってその保証人に対抗することができる。"
