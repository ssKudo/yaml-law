article_title: "第八百九十九条の二"
article_caption: "（共同相続における権利の承継の対抗要件）"
description: "民法の第八百九十九条の二は「共同相続における権利の承継の対抗要件」を定める。 本文冒頭: 相続による権利の承継は、遺産の分割によるものかどうかにかかわらず、次条及び第九百一条の規定により算定した相続分を超える部分については、登記、登録その他の対抗要件を備えなければ、第三者に対抗することができない。"
