article_title: "第二百五十一条"
article_caption: "（共有物の変更）"
description: "民法の第二百五十一条は「共有物の変更」を定める。 本文冒頭: 各共有者は、他の共有者の同意を得なければ、共有物に変更（その形状又は効用の著しい変更を伴わないものを除く。次項において同じ。）を加えることができない。"
