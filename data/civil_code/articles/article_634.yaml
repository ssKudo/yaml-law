article_title: "第六百三十四条"
article_caption: "（注文者が受ける利益の割合に応じた報酬）"
description: "民法の第六百三十四条は「注文者が受ける利益の割合に応じた報酬」を定める。 本文冒頭: 次に掲げる場合において、請負人が既にした仕事の結果のうち可分な部分の給付によって注文者が利益を受けるときは、その部分を仕事の完成とみなす。"
