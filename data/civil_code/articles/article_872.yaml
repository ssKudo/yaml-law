article_title: "第八百七十二条"
article_caption: "（未成年被後見人と未成年後見人等との間の契約等の取消し）"
description: "民法の第八百七十二条は「未成年被後見人と未成年後見人等との間の契約等の取消し」を定める。 本文冒頭: 未成年被後見人が成年に達した後後見の計算の終了前に、その者と未成年後見人又はその相続人との間でした契約は、その者が取り消すことができる。"
