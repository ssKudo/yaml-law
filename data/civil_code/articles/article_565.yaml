article_title: "第五百六十五条"
article_caption: "（移転した権利が契約の内容に適合しない場合における売主の担保責任）"
description: "民法の第五百六十五条は「移転した権利が契約の内容に適合しない場合における売主の担保責任」を定める。 本文冒頭: 前三条の規定は、売主が買主に移転した権利が契約の内容に適合しないものである場合（権利の一部が他人に属する場合においてその権利の一部を移転しないときを含む。）について準用する。"
