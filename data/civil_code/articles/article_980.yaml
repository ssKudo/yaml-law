article_title: "第九百八十条"
article_caption: "（遺言関係者の署名及び押印）"
description: "民法の第九百八十条は「遺言関係者の署名及び押印」を定める。 本文冒頭: 第九百七十七条及び第九百七十八条の場合には、遺言者、筆者、立会人及び証人は、各自遺言書に署名し、印を押さなければならない。"
