article_title: "第九百二十八条"
article_caption: "（公告期間満了前の弁済の拒絶）"
description: "民法の第九百二十八条は「公告期間満了前の弁済の拒絶」を定める。 本文冒頭: 限定承認者は、前条第一項の期間の満了前には、相続債権者及び受遺者に対して弁済を拒むことができる。"
