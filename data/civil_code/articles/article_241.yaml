article_title: "第二百四十一条"
article_caption: "（埋蔵物の発見）"
description: "民法の第二百四十一条は「埋蔵物の発見」を定める。 本文冒頭: 埋蔵物は、遺失物法の定めるところに従い公告をした後六箇月以内にその所有者が判明しないときは、これを発見した者がその所有権を取得する。"
