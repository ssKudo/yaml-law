article_title: "第六百十一条"
article_caption: "（賃借物の一部滅失等による賃料の減額等）"
description: "民法の第六百十一条は「賃借物の一部滅失等による賃料の減額等」を定める。 本文冒頭: 賃借物の一部が滅失その他の事由により使用及び収益をすることができなくなった場合において、それが賃借人の責めに帰することができない事由によるものであるときは、賃料は、その使用及び収益をすることができなくなった部分の割合に応じて、減額される。"
