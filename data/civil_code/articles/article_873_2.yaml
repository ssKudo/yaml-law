article_num: "873_2"
article_title: "第八百七十三条の二"
article_caption: "（成年被後見人の死亡後の成年後見人の権限）"
description: "民法の第八百七十三条の二は「成年被後見人の死亡後の成年後見人の権限」を定める。 本文冒頭: 成年後見人は、成年被後見人が死亡した場合において、必要があるときは、成年被後見人の相続人の意思に反することが明らかなときを除き、相続人が相続財産を管理することができるに至るまで、次に掲げる行為をすることができる。"
