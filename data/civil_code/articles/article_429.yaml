article_title: "第四百二十九条"
article_caption: "（不可分債権者の一人との間の更改又は免除）"
description: "民法の第四百二十九条は「不可分債権者の一人との間の更改又は免除」を定める。 本文冒頭: 不可分債権者の一人と債務者との間に更改又は免除があった場合においても、他の不可分債権者は、債務の全部の履行を請求することができる。"
