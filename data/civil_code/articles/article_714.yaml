article_num: "714"
article_title: "第七百十四条"
article_caption: "（責任無能力者の監督義務者等の責任）"
description: "民法の第七百十四条は「責任無能力者の監督義務者等の責任」を定める。 本文冒頭: 前二条の規定により責任無能力者がその責任を負わない場合において、その責任無能力者を監督する法定の義務を負う者は、その責任無能力者が第三者に加えた損害を賠償する責任を負う。"
