article_caption: "（賃貸借に関する規定の準用）"
description: "民法の第二百七十三条は「賃貸借に関する規定の準用」を定める。 本文冒頭: 永小作人の義務については、この章の規定及び設定行為で定めるもののほか、その性質に反しない限り、賃貸借に関する規定を準用する。"
