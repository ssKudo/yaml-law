article_title: "第四百三十五条の二"
article_caption: "（相対的効力の原則）"
description: "民法の第四百三十五条の二は「相対的効力の原則」を定める。 本文冒頭: 第四百三十二条から前条までに規定する場合を除き、連帯債権者の一人の行為又は一人について生じた事由は、他の連帯債権者に対してその効力を生じない。"
