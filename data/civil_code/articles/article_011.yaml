article_title: "第十一条"
article_caption: "（保佐開始の審判）"
description: "民法の第十一条は「保佐開始の審判」を定める。 本文冒頭: 精神上の障害により事理を弁識する能力が著しく不十分である者については、家庭裁判所は、本人、配偶者、四親等内の親族、後見人、後見監督人、補助人、補助監督人又は検察官の請求により、保佐開始の審判をすることができる。"
