article_num: "483"
article_title: "第四百八十三条"
article_caption: "（特定物の現状による引渡し）"
description: "民法の第四百八十三条は「特定物の現状による引渡し」を定める。 本文冒頭: 債権の目的が特定物の引渡しである場合において、契約その他の債権の発生原因及び取引上の社会通念に照らしてその引渡しをすべき時の品質を定めることができないときは、弁済をする者は、その引渡しをすべき時の現状でその物を引き渡さなければならない。"
