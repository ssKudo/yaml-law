article_num: "264_3"
article_title: "第二百六十四条の三"
article_caption: "（所有者不明土地管理人の権限）"
description: "民法の第二百六十四条の三は「所有者不明土地管理人の権限」を定める。 本文冒頭: 前条第四項の規定により所有者不明土地管理人が選任された場合には、所有者不明土地管理命令の対象とされた土地又は共有持分及び所有者不明土地管理命令の効力が及ぶ動産並びにその管理、処分その他の事由により所有者不明土地管理人が得た財産（以下「所有者不明土地等」という。）の管理及び処分をする権利は、所有者不明土地管理人に専属する。"
