article_num: "424_6"
article_title: "第四百二十四条の六"
article_caption: "（財産の返還又は価額の償還の請求）"
description: "民法の第四百二十四条の六は「財産の返還又は価額の償還の請求」を定める。 本文冒頭: 債権者は、受益者に対する詐害行為取消請求において、債務者がした行為の取消しとともに、その行為によって受益者に移転した財産の返還を請求することができる。"
