article_num: "707"
article_title: "第七百七条"
article_caption: "（他人の債務の弁済）"
description: "民法の第七百七条は「他人の債務の弁済」を定める。 本文冒頭: 債務者でない者が錯誤によって債務の弁済をした場合において、債権者が善意で証書を滅失させ若しくは損傷し、担保を放棄し、又は時効によってその債権を失ったときは、その弁済をした者は、返還の請求をすることができない。"
