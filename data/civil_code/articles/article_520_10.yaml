article_title: "第五百二十条の十"
article_caption: "（指図証券の債務者の調査の権利等）"
description: "民法の第五百二十条の十は「指図証券の債務者の調査の権利等」を定める。 本文冒頭: 指図証券の債務者は、その証券の所持人並びにその署名及び押印の真偽を調査する権利を有するが、その義務を負わない。"
