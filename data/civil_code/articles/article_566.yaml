article_num: "566"
article_title: "第五百六十六条"
article_caption: "（目的物の種類又は品質に関する担保責任の期間の制限）"
description: "民法の第五百六十六条は「目的物の種類又は品質に関する担保責任の期間の制限」を定める。 本文冒頭: 売主が種類又は品質に関して契約の内容に適合しない目的物を買主に引き渡した場合において、買主がその不適合を知った時から一年以内にその旨を売主に通知しないときは、買主は、その不適合を理由として、履行の追完の請求、代金の減額の請求、損害賠償の請求及び契約の解除をすることができない。"
