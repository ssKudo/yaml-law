article_title: "第九百四十三条"
article_caption: "（財産分離の請求後の相続財産の管理）"
description: "民法の第九百四十三条は「財産分離の請求後の相続財産の管理」を定める。 本文冒頭: 財産分離の請求があったときは、家庭裁判所は、相続財産の管理について必要な処分を命ずることができる。"
