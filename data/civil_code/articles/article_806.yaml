article_title: "第八百六条"
article_caption: "（後見人と被後見人との間の無許可縁組の取消し）"
description: "民法の第八百六条は「後見人と被後見人との間の無許可縁組の取消し」を定める。 本文冒頭: 第七百九十四条の規定に違反した縁組は、養子又はその実方の親族から、その取消しを家庭裁判所に請求することができる。"
