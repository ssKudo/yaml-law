article_title: "第九百二十七条"
article_caption: "（相続債権者及び受遺者に対する公告及び催告）"
description: "民法の第九百二十七条は「相続債権者及び受遺者に対する公告及び催告」を定める。 本文冒頭: 限定承認者は、限定承認をした後五日以内に、すべての相続債権者（相続財産に属する債務の債権者をいう。以下同じ。）及び受遺者に対し、限定承認をしたこと及び一定の期間内にその請求の申出をすべき旨を公告しなければならない。"
