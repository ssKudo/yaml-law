article_title: "第三百十三条"
article_caption: "（不動産賃貸の先取特権の目的物の範囲）"
description: "民法の第三百十三条は「不動産賃貸の先取特権の目的物の範囲」を定める。 本文冒頭: 土地の賃貸人の先取特権は、その土地又はその利用のための建物に備え付けられた動産、その土地の利用に供された動産及び賃借人が占有するその土地の果実について存在する。"
