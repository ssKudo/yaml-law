article_title: "第八百九十五条"
article_caption: "（推定相続人の廃除に関する審判確定前の遺産の管理）"
description: "民法の第八百九十五条は「推定相続人の廃除に関する審判確定前の遺産の管理」を定める。 本文冒頭: 推定相続人の廃除又はその取消しの請求があった後その審判が確定する前に相続が開始したときは、家庭裁判所は、親族、利害関係人又は検察官の請求によって、遺産の管理について必要な処分を命ずることができる。"
