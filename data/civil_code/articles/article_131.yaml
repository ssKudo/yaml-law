article_title: "第百三十一条"
article_caption: "（既成条件）"
description: "民法の第百三十一条は「既成条件」を定める。 本文冒頭: 条件が法律行為の時に既に成就していた場合において、その条件が停止条件であるときはその法律行為は無条件とし、その条件が解除条件であるときはその法律行為は無効とする。"
