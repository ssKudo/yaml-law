article_title: "第二百七十五条"
article_caption: "（永小作権の放棄）"
description: "民法の第二百七十五条は「永小作権の放棄」を定める。 本文冒頭: 永小作人は、不可抗力によって、引き続き三年以上全く収益を得ず、又は五年以上小作料より少ない収益を得たときは、その権利を放棄することができる。"
