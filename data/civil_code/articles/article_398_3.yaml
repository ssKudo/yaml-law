article_title: "第三百九十八条の三"
article_caption: "（根抵当権の被担保債権の範囲）"
description: "民法の第三百九十八条の三は「根抵当権の被担保債権の範囲」を定める。 本文冒頭: 根抵当権者は、確定した元本並びに利息その他の定期金及び債務の不履行によって生じた損害の賠償の全部について、極度額を限度として、その根抵当権を行使することができる。"
