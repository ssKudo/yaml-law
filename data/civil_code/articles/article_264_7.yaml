article_caption: "（所有者不明土地管理人の報酬等）"
description: "民法の第二百六十四条の七は「所有者不明土地管理人の報酬等」を定める。 本文冒頭: 所有者不明土地管理人は、所有者不明土地等から裁判所が定める額の費用の前払及び報酬を受けることができる。"
