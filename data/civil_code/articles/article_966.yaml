article_title: "第九百六十六条"
article_caption: "（被後見人の遺言の制限）"
description: "民法の第九百六十六条は「被後見人の遺言の制限」を定める。 本文冒頭: 被後見人が、後見の計算の終了前に、後見人又はその配偶者若しくは直系卑属の利益となるべき遺言をしたときは、その遺言は、無効とする。"
