article_title: "第九百九十九条"
article_caption: "（遺贈の物上代位）"
description: "民法の第九百九十九条は「遺贈の物上代位」を定める。 本文冒頭: 遺言者が、遺贈の目的物の滅失若しくは変造又はその占有の喪失によって第三者に対して償金を請求する権利を有するときは、その権利を遺贈の目的としたものと推定する。"
