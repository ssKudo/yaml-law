article_caption: "（登記をした不動産保存又は不動産工事の先取特権）"
description: "民法の第三百三十九条は「登記をした不動産保存又は不動産工事の先取特権」を定める。 本文冒頭: 前二条の規定に従って登記をした先取特権は、抵当権に先立って行使することができる。"
