article_title: "第八百二十七条"
article_caption: "（財産の管理における注意義務）"
description: "民法の第八百二十七条は「財産の管理における注意義務」を定める。 本文冒頭: 親権を行う者は、自己のためにするのと同一の注意をもって、その管理権を行わなければならない。"
