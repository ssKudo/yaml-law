article_title: "第八百九十七条"
article_caption: "（祭祀に関する権利の承継）"
description: "民法の第八百九十七条は「祭祀に関する権利の承継」を定める。 本文冒頭: 系譜、祭具及び墳墓の所有権は、前条の規定にかかわらず、慣習に従って祖先の祭祀を主宰すべき者が承継する。"
