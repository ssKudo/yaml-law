article_title: "第四百八十四条"
article_caption: "（弁済の場所及び時間）"
description: "民法の第四百八十四条は「弁済の場所及び時間」を定める。 本文冒頭: 弁済をすべき場所について別段の意思表示がないときは、特定物の引渡しは債権発生の時にその物が存在した場所において、その他の弁済は債権者の現在の住所において、それぞれしなければならない。"
