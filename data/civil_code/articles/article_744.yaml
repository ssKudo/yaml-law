article_title: "第七百四十四条"
article_caption: "（不適法な婚姻の取消し）"
description: "民法の第七百四十四条は「不適法な婚姻の取消し」を定める。 本文冒頭: 第七百三十一条、第七百三十二条及び第七百三十四条から第七百三十六条までの規定に違反した婚姻は、各当事者、その親族又は検察官から、その取消しを家庭裁判所に請求することができる。"
