article_caption: "（抵当権の効力の及ぶ範囲）"
description: "民法の第三百七十条は「抵当権の効力の及ぶ範囲」を定める。 本文冒頭: 抵当権は、抵当地の上に存する建物を除き、その目的である不動産（以下「抵当不動産」という。）に付加して一体となっている物に及ぶ。"
