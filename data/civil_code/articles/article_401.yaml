article_title: "第四百一条"
article_caption: "（種類債権）"
description: "民法の第四百一条は「種類債権」を定める。 本文冒頭: 債権の目的物を種類のみで指定した場合において、法律行為の性質又は当事者の意思によってその品質を定めることができないときは、債務者は、中等の品質を有する物を給付しなければならない。"
