article_caption: "（縁組の届出の受理）"
description: "民法の第八百条は「縁組の届出の受理」を定める。 本文冒頭: 縁組の届出は、その縁組が第七百九十二条から前条までの規定その他の法令の規定に違反しないことを認めた後でなければ、受理することができない。"
