article_num: "941"
article_title: "第九百四十一条"
article_caption: "（相続債権者又は受遺者の請求による財産分離）"
description: "民法の第九百四十一条は「相続債権者又は受遺者の請求による財産分離」を定める。 本文冒頭: 相続債権者又は受遺者は、相続開始の時から三箇月以内に、相続人の財産の中から相続財産を分離することを家庭裁判所に請求することができる。"
