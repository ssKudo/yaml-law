article_title: "第六百九十一条"
article_caption: "（終身定期金契約の解除）"
description: "民法の第六百九十一条は「終身定期金契約の解除」を定める。 本文冒頭: 終身定期金債務者が終身定期金の元本を受領した場合において、その終身定期金の給付を怠り、又はその他の義務を履行しないときは、相手方は、元本の返還を請求することができる。"
