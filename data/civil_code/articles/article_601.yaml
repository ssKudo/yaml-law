article_title: "第六百一条"
article_caption: "（賃貸借）"
description: "民法の第六百一条は「賃貸借」を定める。 本文冒頭: 賃貸借は、当事者の一方がある物の使用及び収益を相手方にさせることを約し、相手方がこれに対してその賃料を支払うこと及び引渡しを受けた物を契約が終了したときに返還することを約することによって、その効力を生ずる。"
