article_title: "第八百三十二条"
article_caption: "（財産の管理について生じた親子間の債権の消滅時効）"
description: "民法の第八百三十二条は「財産の管理について生じた親子間の債権の消滅時効」を定める。 本文冒頭: 親権を行った者とその子との間に財産の管理について生じた債権は、その管理権が消滅した時から五年間これを行使しないときは、時効によって消滅する。"
