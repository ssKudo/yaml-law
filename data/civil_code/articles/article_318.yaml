article_caption: "（運輸の先取特権）"
description: "民法の第三百十八条は「運輸の先取特権」を定める。 本文冒頭: 運輸の先取特権は、旅客又は荷物の運送賃及び付随の費用に関し、運送人の占有する荷物について存在する。"
