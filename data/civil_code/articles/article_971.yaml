article_title: "第九百七十一条"
article_caption: "（方式に欠ける秘密証書遺言の効力）"
description: "民法の第九百七十一条は「方式に欠ける秘密証書遺言の効力」を定める。 本文冒頭: 秘密証書による遺言は、前条に定める方式に欠けるものがあっても、第九百六十八条に定める方式を具備しているときは、自筆証書による遺言としてその効力を有する。"
