article_caption: "（包括遺贈及び特定遺贈）"
description: "民法の第九百六十四条は「包括遺贈及び特定遺贈」を定める。 本文冒頭: 遺言者は、包括又は特定の名義で、その財産の全部又は一部を処分することができる。"
