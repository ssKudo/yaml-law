article_title: "第六百五条"
article_caption: "（不動産賃貸借の対抗力）"
description: "民法の第六百五条は「不動産賃貸借の対抗力」を定める。 本文冒頭: 不動産の賃貸借は、これを登記したときは、その不動産について物権を取得した者その他の第三者に対抗することができる。"
