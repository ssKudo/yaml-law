article_title: "第八百五十八条"
article_caption: "（成年被後見人の意思の尊重及び身上の配慮）"
description: "民法の第八百五十八条は「成年被後見人の意思の尊重及び身上の配慮」を定める。 本文冒頭: 成年後見人は、成年被後見人の生活、療養看護及び財産の管理に関する事務を行うに当たっては、成年被後見人の意思を尊重し、かつ、その心身の状態及び生活の状況に配慮しなければならない。"
