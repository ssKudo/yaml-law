article_caption: "（不動産質権者による使用及び収益）"
description: "民法の第三百五十六条は「不動産質権者による使用及び収益」を定める。 本文冒頭: 不動産質権者は、質権の目的である不動産の用法に従い、その使用及び収益をすることができる。"
