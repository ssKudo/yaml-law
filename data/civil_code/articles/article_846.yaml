article_title: "第八百四十六条"
article_caption: "（後見人の解任）"
description: "民法の第八百四十六条は「後見人の解任」を定める。 本文冒頭: 後見人に不正な行為、著しい不行跡その他後見の任務に適しない事由があるときは、家庭裁判所は、後見監督人、被後見人若しくはその親族若しくは検察官の請求により又は職権で、これを解任することができる。"
