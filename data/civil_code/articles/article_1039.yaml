article_title: "第千三十九条"
article_caption: "（配偶者居住権の取得による配偶者短期居住権の消滅）"
description: "民法の第千三十九条は「配偶者居住権の取得による配偶者短期居住権の消滅」を定める。 本文冒頭: 配偶者が居住建物に係る配偶者居住権を取得したときは、配偶者短期居住権は、消滅する。"
