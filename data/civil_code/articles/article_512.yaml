article_num: "512"
article_title: "第五百十二条"
article_caption: "（相殺の充当）"
description: "民法の第五百十二条は「相殺の充当」を定める。 本文冒頭: 債権者が債務者に対して有する一個又は数個の債権と、債権者が債務者に対して負担する一個又は数個の債務について、債権者が相殺の意思表示をした場合において、当事者が別段の合意をしなかったときは、債権者の有する債権とその負担する債務は、相殺に適するようになった時期の順序に従って、その対当額について相殺によって消滅する。"
