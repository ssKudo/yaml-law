article_title: "第五百九十三条の二"
article_caption: "（借用物受取り前の貸主による使用貸借の解除）"
description: "民法の第五百九十三条の二は「借用物受取り前の貸主による使用貸借の解除」を定める。 本文冒頭: 貸主は、借主が借用物を受け取るまで、契約の解除をすることができる。"
