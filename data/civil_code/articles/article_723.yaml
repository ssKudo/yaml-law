article_title: "第七百二十三条"
article_caption: "（名誉毀き損における原状回復）"
description: "民法の第七百二十三条は「名誉毀き損における原状回復」を定める。 本文冒頭: 他人の名誉を毀き損した者に対しては、裁判所は、被害者の請求により、損害賠償に代えて、又は損害賠償とともに、名誉を回復するのに適当な処分を命ずることができる。"
