article_title: "第八百七十条"
article_caption: "（後見の計算）"
description: "民法の第八百七十条は「後見の計算」を定める。 本文冒頭: 後見人の任務が終了したときは、後見人又はその相続人は、二箇月以内にその管理の計算（以下「後見の計算」という。）をしなければならない。"
