article_caption: "（組合員の脱退）"
description: "民法の第六百七十八条は「組合員の脱退」を定める。 本文冒頭: 組合契約で組合の存続期間を定めなかったとき、又はある組合員の終身の間組合が存続すべきことを定めたときは、各組合員は、いつでも脱退することができる。"
