article_caption: "（復受任者の選任等）"
description: "民法の第六百四十四条の二は「復受任者の選任等」を定める。 本文冒頭: 受任者は、委任者の許諾を得たとき、又はやむを得ない事由があるときでなければ、復受任者を選任することができない。"
