article_title: "第六百三十六条"
article_caption: "（請負人の担保責任の制限）"
description: "民法の第六百三十六条は「請負人の担保責任の制限」を定める。 本文冒頭: 請負人が種類又は品質に関して契約の内容に適合しない仕事の目的物を注文者に引き渡したとき（その引渡しを要しない場合にあっては、仕事が終了した時に仕事の目的物が種類又は品質に関して契約の内容に適合しないとき）は、注文者は、注文者の供した材料の性質又は注文者の与えた指図によって生じた不適合を理由として、履行の追完の請求、報酬の減額の請求、損害賠償の請求及び契約の解…"
