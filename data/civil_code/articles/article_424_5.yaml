article_title: "第四百二十四条の五"
article_caption: "（転得者に対する詐害行為取消請求）"
description: "民法の第四百二十四条の五は「転得者に対する詐害行為取消請求」を定める。 本文冒頭: 債権者は、受益者に対して詐害行為取消請求をすることができる場合において、受益者に移転した財産を転得した者があるときは、次の各号に掲げる区分に応じ、それぞれ当該各号に定める場合に限り、その転得者に対しても、詐害行為取消請求をすることができる。"
