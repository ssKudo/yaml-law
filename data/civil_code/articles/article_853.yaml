article_title: "第八百五十三条"
article_caption: "（財産の調査及び目録の作成）"
description: "民法の第八百五十三条は「財産の調査及び目録の作成」を定める。 本文冒頭: 後見人は、遅滞なく被後見人の財産の調査に着手し、一箇月以内に、その調査を終わり、かつ、その目録を作成しなければならない。"
