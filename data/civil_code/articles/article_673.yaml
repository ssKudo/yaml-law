article_num: "673"
article_title: "第六百七十三条"
article_caption: "（組合員の組合の業務及び財産状況に関する検査）"
description: "民法の第六百七十三条は「組合員の組合の業務及び財産状況に関する検査」を定める。 本文冒頭: 各組合員は、組合の業務の決定及び執行をする権利を有しないときであっても、その業務及び組合財産の状況を検査することができる。"
