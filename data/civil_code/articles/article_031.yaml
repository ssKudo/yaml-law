article_title: "第三十一条"
article_caption: "（失踪の宣告の効力）"
description: "民法の第三十一条は「失踪の宣告の効力」を定める。 本文冒頭: 前条第一項の規定により失踪の宣告を受けた者は同項の期間が満了した時に、同条第二項の規定により失踪の宣告を受けた者はその危難が去った時に、死亡したものとみなす。"
