article_caption: "（損害賠償の範囲）"
description: "民法の第四百十六条は「損害賠償の範囲」を定める。 本文冒頭: 債務の不履行に対する損害賠償の請求は、これによって通常生ずべき損害の賠償をさせることをその目的とする。"
