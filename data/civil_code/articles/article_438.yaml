article_caption: "（連帯債務者の一人との間の更改）"
description: "民法の第四百三十八条は「連帯債務者の一人との間の更改」を定める。 本文冒頭: 連帯債務者の一人と債権者との間に更改があったときは、債権は、全ての連帯債務者の利益のために消滅する。"
