article_title: "第五百五条"
article_caption: "（相殺の要件等）"
description: "民法の第五百五条は「相殺の要件等」を定める。 本文冒頭: 二人が互いに同種の目的を有する債務を負担する場合において、双方の債務が弁済期にあるときは、各債務者は、その対当額について相殺によってその債務を免れることができる。"
