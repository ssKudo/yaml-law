article_title: "第千四十八条"
article_caption: "（遺留分侵害額請求権の期間の制限）"
description: "民法の第千四十八条は「遺留分侵害額請求権の期間の制限」を定める。 本文冒頭: 遺留分侵害額の請求権は、遺留分権利者が、相続の開始及び遺留分を侵害する贈与又は遺贈があったことを知った時から一年間行使しないときは、時効によって消滅する。"
