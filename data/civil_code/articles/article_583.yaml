article_caption: "（買戻しの実行）"
description: "民法の第五百八十三条は「買戻しの実行」を定める。 本文冒頭: 売主は、第五百八十条に規定する期間内に代金及び契約の費用を提供しなければ、買戻しをすることができない。"
