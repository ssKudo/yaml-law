article_title: "第五百五十一条"
article_caption: "（贈与者の引渡義務等）"
description: "民法の第五百五十一条は「贈与者の引渡義務等」を定める。 本文冒頭: 贈与者は、贈与の目的である物又は権利を、贈与の目的として特定した時の状態で引き渡し、又は移転することを約したものと推定する。"
