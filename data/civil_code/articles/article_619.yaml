article_title: "第六百十九条"
article_caption: "（賃貸借の更新の推定等）"
description: "民法の第六百十九条は「賃貸借の更新の推定等」を定める。 本文冒頭: 賃貸借の期間が満了した後賃借人が賃借物の使用又は収益を継続する場合において、賃貸人がこれを知りながら異議を述べないときは、従前の賃貸借と同一の条件で更に賃貸借をしたものと推定する。"
