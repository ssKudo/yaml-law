article_title: "第四百十条"
article_caption: "（不能による選択債権の特定）"
description: "民法の第四百十条は「不能による選択債権の特定」を定める。 本文冒頭: 債権の目的である給付の中に不能のものがある場合において、その不能が選択権を有する者の過失によるものであるときは、債権は、その残存するものについて存在する。"
