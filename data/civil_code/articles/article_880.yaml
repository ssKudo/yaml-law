article_title: "第八百八十条"
article_caption: "（扶養に関する協議又は審判の変更又は取消し）"
description: "民法の第八百八十条は「扶養に関する協議又は審判の変更又は取消し」を定める。 本文冒頭: 扶養をすべき者若しくは扶養を受けるべき者の順序又は扶養の程度若しくは方法について協議又は審判があった後事情に変更を生じたときは、家庭裁判所は、その協議又は審判の変更又は取消しをすることができる。"
