article_title: "第四百二十二条の二"
article_caption: "（代償請求権）"
description: "民法の第四百二十二条の二は「代償請求権」を定める。 本文冒頭: 債務者が、その債務の履行が不能となったのと同一の原因により債務の目的物の代償である権利又は利益を取得したときは、債権者は、その受けた損害の額の限度において、債務者に対し、その権利の移転又はその利益の償還を請求することができる。"
