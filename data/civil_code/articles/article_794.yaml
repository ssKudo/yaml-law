article_title: "第七百九十四条"
article_caption: "（後見人が被後見人を養子とする縁組）"
description: "民法の第七百九十四条は「後見人が被後見人を養子とする縁組」を定める。 本文冒頭: 後見人が被後見人（未成年被後見人及び成年被後見人をいう。以下同じ。）を養子とするには、家庭裁判所の許可を得なければならない。"
