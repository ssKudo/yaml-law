article_title: "第九百四条の二"
article_caption: "（寄与分）"
description: "民法の第九百四条の二は「寄与分」を定める。 本文冒頭: 共同相続人中に、被相続人の事業に関する労務の提供又は財産上の給付、被相続人の療養看護その他の方法により被相続人の財産の維持又は増加について特別の寄与をした者があるときは、被相続人が相続開始の時において有した財産の価額から共同相続人の協議で定めたその者の寄与分を控除したものを相続財産とみなし、第九百条から第九百二条までの規定により算定した相続分に寄与分を加えた…"
