description: "民法の第千三十七条は「配偶者短期居住権」を定める。 本文冒頭: 配偶者は、被相続人の財産に属した建物に相続開始の時に無償で居住していた場合には、次の各号に掲げる区分に応じてそれぞれ当該各号に定める日までの間、その居住していた建物（以下この節において「居住建物」という。）の所有権を相続又は遺贈により取得した者（以下この節において「居住建物取得者」という。）に対し、居住建物について無償で使用する権利（居住建物の一部のみを無償…"
