article_title: "第九百十二条"
article_caption: "（遺産の分割によって受けた債権についての担保責任）"
description: "民法の第九百十二条は「遺産の分割によって受けた債権についての担保責任」を定める。 本文冒頭: 各共同相続人は、その相続分に応じ、他の共同相続人が遺産の分割によって受けた債権について、その分割の時における債務者の資力を担保する。"
