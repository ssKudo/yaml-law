article_title: "第八百五条"
article_caption: "（養子が尊属又は年長者である場合の縁組の取消し）"
description: "民法の第八百五条は「養子が尊属又は年長者である場合の縁組の取消し」を定める。 本文冒頭: 第七百九十三条の規定に違反した縁組は、各当事者又はその親族から、その取消しを家庭裁判所に請求することができる。"
