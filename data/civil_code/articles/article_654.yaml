article_title: "第六百五十四条"
article_caption: "（委任の終了後の処分）"
description: "民法の第六百五十四条は「委任の終了後の処分」を定める。 本文冒頭: 委任が終了した場合において、急迫の事情があるときは、受任者又はその相続人若しくは法定代理人は、委任者又はその相続人若しくは法定代理人が委任事務を処理することができるに至るまで、必要な処分をしなければならない。"
