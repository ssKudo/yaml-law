article_title: "第六百七十二条"
article_caption: "（業務執行組合員の辞任及び解任）"
description: "民法の第六百七十二条は「業務執行組合員の辞任及び解任」を定める。 本文冒頭: 組合契約の定めるところにより一人又は数人の組合員に業務の決定及び執行を委任したときは、その組合員は、正当な事由がなければ、辞任することができない。"
