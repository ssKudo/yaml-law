article_title: "第八百五十九条の三"
article_caption: "（成年被後見人の居住用不動産の処分についての許可）"
description: "民法の第八百五十九条の三は「成年被後見人の居住用不動産の処分についての許可」を定める。 本文冒頭: 成年後見人は、成年被後見人に代わって、その居住の用に供する建物又はその敷地について、売却、賃貸、賃貸借の解除又は抵当権の設定その他これらに準ずる処分をするには、家庭裁判所の許可を得なければならない。"
