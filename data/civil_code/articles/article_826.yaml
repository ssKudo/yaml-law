article_title: "第八百二十六条"
article_caption: "（利益相反行為）"
description: "民法の第八百二十六条は「利益相反行為」を定める。 本文冒頭: 親権を行う父又は母とその子との利益が相反する行為については、親権を行う者は、その子のために特別代理人を選任することを家庭裁判所に請求しなければならない。"
