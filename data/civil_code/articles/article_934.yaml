article_title: "第九百三十四条"
article_caption: "（不当な弁済をした限定承認者の責任等）"
description: "民法の第九百三十四条は「不当な弁済をした限定承認者の責任等」を定める。 本文冒頭: 限定承認者は、第九百二十七条の公告若しくは催告をすることを怠り、又は同条第一項の期間内に相続債権者若しくは受遺者に弁済をしたことによって他の相続債権者若しくは受遺者に弁済をすることができなくなったときは、これによって生じた損害を賠償する責任を負う。"
