article_title: "第九百三十七条"
article_caption: "（法定単純承認の事由がある場合の相続債権者）"
description: "民法の第九百三十七条は「法定単純承認の事由がある場合の相続債権者」を定める。 本文冒頭: 限定承認をした共同相続人の一人又は数人について第九百二十一条第一号又は第三号に掲げる事由があるときは、相続債権者は、相続財産をもって弁済を受けることができなかった債権額について、当該共同相続人に対し、その相続分に応じて権利を行使することができる。"
