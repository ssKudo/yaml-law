article_num: "398_10"
article_title: "第三百九十八条の十"
article_caption: "（根抵当権者又は債務者の会社分割）"
description: "民法の第三百九十八条の十は「根抵当権者又は債務者の会社分割」を定める。 本文冒頭: 元本の確定前に根抵当権者を分割をする会社とする分割があったときは、根抵当権は、分割の時に存する債権のほか、分割をした会社及び分割により設立された会社又は当該分割をした会社がその事業に関して有する権利義務の全部又は一部を当該会社から承継した会社が分割後に取得する債権を担保する。"
