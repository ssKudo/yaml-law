article_title: "第九百二条の二"
article_caption: "（相続分の指定がある場合の債権者の権利の行使）"
description: "民法の第九百二条の二は「相続分の指定がある場合の債権者の権利の行使」を定める。 本文冒頭: 被相続人が相続開始の時において有した債務の債権者は、前条の規定による相続分の指定がされた場合であっても、各共同相続人に対し、第九百条及び第九百一条の規定により算定した相続分に応じてその権利を行使することができる。"
