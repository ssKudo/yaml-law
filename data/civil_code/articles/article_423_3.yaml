article_num: "423_3"
article_title: "第四百二十三条の三"
article_caption: "（債権者への支払又は引渡し）"
description: "民法の第四百二十三条の三は「債権者への支払又は引渡し」を定める。 本文冒頭: 債権者は、被代位権利を行使する場合において、被代位権利が金銭の支払又は動産の引渡しを目的とするものであるときは、相手方に対し、その支払又は引渡しを自己に対してすることを求めることができる。"
