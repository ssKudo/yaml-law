article_title: "第八百五十五条"
article_caption: "（後見人の被後見人に対する債権又は債務の申出義務）"
description: "民法の第八百五十五条は「後見人の被後見人に対する債権又は債務の申出義務」を定める。 本文冒頭: 後見人が、被後見人に対し、債権を有し、又は債務を負う場合において、後見監督人があるときは、財産の調査に着手する前に、これを後見監督人に申し出なければならない。"
