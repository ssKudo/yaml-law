description: "民法の第二百六十四条の二は「所有者不明土地管理命令」を定める。 本文冒頭: 裁判所は、所有者を知ることができず、又はその所在を知ることができない土地（土地が数人の共有に属する場合にあっては、共有者を知ることができず、又はその所在を知ることができない土地の共有持分）について、必要があると認めるときは、利害関係人の請求により、その請求に係る土地又は共有持分を対象として、所有者不明土地管理人（第四項に規定する所有者不明土地管理人をいう。以…"
