article_title: "第六百条"
article_caption: "（損害賠償及び費用の償還の請求権についての期間の制限）"
description: "民法の第六百条は「損害賠償及び費用の償還の請求権についての期間の制限」を定める。 本文冒頭: 契約の本旨に反する使用又は収益によって生じた損害の賠償及び借主が支出した費用の償還は、貸主が返還を受けた時から一年以内に請求しなければならない。"
