article_caption: "（自然水流に対する妨害の禁止）"
description: "民法の第二百十四条は「自然水流に対する妨害の禁止」を定める。 本文冒頭: 土地の所有者は、隣地から水が自然に流れて来るのを妨げてはならない。"
