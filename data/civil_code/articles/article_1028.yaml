article_title: "第千二十八条"
article_caption: "（配偶者居住権）"
description: "民法の第千二十八条は「配偶者居住権」を定める。 本文冒頭: 被相続人の配偶者（以下この章において単に「配偶者」という。）は、被相続人の財産に属した建物に相続開始の時に居住していた場合において、次の各号のいずれかに該当するときは、その居住していた建物（以下この節において「居住建物」という。）の全部について無償で使用及び収益をする権利（以下この章において「配偶者居住権」という。）を取得する。"
