article_caption: "（動産に関する物権の譲渡の対抗要件）"
description: "民法の第百七十八条は「動産に関する物権の譲渡の対抗要件」を定める。 本文冒頭: 動産に関する物権の譲渡は、その動産の引渡しがなければ、第三者に対抗することができない。"
