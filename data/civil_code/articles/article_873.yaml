article_title: "第八百七十三条"
article_caption: "（返還金に対する利息の支払等）"
description: "民法の第八百七十三条は「返還金に対する利息の支払等」を定める。 本文冒頭: 後見人が被後見人に返還すべき金額及び被後見人が後見人に返還すべき金額には、後見の計算が終了した時から、利息を付さなければならない。"
