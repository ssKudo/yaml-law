article_title: "第二百八十六条"
article_caption: "（承役地の所有者の工作物の設置義務等）"
description: "民法の第二百八十六条は「承役地の所有者の工作物の設置義務等」を定める。 本文冒頭: 設定行為又は設定後の契約により、承役地の所有者が自己の費用で地役権の行使のために工作物を設け、又はその修繕をする義務を負担したときは、承役地の所有者の特定承継人も、その義務を負担する。"
