article_num: "944"
article_title: "第九百四十四条"
article_caption: "（財産分離の請求後の相続人による管理）"
description: "民法の第九百四十四条は「財産分離の請求後の相続人による管理」を定める。 本文冒頭: 相続人は、単純承認をした後でも、財産分離の請求があったときは、以後、その固有財産におけるのと同一の注意をもって、相続財産の管理をしなければならない。"
