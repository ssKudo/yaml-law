article_title: "第九百四十二条"
article_caption: "（財産分離の効力）"
description: "民法の第九百四十二条は「財産分離の効力」を定める。 本文冒頭: 財産分離の請求をした者及び前条第二項の規定により配当加入の申出をした者は、相続財産について、相続人の債権者に先立って弁済を受ける。"
