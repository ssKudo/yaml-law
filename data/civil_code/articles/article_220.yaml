article_title: "第二百二十条"
article_caption: "（排水のための低地の通水）"
description: "民法の第二百二十条は「排水のための低地の通水」を定める。 本文冒頭: 高地の所有者は、その高地が浸水した場合にこれを乾かすため、又は自家用若しくは農工業用の余水を排出するため、公の水流又は下水道に至るまで、低地に水を通過させることができる。"
