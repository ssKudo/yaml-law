article_title: "第四百二十五条の四"
article_caption: "（詐害行為取消請求を受けた転得者の権利）"
description: "民法の第四百二十五条の四は「詐害行為取消請求を受けた転得者の権利」を定める。 本文冒頭: 債務者がした行為が転得者に対する詐害行為取消請求によって取り消されたときは、その転得者は、次の各号に掲げる区分に応じ、それぞれ当該各号に定める権利を行使することができる。"
