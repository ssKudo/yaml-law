article_caption: "（配偶者居住権の登記等）"
description: "民法の第千三十一条は「配偶者居住権の登記等」を定める。 本文冒頭: 居住建物の所有者は、配偶者（配偶者居住権を取得した配偶者に限る。以下この節において同じ。）に対し、配偶者居住権の設定の登記を備えさせる義務を負う。"
