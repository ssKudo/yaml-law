division: "第二目 個人根保証契約"
article_num: "465_5"
article_title: "第四百六十五条の五"
article_caption: "（保証人が法人である根保証契約の求償権）"
description: "民法の第四百六十五条の五は「保証人が法人である根保証契約の求償権」を定める。 本文冒頭: 保証人が法人である根保証契約において、第四百六十五条の二第一項に規定する極度額の定めがないときは、その根保証契約の保証人の主たる債務者に対する求償権に係る債務を主たる債務とする保証契約は、その効力を生じない。"
