article_title: "第七百五十六条"
article_caption: "（夫婦財産契約の対抗要件）"
description: "民法の第七百五十六条は「夫婦財産契約の対抗要件」を定める。 本文冒頭: 夫婦が法定財産制と異なる契約をしたときは、婚姻の届出までにその登記をしなければ、これを夫婦の承継人及び第三者に対抗することができない。"
