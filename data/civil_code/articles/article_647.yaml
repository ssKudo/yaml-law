article_title: "第六百四十七条"
article_caption: "（受任者の金銭の消費についての責任）"
description: "民法の第六百四十七条は「受任者の金銭の消費についての責任」を定める。 本文冒頭: 受任者は、委任者に引き渡すべき金額又はその利益のために用いるべき金額を自己のために消費したときは、その消費した日以後の利息を支払わなければならない。"
