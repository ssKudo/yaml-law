article_title: "第八百七十六条の四"
article_caption: "（保佐人に代理権を付与する旨の審判）"
description: "民法の第八百七十六条の四は「保佐人に代理権を付与する旨の審判」を定める。 本文冒頭: 家庭裁判所は、第十一条本文に規定する者又は保佐人若しくは保佐監督人の請求によって、被保佐人のために特定の法律行為について保佐人に代理権を付与する旨の審判をすることができる。"
