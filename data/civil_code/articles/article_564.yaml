article_title: "第五百六十四条"
article_caption: "（買主の損害賠償請求及び解除権の行使）"
description: "民法の第五百六十四条は「買主の損害賠償請求及び解除権の行使」を定める。 本文冒頭: 前二条の規定は、第四百十五条の規定による損害賠償の請求並びに第五百四十一条及び第五百四十二条の規定による解除権の行使を妨げない。"
