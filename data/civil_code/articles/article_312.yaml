article_title: "第三百十二条"
article_caption: "（不動産賃貸の先取特権）"
description: "民法の第三百十二条は「不動産賃貸の先取特権」を定める。 本文冒頭: 不動産の賃貸の先取特権は、その不動産の賃料その他の賃貸借関係から生じた賃借人の債務に関し、賃借人の動産について存在する。"
