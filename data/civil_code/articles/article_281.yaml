article_title: "第二百八十一条"
article_caption: "（地役権の付従性）"
description: "民法の第二百八十一条は「地役権の付従性」を定める。 本文冒頭: 地役権は、要役地（地役権者の土地であって、他人の土地から便益を受けるものをいう。以下同じ。）の所有権に従たるものとして、その所有権とともに移転し、又は要役地について存する他の権利の目的となるものとする。"
