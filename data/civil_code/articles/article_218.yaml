article_title: "第二百十八条"
article_caption: "（雨水を隣地に注ぐ工作物の設置の禁止）"
description: "民法の第二百十八条は「雨水を隣地に注ぐ工作物の設置の禁止」を定める。 本文冒頭: 土地の所有者は、直接に雨水を隣地に注ぐ構造の屋根その他の工作物を設けてはならない。"
