article_title: "第四百二十二条"
article_caption: "（損害賠償による代位）"
description: "民法の第四百二十二条は「損害賠償による代位」を定める。 本文冒頭: 債権者が、損害賠償として、その債権の目的である物又は権利の価額の全部の支払を受けたときは、債務者は、その物又は権利について当然に債権者に代位する。"
