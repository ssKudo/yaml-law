article_title: "第三百七十六条"
article_caption: "（抵当権の処分）"
description: "民法の第三百七十六条は「抵当権の処分」を定める。 本文冒頭: 抵当権者は、その抵当権を他の債権の担保とし、又は同一の債務者に対する他の債権者の利益のためにその抵当権若しくはその順位を譲渡し、若しくは放棄することができる。"
