article_title: "第百二十八条"
article_caption: "（条件の成否未定の間における相手方の利益の侵害の禁止）"
description: "民法の第百二十八条は「条件の成否未定の間における相手方の利益の侵害の禁止」を定める。 本文冒頭: 条件付法律行為の各当事者は、条件の成否が未定である間は、条件が成就した場合にその法律行為から生ずべき相手方の利益を害することができない。"
