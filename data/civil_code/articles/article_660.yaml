article_title: "第六百六十条"
article_caption: "（受寄者の通知義務等）"
description: "民法の第六百六十条は「受寄者の通知義務等」を定める。 本文冒頭: 寄託物について権利を主張する第三者が受寄者に対して訴えを提起し、又は差押え、仮差押え若しくは仮処分をしたときは、受寄者は、遅滞なくその事実を寄託者に通知しなければならない。"
