article_title: "第八百十五条"
article_caption: "（養子が十五歳未満である場合の離縁の訴えの当事者）"
description: "民法の第八百十五条は「養子が十五歳未満である場合の離縁の訴えの当事者」を定める。 本文冒頭: 養子が十五歳に達しない間は、第八百十一条の規定により養親と離縁の協議をすることができる者から、又はこれに対して、離縁の訴えを提起することができる。"
