article_title: "第三百九十二条"
article_caption: "（共同抵当における代価の配当）"
description: "民法の第三百九十二条は「共同抵当における代価の配当」を定める。 本文冒頭: 債権者が同一の債権の担保として数個の不動産につき抵当権を有する場合において、同時にその代価を配当すべきときは、その各不動産の価額に応じて、その債権の負担を按分する。"
