article_title: "第八百六条の二"
article_caption: "（配偶者の同意のない縁組等の取消し）"
description: "民法の第八百六条の二は「配偶者の同意のない縁組等の取消し」を定める。 本文冒頭: 第七百九十六条の規定に違反した縁組は、縁組の同意をしていない者から、その取消しを家庭裁判所に請求することができる。"
