article_title: "第六百五条の四"
article_caption: "（不動産の賃借人による妨害の停止の請求等）"
description: "民法の第六百五条の四は「不動産の賃借人による妨害の停止の請求等」を定める。 本文冒頭: 不動産の賃借人は、第六百五条の二第一項に規定する対抗要件を備えた場合において、次の各号に掲げるときは、それぞれ当該各号に定める請求をすることができる。"
