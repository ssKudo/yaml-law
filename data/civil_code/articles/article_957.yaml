article_title: "第九百五十七条"
article_caption: "（相続債権者及び受遺者に対する弁済）"
description: "民法の第九百五十七条は「相続債権者及び受遺者に対する弁済」を定める。 本文冒頭: 第九百五十二条第二項の公告があったときは、相続財産の清算人は、全ての相続債権者及び受遺者に対し、二箇月以上の期間を定めて、その期間内にその請求の申出をすべき旨を公告しなければならない。"
