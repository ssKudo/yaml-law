article_title: "第八百六十六条"
article_caption: "（被後見人の財産等の譲受けの取消し）"
description: "民法の第八百六十六条は「被後見人の財産等の譲受けの取消し」を定める。 本文冒頭: 後見人が被後見人の財産又は被後見人に対する第三者の権利を譲り受けたときは、被後見人は、これを取り消すことができる。"
