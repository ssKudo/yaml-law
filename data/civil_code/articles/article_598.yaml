article_caption: "（使用貸借の解除）"
description: "民法の第五百九十八条は「使用貸借の解除」を定める。 本文冒頭: 貸主は、前条第二項に規定する場合において、同項の目的に従い借主が使用及び収益をするのに足りる期間を経過したときは、契約の解除をすることができる。"
