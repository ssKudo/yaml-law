article_title: "第二百二十二条"
article_caption: "（堰せきの設置及び使用）"
description: "民法の第二百二十二条は「堰せきの設置及び使用」を定める。 本文冒頭: 水流地の所有者は、堰せきを設ける必要がある場合には、対岸の土地が他人の所有に属するときであっても、その堰を対岸に付着させて設けることができる。"
