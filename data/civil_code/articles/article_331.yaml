article_caption: "（不動産の先取特権の順位）"
description: "民法の第三百三十一条は「不動産の先取特権の順位」を定める。 本文冒頭: 同一の不動産について特別の先取特権が互いに競合する場合には、その優先権の順位は、第三百二十五条各号に掲げる順序に従う。"
