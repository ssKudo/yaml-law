article_title: "第四百三十九条"
article_caption: "（連帯債務者の一人による相殺等）"
description: "民法の第四百三十九条は「連帯債務者の一人による相殺等」を定める。 本文冒頭: 連帯債務者の一人が債権者に対して債権を有する場合において、その連帯債務者が相殺を援用したときは、債権は、全ての連帯債務者の利益のために消滅する。"
