article_num: "195"
article_title: "第百九十五条"
article_caption: "（動物の占有による権利の取得）"
description: "民法の第百九十五条は「動物の占有による権利の取得」を定める。 本文冒頭: 家畜以外の動物で他人が飼育していたものを占有する者は、その占有の開始の時に善意であり、かつ、その動物が飼主の占有を離れた時から一箇月以内に飼主から回復の請求を受けなかったときは、その動物について行使する権利を取得する。"
