article_caption: "（遺言の執行の妨害行為の禁止）"
description: "民法の第千十三条は「遺言の執行の妨害行為の禁止」を定める。 本文冒頭: 遺言執行者がある場合には、相続人は、相続財産の処分その他遺言の執行を妨げるべき行為をすることができない。"
