article_title: "第五百八条"
article_caption: "（時効により消滅した債権を自働債権とする相殺）"
description: "民法の第五百八条は「時効により消滅した債権を自働債権とする相殺」を定める。 本文冒頭: 時効によって消滅した債権がその消滅以前に相殺に適するようになっていた場合には、その債権者は、相殺をすることができる。"
