article_title: "第千四十六条"
article_caption: "（遺留分侵害額の請求）"
description: "民法の第千四十六条は「遺留分侵害額の請求」を定める。 本文冒頭: 遺留分権利者及びその承継人は、受遺者（特定財産承継遺言により財産を承継し又は相続分の指定を受けた相続人を含む。以下この章において同じ。）又は受贈者に対し、遺留分侵害額に相当する金銭の支払を請求することができる。"
