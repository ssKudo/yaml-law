description: "民法の第二百六十四条の九は「管理不全土地管理命令」を定める。 本文冒頭: 裁判所は、所有者による土地の管理が不適当であることによって他人の権利又は法律上保護される利益が侵害され、又は侵害されるおそれがある場合において、必要があると認めるときは、利害関係人の請求により、当該土地を対象として、管理不全土地管理人（第三項に規定する管理不全土地管理人をいう。以下同じ。）による管理を命ずる処分（以下「管理不全土地管理命令」という。）をするこ…"
