article_title: "第三百八十九条"
article_caption: "（抵当地の上の建物の競売）"
description: "民法の第三百八十九条は「抵当地の上の建物の競売」を定める。 本文冒頭: 抵当権の設定後に抵当地に建物が築造されたときは、抵当権者は、土地とともにその建物を競売することができる。"
